kw": ["Nicolas", "Pre WR", "Running", "Training", "struggling", "Tired"], "file": "A002C001_260527DC", "i": "02:00:48:08", "src": "16:41:30:08", "t": "la SwissPix qui est décidément la SwissPix 700 qui est une course qui ne me réussit pas deux années de suite après plus de 500 km j'ai été blessé donc forcément c'est frustrant on a fait plus de 500 km sur les 700 de pas aller au bout c'est déjà frustrant peut-être plus l'année dernière parce que on était en train de / batailler pour la victoire avec Sanglier / ça reste des choses qui sont un peu frustrantes maintenant dans ces moments-là je dirais que j'arrive souvent quand même à voir le chemin que j'ai accompli pour y aller et qui est souvent un beau chemin qui me permet de passer assez rapidement au sucre peut-être plus rapidement au sucre les gens qui m'ont trouvé"}, {"kind": "iv", "speaker": "Kristine", "source": "Pre", "topic": "training", "name": "Kristine and the hypoxic gym", "note": "Alpinist who opened a hypoxic training gym called Keep Pushing, running sessions at altitude", "kw": ["Kristine", "Gym", "Hypoxy", "Training"], "file": "DSC_0094", "i": "02:01:42:15", "src": "00:06:07:19", "t": "Je m'appelle Christine Vogue-On-Dix, je suis jeune voisin et je suis alpiniste. J'ai ouvert une salle de sport, plus particulièrement une salle epoxy qui s'appelle Keep Pushing, où on fait des entraînements à 3500 mètres d'altitude. Et Nico, je l'ai connu dans une ancienne salle epoxy qui s'appelle Sport Altitude et ça a été un de mes premiers clients à Keep Pushing à l'ouverture en septembre."}, {"kind": "iv", "speaker": "Kristine", "source": "Pre", "topic": "training", "name": "Training smarter, not just harder", "note": "Hypoxic work lets athletes like Nicolas train differently and more intelligently, with less load on the joints", "kw": ["Kristine", "Gym", "Hypoxy", "Training", "Explaining"], "file": "DSC_0094", "i": "02:02:09:10", "src": "00:06:49:06", "t": "Alors des athlètes comme Nicolas, ça lui permet de s'entraîner d'une façon un petit peu différente, certainement un petit peu plus intelligente, de mettre moins de charge sur ses articulations, de s'entraîner avec des intensités différentes et puis on force l'adaptation du corps. Du coup ça faudra lui demander si ça l'aide, mais en général les gens ils sentent des effets à partir d'un mois et demi, deux mois de séance régulière."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "training", "name": "Heavier than trail, lighter than ski touring", "note": "Six or seven kilos is heavy for trail but he does alpinism year round; still lighter than a ski kit", "kw": ["Nicolas", "Gear", "Training", "Running", "Alpine"], "file": "A003C004_2606111P", "i": "02:02:36:18", "src": "12:15:57:01", "t": "pas lourd pour part. / C'est assez lourd. En trail on n'a pas souvent un poids comme ça. Après je fais de l'alpinisme toute l'année. Disons que ça va. C'est moins lourd que avec le ski. On a quand même beaucoup plus de matériel. On a encore le DVA. On a encore le pêle, son, tout ça. / Plus d'habillée aussi. C'est"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Ueli Steck changed what seemed possible", "note": "A precursor of extreme alpine style who shifted the perception of what was achievable, and who was humble and fragile in how he spoke about it", "kw": ["Nicolas", "Pre WR", "Alpine", "Scrambling", "Explaining"], "file": "A002C001_260527DC", "i": "02:04:20:16", "src": "16:08:21:20", "t": "Ulishtek, c'est une personne qui m'a beaucoup inspiré et qui a vraiment été précurseur dans ce style alpin poussé à l'extrême. Quand on voit la face nord de la Higuerre, par exemple, / qui l'arrivait à gravir en un peu plus de 2h30, / même aujourd'hui, on voit ça, / ça paraît tellement démesuré. / Il y a des personnes comme ça qui ont changé la perception qu'on pouvait avoir de ce qui était faisable. Et pour moi, il en fait vraiment parti. Et je trouvais aussi à la fois très humble et très fragile dans sa manière d'exprimer les choses. C'est quelque chose que je crois aussi toucher."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Defining his style", "note": "His style depends on the discipline - alpinism in a fast alpine style, or pure trail; he does not think he is inventing anything", "kw": ["Nicolas", "Pre WR", "Alpine", "Running", "Explaining"], "file": "A002C001_260527DC", "i": "02:05:07:11", "src": "16:23:57:20", "t": "Comment je définirais mon style ? Mon style, il va vraiment dépendre de l'activité que je pratique. Ça peut être de l'alpinisme, ça peut être du trail purement. / Je pense que de qualifier ça d'alpinisme dans le style alpin, on allant assez vite, ça me paraît correspondre à ça pour la partie alpinisme, sinon c'est du trail. Je ne pense pas inventer un style. A mon avis, il y a d'autres précurseurs, bien avant moi, qui ont mis en avant ça, on parlait du litchtech, on peut parler du Kegan Jornet, on peut parler de"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Alpinism combined with ultra endurance", "note": "What is less visible is the combination of alpinism with ultra endurance, in the vein of projects like Kilian Jornet's", "kw": ["Nicolas", "Pre WR", "Alpine", "Running", "Mont Blanc"], "file": "A002C001_260527DC", "i": "02:05:48:06", "src": "16:25:46:20", "t": "Je pense que de qualifier ça d'alpinisme dans le style alpin, on allant assez vite, ça me paraît correspondre à ça pour la partie alpinisme, sinon c'est du trail. Je ne pense pas inventer un style. A mon avis, il y a d'autres précurseurs, bien avant moi, qui ont mis en avant ça, on parlait du litchtech, on peut parler du Kegan Jornet, on peut parler de / ou ça se voit moins, parce que ça combine vraiment cet aspect alpinisme avec l'aspect ultra-endurance. Maintenant, quand on regarde des projets comme Kegan Jornet a eu, il y a deux ans, faisant les 82, 4000 d'Alpes, ou l'année dernière aux États-Unis, c'est des choses qui se font déjà. C'est quelque chose qu'on voit moins, effectivement, de par la longueur et l'aspect Alpe."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Florian taught him to think outside the frame", "note": "Much in the mountains is codified, and what Florian showed him is that there is room for your own way of doing it", "kw": ["Nicolas", "Pre WR", "Partner", "Alpine", "Inspiration", "Explaining"], "file": "A002C001_260527DC", "i": "02:06:18:01", "src": "16:37:41:08", "t": "qu'est-ce qu'il t'a appris concrètement sur la montagne et sur toi même potentiellement ? / ce que Florian m'a appris c'est peut-être de penser en dehors du cadre c'est que / dans la montagne il y a beaucoup de choses qui sont très cadrées et codifiées et c'est qu'il y a aussi de la place pour sa propre pratique pour la manière dont on a envie de faire les choses / alors oui forcément on va pouvoir discuter de sécurité on va pouvoir discuter de plein de choses / mais ça ne veut pas dire pas se poser ces questions ça veut juste dire assumer qu'on peut avoir une vision différente de sa pratique en montagne / est-ce que tu peux penser à une ou deux personnes qui ont compté autant dans ton parcours ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Matteo Giacomo shaped his practice too", "note": "Another figure who changed how he approaches the mountain", "kw": ["Nicolas", "Pre WR", "Inspiration", "Alpine", "Partner", "Explaining"], "file": "A002C001_260527DC", "i": "02:07:07:08", "src": "16:38:28:08", "t": "je pense que dans mon parcours il y a aussi Matteo Giacomo qui a s'endutu un impact aussi il départ sa pratique dans la montagne au départ quand j'ai rencontré Matteo je l'ai pris comme zine et on allait faire la cascade de glace et il m'a aussi apporté un regard différent parce que j'allais souvent chercher des sommets avant le procès d'alpinisme et là il m'a sans doute montré le fait qu'on pouvait aller chercher autre chose en montagne le fait qu'on pouvait aller prendre du plaisir on allait grimper en cascade dans des endroits ou on ne pouvait jamais grimper en cascade et qui n'ont absolument rien de prestige ils m'ont dit juste d'aller prendre du plaisir ça me laisse des super souvenirs et plusieurs fois avec Matteo des choses comme ça qui sont peut-être plus improbables qui n'ont jamais les grands titres des journaux mais tu vas juste en montagne parce que tu vas mettre en montagne"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Four itineraries, each with its own DNA", "note": "He prefers to call them four itineraries rather than four faces - each is emblematic and has its own character", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Alpine", "Explaining"], "file": "A002C001_260527DC", "i": "02:08:21:15", "src": "16:43:44:18", "t": "je préfère parler de quatre itinéraires les quatre faces, c'est quatre itinéraires qui sont pour moi emblématiques ils ont chacun leur propre ADN on a forcément les itinéraires des grands mulets qui est le itinéraire où se font tous les recours un aller-retour depuis Saint-Gervais et des niveaux les plus importants je pense qu'on peut faire"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "The royal traverse is his favourite", "note": "From Les Contamines over Bionnassay, his favourite summit on the massif", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Ridge", "Alpine", "Enjoying"], "file": "A002C001_260527DC", "i": "02:08:51:12", "src": "16:44:12:08", "t": "la voie que je préfère c'est la traversée royale en partant des contamines juste à l'église d'unidis via l'église de Nasset qui est le sommet préféré sur le Massif et le versant italien / je pense que j'adore tellement la focaccia pour mailleurs il fallait que je trouve quelque chose un moyen d'aller en Utrelle / unsupported ? qu'est-ce que ça change pour toi ? plutôt celle-là ? / oui exactement tu as déjà commencé avec des caractéristiques"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Built for adventure formats", "note": "What lets him perform is very long formats, which are closer to adventure than to pure trail running", "kw": ["Nicolas", "Pre WR", "Running", "Alpine", "Explaining"], "file": "A002C002_260527XB", "i": "02:09:31:19", "src": "17:02:46:24", "t": "oui exactement tu as déjà commencé avec des caractéristiques / Et ça, c'est ce qui me permet peut-être de performer sur des formats extrêmement longs et qui sont peut-être plus des formats à renture au final que des formats pure trail running. Ce qui correspond, c'est bon, au projet du Mont Blanc. Un format sur quatre jours comme ça qui demande peut-être plus de résilience et moins de capacité physique. C'est peut-être des choses qui me correspondent mieux. Et c'est ce qui me permet de performer sur des événements particuliers."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the sport", "name": "A line from Ueli Steck", "note": "A phrase of Ueli Steck's about what he saw, and how it shaped the way he thinks about progression", "kw": ["Nicolas", "Inspiration", "Alpine", "Explaining"], "file": "A002C063_260418WT", "i": "02:09:59:11", "src": "04:31:11:04", "t": "parce que j'ai commencé à pouvoir vraiment progresser pour y arriver et il y a ça, et il y a une autre phrase de Uli Shtek qui disait que il voyait quelque chose quand il parlait surtout de la face nord des grandes jurasses qui était vraiment la face qui associa Uli où il disait que quand il la regardait avant il disait j'arriverais peut-être jamais à faire ça et au fur et à mesure il progressait et il disait un jour, ça sera peut-être possible et après un jour, ça sera peut-être possible de la faire"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Teaching him what the terrain really costs", "note": "Coming from a different background, he could show Nicolas that sixty kilometres with three thousand metres on climbing ground is nothing like the same on trail", "kw": ["Florian", "Partner", "Alpine", "Running", "Training"], "file": "DSC_0169", "i": "02:10:33:16", "src": "00:05:50:01", "t": "Alors je pense que ce qui a changé dans son approche à l'alpinisme, Nico, dans notre... par rapport à notre rencontre, c'est que moi j'ai un parcours qui est un petit peu atypique, dans le sens où quand j'étais jeune, j'ai peu d'expérience en montagne, mais j'ai fait une première expédition tout de suite à 25 ans, qui était une expédition qui était très engagée au Pakistan, sur une voie très connue qui était vraiment... il y avait de l'altitude, il y avait de la technicité, et en fait ça, ça m'a tout de suite mis un petit peu dans le bain de ce qui est la haute montagne, et du coup moi j'ai toujours eu un peu cette culture où la montagne reste un élément, un univers assez dangereux, assez technique. J'avais pas cette approche montagne un peu douce, on va dire, ou calce, tout de suite un peu très engagée, voilà. Et du coup en fait, Nico en venant du trail, il y avait plutôt cette approche... / pas trop de connaissance des dangers objectifs, ça va aller... En fait la dynamique quand on est trailer, de faire surtout dans l'ultra, de faire 60 bornes avec 3000 de déplus, c'est rien du tout. Sauf que le transfert à la haute montagne, et bien il ne se fait pas de manière aussi simple, il faut avoir une culture montagne, et cette culture montagne, moi je pense que du coup j'ai essayé de lui apporter par rapport aux dangers objectifs, par rapport aussi à la technicité de l'ultinéraire, même si en trail il y a des courses qui sont quand même à s'engager, ça reste quand même des terrain"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "What fast and light actually means", "note": "One push from one point to another, often far apart, moving constantly, and cutting away the barriers as you go", "kw": ["Florian", "Alpine", "Running", "Explaining"], "file": "DSC_0169", "i": "02:12:33:00", "src": "00:08:51:11", "t": "pas trop de connaissance des dangers objectifs, ça va aller... En fait la dynamique quand on est trailer, de faire surtout dans l'ultra, de faire 60 bornes avec 3000 de déplus, c'est rien du tout. Sauf que le transfert à la haute montagne, et bien il ne se fait pas de manière aussi simple, il faut avoir une culture montagne, et cette culture montagne, moi je pense que du coup j'ai essayé de lui apporter par rapport aux dangers objectifs, par rapport aussi à la technicité de l'ultinéraire, même si en trail il y a des courses qui sont quand même à s'engager, ça reste quand même des terrains... voilà, des terrains roulants, et moi c'est vrai que j'aime beaucoup, depuis que je suis très petit, je tourne dans des endroits avec du scrambling, des choses un peu plus grimpes, cours à pied... et voilà moi j'ai essayé d'amener cette approche là de technicité, de mobilité rapide dans des terrains un peu scavreux, on va dire, et voilà, je pense que c'est ce que j'ai pu apporter, là où il a évolué un petit peu, c'est danger objectif et technicité dans des terrains à chamois, on appelle ça. / alors le principe c'est vraiment si tu pars d'un point et t'arrives à un autre point qui souvent est très loin, dans le sens sur One Push comme on dit, et le but c'est de réduire ce temps en fait que tu vas passer du cours montagne, enfin de réduire, alors attends on va la refaire. / Alors le principe du Fast & Light c'est vraiment le côté One Push, c'est le côté mouvement en permanence. Et ce qui est"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "The Miage traverse, a shared memory", "note": "A route you would normally build up to over years, done in a single push - breaking mental and physical barriers", "kw": ["Florian", "Partner", "Alpine", "Ridge", "happy"], "file": "DSC_0169", "i": "02:13:47:24", "src": "00:10:03:12", "t": "Par exemple avec Nico / Par exemple avec Nico on a un très très beau souvenir, c'est vraiment la traversée miyage de l'acémon blanc, où ça c'est des courses, quand tu commences l'aide-pinisme tu te dis bah là il me faut 4 jours quoi, et puis après au fur et à mesure de ton expérience tout ça, si en plus tu aimes bien un peu courir, l'endurance, tu dis tiens est-ce qu'on ne essaierait pas de le faire en one push, voilà, et du coup tu pars sur une traversée, / c'est ce que je passe comme si tu survolais tout ça, et voilà tu fais un peu péter les barrières mentales et physique tes propres barrières, chacun les met où il veut, mais voilà quand tu vas pousser un peu dans le fast and light, tu chaque détaille compte, tu vas regarder le poids du sac, ton hydratation, ton alimentation, la carteau pour être bien calé dans ton itinéraire, et moi c'est ça que j'aime c'est pousser tous les curseurs un petit peu au max pour être safe et réussir ton projet. / Et la première"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Linkages exist, but not quite this", "note": "There have been chains and records before, but the particular combination here has not been done", "kw": ["Florian", "Partner", "Alpine", "Mont Blanc", "Explaining"], "file": "DSC_0169", "i": "02:14:41:22", "src": "00:26:19:11", "t": "Et la première / ça, ça a déjà fait ? / Alors, le projet que Nico est tente, est-ce que c'est déjà fait ? Alors, il y a eu pas mal de choses comme ça, des enchaînements, des records et tout. Après, je crois que le fait d'enchaîner comme ça les 4 FKT, je crois que, non, c'est un peu une première, et voilà, après, il y a dû déjà avoir des choses un petit peu dans le même état d'esprit et tout ça, mais comme ça, ce sont les 4 Ritinerak sur la même montagne, je pense que c'est une première."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Two communities that used to be separate", "note": "Alpinists and trail runners were distinct worlds; now the transfer between them is clearly happening", "kw": ["Florian", "Partner", "Alpine", "Running", "Explaining"], "file": "DSC_0169", "i": "02:15:12:21", "src": "00:27:14:11", "t": "et tout ça. / Maintenant, je pense que, à l'heure actuelle, on voit vraiment ce transfert, avant, il y avait vraiment la communauté Alpi-Miste et la communauté Trail-R, et c'était très distinct, et de plus en plus, on voit vraiment que ces deux communautés se rejoignent, et du coup, en fait, on a des projets en Alpi, notamment sur Fast & Light, où des FKT qui se rejoignent, et du coup, on a vraiment des choses qui poussent de plus en plus. / Donc, je pense qu'à l'heure actuelle, ce projet, il est dans la continuité de ce qui se fait déjà un petit peu. Et voilà, il est dans l'air du temps un petit peu, c'est de combiner en fait des choses qui avantent à les mettre un mois pour faire, maintenant, tu le fais en 3-4 jours. / Est-ce que ce genre de projet va changer la manière dont les gens voient le monde blanc ?"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Alpine skill and ultra endurance in one pot", "note": "Not something new - you take everything from alpinism and everything from ultra endurance and put the two together", "kw": ["Florian", "Partner", "Alpine", "Running", "Explaining"], "file": "DSC_0169", "i": "02:16:03:20", "src": "00:29:37:07", "t": "Alors est-ce que ce projet des quatre faces, c'est du trail, de l'alpinisme ou quelque chose de nouveau ? Alors c'est pas quelque chose de nouveau, parce que c'est quelque chose qui se fait depuis pas mal d'années, après c'est quelque chose qui est mis en avant ces derniers temps. Est-ce que c'est du trail ou de l'alpinisme ? Ben c'est du trail, l'alpinisme. / C'est vraiment cette nouvelle, voilà c'est ça, on met les aptitudes et nos connaissances du trail, / on les transpose dans l'alpinisme, et puis on fait un peu cette marmite là et en avant quoi. C'est vraiment les aptitudes de l'alpinisme, toutes l'expérience de l'alpinisme, toute l'expérience du trail, / et on met ces deux choses là, les capacités physiques, les capacités techniques, et on met. Et après ce qui est vraiment intéressant aussi moi je trouve, de ce que j'ai pu observer avec des gens comme Nico, qui sont des trailers très très forts, et puis j'ai eu la chance de tourner avec des alpinistes très très forts, les capacités physiques en fait souvent elles sont impressionnantes dans les deux domaines, c'est-à-dire que avec de la vitesse et très peu de poids, un trailer hyper impressionnant. On va avoir beaucoup de rythmes, beaucoup de vitesse, et du coup une capacité à enchaîner les itinéraires à faire de la distance. Par contre, s'il y a du poids, de la lourdeur, là les capacités physiques elles s'écoulent parce qu'ils n'ont pas l'habitude de porter des gros sacs, de porter du matos, de porter des caméras et tou"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the sport", "name": "No transport during the chain", "note": "Refuses any transport across the whole linkage - sleeping at the Cosmiques hut and climbing back up in the morning", "kw": ["Nicolas", "Explaining", "Mountain Hut", "Preparation"], "file": "A004C046_260613H5", "i": "02:17:55:23", "src": "12:47:38:23", "t": "et on met ces deux choses là, les capacités physiques, les capacités techniques, et on met. Et après ce qui est vraiment intéressant aussi moi je trouve, de ce que j'ai pu observer avec des gens comme Nico, qui sont des trailers très très forts, et puis j'ai eu la chance de tourner avec des alpinistes très très forts, les capacités physiques en fait souvent elles sont impressionnantes dans les deux domaines, c'est-à-dire que avec de la vitesse et très peu de poids, un trailer hyper impressionnant. On va avoir beaucoup de rythmes, beaucoup de vitesse, et du coup une capacité à enchaîner les itinéraires à faire de la distance. Par contre, s'il y a du poids, de la lourdeur, là les capacités physiques elles s'écoulent parce qu'ils n'ont pas l'habitude de porter des gros sacs, de porter du matos, de porter des caméras et tout comme les vilias, et tout ça, alors que les alpinistes, de la vitesse, tu les mets light, ils ne vont pas avancer vite, c'est des escargot, par contre tu leur mets du poids, ou un petit rythme lent régulier, ils sont increvables. Et du coup en fait c'est super chouette de voir ces deux monde qui cohabitent, ces deux potentiels physiques qui sont complètement différents, tu les mets comme ça et une fois que tu as compris ce que Nico a fait, il a compris que c'est pas tout à fait le même rythme, c'est pas tout à fait le même poids, on combine tout ça, on va super loin et du coup on amène sur des pratiques un peu de nouvelles douées, du trailer de pymisme. / cos"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the sport", "name": "On the trail sections he is set free", "note": "Two disciplines in one project; coming off the alpine sections onto trail releases the pressure", "kw": ["Nicolas", "Running", "Alpine", "Explaining", "Enjoying"], "file": "A004C047_260613OO", "i": "02:18:19:12", "src": "12:55:17:07", "t": "Et après, c'est / Il y a vraiment deux choses, il y a toutes les parties alpinistes, mais les parties de trail. / Et c'est vrai que... Quand je passe sur les parties... Quand je définis les sections alpinistes et que je passe sur les parties de trail, là spécialement, je suis libéré. Parce qu'il y a toute la pression qui retombe, il y a... J'ai plus ou moins de danger en soi, alors que sur les parties alpinistes, je suis obligé de rester comme plus longtemps, en fait. / C'est vrai que tu viens de la base"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the sport", "name": "From trail into alpinism", "note": "Rooted in trail running, moving further into alpinism and the combination of the two", "kw": ["Nicolas", "Running", "Alpine", "Training", "Explaining"], "file": "A004C047_260613OO", "i": "02:18:46:23", "src": "12:55:40:18", "t": "C'est vrai que tu viens de la base / plus longtemps, en fait. / C'est vrai que tu viens de la base du code du monde du trail, finalement, et tu t'aventures de plus en plus dans ce côté alpinisme et puis de combinaison. Et puis, tu as bien fini, c'est de pratique. Donc, finalement, ça me semble pas assez logique, finalement, que le moment de relâchement, c'est quand tu reviens dans ta zone de confort, finalement. Est-ce que, d'une certaine manière, ça repousse tes limites plus que ce que tu ferais d'habitude ? / Ah, clairement, oui. Oui, / Donc, ce que j'aime bien faire, c'est d'abord toujours voir tout ce qui est matériel plutôt technique."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Technical kit gets checked first", "note": "His routine: always lay out the technical gear before anything else", "kw": ["Nicolas", "Gear", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "02:20:31:03", "src": "12:00:20:04", "t": "Donc, ce que j'aime bien faire, c'est d'abord toujours voir tout ce qui est matériel plutôt technique. / Donc, les chaussures, les crampons,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Extra weight for big mittens", "note": "Expects a lot of wind and his hands get cold, so he allows the extra weight of heavy mittens", "kw": ["Nicolas", "Gear", "Wind", "Conditions", "Explaining"], "file": "A002C287_260611IW", "i": "02:20:42:15", "src": "12:00:54:07", "t": "Ensuite, au niveau du vêtement, je préviens pas mal de vent. Et j'ai souvent les mains qui ont bien froid, donc je m'accorde un petit peu de poids supplémentaires, avec des grosses moufles au cas ouf. / Que je cale bien au fond."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Trainers or mountaineering boots", "note": "Tested crampons on trainers; carries both so he can run the rolling sections and stay secure on technical ground", "kw": ["Nicolas", "Gear", "Shoes", "Running", "Explaining"], "file": "A002C287_260611IW", "i": "02:21:01:24", "src": "12:01:49:23", "t": "Que je cale bien au fond. / J'aurais pu partir en basket et mettre les crompons sur les baskets, mais j'ai fait quelques tests, ça tient fortement bien, en fin, je ne l'ai pas énormément, donc je peux faire partir avec quelque chose qui tienne vraiment bien au pied, pour les parties roulantes, les baskets qui me permettent de bien courir, pour les chaussures d'alpi, pour les portions vraiment trop cliques. Ok."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Crampons had torn the trousers", "note": "Lighter gloves by default with mittens in reserve; the crampons had already put holes in the trousers, repaired that week", "kw": ["Nicolas", "Gear", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "02:21:27:04", "src": "12:03:18:06", "t": "une paire de gants un peu plus légère, que je prendrai en priori, tout le temps, et si tu commences à faire vraiment trop froid les moufles. Un pantalon, / donc, justement, vraiment bien légère, j'ai celui-ci au bout en plus, / je lui ai fait quelques trous l'huitième dernier, donc je lui ai fait rafistoler cette semaine, / les crampons avaient déjà bien abîmé."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Tracker bagged so he remembers it", "note": "The GPS tracker goes in its own bag so he does not forget to switch it on", "kw": ["Nicolas", "Gear", "Watch", "Preparation"], "file": "A002C287_260611IW", "i": "02:21:58:14", "src": "12:03:54:21", "t": "Le tracker GPS, alors que je le mets dans le sachet, comme ça, je pense bien à l'alumine, on va me mettre dans le sac de main. / Des lunettes de soleil,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Undecided about the helmet", "note": "Always hesitant on pure glacier routes; he will save the helmet for rocky ground and carry it on the Gouter ridge", "kw": ["Nicolas", "Gear", "Glacier", "Ridge", "Explaining"], "file": "A002C287_260611IW", "i": "02:22:14:09", "src": "12:05:56:04", "t": "Ensuite le casque, toujours un peu hésitant à le prendre sur des parcours vraiment glaciers comme ça, il n'a pas forcément besoin, je ne sais pas comment se taper décider, juste à savoir si je prends le casque, je vais me lafronter à le dessus, je pense que je garderai plutôt le casque pour les sections uniquement rochées, je vais faire de vrais allers pour demain et je le mettrai déjà pour la rède du goûter à partir de samedi, / ça je le laisse là encore"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Pack on the back before it is finished", "note": "Wears the loaded pack to check nothing rubs; he has set off before and regretted it within a few hundred metres", "kw": ["Nicolas", "Gear", "Preparation", "Explaining"], "file": "A003C001_260611C3", "i": "02:22:49:21", "src": "12:12:03:07", "t": "une dernière chose, une fois que le sac est prêt. / Je le mets sur le dos pour être sûr qu'il n'y a rien qui le gêne. / C'est déjà arrivé de partir à 800-500 m avant d'un point d'accès, c'était vraiment désagréable."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Room left in the bag is the test", "note": "As long as there is still space in the pack he knows he has not over-packed", "kw": ["Nicolas", "Gear", "Preparation", "Training", "Explaining"], "file": "A003C004_2606111P", "i": "02:23:12:05", "src": "12:16:33:21", "t": "Mais j'ai encore de place dans le sac. C'est toujours un bon critère. Je peux encore ouvrir ça et rajouter du poids. Tant que j'ai encore de place dans le sac, c'est que je n'ai pas exagéré. / Quand je suis parti le week-end dernier pour m'entraîner, le sac, je vais encore un peu plus de choses. Je bois un peu plus de matériel. Il est un peu plus plein. Mais là, si je dois encore rajouter par exemple"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Two bottles, water and energy drink", "note": "Two soft flasks with water and energy drink, maybe a third, plus half a litre before he even starts", "kw": ["Nicolas", "food", "Gear", "Preparation"], "file": "A002C287_260611IW", "i": "02:24:56:18", "src": "12:06:50:07", "t": "là je vais préparer deux bouddhas avec de l'eau et une boisson énergétique et je pense que je vais peut-être en prendre une troisième, je boirai déjà un demi-litre avant de me poser les baskets, ça me laisse pas dans le lit pour le sommeil et la rône, ça va être parfait comme ça,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Which Haribo for tomorrow", "note": "The genuinely important question of the evening: which sour Haribo goes in the pack", "kw": ["Nicolas", "food", "Preparation", "laughing", "happy"], "file": "A002C287_260611IW", "i": "02:25:26:02", "src": "12:07:15:16", "t": "là je vais préparer deux bouddhas avec de l'eau et une boisson énergétique et je pense que je vais peut-être en prendre une troisième, je boirai déjà un demi-litre avant de me poser les baskets, ça me laisse pas dans le lit pour le sommeil et la rône, ça va être parfait comme ça, / va être parfait comme ça, ensuite question très sprasévique, c'est quelle gamme de haribo je vais apprendre, c'est-à-dire les orangis naquipiques, les pêches qui piquent et les propos qui piquent, on va viser sur les orangis naquipiques pour demain, / ça sera parfait"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Three gels because the day is long", "note": "Adds three gels, coffee flavoured, on the assumption the day will run long", "kw": ["Nicolas", "food", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "02:25:54:02", "src": "12:07:50:17", "t": "on va quand même prendre quelques gels parce que la journée va être longue, je pense, / trois gels comme ça, trois gels, café, c'est beau d'achuter pour la journée,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Water from a river is allowed", "note": "If he passes a stream he will drink from it - taking water is the one thing permitted while self-supported", "kw": ["Nicolas", "food", "Explaining", "Mountain"], "file": "A003C001_260611C3", "i": "02:26:23:01", "src": "12:10:17:23", "t": "Si jamais je vois une petite rivière, on passe au sol des mains, je l'aventure aussi. La seule chose que l'on va le faire pendant une supportite, c'est de prendre de l'eau dans la rivière. / profiterai du confort qu'on peut avoir. Si j'en vois une, je ne me gênerai pas."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Buying water would break self", "note": "Even buying water in a cafe would not be allowed under self-support; the rules are strict on it", "kw": ["Nicolas", "food", "Explaining", "Preparation"], "file": "A004C047_260613OO", "i": "02:26:49:19", "src": "13:01:29:24", "t": "Mais même, prendre de lot, acheter de lot dans un café, ce ne sera pas autorisé. Ça passe en self-support. Donc, vraiment, ils sont assez... assez égligés là-dessus. Et c'est pour ça que même puisqu'il y a le tournage, on ne peut pas tourner, il peut-être d'équipe du tournage avec. C'est considéré comme un support. Donc, pendant les ascensions, j'ai tout filmé à la Gopron pour avoir justement quelques images. / Et où est-ce que peut-être"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "A litre and a half, hoping for a river", "note": "Carrying 1.5 litres and hoping to find a river on the way to top up to two", "kw": ["Nicolas", "food", "Mountain", "Explaining"], "file": "A004C070_260613YW", "i": "02:27:18:18", "src": "19:12:28:09", "t": "Et où est-ce que peut-être / J'ai pris 1,5 litres de l'eau et je n'ai pas une bouteille vieille. J'espère trouver une rivière sur la route mais à pourner le tissu déjà. / Je peux remplir et avoir 2 litres pour les résalons."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "You see the Saleve from everywhere", "note": "Living in Geneva the Saleve is always in view; a place he has spent a great deal of time", "kw": ["Nicolas", "Pre WR", "Salève", "Town", "Mountain"], "file": "A002C001_260527DC", "i": "02:28:58:09", "src": "15:59:00:05", "t": "Alors à quel moment j'ai vu pour la première fois une vraie montagne, en habitant à Genève on voit le salet de partout, donc forcément c'est un lieu qui est très particulier pour moi, c'est un lieu où j'ai un moment trainé, c'est un lieu... / Au dernier il était faible, c'est à la fin de journée aussi. / Je n'ai pas fait de chier pour le centre-sport. / Je pense que maintenant il va être par là."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "The massif is part of his life", "note": "Not just a mountain but a massif, and a permanent part of his life - he trains there several times a week", "kw": ["Nicolas", "Pre WR", "Mountain", "Training", "Alpine"], "file": "A002C001_260527DC", "i": "02:29:33:19", "src": "16:01:53:20", "t": "Je ne vois pas tout ce montagne. C'est vraiment un massif. C'est ce que part de ma vie. En permanence je viens souvent m'entraîner plusieurs fois par semaine. / On se rencontre avec nos amis. On fait plein d'activités différentes. Oui, je vais penser de vraie montagne c'est celle-ci. / Et à côté"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "The landscapes of the record", "note": "What he will cross during the record: trail paths first, then long glacier sections and high alpine ground", "kw": ["Nicolas", "Pre WR", "Glacier", "Mont Blanc", "Alpine", "Mountain"], "file": "A002C001_260527DC", "i": "02:29:54:14", "src": "16:11:34:20", "t": "Et à côté / Alors ce que je vais rencontrer comme paysage durant le record en Mont-Blanc, ça va être assez varié. Ça sera d'abord des sentiers de trails, ensuite il y aura beaucoup de portions glacières où ça reste des grands détendus de neige qui cachent pas mal de danger quand même avec des crevasses qui ne sont pas visibles, peut-être les parties qui affectent le moins parce que ça laisse beaucoup de place à l'incertitude. Et on ne peut pas trop prévoir sur ces sections-là. Et une des parties qui me réjouis le plus, ça va être l'aiguille et l'arrête de bionnaisais où il va y avoir des sections d'escalade et d'arrêt mixte avec du rocher où je trouve que c'est les portions les plus esthétiques. / Tu te sens vivant quand tu cours ? Plus vivant qu'autrement ? / Je ne pourrais pas dire"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "Why the Saleve is his mountain", "note": "A mountain with a lot of history and many faces - gentle family paths alongside far harder trails", "kw": ["Nicolas", "Pre WR", "Salève", "Mountain", "Training"], "file": "A002C001_260527DC", "i": "02:30:47:09", "src": "16:27:37:20", "t": "Je ne pourrais pas dire / Tu aimerais se le salèvres, et on y est d'ailleurs en ce moment, pourquoi c'est ta montagne, ou qu'elle représente pour toi ? / Le salèvres, c'est une montagne qui a beaucoup d'histoires, beaucoup de ranzalpinistes qui sont passés ici, / et c'est vraiment une montagne multiple facette. Il y a aussi des sentiers très familiaux, où on peut aller se promener, où on peut aller faire un rendement très cool, et aussi des sentiers hyper techniques, où le moindre pas de côté est interdit, parce que ça pourrait être une chute qui pourrait être fatale. Et on arrive vraiment à mixer tout ça, pour en fonction de son humeur, en fonction du jour, en fonction de ce qu'on a envie de faire, trouver la pratique qui ne correspond pas. / Combien de fois par semaine tu y montes, et à quelle heure ? / Je vais au salèvres en général, deux fois par semaine,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "Chamonix, the cradle of alpinism", "note": "Loves walking the streets of Chamonix after a day out in the massif; the Grand Nesle rock and the massif itself inspire him", "kw": ["Nicolas", "Pre WR", "Chamonix", "Town", "Alpine", "Mont Blanc", "Enjoying"], "file": "A002C001_260527DC", "i": "02:31:41:04", "src": "16:43:07:08", "t": "c'est le berceau de l'alpinisme pour moi j'adore me trimballer dans les rues de Chamonix après avoir fait une sortie en alpies en Mont Blanc en un journée et retrouver à la fois ces touristes ou à l'aiguille du midi ils sont en train de manger des glaces des gens avec des cordes sur le dos d'autres avec des baskets de trails des gens qui arrivent, des gens qui partent c'est une ambiance, une aura particulière donc Chamonix et le Massif du Mont Blanc inspirent des émotions que je trouve même par ailleurs / pourquoi les quatre faces et pourquoi pas une seule ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "places", "name": "Sunrises are what he would keep", "note": "If one thing had to stay it would be the sunrises, in ultra trail after a night out and in the high mountains", "kw": ["Nicolas", "Sunrise", "Mountain", "Enjoying", "happy"], "file": "A002C063_260418WT", "i": "02:32:21:11", "src": "04:21:44:21", "t": "Je pense que s'il y a une chose que je dois garder, c'est vraiment les levées de soleil. Que ce soit en ultra-trail, où on a un levée de soleil après une nuit en général, pour toute la nuit, c'est comme une nouvelle vie, presque, on pourrait dire. Et en alpinisme aussi, où on a quand même cet aspect très austère de la montagne, avec des bruits de serrac, de rochers qui tombent la nuit, ça pourrait être assez impressionnant. Quand le jour se laisse, c'est une libération. / Peut-être que tu peux décrire ça en une sentence, que le rêve de soleil, c'est comme une nouvelle vie. Je trouve ça très bien. / Le levée de soleil en montagne, c'est comme une nouvelle vie, c'est vraiment comme une libération. / Et peut-être aussi, quand tu es en montagne, / en limite peut-être, / et qu'est-ce qu'il y a dans Heade ? Il y a des choses où il est nulle dans la Heade."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "places", "name": "Up the Saleve every other day", "note": "He climbs it every two days and was still surprised to find the vegetation suddenly green; the mountain changes all year", "kw": ["Nicolas", "Salève", "Training", "Mountain", "Weather"], "file": "A002C063_260418WT", "i": "02:33:29:24", "src": "04:26:49:04", "t": "C'est complètement différent. Là, je monte tous les deux jours au salleve. Et hier, je me suis surpris parce que je voyais la végétation qui était verte. Et c'est tout nouveau. Et je voyais les fleurs. / Et la montagne change toute l'année. D'un pouvoir de la neige, de la glace, après, il y a grand soleil, on a chaud. Et ça change vraiment tout le temps. Et en haute montagne, c'est la même chose. On peut avoir un passage, on peut pas passer. Et quelques jours après, il aura neiger, il y aura des conditions et on va pouvoir y aller. C'est fascinant, ce changement."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "Place du Triangle de l'Amitie", "note": "The symbolic square in Chamonix for trail running and for Mont Blanc records", "kw": ["Nicolas", "Chamonix", "Town", "Running", "Explaining"], "file": "A003C106_260611ZQ", "i": "02:34:11:04", "src": "19:04:10:23", "t": "Maintenant, nous allons à Iglis et Le Place. C'est quel minuit pour toi, cet endroit ? / La Place du Triumne de l'Amitié, c'est un peu pour tout ce qui est trail. C'est la Place et même pour les records au Mont Blanc. C'est vraiment la Place symbolique."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "Every start happens in front of the church", "note": "The square carries a particular symbolism for him, tied to his UTMB finishes in 2017 and 2023", "kw": ["Nicolas", "Chamonix", "Town", "Start", "Running"], "file": "A003C106_260611ZQ", "i": "02:34:33:09", "src": "19:04:30:23", "t": "Chaque départ, pour J'habitier Nerère, justement, ça sera devant les Iglises. Et là, / cette Place-là, pour moi, elle a toute une symbolique particulière avec l'arrivée de la PTAL en 2017 et en 2023. / Surtout en 2023,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "Arriving at the UTMB in 2023", "note": "Finishing in broad daylight with crowds through the streets; the mythical arrival place in Chamonix", "kw": ["Nicolas", "Chamonix", "Town", "Arrival", "happy", "Running"], "file": "A003C106_260611ZQ", "i": "02:34:51:14", "src": "19:04:46:11", "t": "Surtout en 2023, / Surtout en 2023, arriver en pleine journée avec du monde partout dans les rues et cette ambiance juste de folie quand on est arrivé à la PTAL. Donc c'est vrai que c'est un endroit que j'aime particulièrement. Et j'ai reviendrait cet été pour la PTAL, j'espère, avec la même ambiance et le même résultat que il y a 3 ans. / C'est beaucoup de motivation pour maintenant. / Exactement. C'est vraiment le lieu mythique à"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "He decided that morning he wanted music", "note": "He had not planned on music for the departure, then that morning found he wanted it", "kw": ["Nicolas", "Chamonix", "Music", "Start", "happy"], "file": "A003C117_2606114O", "i": "02:35:21:06", "src": "19:13:37:16", "t": "Exactement. C'est vraiment le lieu mythique à / maintenant pour toi ? / Disons que c'est / C'est marrant que tu pourras cette question, c'est peut-être pour ça que au départ j'avais pas prévu de mettre de la musique et là je me suis dit je vais bien enlever une musique. C'est peut-être ce qui va me donner un peu plus de mouvement pour le départ parce que c'est bizarre de partir dans un tel calme comme ça à la nuit seul. En général quand on va faire des sommets, on ne touche comme ça, on est toujours un ou deux copains. Il y a quand même une emulsion comme ça mais là c'est vrai que c'est un peu spécial."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "A chamois came right up to him", "note": "It approached without fear and simply watched him; on the descent another ran on the snow beside him", "kw": ["Nicolas", "Animal", "Mountain", "happy", "Enjoying"], "file": "A004C047_260613OO", "i": "02:35:55:14", "src": "13:02:29:12", "t": "une chamois, oui, / exactement. Il était tout à coupsé, il avait pas l'air très... il avait pas l'air très craintif. Donc, il s'approchait comme ça, il regardait. / Est-ce que tu peux redire les sentences avec chalume, chambon, / pour redire ? / À la descente, j'ai aussi vu un grand chambon qui courait sur la neige et il était tout à côté de moi. Et c'était assez rigolo parce que il était pas du tout craintif, il s'approchait. Je pense qu'il y a l'habitude de voir pas mal de monde. Merci."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Who he is", "note": "Introduces himself: IT manager in Geneva with a passion for endurance running, ultra trail and alpinism", "kw": ["Nicolas", "Pre WR", "Office", "Running", "Alpine"], "file": "A002C001_260527DC", "i": "02:37:49:19", "src": "15:53:58:01", "t": "Présente-toi, ton prénom, ton nom et ce que tu fais dans la vie. / Je m'appelle Nicolas Lémane, je suis manager dans l'informatique, je neve, et j'ai une vraie passion pour tout ce qui est cours de l'envissement, ultra-traig et alpinisme."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Work stress and sport stress", "note": "The two either compound or cancel each other out depending on his state of mind; availability is a key performance factor in ultra", "kw": ["Nicolas", "Pre WR", "Office", "Training", "Nervous"], "file": "A002C001_260527DC", "i": "02:38:08:08", "src": "15:55:26:10", "t": "Alors, le stress du boulot, le stress du sport, c'est deux choses qui peuvent ou se cumuler ou se compenser, ça va dépendre de l'état d'esprit dans lequel on est. En ultra-trail, je pense qu'un des facteurs clés de la performance avec la disponibilité mentale, c'est vraiment quelque chose que plus le temps passe, plus j'appréhende et j'en fais avec. / Comment te décrireais-tu aujourd'hui, en quelques mots ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Enthusiastic and rigorous", "note": "Two words for himself: enthusiastic, a real kid about projects like this - and rigorous", "kw": ["Nicolas", "Pre WR", "Office", "Preparation", "happy"], "file": "A002C001_260527DC", "i": "02:38:36:13", "src": "15:55:52:09", "t": "Je pense que si je devais donner deux ou trois mots pour me décrire, je dirais la première chose, c'est enthousiaste. Je suis un vrai gamin par rapport à des projets comme ça et riboureux. Je pense que tout le monde peut faire ce qu'il veut dans la vie, peut arriver à ce qu'il veut, par contre, ça demande de se donner les moyens. / Est-ce que d'une certaine"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Banking rigour and the mountain", "note": "Twenty years in a highly organised industry he was predisposed to, and the discipline feeds back into how he approaches the mountain", "kw": ["Nicolas", "Pre WR", "Office", "Preparation", "Alpine"], "file": "A002C001_260527DC", "i": "02:38:59:19", "src": "15:56:21:20", "t": "Est-ce que d'une certaine / La culture du milieu bancaire et ce trigger qui caractérise ce milieu, ce côté très organisé, je pense que c'est quelque chose qui m'a amené à travailler là-dedans depuis vingt ans, c'est quelque chose pour lequel je suis prédisposé et à la fois, ça m'a permis d'accomplir ma carrière professionnelle et en même temps d'accomplir ma carrière sportive. / Tu as grandi, ou exactement, décris-moi un petit peu le paysage de ton enfance. / Alors j'ai grandi dans le nord-est de la France, c'est une région..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Fitting it all into a day, a week, a year", "note": "The rigour it takes to fit every session into a day, those days into a week and the weeks into a year", "kw": ["Nicolas", "Pre WR", "Training", "Office", "Preparation", "Explaining"], "file": "A002C001_260527DC", "i": "02:39:37:14", "src": "16:29:32:20", "t": "tout ça, on parlait de rigueur avant, et pour pouvoir mettre tout ça dans une journée, et toutes ces journées dans une semaine, et toutes ces semaines dans une année, il faut être hyper organisé. / Parfois, il y a beaucoup de monde qui croient que j'adore cette organisation, c'est quelque chose qui me fait fondamentalement plaisir, / et en fait, / ça ne me dérange pas, mais c'est pas une nécessité. Ça ne me dérange pas, c'est plus une nécessité, si je veux pouvoir faire tout ça. / Alors, c'est pas une obsession avec des chiffres, mais c'est seulement une nécessité que quelque chose... / C'est possible dans une, une jour, par exemple. / Exactement, c'est pas du tout que je suis obsédé par un parallèle chiffre, ou"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "work & discipline", "name": "Organised months in advance", "note": "Very organised and needing control over a great deal; everything planned months ahead, rational and thought through", "kw": ["Christelle", "Family", "Preparation", "Office"], "file": "A002C118_2604191Z", "i": "02:40:27:09", "src": "05:10:53:17", "t": "Exactement, c'est pas du tout que je suis obsédé par un parallèle chiffre, ou / À Nicolas, il est quelqu'un de très, très organisé. Et effectivement, il a besoin de garder le contrôle sur beaucoup de choses. Il a une organisation des mois à l'avance, tout est rationnel, tout est réfléchi. / C'est quelqu'un de très, très structuré dans sa tête. / Et donc, ça se ressent aussi bien au niveau de son engagement, de ses entraînements, de ses courses, de tout ce qu'il fait. / Et qu'est-ce que tu passes avec son obsession d'Excel ? / Avec des programmes d'Excel ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "work & discipline", "name": "His love of Excel has bailed her out", "note": "When she has trouble with a spreadsheet she asks the specialist; she is not as rational as he is", "kw": ["Christelle", "Family", "Office", "laughing"], "file": "A002C118_2604191Z", "i": "02:41:04:13", "src": "05:11:27:11", "t": "programmes d'Excel ? / Je dois le dire que son attrait pour Excel, ça m'a déjà aidé plus d'une fois. Parce que quand j'ai moi-même des soucis avec Excel, je demande aux spécialistes, c'est Nicolas. / Sinon, j'ai un peu de mal à comprendre. Je ne suis pas aussi rationnel que lui."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "risk & safety", "name": "Competence as a way of feeling safe", "note": "High mountains carry enormous uncertainty; he can plan for a great deal but much is at the mountain's mercy, so technical competence is how he feels secure", "kw": ["Nicolas", "Pre WR", "Dangerous", "Alpine", "Preparation"], "file": "A002C001_260527DC", "i": "02:42:44:00", "src": "16:07:26:04", "t": "C'est peut-être d'un côté pour sentir en sécurité. Je pense qu'en haute montagne, on a énormément d'incertitudes. Il y a plein de choses pour lesquelles je peux prévoir, mais aussi plein de choses pour lesquelles on est tributaire de la montagne. Je pense aux chutes de Serrac, aux chutes de Pierre. Il y a suffitement de choses imprévisibles pour que tout ce qu'on peut mettre comme compétences et avoir comme compétences et comme moyens, on va les mettre en œuvre. Si je pense au projet du Mont Blanc, il y a des sections d'escalade qui ne sont certes pas difficiles, mais c'est des sections sur lesquelles j'ai envie de me sentir à l'aise confortable et pas à me sentir limite sur des pensions comme ça. / Tu nous as mentionné à plusieurs reprises ton admiration pour Ulishtek. Pourquoi son approche t'inspire ? / Ulishtek, c'est un personnage,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "risk & safety", "name": "On some sections a fall would be fatal", "note": "Completely honest about it - on certain sections a fall would probably kill him, and it does not worry him more than that", "kw": ["Nicolas", "Pre WR", "Dangerous", "Alpine", "Explaining"], "file": "A002C001_260527DC", "i": "02:43:42:11", "src": "16:55:54:08", "t": "et en étant tout à fait honnête sur certaines sections les reins auraient peut-être fatales maintenant c'est pas quelque chose qui m'inquiète plus que ça je pense que j'ai quand même l'habitude de ce genre d'efforts et j'ai assez confiance de la lucidité que je vais avoir tout au long de tout comme ça / tu as déjà eu peur en montagne vraiment peur pour ta vie ? / j'ai déjà eu à plusieurs reprises vraiment pas pour ma vie ça s'est produit à plusieurs reprises je pense que j'ai frôlé des accidents assez graves"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "risk & safety", "name": "Does the project take away the fear people should have", "note": "Asked whether people seeing this will think it is easy and attempt it themselves", "kw": ["Nicolas", "Pre WR", "Dangerous", "Explaining", "Mountain"], "file": "A002C001_260527DC", "i": "02:44:20:18", "src": "16:56:30:08", "t": "est-ce que tu as peur que ton projet enlève la peur que les gens devraient avoir devant la montagne finalement que les gens te voient, pensent que c'est facile les prennent eux-mêmes des risques inconsidérés ou qui poussent leurs limites sans vraiment avoir fait tout le travail que t'as fait en amont c'est / une question que je me suis posée de savoir si le fait d'exposer un projet comme ça ça ne pourrait pas inspirer d'autres personnes qui n'auraient peut-être pas forcément la conscience des risques qui sont pris à certains moments qui ne mesurerait pas le niveau de compétences qu'il faut avoir pour le faire je pense que avec les années de pratique si j'ai bien compris quelque chose c'est que en débutant la montagne j'étais beaucoup plus naïf et cette naïveté on n'arrive pas à avoir une réelle conscience des risques qu'on va prendre des réelles dangers de certaines sections si on marche sur un glacier par exemple on voit juste une étendue de neige on ne sera pas compte qu'il y a plein de crevasses en dessous une fois qu'on a l'habitude qu'on connaît ces risques on les appréhende on arrive à les minimiser je dirais le fait d'exposer un projet comme ça je ne voudrais pas non plus que ça soit ça puisse faire penser à d'autres personnes qui n'ont aucun risque dans ce genre de projet / comment tu te positionnes là-dessus tu veux plutôt inspirer ou mettre en garde"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "risk & safety", "name": "The day ends when the danger does", "note": "After a high mountain outing the day is not over until every dangerous section is behind him", "kw": ["Nicolas", "Dangerous", "Alpine", "Glacier"], "file": "A002C063_260418WT", "i": "02:45:43:00", "src": "04:23:35:04", "t": "quand on a fini une course en haute montagne, la journée n'est pas finie, mais pour moi, elle est finie quand on a fini tous ces moments où il peut y avoir du danger, je dirais. Après, des fois, on a 2, 3, 4 heures de marche, mais pour quelqu'un de normal, entre guillemets, ou qui ne fait pas ça, ça paraît très énorme. Alors que nous, on a fini notre journée, il reste encore 4 heures de marche, il ne sait pas qu'un danger, c'est juste la marche. Nice, nice. / Ouais, c'est de"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "risk & safety", "name": "Temperature swings over wind", "note": "Sometimes wind forces a retreat, but it is the shifts in temperature between faces that impress him most", "kw": ["Nicolas", "Weather", "Wind", "Conditions", "Dangerous"], "file": "A002C063_260418WT", "i": "02:46:09:05", "src": "04:26:15:04", "t": "Ouais, c'est de / alors des fois ça empêche de faire une structure montagne ou renoncer à cause du vent. D'accord. C'est plus les changements de température qui m'impressionnent toujours. Entre une face nord aussi, ou en bascule sur une autre face, c'est une autre montagne dans ce sens. / Et la valeur qui est quand même / plusieurs fois sur la salle est-ce toujours les mêmes sensations ou tu as des différentes nouvelles fascinations ou spots ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "His first Sierre", "note": "Coming from flat country, mountains are imposing; his first mountain race struck her as extreme and she was very worried", "kw": ["Christelle", "Family", "Nervous", "Running"], "file": "A002C118_2604191Z", "i": "02:46:45:10", "src": "05:08:01:03", "t": "Je ne sais pas comment que ça s'est fait. Je me souviens de son premier sière zinale. Je trouvais que c'était le bout du monde. Sière zinale pour moi, c'était la course extrême. / Je me revois l'attendre à l'arrivée. C'était très, très joyeux. Je pensais qu'il n'y allait jamais plus loin que ça. / Et entre-temps, j'ai appris qu'il y en avait des courses bien plus longues que ça. / J'ai trouvé que c'était absolument fou. J'étais très inquiète. Comme je vous le disais tout à l'heure, nous, on est d'un paysage plutôt plat. Et donc les montagnes, c'est quelque chose d'impressionnant. Pas de danger réellement, mais qu'il faut connaître. Donc, sachant d'où on était originaire, le peu de connaissance de la montagne, j'étais même un peu traumatisé. Et dans la famille, on l'était un peu tous. Très inquiet. / Peut-être, est-ce que tu peux formuler la réponse ? Parce que quand on utilise seulement la réponse, on connaît / le début. Alors / quand il a avancé, il avait fait l'ultra. / Donc tu veux dire que je répète un petit peu ? Exactement."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "The whole family tried to stop him", "note": "When he took up ultra trail everyone was alarmed; his grandmother did everything she could to make him stop", "kw": ["Christelle", "Family", "Nervous"], "file": "A002C118_2604191Z", "i": "02:48:16:03", "src": "05:09:29:01", "t": "Donc quand Nicolas a commencé l'ultra trail, tout le monde était très inquiet dans la famille. Moi, extrêmement, sa grand-mère, très inquiète, elle a tout fait pour essayer de le faire arrêter, des discussions, etc. Parce que pour nous, qui sommes vraiment des gens de la Terre, et pas des gens des hautes montagnes, c'était très impressionnant, très inquiet. Beaucoup d'inquiétudes. / que tu as aussi un petit peu peur, peut-être, de lui ? / quelque chose peut être. / J'ai très, très souvent"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "She is often frightened for him", "note": "She knows it is dangerous and hopes he measures the risk and takes as little of it as he can", "kw": ["Christelle", "Family", "Nervous", "Dangerous"], "file": "A002C118_2604191Z", "i": "02:48:58:23", "src": "05:10:09:05", "t": "J'ai très, très souvent / J'ai très, très souvent peur pour Nicolas. Oui, très souvent. Je sais que c'est dangereux. Je pense qu'il mesure le danger, qu'il le calcule, qu'il essaye, j'espère, de prendre le moindre risque possible, mais je sais que tout peut s'arrêter à tout moment, on le voit souvent. / Et peut-être maintenant, les choses behind the curtain de Nicolas. / Alors, Nicolas, pour moi, / donne l'impression que tout est toujours sous contrôle. / Il peut organiser,"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "Hoping he knows his limits", "note": "She hopes above all that he is aware of his limits - because otherwise he will simply try again until he succeeds", "kw": ["Christelle", "Family", "Nervous", "Dangerous"], "file": "A002C118_2604191Z", "i": "02:49:38:14", "src": "05:15:18:05", "t": "Il peut organiser, / et j'espère qu'il est conscient de ses limites, j'espère surtout que tout va aller très bien et qu'il arrivera au bout de ce qu'il souhaite, parce que sinon il va réessayer jusqu'à y arriver, et il y aura ce risque, ou cette crainte pour moi en tout cas, qui va se répéter plusieurs fois. Donc, tout bon. / Mais est-ce que"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "Frightened by the photographs", "note": "She is afraid of not knowing what he is doing while he does it, and the photos he sends frighten her; life up there is fragile", "kw": ["Christelle", "Family", "Nervous", "Dangerous", "Phone"], "file": "A002C118_2604191Z", "i": "02:50:04:07", "src": "05:15:49:00", "t": "Mais est-ce que / J'ai toujours peur pour Nicolas. J'ai peur de ne pas savoir ce qu'il fait, au moment où il le fait, par exemple, j'ai surtout très peur aussi quand je vois les photos qu'il envoie parfois, parce qu'à l'heure-là, je me rends compte que ça tient qu'à un fil. Le moindre, même pas faux pas, mais la moindre hésitation peut-être pour être très grave. / Et je suis consciente que la vie, dans ces moments-là, elle est très fragile. Et j'espère qu'il tient suffisamment sa vie pour garder toujours le pied sûr. / Quand tout le récours du monde est fini et des choses comme ça, il a fait le récours quatre fois, / qu'est-ce que tu"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "risk & safety", "name": "Putting the cursors in the right place", "note": "Reining in an abnormal level of motivation and setting the limits where they belong - a project that works on paper still has to work in the mountains", "kw": ["Florian", "Dangerous", "Preparation", "Explaining"], "file": "DSC_0169", "i": "02:50:58:03", "src": "00:13:47:09", "t": "qu'est-ce que tu / n'ai pas d'exemple concret comme ça, je pense si peut-être mettre les limites et les curseurs au bon endroit, freiner un peu sa motivation hors norme et se dire ok ce projet sur papier c'est possible mais dans la réalité il y a peut-être encore un chemin avant d'arriver à ça notamment sur des intérieurs un peu plus engagés, par exemple versant l'italien du Mont-Blanc sur certaines choses. / En quoi cette approche légère qu'il a en général, change tout pour un projet comme les quatre faces du Mont-Blanc ?"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "risk & safety", "name": "What gets forgotten is the investment", "note": "Projects like this demand an enormous physical and mental investment that is easy to overlook from outside", "kw": ["Florian", "Partner", "Preparation", "Dangerous", "Explaining"], "file": "DSC_0169", "i": "02:51:44:04", "src": "00:28:20:07", "t": "Voilà, je pense que, des fois, ce qu'on a tendance à oublier, c'est que dès qu'il y a des projets comme ça, ça demande un investissement qui est très important, tant physique, mental, temporel, voilà, il y a des projets qui sont très importants, pour arriver à une fileté comme ça. Et maintenant, un peu dans la société du zapping et du consommérisme tout de suite, les gens, des fois, ils ne se rendent pas compte à quel point ça peut être pour Nico, par exemple, je pense que ce projet-là, c'est l'aboutissement de plein d'années de trails, avant tout, des banquets, ce n'est pas quelque chose qui vient comme ça du jour au lendemain, et en six mois, je vais faire le pinniste et faire un enchaînement. Donc voilà, je pense que, potentiellement, ça peut rendre les choses plus accessibles pour les gens, mais il faut qu'ils essaient de se rendre compte que ce n'est pas si important."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "risk & safety", "name": "Mont Blanc is mythical, and still high mountain", "note": "Everyone wants to go because of the name, but it remains serious high mountain terrain", "kw": ["Florian", "Partner", "Mont Blanc", "Dangerous", "Alpine"], "file": "DSC_0169", "i": "02:52:36:07", "src": "00:29:10:02", "t": "Et c'est problème sur des itinéraires mythiques comme le Mont Blanc où tout le monde a envie d'y aller, mais ça reste quand même très haut, ça reste de là, haute montagne, il ne faut pas l'oublier. / Est-ce que ce problème, alors, est-ce que le problème, c'est que les gens, ils ne sont pas très proches, ils ne sont pas très proches, ils ne sont pas très proches, ils ne sont pas très proches, ils ne sont pas très proches, / Est-ce que ce problème, alors tu as déjà répondu parcellement ou même complètement à vrai dire, mais peut-être si on peut essayer de résumer, est-ce que ce projet, les quatre faces en automne, c'est du trail ou de l'alpinisme ou c'est un truc nouveau ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "route & conditions", "name": "Grands Mulets is the one he wants least", "note": "No great difficulty but too random for his liking", "kw": ["Nicolas", "Pre WR", "Glacier", "Conditions", "Dangerous", "Explaining"], "file": "A002C001_260527DC", "i": "02:54:24:15", "src": "16:45:09:08", "t": "pour parler des quatre itinéraires si on commence par l'été un des grands mûlets je pense qu'une itinéraire que j'ai le moins envie de faire pourquoi ? / parce que c'est celui qui est le plus aléatoire au niveau de la jonction c'est un endroit qui est extrêmement crevassé j'ai été à Grand ski cet hiver et je suis passé dans une crevasse heureusement les skis m'ont bien retenu en étant encordé et là je vais dans le passé en solo et cet aspect d'aléatoire c'est pas quelque chose plus que j'affectionne après techniquement c'est extrêmement facile donc"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "route & conditions", "name": "Saint", "note": "A route he has done before, with the Grand Couloir to cross; the stone fall there does not trouble him unduly", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Dangerous", "Conditions", "Explaining"], "file": "A002C001_260527DC", "i": "02:55:03:22", "src": "16:45:46:08", "t": "soit il n'y a pas de grosse difficulté mais ce que t'es aléatoire je n'aime pas ensuite il y a l'itinéraire depuis Saint-Gervais qui est un itinéraire que j'ai déjà fait ou depuis les Oùches depuis Saint-Gervais mais qui est relativement similaire c'est la voie normale en été du Mont Blanc cet itinéraire là je le connais vraiment par coeur je suis extrêmement à l'aise donc ça va vraiment bien dérouler / oui il y aura des endroits avec des crevasses / oui il y aura des endroits avec des crevasses mais ça reste vraiment limité c'est vraiment très fréquenté donc ça réduit bien le risque / il y a le grand couloir à traverser maintenant dans les orènes dans lesquelles je vais traverser je dirais que c'est pas quelque chose qui m'embête plus que ça / ensuite il y a l'itinéraire"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "route & conditions", "name": "The Jonction is the part he likes least", "note": "An obligatory passage rather than an enjoyable one", "kw": ["Nicolas", "Glacier", "Conditions", "struggling"], "file": "DSC_0095", "i": "02:55:52:04", "src": "00:02:59:02", "t": "ensuite il y a l'itinéraire / quand tu arrives ? / Alors pour moi la junction c'est peut-être le passage que j'ai apprécié le moins du projet maintenant c'est un passage obligé parce que c'est le passage qui va être le plus crevassé avec des pontes de neige et c'est le passage qui m'inquiète le plus. Il y a d'autres endroits qui vont être plus compliqués techniquement où il y a de l'escalade, je pense pas les 8 bionnaissais qui sont plus impressionnants mais là c'est moi qui maîtrise la situation. J'ai beaucoup moins d'aléa que je maîtrise pas."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "route & conditions", "name": "Snow bridges between the seracs", "note": "Back from a recce and a ski descent of Mont Blanc, he has already noticed changes; the flat section at the Jonction hides snow bridges between the seracs", "kw": ["Nicolas", "Glacier", "Snow", "Dangerous", "Conditions"], "file": "DSC_0095", "i": "02:56:30:10", "src": "00:03:53:20", "t": "Aujourd'hui on est venu à la Junction, j'étais aussi la semaine dernière en repérage et faire le Mont Blanc à ski et j'ai déjà remarqué énormément de changements en une semaine alors qu'il n'a pas fait spécialement chaud. Donc pour le projet, au mois de juin, je serais obligé de lui faire un repérage 2-3 jours avant avec un ami pour être sûr de l'endroit où je vais passer le jour J et éviter justement les endroits qui pourraient être problématiques par rapport aux ponts de neige. / D'accord. Et peut-être tu peux seulement expliquer la problématique de les crevasses ou les endroits en 20 centaines ? / Alors la problématique à la Junction c'est qu'il y a un endroit assez plat où il y a des ponts de neige qui se font facilement entre les ciracles et on ne peut pas vraiment le voir. Donc on marche dessus et si le pont de neige est plus assez solide, on peut tomber vraiment dans la crevasse."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Wind forecast: 70 passable, 90 is dicey", "note": "Morning forecast of 90 km/h at 4000m dropping to 70 in the afternoon; 70 can be worked with, 90 cannot", "kw": ["Nicolas", "Wind", "Weather", "Conditions", "Preparation"], "file": "A003C007_260611XF", "i": "02:57:31:13", "src": "12:43:06:24", "t": "possible avec une amie ? / Donc à 2015 km heure et après 90 km heure à 4000 km Ça c'est le matin Et après il prévoit dans l'après midi 70 / Donc c'est pas fou 70 mais 70 ça peut passer et 90 c'est chaud"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Talking about delaying the start", "note": "No wind data yet for Saturday; discussing pushing the departure back two hours to see if it calms", "kw": ["Nicolas", "Wind", "Weather", "Start", "Preparation"], "file": "A003C007_260611XF", "i": "02:57:57:13", "src": "12:43:30:18", "t": "À partir samedi j'ai pas encore, il y a pas encore d'infos sur le vent Mais c'est tendu Et de le décaler ? / On parle de décaler dans la journée je dis, tu vas commencer plus tard Euh... / Ouais, c'est vraiment une bonne notion De décaler peut-être / deux heures Et si ça se calme quand même ? / Parce que c'est pas bon Ah c'est pour la séance Attention"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The hardest part is before the main track", "note": "As always at the start, the complicated part is reaching the main line - crossing the Jonction and what lies in it", "kw": ["Nicolas", "Glacier", "Conditions", "Start", "Explaining"], "file": "A003C106_260611ZQ", "i": "02:58:24:19", "src": "19:02:25:23", "t": "Comme toujours au départ, le plus compliqué c'est avant d'arriver sur le trace principal, donc dans lequel est-ce qu'il a eu passer et tout ça, ça me vit pas pendant 5 minutes parce que je me suis perdu en ville. / parce que tu vas croiser la junction et tu es déjà dans de là un petit peu ? / Oui, je fais une petite petite encroisse à long terme."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Skis on his back at the Jonction", "note": "Remembers crossing roped up with skis on his back and not being keen on it", "kw": ["Nicolas", "Glacier", "Dangerous", "Gear", "Conditions"], "file": "A003C106_260611ZQ", "i": "02:59:00:24", "src": "19:02:59:23", "t": "Cette fiver, les skis sur le dos, ça m'a bloqué, on était encordés. Je ne m'envoie pas trop. Là, je ne suis pas trop trop chaud, / je suis assez tôt. J'ai été passé en fin de journée en descendant du Mont Blanc-Stibert. / Ce qui est marrant, c'est que c'est le pire. / J'aurais dit hier après midi, je me dis là, c'est la jeunition qui me plaît pas trop, mais maintenant c'est le... c'est plus le vent qui... Donc / le problème avec le door ? La porte. Pour le lendemain."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The Torino transition and its problems", "note": "Explains the crossing to Courmayeur, the glacier section to the Torino hut, and where it gets difficult", "kw": ["Nicolas", "Glacier", "Mountain Hut", "Explaining", "Conditions"], "file": "A004C046_260613H5", "i": "02:59:40:04", "src": "12:44:17:07", "t": "J'aurais dit hier après midi, je me dis là, c'est la jeunition qui me plaît pas trop, mais maintenant c'est le... c'est plus le vent qui... Donc / le problème avec le door ? La porte. Pour le lendemain. / Alors, une fois qu'on est là, il y a la transition en fer qui consiste à aller à Courmayeur qui se trouve ici. Et il y a plusieurs problèmes. Il y a une section à traverser ici, glaciers, jusqu'au refugie Torino. Ça va avoir rien de spécial. Et après, il y a une descente qui est vraiment très escarpée sur le roof. Et il y a une porte de l'ancien refuge qui permet d'y accéder. Donc là, j'ai appelé le refuge Torino. Ils n'avaient même pas si la porte est déjà ouverte vu la saison. / Et j'ai regardé"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Webcams and word of mouth, no clear answer", "note": "Checked webcams the week before and asked people who had been through; nobody could tell him", "kw": ["Nicolas", "Conditions", "Preparation", "Explaining"], "file": "A004C046_260613H5", "i": "03:00:26:17", "src": "12:45:00:20", "t": "Et j'ai regardé / Et j'ai regardé les webcams la semaine dernière et la secordanège. Donc j'aurais demandé des infos sur les conditions pour savoir si c'est... Il y a déjà des gens qui étaient passés. Ils ne pouvaient pas me dire. / Et on vient d'avoir d'autres infos à l'instant. Après, la descente n'est pas du tout practicable. On était déjà limite au niveau du timing. Parce que vu la traversée qu'on a à faire pour arriver... / Ça va être déjà à faire demain pour arriver ici. Ça va être assez rare. La descente, elle est assez longue."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The descent is not passable", "note": "New information arrives: the Torino descent is impassable and the timing was already tight, so plan B is forced", "kw": ["Nicolas", "Dangerous", "Conditions", "Explaining"], "file": "A004C046_260613H5", "i": "03:00:59:20", "src": "12:45:31:07", "t": "Ça va être déjà à faire demain pour arriver ici. Ça va être assez rare. La descente, elle est assez longue. / descente, elle est assez longue. / Donc là, avec toutes les instituts qu'il y a ici, on ne sait même pas si c'est possible de passer ou pas. Il faut qu'on parte sur le plan B. Donc le plan B, ça consiste... / puisqu'on souhaite vraiment pas utiliser le moyen de transport pendant les ascensions. Ça consiste à repartir de..."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Rebuilding the route from the Aiguille du Midi", "note": "Plan B starts from the Aiguille du Midi where he will already be, shortening what was planned for the last day", "kw": ["Nicolas", "Aguille du Midi", "Mont Blanc", "Explaining", "Preparation"], "file": "A004C046_260613H5", "i": "03:01:25:10", "src": "12:46:06:02", "t": "repartir de l'aiguille du midi, où je serai arrivé en fin de journée. Pour faire le plus rire, donc aussi, F4 est une supportide. Aiguille du midi, Mont Blanc, aiguille du midi. Donc ça raccourcie un petit peu ce qui était prévu sur le dernier jour. Mais au vu de tous les éléments qu'on a eu, redescendre sur le versant italien, par ce chemin là, ça ne va pas être possible. Donc on a bien dû trouver quelque chose d'alternatif. / En soi, c'est une autre des voies classiques du Mont Blanc. Donc je trouve que ça va tout à fait du sens de le faire comme ça. / C'est dommage pour toi quand"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Plan B has to make sense on its own", "note": "A fallback purely for the sake of a fallback would not do; the Aiguille du Midi route is a classic in its own right", "kw": ["Nicolas", "Explaining", "Aguille du Midi", "Mont Blanc"], "file": "A004C046_260613H5", "i": "03:02:06:06", "src": "12:46:52:24", "t": "C'est dommage pour toi quand / Alors si c'était un plan B, juste pour trouver un plan B, ça ne me conviendrait pas. Là, je trouve que le plan B, il a aussi du sens. / C'est aussi une des routes classiques du massif du Mont Blanc. C'est aller retour aiguille du midi, la sommet du Mont Blanc, retour aiguille du midi. Et c'est souvent une cour qui se fait même justement à la journée. Les gens ils gagnent, ils prennent la première benne le matin. / Ils font le sommeil, ils redescendent. Et l'objectif"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The same mountain, a day apart", "note": "Two successive days on the same mountain and it is completely different - wind, cloud and fog change everything", "kw": ["Nicolas", "Weather", "Conditions", "Mountain", "Explaining"], "file": "A004C048_260613PO", "i": "03:02:36:09", "src": "13:03:43:19", "t": "Ils font le sommeil, ils redescendent. Et l'objectif / En fait, je réalise toujours que c'est quelque chose, j'en fends que tu as fait une porte ouverte. / Le même montagne, la météo, ça change tout. Le vent, les nuages, du brouillard, j'ai bien vu là, on est deux jours successifs. Le premier jour, c'était un cauchemar. Et le deuxième, oui, il y avait du vent, mais il y avait un grand ciel bleu, donc on a de la visibilité, on sait où on va. / C'est beaucoup plus facile. / Avec le vent, quand on sait pas, on va en plus, comme on entend encore à faire. C'est des passages escarpés, c'est du brouillard, on ne le voit"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Only watched the wind", "note": "Kept moving at the summit because of the wind, did not linger before descending", "kw": ["Nicolas", "Wind", "Conditions", "Summit"], "file": "A003C134_26061230", "i": "03:04:34:17", "src": "08:31:23:09", "t": "J'ai toujours juste regardé le vent. Dès là c'était à combien tu / je ne me sens pas, c'est soufflé mais c'est pour ça que je n'ai pas traîné en haut pour redescendre parce que c'est vrai que dès que tu descendais autour de 4000, ça c'est bien on / a vu, tu as vraiment fait l'aller-retour tu as touché le sommet, / tu as fait le petit coup"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Energy spent, day 3 must be rest", "note": "Used far more energy than expected; needs the next day easier to arrive rested at Bionnassay", "kw": ["Nicolas", "Tired", "Conditions", "Preparation"], "file": "A003C134_26061230", "i": "03:04:56:05", "src": "08:31:57:17", "t": "quel est ton level d'énergie ? c'est un beaucoup utile et beaucoup terminé, je sais peut-être beaucoup / plus que ce que je pensais aujourd'hui je me t'ai dit / justement, ça va être la journée un peu cool pour se mettre dans le bain et en fait ça m'a séché je pense que le niveau de la gestion demain, voir que ça a un peu plus cool pour la troisième / journée à Bionasset parce que c'est une très très longue journée à Bionasset et technique en plus donc il faut que l'on arrive à plus reposer possible à Bionasset / Donc demain c'est journée"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Snow did not hold above 3500", "note": "Expected good support from scouting the previous weekend; above the hut and 3500m it broke down", "kw": ["Nicolas", "Snow", "Conditions", "Explaining"], "file": "A003C134_26061230", "i": "03:05:31:20", "src": "08:32:50:18", "t": "Donc demain c'est journée / Et je pensais vraiment, comme j'étais allé en montagne le week-end dernier, que ça allait bien porter. Mais là il est encore un peu neigeé cette semaine et en fait c'est au-dessus du refuge. Donc moi j'étais allé jusqu'à 3 500 à peu près, ça portait bien. Et là c'est au-dessus de 3 500 que ça commenc
