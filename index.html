makes it even more difficult", "kw": ["Monologue", "struggling", "GoPro"], "file": "GX010019", "i": "01:35:12:00", "o": "01:35:12:01", "d": "", "t": "C'est vraiment galère. / J'essaye d'avancer de troule. On va voir ce que ça donne. / Il y a personne qui est passé ce matin encore donc je ne l'aide pas. / Ok, je suis allé monter par là, ça se dégage un tout petit peu et de passer là sur le glacier. J'ai aussi trouvé un peu mon chemin, des traces de ski, c'était pas super mais ça porte un peu mieux. Au dessus j'ai l'impression que c'est bien bouché, on va voir."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Clearing conditions - found some tracks, better snow, a lot of energy used, trying to preserve energy", "kw": ["Monologue", "Conditions", "GoPro"], "file": "GX010020", "i": "01:35:22:07", "o": "01:36:11:03", "d": "0:48", "t": "Ok, je suis allé monter par là, ça se dégage un tout petit peu et de passer là sur le glacier. J'ai aussi trouvé un peu mon chemin, des traces de ski, c'était pas super mais ça porte un peu mieux. Au dessus j'ai l'impression que c'est bien bouché, on va voir. / Ça m'a demandé énormément d'énergie, beaucoup plus que ce que j'aurais mis comme énergie si les conditions avaient été bonnes, pas bien de faire la trace. / Donc voilà, je pense que je n'ai pas accéléré pour essayer de retraper le temps perdu. Il y a encore beaucoup en perspective, le but c'est de se préserver aussi. / Je pense que la tempête ici, le vent, le froid, la visibilité, tu vas essayer de monter un drapeau petit peu mais ça devient vraiment dangereux. Je vais devoir prendre une décision, je pense bientôt que du froid là."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Storm - the wind, the cold, the visibility, it's getting really dangerous. Have to make a decision", "kw": ["Monologue", "Wind", "struggling", "GoPro", "Conditions"], "file": "GX010021", "i": "01:36:18:18", "o": "01: : "1:48", "t": ""}, {"kind": "fkt", "tl": "WR_D5", "tln": "WR Day 5", "date": "15 Jun", "ty": "MOMENT", "note": "Mont Blanc view", "kw": ["Mont Blanc"], "file": "A001_06150823_C025", "i": "01:13:45:03", "o": "01:13:45:04", "d": "", "t": ""}, {"kind": "fkt", "tl": "WR_D5", "tln": "WR Day 5", "date": "15 Jun", "ty": "MOMENT", "note": "Aguille du Midi", "kw": ["Aguille du Midi"], "file": "A001_06150829_C041", "i": "01:15:26:08", "o": "01:15:26:09", "d": "", "t": ""}], "iv": [{"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "origins", "name": "A mining region with no mountains", "note": "Grew up in north-east France, a working region of mines that became an industrial desert when they closed", "kw": ["Nicolas", "Pre WR", "Family", "City"], "file": "A002C001_260527DC", "i": "01:00:00:02", "src": "15:56:57:18", "t": "Alors j'ai grandi dans le nord-est de la France, c'est une région ouvrière où il y avait beaucoup de mines et une région pour laquelle il y a eu un vrai... / je sais plus comment on dit, un vrai désert industriel quand les mines ont fermé et dans la région d'où je viens, ça me fait pas mal rire maintenant quand j'y retourne pour aller voir la famille, c'est qu'il y a des terriles, il y a des terriles pour ceux qui ne connaissent pas, c'est en gros une bosse de 100 mètres de dénivelé de haut et je vais m'entraîner là-bas, je vais la faire 20, 30, 40 fois quand je vais voir la famille puisque là-bas on n'a pas de grandes montagnes."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "origins", "name": "Nobody in the family was sporty", "note": "No sporting family; the one athletic figure was a father he barely knew and stopped seeing around thirteen", "kw": ["Nicolas", "Pre WR", "Family"], "file": "A002C001_260527DC", "i": "01:00:40:24", "src": "15:57:43:20", "t": "Alors j'ai pas une famille qui est très sportive en général, donc si je dois retrouver quelqu'un dans mon entourage qui a été sportif, c'est mon père que j'ai peu connu, je l'ai plus vu depuis l'âge de 13-14 ans environ, peut-être même un peu avant, je l'ai plus exactement, lui m'emmenait faire beaucoup de sport du vélo et je voyais ça quand j'étais enfant, plus comme une contrainte parce que tous les week-ends je devais aller faire des kilomètres et des kilomètres un vélo. J'y repense maintenant avec un peu de nostalgie, je me dis peut-être que j'arrivais pas à un grand compte que ça me servira aussi aujourd'hui, les capacités qu'on développe, qu'on est enfant, c'est quelque chose qui reste toute la vie je pense. / Donc du coup, est-ce que c'est une forme de signe que tu finirais à courir sur le Mont-Blanc, le fait que tu fasses autant de sport quand t'étais jeune ? / Je pense pas"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "origins", "name": "Chance encounters, not predestination", "note": "He does not think his childhood pointed here; more the accidents of life, encounters and small triggers that make big changes", "kw": ["Nicolas", "Pre WR", "Family", "Explaining"], "file": "A002C001_260527DC", "i": "01:01:31:19", "src": "15:58:31:20", "t": "Je pense pas / Je pense pas que ce soit un signe que je fasse autant de sport quand j'étais jeune qui m'a prédestiné aujourd'hui, mais c'est peut-être plus des hasards de la vie, des rencontres, des petits déclics qui font des grands changements, on parle souvent du battement d'aile d'un papillon qui déclenche un tsunami à l'autre bout du monde et je pense que c'est vraiment ça pour moi. / A quel moment tu as vu une vraie montagne, donc pas ta colline de 100 mètres pour la première fois ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "Flat country, hills of fifty metres", "note": "He is a Lorrain who grew up in real countryside where the biggest hills are fifty metres high", "kw": ["Christelle", "Family", "City"], "file": "A002C118_2604191Z", "i": "01:02:02:14", "src": "05:04:53:20", "t": "Alors Nicolas, c'est un lorain. Il a grandi vraiment à la campagne. Chez nous, c'est très, très plat. Les plus grands montagnes, ils doivent faire 50 mètres. Et puis là, du coup, ça change vraiment du tout au tout. / Et c'était... Ah ouais, c'était la prochaine question."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "He already climbed", "note": "It still makes her laugh: as a small boy he was already climbing, but on the furniture, because there was nothing else", "kw": ["Christelle", "Family", "laughing", "Scrambling"], "file": "A002C118_2604191Z", "i": "01:02:26:15", "src": "05:05:25:08", "t": "Non, pas réellement. Nicolas, quand il était petit, et d'ailleurs, ça me fait souvent rire quand j'y pense, parce qu'il grimpaient déjà. Mais il grimpaient donc à l'intérieur, puisque chez nous, de toute façon, il n'y avait rien. Donc il grimpaient sur les meubles de cuisine, il grimpaient, il sautait, il remontait. Il était très, très, très agile. Et au point où on se disait, il faut absolument les canaliser, et on lui a fait faire la gymnastique. Et donc, quand il était petit, c'était un gymnast de très bon niveau. / Je ne connais pas les montagnes. / Voilà, sur les meubles de la cuisine, sa grand-mère avait très peur toujours. / Et peut-être aussi, est-ce que quelqu'un dans la famille faisait de la montagne, déjà, ou c'est vraiment lui qui est ammé ça? / Et bien, personne dans"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "Nobody in the family went to the mountains", "note": "Absolutely no one - the land is flat and people moved around far less then", "kw": ["Christelle", "Family", "City"], "file": "A002C118_2604191Z", "i": "01:03:25:03", "src": "05:06:21:11", "t": "Et bien, personne dans / Et bien, personne dans la famille faisait de la montagne. Absolument personne, parce que chez nous, c'est plat. Et puis, en ce temps-là, on bougeait quand même beaucoup moins que de nos jours. Donc il a surtout connu des plaines et des petits vallons. Mais je dois dire que quand j'étais jeune, j'étais passionnée de lecture de Frison Roche. Et je suppose que ça l'a peut-être influencé quelque part. / Et maintenant, des questions, peut-être, / il faudra découvrir les montagnes. / Quand vous avez repensé à Nicolas pendant longtemps, avant le montagne et beaucoup du sport, c'était qui?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "Born very premature", "note": "He was a very premature baby, tiny and light, with great difficulty at birth", "kw": ["Christelle", "Family", "Nervous"], "file": "A002C118_2604191Z", "i": "01:04:11:13", "src": "05:13:26:00", "t": "ça vient peut-être de... Nicolas, quand il vivait une nuit, c'était un grand prématuré. C'était un tout petit bébé très, très léger. Il a eu beaucoup de difficultés à la naissance. Enfin, à l'époque là, un grand prématuré, c'était encore difficile. Et j'ai l'impression que c'est cette lutte qui lui a fallu mener dès le début de sa vie, qui lui donne peut-être ce caractère aussi déterminé. / Prême, très joli, très joli. Tu vas seulement contrôler la lumière. / bien. C'est bon. / Il y a beaucoup de soleil maintenant. / Oui, ça a changé. / Est-ce que je peux juste prendre une d'orgédo ? / Bien sûr, oui, bien sûr. Vous direz, si vous avez tant de cas à la pause, à n'importe quel moment, / mais on peut se tutoyer. Comme tout à l'heure, oui, avec l'âge, tout ça, c'est sûr. / Non, non, c'est même pas ça, c'est juste"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "First time in the high mountains", "note": "The Dome de Miage in the Mont Blanc massif was another world entirely", "kw": ["Nicolas", "Pre WR", "Alpine", "Mont Blanc", "Glacier"], "file": "A002C001_260527DC", "i": "01:06:33:09", "src": "16:02:12:09", "t": "Et à côté de ça je dois parler de la haute montagne. La première fois que j'ai eu une haute montagne au domaine de miage, dans le massif du Mont Blanc, ça a été un autre décrit. C'est quelque chose à qui je suis beaucoup plus fort."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "Better at the third half than the game", "note": "Before thirty he was no endurance athlete; he played rugby, and was strongest in the drinking that followed", "kw": ["Nicolas", "Pre WR", "laughing", "Family"], "file": "A002C001_260527DC", "i": "01:06:47:15", "src": "16:02:33:19", "t": "Avant 30 ans je n'étais pas tout à fait un athlète d'endurance. J'ai fait pas mal de sport. J'ai notamment joué au rugby. / Le rugby c'est connu pour une chose surtout pour la troisième mi-temps. J'étais plutôt très fort dans la troisième mi-temps que dans d'autres activités avant mes 30 ans."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "Sedentary, smoker, fifteen kilos heavier", "note": "A completely different life before thirty: sedentary, smoking, more time at the bar than doing sport", "kw": ["Nicolas", "Pre WR", "struggling", "Family"], "file": "A002C001_260527DC", "i": "01:07:07:11", "src": "16:05:18:11", "t": "Avant mes 30 ans, je me menais une vie totalement différente. J'avais une vie vraiment sédentaire, j'étais fumeur, et je passais plus de temps à la péro qu'à la carte du sport. / Maintenant, on va parler un petit peu du switch. Tu nous as raconté que ta première fois en haute montagne, le dome de miage, c'est ce qui t'avait, entre guillemets, / créé comme une sorte de déclic. Est-ce que tu veux me décréer ce moment ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "From running to lose weight to passion", "note": "Started running only to shed some weight; the switch to sport as pleasure came with the high mountains, altitude sickness and all", "kw": ["Nicolas", "Pre WR", "Training", "Alpine", "Hypoxy"], "file": "A002C001_260527DC", "i": "01:07:34:15", "src": "16:05:42:20", "t": "Alors, le switch, vraiment, où je suis passé de courir, parce que je me disais qu'il fallait quand même faire quelque chose pour essayer de perdre un peu de poids, pour me maintenir un peu en forme. Le switch vers le sport plaisir, la passion pour la montagne, ça fait au dome de miage. C'est la première fois que j'ai vraiment découvert cet univers de la haute montagne. / Je ne vais pas dire le contraire. Le mal de l'altitude, pas forcément la condition physique adaptée pour ça. Par contre, ça a été des paysages grandiose. Pour moi, qui ne vient pas du tout de ce milieu, / c'était une révélation, je peux dire. / Maintenant, racontez-moi un petit peu la première course de trail à laquelle tu as participé. Comment ça s'est passé"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "An early solo Tour du Mont Blanc", "note": "One of his first ultras, done solo, leaving on a Friday evening after work", "kw": ["Nicolas", "Pre WR", "Running", "Mont Blanc", "Training", "happy"], "file": "A002C001_260527DC", "i": "01:08:16:10", "src": "16:58:12:08", "t": "Maintenant, racontez-moi un petit peu la première course de trail à laquelle tu as participé. Comment ça s'est passé / je me souviens je pense que c'est peut-être mon premier ultranom peut-être mon deuxième ultranom j'ai fait en solo en faisant un tour du Mont Blanc en partant le vendredis soir après le travail un truc totalement improbable avec une certaine maïcité ça a été dur pour arriver au bout je suis arrivé / mais j'ai pas mal d'histoires et d'anecdotes sur ce massif, il y a un âgement particulier c'est pour ça que ce projet me parle / c'est pas l'action"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the switch", "name": "The Dome de Miage, and wanting Mont Blanc", "note": "His first time in the high mountains and his first race; ridges and summits he never imagined climbing", "kw": ["Nicolas", "Alpine", "Mont Blanc", "Glacier", "Ridge"], "file": "A002C063_260418WT", "i": "01:08:46:17", "src": "04:27:44:01", "t": "quand ou pourquoi? / La première fois que je suis allé en haute montagne, c'était au domaine de miage, dans le massif du Mont Blanc. C'était ma première course. J'avais envie de faire le Mont Blanc. Et quelqu'un m'avait emmené faire un sommet juste à côté pour essayer. / Si on t'avait montré ta vie aujourd'hui, quand tu avais 25 ans, tu aurais dit quoi? / C'est pas possible. J'aurais dit que c'était pas possible. J'avais pas du tout une vie comme ça. J'avais une vie beaucoup plus sédentaire. / Et même quand je repense à cette première sortie en haute montagne,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the switch", "name": "The real switch was a trail race", "note": "The high mountains impressed him, but the actual turning point was his first trail running race and the view over Lac d'Annecy", "kw": ["Nicolas", "Running", "Training", "happy"], "file": "A002C063_260418WT", "i": "01:09:26:00", "src": "04:29:06:04", "t": "une étape à étape. / Peut-être. Sans doute pas sur ce moment. La fois où j'ai eu un switch, je pense, c'était sur ma première course de trail running. C'est... / Disons que la première fois que j'étais en haute montagne, j'étais très impressionné. Et ma première fois, sur la course de trail running, j'ai eu une vue sur le lac d'Ancy. Et ça, ça a été plus émerveillé. Et c'est assez différent comme sensation. Et les deux ont contribué à faire que aujourd'hui, j'ai envie de passer tout le monde en montagne. / qu'est-ce qui change concrètement dans la vie, quand ta vie, tu as commencé? / Je crois que j'ai commencé la montagne. / Ça a été une passion"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the switch", "name": "A devouring passion", "note": "It started small and grew, and he kept adding disciplines - climbing, alpinism, one after another", "kw": ["Nicolas", "Training", "Running", "Alpine", "Scrambling"], "file": "A002C063_260418WT", "i": "01:10:14:05", "src": "04:29:51:20", "t": "Ça a été une passion / Ça a été une passion dévorante. Au début, j'ai commencé à y aller un petit peu. Et j'ai rajouté plein d'autres sports, au fur et à mesure, un petit peu d'escalade, de l'alpinisme, de la cascade de glace, du ski de randonnée. Et au final, avec toutes ces activités, maintenant, je passe tout le monde en libre en montagne. Nice. / Have to quickly start up again. / Il y a une personne, un moment qui a fait basculer les choses. Pas parce que... Oui, à basculer."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "the switch", "name": "A completely different young man", "note": "The opposite of who he became - he liked parties and drinks and spending the time he had", "kw": ["Christelle", "Family", "laughing"], "file": "A002C118_2604191Z", "i": "01:10:49:19", "src": "05:07:05:08", "t": "C'était un jeune homme totalement différent. Un jeune homme allait opposer de ce qu'il est devenu. Il aimait faire la fête, il aimait boire des verres, passer. Au passé du temps qu'il n'y avait pas assez, il le fait toujours. Mais il faisait du bateau. Enfin, c'était une vie très, très différente. Et puis, il s'est mis tout doucement à la course. Au début, je trouvais ça très bien. Et puis, quand j'ai vu l'intensité que ça prenait, l'engagement que ça représentait, c'est là que mon attiqué étude a commencé à croître. / Au fur et à mesure qu'il montait, j'étais de plus en plus inquiète. / Est-ce qu'il y avait des signes que tout ça allait arriver ou c'est vraiment sorti de nulle part de changer de / l'amour? C'est vraiment arrivé brutalement sans comprenne. / Je ne sais pas comment que ça s'est fait."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "His personal situation", "note": "PERSONAL - the interviewer had cut the couple questions; he speaks about his situation and a separation. Handle with care before using", "kw": ["Nicolas", "Pre WR", "Family", "Partner", "struggling"], "file": "A002C001_260527DC", "i": "01:13:07:07", "src": "16:35:57:08", "t": "une façon générale vis-à-vis de Jean ça va ? / mais ouais c'est un peu compliqué ma situation ah ouais en ce moment ? je vais vous raconter comment on va se séparer avec Jace c'est quoi ? / je les avais pas inclus de toute manière à mince / donc le goût je pense pas avoir... les alias ? / les alias exact / c'est reparti ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "How he met Florian", "note": "Cannot say exactly when, but recalls how the friendship with Florian began", "kw": ["Nicolas", "Pre WR", "Family", "Partner", "Explaining"], "file": "A002C001_260527DC", "i": "01:13:51:14", "src": "16:37:00:18", "t": "comment est-ce que tu as rencontré Florian ? raconte-moi un petit peu cette rencontre / alors Florian comment j'ai rencontré c'est une très bonne question je ne pourrais pas dire exactement comment j'ai rencontré je me suis fait notre première sortie en montagne ensemble c'est une sortie qu'on a fait... on était dans un grand combat et Florian c'est quelqu'un qui est vraiment hyper inspirant en montagne qui est très forte forcément il y a un niveau assez impressionnant une naissance ça a été vraiment inspirant pour moi parce que c'était une pratique un peu différente de la montagne beaucoup plus libre dans ma vision que j'ai de sa pratique en montagne"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "How his mother sees it", "note": "Ambiguous - she sees it does him good, but the exchanges are difficult because she is not sporty and struggles to picture it", "kw": ["Nicolas", "Pre WR", "Family", "Christelle", "Explaining", "Phone"], "file": "A002C002_260527XB", "i": "01:14:34:11", "src": "17:03:30:24", "t": "Alors comment c'est perçu par ma maman, par ma famille ? Je ne sais pas, c'est assez ambigus. Je pense que ma maman voit que je ne m'ai pas nuit là-dedans. Donc forcément, ça lui fait plaisir de voir que je ne m'ai pas nuit. Au début, il y avait quand même beaucoup d'impiétudes. Je ne sais pas si maintenant elle me le montre moins ou aussi assez peut-être un peu habituée. / Et c'est toujours des échanges qui sont un peu difficiles parce qu'elle n'est pas vraiment sportive. Et je crois qu'elle a peut-être un peu du mal à comprendre des fois ce que je peux trouver là-dedans, mais je ne sais pas si c'est un peu comme ça."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "His son Jean wants MMA", "note": "Jean is fifteen and does combat sports; nothing to do with the alpine world, so he plants a seed without pushing", "kw": ["Nicolas", "Pre WR", "Family", "Partner", "Explaining"], "file": "A002C002_260527XB", "i": "01:15:18:03", "src": "17:04:48:24", "t": "Je pense que mon fils Jean, il devrait être athlète mais en MMA. Donc ce n'est pas forcément quelque chose qui correspond vraiment au milieu de l'alpinisme. / Et à côté de ça, j'essaie de planter la petite graine sans voir le forcer ou le pousser là-dedans. Donc j'essayais plus d'utiliser sa curiosité. / Et je suis assez ému quand je parle de ça parce que je pense qu'on a vraiment ce même caractère tous les deux où on est très respectueux d'activité de l'autre. / Et on essaye"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "Moved talking about Jean", "note": "Visibly moved - they share the same character, each respectful of the other's world and each trying to step into it", "kw": ["Nicolas", "Pre WR", "Family", "happy", "Partner"], "file": "A002C002_260527XB", "i": "01:15:53:20", "src": "17:05:09:04", "t": "Et on essaye / Et je suis assez ému quand je parle de ça parce que je pense qu'on a vraiment ce même caractère tous les deux où on est très respectueux d'activité de l'autre. / Et on essaye chacun d'aller un peu dans le milieu de l'un de l'autre. Donc lui, il va tenter de faire une course avec moi ou un petit peu d'alpinisme. / Et moi, je vais peut-être m'intéresser à des jeux vidéo ou des choses comme ça. / Et on a un profond... / Qu'est-ce que tu as dit ? / Tu as un profond respect, profond admiration, je pense que tu es... / Parfait. Il y a encore quelques questions et après on va s'arrêter là pour avoir la question de timing. Oui. / Mais le problème c'est qu'il y a le truc qui va descendre. / Bon, vas-y commence à"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "Mont Blanc with Jean did not happen", "note": "The weather was not right last year to climb it with his son, and the massif matters particularly to him", "kw": ["Nicolas", "Pre WR", "Family", "Mont Blanc", "Weather", "Conditions"], "file": "A002C002_260527XB", "i": "01:16:53:07", "src": "17:06:15:05", "t": "Bon, vas-y commence à / Alors les conditions météo pour monter le Mont Blanc avec Jean, l'année dernière était vraiment pas réunie. Et comme c'est un massif qui est particulier pour moi et j'en parlais, j'ai envie de planter la graine, j'ai envie de l'écouter de cette activité mais de le pousser là-dedans. J'ai envie de lui faire du plaisir aussi. Donc j'ai préféré de pousser ça à un moment qui va plus profiter. / On va parler du why. Qu'est-ce que tu veux que les gens retiennent de ce projet ? L'effort, la transformation ou autre chose ? / C'est le car de la cabine ? / remet tout nickel comme on a dit. On se voit samedi."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "family", "name": "He only calls when things are fine", "note": "She does not know him in bad moments - he rings regularly, and always when all is well", "kw": ["Christelle", "Family", "Phone"], "file": "A002C118_2604191Z", "i": "01:17:50:18", "src": "05:12:32:00", "t": "Je ne connais pas Nicolas dans des moments où ça ne va pas. Donc il m'appelle toujours quand tout va bien. Il m'appelle régulièrement et malgré la distance, on garde quand même des contacts très proches, heureusement. / Est-ce qu'il y a des choses"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "family", "name": "She trusts him with the four routes", "note": "When he tells her about new projects like the four routes on Mont Blanc, she trusts him", "kw": ["Christelle", "Family", "Mont Blanc"], "file": "A002C118_2604191Z", "i": "01:18:14:14", "src": "05:15:02:10", "t": "Est-ce qu'il y a des choses / Eh bien quand Nicolas me parle de ces nouveaux projets, notamment celui des quatre voix pour le Mont Blanc, eh bien je lui fais confiance. / Maintenant, j'espère que ce n'est pas inconsidéré,"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "family", "name": "Proud of him either way", "note": "If he breaks the record she will be very proud - but she is proud of him regardless. She is his mother; what matters is who he is, the record belongs to him", "kw": ["Christelle", "Family", "happy"], "file": "A002C118_2604191Z", "i": "01:18:33:02", "src": "05:17:01:00", "t": "Et bien, si Nicolas arrive à battre ce record du monde, je serais très fière de lui. Je serais très fière de lui, mais seulement je suis fière de lui de toute façon. Et quoi qu'il fasse, je serais fière de lui, parce que record de ma nom, ça reste un homme extraordinaire. / Et peut-être le même aux similar questions, est-ce que vous êtes fière de lui par le record / aussi pour tout le reste ? / Je suis la maman de Nicolas. Donc ce qui est important pour moi, c'est la personne qu'il est. Et le record, ça, c'est quelque chose qui lui appartient. C'est pour lui que c'est important. Pour moi, ça reste toujours mon fils. Ça reste le petit garçon qui a grandi, qui est devenu un homme, qui prend ses premiers cheveux gris et surtout qui vit sa passion. Et de ça, j'en suis très heureuse. / Parfait. Très joli."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "family", "name": "They met over the counter", "note": "Nicolas was a regular customer at the shop in Carouge, always turning up full of drive and motivation", "kw": ["Florian", "Partner", "Town"], "file": "DSC_0169", "i": "01:19:40:23", "src": "00:04:14:16", "t": "Parfait. Très joli. / Alors Nicolas, on s'est rencontrés justement au magasin à Cactusport, en Carouch, c'était un client régulier, et puis, ben Nico, il arrive toujours avec beaucoup d'entrains, beaucoup de motivation, et puis nous, c'est un petit magasin qui est assez dans la proximité, où en gros on n'a pas vraiment des clients, c'est vraiment très proche au niveau relationnel, du coup on a commencé à échanger un petit peu sur les projets de montagne, il a toujours plein plein plein de projets, et du coup c'est comme ça un peu qu'on s'est raccroché. Lui, il vena vraiment de l'univers du trègle, moi je faisais un petit peu de trègle, mais principalement plutôt escalade, grande voie, et puis un peu voyage d'aventure, lié avec le rocher principalement, et de la montagne alpinisme, et puis lui, il est arrivé avec ses projets un peu de one-pouche, de distance, de dénivelé, tout ça, et moi c'est quelque chose qui m'a tiré, mais je n'ai pas trop de compagnons de cordée comme ça, et on s'est rapproché en fait avec chacun nos spécificités, nos aptitudes, et du coup on a fait des commerces sortis comme ça, avec à chaque fois des trucs qui font un petit peu..."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "Son picked the cap", "note": "His son chose the cap colour for the attempt - black over blue", "kw": ["Nicolas", "Family", "Preparation", "Gear"], "file": "A002C287_260611IW", "i": "01:20:47:17", "src": "12:04:08:23", "t": "je les mettrais aussi, dans le sac, je les mettrais dans une petite poche facilement facile demain. Une casquette, le choix de la couleur de la casquette, c'est mon fils qui est au droit aujourd'hui, j'hésite entre le bleu, noir, / il va durer un noir, c'est plus sympa."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "Messages from friends and his son Jean", "note": "Messages of encouragement land well; his son Jean sent one too", "kw": ["Nicolas", "Family", "Partner", "happy"], "file": "A004C046_260613H5", "i": "01:21:05:09", "src": "12:49:39:02", "t": "énergies et des mots de croissance. / Oui, ça fait plaisir de recevoir des messages d'amis. Il y a aussi le groupe, je recevrai aussi des messages en privé. Les gens qui l'ont redé les messages pour m'encourager. Est-ce que c'est super plaisir ? Il y a mon fils Jean qui m'a envoyé un message aussi. Il n'a pas l'habitude d'envoyer. C'est pour ça que j'étais encore plus surpris pour m'encourager. C'est vraiment cool. / Et aussi pour"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "Different friendships have different rhythms", "note": "He and Florian do not message much; that says nothing about the quality of the friendship", "kw": ["Nicolas", "Partner", "Family", "Explaining"], "file": "A004C046_260613H5", "i": "01:21:27:18", "src": "12:50:10:06", "t": "Et aussi pour / quelque chose ou ? / Il m'a envoyé un petit message où il a réagi à quelques messages. Mais avec Florian, on n'a pas l'habitude de se ruer beaucoup de messages comme ça. Il y a certaines relations qui sont... / On échange beaucoup, les autres sont moins. Ça ne dénote en rien de la qualité de nos relations. Mais ça n'est pas juste des personnes."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "First attempted the royal traverse with Florian", "note": "The first time he tried this traverse it was with Florian; they turned back at the foot of the Bosses ridge", "kw": ["Nicolas", "Partner", "Ridge", "Mountain", "Explaining"], "file": "A004C047_260613OO", "i": "01:21:55:12", "src": "12:51:16:19", "t": "en particulier ? / La première fois que j'ai voulu faire cette traversée royale avec quelqu'un, c'était avec Flo justement. / Et on est partis des contaminants, pas exactement là où on vous a pas recevés les mains, mais un peu de choses près. Et on a fait cette traversée de Bionasset, on est arrivés juste au pied de l'arrêt des bosses, on a fait demi-tour, on nous a redescendu par une autre voie. On n'avait pas fait le sommet le jour là, parce qu'on voulait redescendre parler trois mots, mais il avait des visites avalants. / Mais oui, la première fois que j'ai fait cette grande traversée, c'est de les tenter en tout cas avec lui. / Lui, il l'avait vécu comment ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "Christelle, his mother", "note": "Introduces herself as Nicolas's mother", "kw": ["Christelle", "Family"], "file": "A002C118_2604191Z", "i": "01:23:51:12", "src": "05:02:39:24", "t": "bien. Alors, je m'appelle Christelle et je suis donc la maman de Nicolas. Donc je parle à... Je regarde. D'accord, je parle en direct. Ok, très bien. Donc je suis Christelle, la maman de Nicolas. / Et quoi, votre premier réflexe quand vous venez de votre fille Nicolas? / Votre premier réflexe. / Quand on parle de Nicolas, c'est votre première pensée qui vous vient à l'esprit et quand on parle de Nicolas? / Quand on me parle de Nicolas, je me dis que c'est un sportif... / Enfin, je me dis qu'il réussit sur beaucoup de plans."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "He carries everything at once", "note": "He succeeds on many fronts - professional life, personal life, and above all the sport and the mountains, his first passion", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:24:32:09", "src": "05:03:18:01", "t": "Enfin, je me dis qu'il réussit sur beaucoup de plans. / Enfin, je me dis qu'il réussit sur beaucoup de plans. Il mène un peu tout de front, aussi bien sa vie professionnelle, personnelle, mais surtout tout ce qui concerne le sport, la montagne, sa première passion. / Et quoi, son caractère de base, et puis tout petit, c'est quoi le trait qui charme échange chez lui? / Il est très... Comment dire... / Nicolas est très, très... / Ah, je ne trouve pas le mot maintenant. / Désolé, il est très... Comment dire... / Et juste le mot qui m'échappe, c'est pour dire que... / il est jusqu'au boutiste, et puis surtout,"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "Perseverance to the very end", "note": "His defining trait is perseverance - he is a jusqu'au-boutiste, and when he starts something he goes all in", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:25:21:04", "src": "05:04:29:02", "t": "il est jusqu'au boutiste, et puis surtout, / Donc, l'une des principales caractéristiques du caractère de Nicolas, c'est la persévérance. Il est assez jusqu'au boutiste, et il adore la montagne. Donc, quand on met tout ça bout à bout, on arrive à ce résultat. / Nicolas, il a grandi, ou exactement, c'est quoi, comme environnement?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "She has no sense that he doubts", "note": "His personal commitment is such that once he begins something or launches into a new adventure, he goes", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:25:47:23", "src": "05:11:59:10", "t": "Je n'ai pas l'impression que Nicolas soit quelqu'un qui doute. Il a tellement d'engagement personnel que quand il commence quelque chose, ou quand il se lance dans une nouvelle aventure, ou un nouveau défi, les doutes sont derrière lui. D'ailleurs, je ne sais même pas si les sujets ont doutes. J'en doute."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "No weakening in his character", "note": "There is no faltering in his nature - he always goes", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:26:14:11", "src": "05:13:16:01", "t": "il n'y a pas de fléchissement dans sa nature et dans son caractère. Il y va toujours."}, {"kind": "iv", "speaker": "Kristine", "source": "Pre", "topic": "portrait", "name": "What she sees in him", "note": "Asked what she notices in Nicolas that other people might not", "kw": ["Kristine", "Gym", "Explaining"], "file": "DSC_0094", "i": "01:26:26:08", "src": "00:07:14:01", "t": "D'accord et une question peut-être plus personnelle aussi pour Nicolas, mais peut-être tu peux dire moi qu'est-ce que vous voyez chez lui, que les autres peut-être ne voyaient pas ou les des choses très spéciales ou les choses que tu penses, c'est vraiment des choses, le Nicolas, typiquement Nicolas. / Bon alors beaucoup de persévérance, toujours des idées un peu farfelues. / Qu'est-ce que tu peux"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "Florian, climbing instructor", "note": "Introduces himself: climbing instructor, route setter, and years working in a specialist mountain shop", "kw": ["Florian", "Partner", "Scrambling"], "file": "DSC_0169", "i": "01:27:05:21", "src": "00:03:44:10", "t": "Qu'est-ce que tu peux / Alors moi je m'appelle Florent Lococ, du coup, et j'ai plusieurs casquettes, j'étais moniteur d'escalade, ouvreur de voix et de bloc, et je travaillais longtemps dans un magasin spécialisé dans la montagne, sur Genève, Carouch, en Cactusport, / et puis après, j'ai pas mal brassé un petit peu dans le monde de l'Auth d'Or, voilà, donc professionnel. / Comment est-ce que tu connais Nicolas et comment est-ce que vous vous êtes rencontrés?"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "Organised and permanently motivated", "note": "The first time out he was on normal ground, but Nicolas organises well and arrives hugely motivated", "kw": ["Florian", "Partner", "Preparation", "Training"], "file": "DSC_0169", "i": "01:27:38:21", "src": "00:11:06:14", "t": "Alors Nico, l'avantage c'est que c'est un mec il avait vachement bien à se organiser, il est toujours hyper motivé et du coup la première fois c'était voin normal du pain, mais par contre en partant de châmes, Nico il prend pas trop les bains, moi ça me va bien parce que à l'époque j'avais pas trop d'argent et tout ça, donc voilà, départ de châmes, parti pour la voie normale du pain, et après moi ce qu'il faut savoir c'est que je regarde pas trop les cartes et j'ai pas beaucoup de mémoire du coup en fait j'ai beaucoup au fini, bref on a loupé la voie normale du pain, d'accord on s'est retrouvé dans une variante, je fais souvent des variantes sans faire exprès, et du coup on est vraiment dans les passages assez scabreux et tout avec très très peu de matos, parce que bien sûr on a deux friends et tout, voilà donc on était un petit peu limite mais c'était, voilà Nico derrière, il a super bien suivi, super bien organisé, mais vraiment il a cette aptitude à se recentrer et à reprendre un peu les bons gestes, à calmer un petit peu quand il faut calmer, et voilà c'est une des premières expériences qui va montrer qu'il tenait bien la route, parce que des fois tu peux avoir des gens qui sont très très forts au niveau sportif, mais qui mentalement par contre s'effondrent, lui de part l'ultra endurance je pense qu'il a aussi un très très beau mental par rapport à l'engagement et tout. / Qu'est-ce qu'il a compris tout de suite et à l'inverse qu'est-ce qu'il lui a pris du temps à comprend"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "A very big mental engine", "note": "His strength is mental - always full on, and even deep in difficulty he keeps going", "kw": ["Florian", "Partner", "struggling", "Explaining"], "file": "DSC_0169", "i": "01:29:06:17", "src": "00:16:08:20", "t": "Les forces de Nico c'est mental motivation, c'est vraiment, il a un gros gros mental, il est tout le temps à fond, il est vraiment même dans le dur, il va continuer, il va y aller et puis il l'aime ça, je pense qu'il l'aime ça, il a un côté un peu mazo, vraiment j'aime me faire mal et j'y vais. Et aussi ce côté motivation, quand on le rencontre c'est quelqu'un, tout de suite on se rencontre, il a de la joie de vivre, il a une belle énergie, il est toujours hyper à partager, hyper altruiste, il pense vraiment à l'autre et tout ça, et ça se retrouve vachement dans ses projets, il y a toujours de la vie dans ses projets, de la motivation, il a toujours envie d'aller se balader, il ne faut pas genre, non aujourd'hui il faut que je fasse ma petite sortie, typique il est en phase d'entraînement, tu lui propose d'aller faire un rejébé ou un truc comme ça, il va craquer, il va y aller, même on a fait des trucs des fois, où il était en phase d'entraînement, il était complètement cuir rincé, mais par contre il me disait, ah il va, on y va, et puis il est toujours, ouais, allez faire ça, je me dis, Nico, ouais mais c'est pas grave, et voilà, c'est dans le dur, mais par contre il y va, il y va, donc c'est vraiment ce côté motivation mentale qui fait sa grande force. / Et à l'inverse, est-ce qu'il a des faiblesses, des choses qui t'inquiètent personnellement, pour banquer de ce record particulièrement ? / Alors, des faiblesses, on en a forcément, mais, / des choses qui vont m'inquiéter da"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "Is he ready? Absolutely", "note": "Ready for some time - mental, physical and technical parameters all in place", "kw": ["Florian", "Partner", "Preparation", "Training"], "file": "DSC_0169", "i": "01:30:43:07", "src": "00:22:53:11", "t": "est prêt ? / Est-ce qu'il est prêt pour ce genre de projet ? Oui, carrément, oui. Ça fait quelques temps qu'il est prêt. C'est plusieurs paramètres, il y a un paramètre mental, il y a un paramètre physique, il y a un paramètre technique, et puis après, il y a un paramètre spatio-temporel, des conditions externes. Donc, lui, il est prêt."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "He has real values", "note": "A project like this puts a sporting approach to the mountain in the spotlight, and Nico brings genuine values to it", "kw": ["Florian", "Partner", "Explaining", "Alpine"], "file": "DSC_0169", "i": "01:31:11:06", "src": "00:32:12:12", "t": "Alors ce genre de projet forcément il va mettre un petit peu en lumière une approche sportive de la montagne, et après Nico, c'est quelqu'un qui a des vrais valeurs, des vrais valeurs sportives, mais des vrais valeurs aussi environnementales, / et je pense que dans ce qui va dégager, dans le message qui va apporter, il va y avoir une prise de conscience un petit peu de tout ça. / C'est vrai qu'à l'heure actuelle, on a vraiment une forme d'urbanisation du milieu outdoor, dans le sens où avant les pratiquants de ce genre de sport étaient souvent des gens qui étaient déjà, qui habitaient en montagne, en moins en montagne, qui avaient déjà une conscience de l'environnement dans lequel ils évoluent, maintenant de plus en plus on a un public très urbain qui vient dans les montagnes, et je pense que culturellement il y a vraiment une éducation à faire sur comment est-ce qu'on aborde ce milieu montagne, ce milieu naturel. Moi j'habite au pied du salaire et j'ai pu"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Who he would be without it", "note": "Without alpinism and trail he would be a different person; it gives perspective, and every alpinist has faced situations where life was at stake", "kw": ["Nicolas", "Pre WR", "Dangerous", "Alpine", "Explaining"], "file": "A002C001_260527DC", "i": "01:33:37:04", "src": "16:11:03:24", "t": "Sans l'alpinisme et le trail, je pense que je serais différent parce que ça te permet de prendre beaucoup de recul sur pas mal de situations dans la vie. C'est vrai que je pense que tout alpiniste a déjà été confronté à des situations où sa vie a pu être tenue en danger. Et par rapport à des petites choses du quotidien, ça permet quand même de prendre du recue et de le relativiser."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Not alive, but good", "note": "He would not say running makes him feel alive - it makes him feel good, and he asks himself fewer questions", "kw": ["Nicolas", "Pre WR", "Running", "Enjoying", "happy"], "file": "A002C001_260527DC", "i": "01:34:01:20", "src": "16:12:24:20", "t": "Je ne pourrais pas dire que je me sens vivant quand je cours, je pourrais dire que je me sens bien. C'est facile, on a déjà eu l'occasion d'en parler et on se pose moins de questions. On est vraiment à ce qu'on fait et on n'a pas tout ce bruit du quotidien qui vient me perturber, je dirais. / Du coup, quand tu cours, est-ce que c'est vert quelque chose ou loin de quelque chose ? / Vert ou loin ? / Je ne pourrais"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Contemplative, and simply being outside", "note": "What draws him is partly the landscapes and partly just being outdoors", "kw": ["Nicolas", "Pre WR", "Running", "Enjoying", "Mountain"], "file": "A002C001_260527DC", "i": "01:34:38:15", "src": "16:13:23:12", "t": "Je ne pourrais / Ce qui me motive et qui me plaît quand je vais courir, forcément il y a un aspect contemplatif avec des paysages, des choses de ce type-là et il y a aussi le fait d'être bien, d'être dehors. Ça n'apporte pas grand chose de rester scotché sur le canapé toute la journée et de profiter par contre des paysages de choses simples, en fait. C'est la simplicité, peut-être, qui m'attire. / Tu dis souvent, effectivement, ça, que la vie en montagne n'est plus simple, en quoi est-ce que c'est le cas ? / La vie en montagne, pour moi, est plus simple parce qu'on a moins de questions à se poser. / On a un réseau avec le téléphone,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Competitive, but against himself", "note": "He is competitive and remembers racing head to head, but the measure is himself rather than the other runner", "kw": ["Nicolas", "Pre WR", "Running", "Explaining"], "file": "A002C001_260527DC", "i": "01:35:15:18", "src": "16:21:46:22", "t": "On a un réseau avec le téléphone, / Je pense que je suis compétitif. Maintenant, une scène de compétition. J'ai des souvenirs de courses où on était deux en tête de courses et j'ouvrais à mon concurrent, pourrais dire, ça compote parce qu'il n'arrivait plus à l'ouvrir, il avait trop froid au main. Donc c'est une scène de compétition, c'est une compétition dans le meilleur de soi-même. Cet aspect compétitif, il peut parfois être pris de manière un peu négative, parce qu'on peut le percevoir comme essayer d'être meilleur, mieux que l'autre. Pour moi, être compétitif, c'est de donner le meilleur de soi-même. / Ok, c'est intéressant. Donc finalement, quand quelqu'un te dépasse, tu n'en ressens pas grand chose. / Disons que quand quelqu'un me dépasse, ça ne va pas me..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "No jealousy, and winning is validating", "note": "No resentment towards a rival - he tries to do better, but relative to himself; winning is validating and it would be dishonest to pretend otherwise", "kw": ["Nicolas", "Pre WR", "Running", "happy", "Explaining"], "file": "A002C001_260527DC", "i": "01:36:05:11", "src": "16:22:33:20", "t": "Je vais pas avoir de jalousie, d'envie, de ressentiment par rapport à lui. Je vais essayer de faire mieux, oui, mais ça reste par rapport à moi. Je vais essayer de donner le meilleur de moi-même pour avoir une performance qui me permettrait de le redepasser. / Est-ce qu'il y a quand même une partie de toi qui a besoin de gagner ? / Ça serait mon rapport, par rapport vis-à-vis de la compétition, de la victoire. C'est sûr que c'est valorisant. Ça serait pas juste de dire que ça me passe totalement au-dessus. Oui, forcément, c'est valorisant. C'est ce qui permet aussi de rencontrer du monde, d'avoir une certaine notoriété dans ce milieu-là. / Je pense que tout"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "The mountain asks for no result", "note": "In the mountains there is no result to chase, which is what makes injury in competition so frustrating", "kw": ["Nicolas", "Pre WR", "Running", "Alpine", "Enjoying", "Explaining"], "file": "A002C001_260527DC", "i": "01:36:58:06", "src": "16:41:02:08", "t": "Je pense que tout / quand on va en montagne il n'y a pas cette recherche un tracéque d'un résultat c'est peut-être ça qui est le plus frustrant c'est les blessures dans le cadre de compétition / parlons maintenant un petit peu du record / est-ce que tu as un exemple quand tu étais blessé dans une compétition ? / alors j'ai été blessé plusieurs fois dans des courses"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "The project in one sentence", "note": "How he would put it to someone who knows nothing about mountains: four times to the summit in four days, four routes, unsupported", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Explaining", "Preparation"], "file": "A002C001_260527DC", "i": "01:37:28:13", "src": "16:42:37:08", "t": "si je devais expliquer le projet à quelqu'un qui ne connait rien à la montagne je l'expliquerais tellement simplement je lui dirais qu'en quatre jours je vais aller quatre fois en du Mont-Bourg / pourquoi le Mont Blanc spécifiquement ? / le Massif du Mont Blanc c'est un Massif qui m'inspire déjà le rocher dans le Massif du Mont Blanc le Grand Nître c'est un rocher qui est absolument génial qui est beau je trouve et a grimper sur la section du rocher c'est vraiment hyper agréable"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Fate is not fixed", "note": "He is not asking anyone to act, only that people know life is not a destiny handed to them", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration"], "file": "A002C002_260527XB", "i": "01:38:00:20", "src": "17:11:41:24", "t": "Je ne peux pas forcément que les gens passent à l'action. Je veux juste que tout le monde puisse avoir la conscience qu'au final, dans la vie, il ne faut pas croire le destin que chacun prend dans les choses en main et faire ce qu'on a envie. Il faut juste croire, on s'est réellement."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Believe in yourself, maybe more than you are", "note": "It may sound like a platitude, but believing in what you want to do and in yourself, perhaps more than you actually are", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration", "happy"], "file": "A002C002_260527XB", "i": "01:38:19:12", "src": "17:11:58:12", "t": "Ça ne va pas être peut-être une phrase un peu de bateau comme ça, mais au final, / croire en ce qu'on a envie de faire, croire en soi peut-être même plus qu'on s'est réellement. / Si tu réussis les 4 faces, qu'est-ce qui vient après? / C'est rare que je dise ça, mais je ne pense pas si je réussis ce projet, qu'est-ce qui vient après. / Je suis convaincu que je vais réussir. / J'ai peut-être trop été les derniers temps dans un schéma,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "Life up there is simpler", "note": "Mountain life is far simpler than daily life because it forces him back onto very basic things", "kw": ["Nicolas", "Emptiness", "Mountain", "Enjoying"], "file": "A002C063_260418WT", "i": "01:38:53:16", "src": "04:21:05:18", "t": "J'ai peut-être trop été les derniers temps dans un schéma, / Alors la vie en Montagnes est beaucoup plus simple pour moi que la vie au quotidien parce qu'au final, on a obligé de se recentrer sur des choses très simples, très basiques. On veut manger, on veut boire et qu'on est dans une course de montagne, on va essayer de progresser et d'arriver au bout. Et on est vraiment focus sur ces choses-là. Tout ce qui téléphone, réseau sociaux, télé, on y pense plus du tout. Et on se ressente sur les choses qui nous permettent tout simplement de vivre."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "Single sentences that changed the trajectory", "note": "Several moments redirected him, sometimes nothing more than one sentence someone said", "kw": ["Nicolas", "Explaining", "Inspiration", "Partner"], "file": "A002C063_260418WT", "i": "01:39:26:07", "src": "04:30:25:04", "t": "Je pense que je pourrais avoir plusieurs moments qui, à chaque fois, ont changé la trajectoire. Notamment, dans des petites phrases, c'est des choses, des fois, une seule phrase. Tu vas y repenser, ça va changer beaucoup de choses sur la trajectoire. C'est comme un petit angle, même si c'est un tout petit angle au départ, quand tu regardes à la fin, ça fait un très gros écart. / Est-ce que tu as un exemple, le particulier, d'une de ces phrases qui a percuté ? / Oui, je pense que on en parlait, et j'ai un ami un jour qui m'a dit / j'allais en montagne assez régulièrement pour faire certains sommets avec des guides."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "Every outing now points at the project", "note": "Going into the mountains at the moment, he thinks constantly about the attempt ahead", "kw": ["Nicolas", "Mountain", "Preparation", "Nervous"], "file": "DSC_0095", "i": "01:40:05:12", "src": "00:00:48:13", "t": "ce moment quand je vais en montagne c'est sûr que je pense vraiment beaucoup au projet qui approche et je dirais que chaque sortie surtout en montagne c'est l'occasion de préparer, de faire des tests de matériel. Aujourd'hui j'ai commencé à faire un test avec des crampons sur des baskets, ça n'a pas été du tout. Heureusement j'étais un peu méfiant et j'ai prévu une autre paire de chaussures qui a permis quand même de faire la sortie, mais donc ça oblige encore à revoir pas mal de choses et à adapter pas mal de choses. / Est-ce que tu m'as dit que tu sens très libre ? Les montagnes sont la liberté mais aussi peut-être les choses que... / pas des choses"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "The mountains without a project", "note": "Going up with no objective is a space he loves precisely because it asks nothing of him", "kw": ["Nicolas", "Mountain", "Enjoying", "Emptiness"], "file": "DSC_0095", "i": "01:40:49:07", "src": "00:02:03:15", "t": "pas des choses / 100 de projets ? / Alors quand je vais à la montagne sans projets c'est vrai que pour moi c'est un espace que j'adore parce que c'est un espace qui est extrêmement facile. Il y a beaucoup de personnes qui ne pourraient pas comprendre ça mais en fait en montagne on pense à l'instant présent, on pense à ce qu'on est en train de faire quand on grimpe on est concentré, on envisage vraiment à court terme les actions qu'on va devoir faire alors que dans la vie quotidienne on a le téléphone, on a la télé, les réseaux sociaux, on est sollicité de toute part. Alors pour moi la montagne c'est vraiment quelque chose libre et facile."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "motivation", "name": "Four routes suits him", "note": "The four itineraries fit Nicolas exactly - not one line but a whole emblematic mountain seen by different faces and different moods", "kw": ["Florian", "Mont Blanc", "Alpine", "Explaining"], "file": "DSC_0169", "i": "01:41:27:00", "src": "00:20:43:12", "t": "Alors, moi, par rapport à ce projet, les quatre phases, les quatre itinéraires, je trouve ça vraiment chouette, parce que ça correspond bien à Nico. Pas viser un seul itinéraire, mais toujours essayer d'ajouter un peu plus, il y a de bien, plus c'est long, plus il kiffe. Et du coup, le fait d'avoir ce côté quatre itinéraires comme ça, par quatre branches, moi je trouve ça assez beau, parce que tu as un côté... / Tu vas découvrir un peu une montagne emblématique par différents itinéraires, différents versants et différentes ambiances. Ce n'est pas du tout la même chose que tu passes par la voie normale, tu passes par le versant italien, tu passes par... / Bon après, il y a quand même une tésitinaire où ça se rassemble un peu, mais je trouve ce côté un peu français et côté italien, ça fait vraiment un beau tour de la montagne. / Par tes réponses avant, je pense qu'on peut le déduire, mais est-ce que tu penses qu'il peut le faire ? / Est-ce qu'il en a les capacités, bien sûr, oui, c'est sûr. Après, dans des projets"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "motivation", "name": "Bigger than the four FKTs", "note": "On paper it was four FKTs; in reality it became a far larger adventure than he pictured", "kw": ["Nicolas", "Explaining", "Mont Blanc", "Preparation"], "file": "A004C047_260613OO", "i": "01:42:32:23", "src": "12:54:12:20", "t": "Est-ce qu'il en a les capacités, bien sûr, oui, c'est sûr. Après, dans des projets / Il y a déjà plein d'autres choses qui viennent que les FKT, enfin, c'est une telle aventure au final. / Quand je posais ça sur papier, je suis toujours seulement en souci, je me rendais peut-être pas compte de l'ampleur ces trucs. / C'est vrai que c'est assez énorme. Donc oui, alors, les FKT, là, ils en ont déjà deux, on a une supportie qui devrait être validée. Mais c'est"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "motivation", "name": "What he is looking for: adventure", "note": "Asked what he is after - simply adventure, something out of the ordinary", "kw": ["Nicolas", "Explaining"], "file": "A004C047_260613OO", "i": "01:42:58:05", "src": "12:54:35:23", "t": "Finalement, c'est quoi que tu recherches ? Est-ce que tu as déjà... Tu as déjà à mettre des mots, finalement, sur ce que tu recherches à travers cette aventure ? / Je sais pas, mais on ne recherche pas tout simplement l'aventure. / C'est juste l'aventure, quelque chose qui change de l'ordinaire. Et..."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "motivation", "name": "Creating the project is part of himself", "note": "Building and imagining a project like this is almost a part of who he is", "kw": ["Nicolas", "Explaining", "Preparation"], "file": "A004C047_260613OO", "i": "01:43:16:07", "src": "12:54:53:12", "t": "Ouais, d'avoir un... de faire un projet comme ça, de le créer, d'y imaginer... Ouais, c'est... Je sais pas, c'est presque... On peut apprécier, c'est une partie de soi. / Il y a quelque chose que le trail te"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "The debate about everyone being able to do it", "note": "Showing the teaser started an argument about his claim that anyone could do this, and it shifted his view slightly", "kw": ["Nicolas", "Pre WR", "Explaining", "Training"], "file": "A002C001_260527DC", "i": "01:44:49:15", "src": "16:09:22:21", "t": "Alors, quand je dis que tout le monde peut le faire, c'est marrant parce que j'ai montré le teaser à quelques personnes et dans le teaser, je dis tout le monde peut le faire. On en a discuté, ça a été un mini débat. Et ça a tout petit peu changé ma vision, on a réussi à me faire changer ma vision là-dessus, parce que je pense que tout le monde peut le faire si ça donne les moyens. / Et le fait"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "He gets there by giving himself the means", "note": "He still thinks anyone can do it - what makes it possible for him is that he commits the means to it", "kw": ["Nicolas", "Pre WR", "Preparation", "Training"], "file": "A002C001_260527DC", "i": "01:45:17:09", "src": "16:09:47:15", "t": "Et le fait / Et le fait d'ignorer cette partie-là, ça ne serait pas juste. Je pense que tout le monde peut le faire, oui. Et j'arrive à faire des choses comme ça parce que je m'en donne les moyens. Et c'est assez important quand même dans l'approche. / Est-ce que tu te considères comme quelqu'un d'extrême ? / Non, je ne me considère pas comme"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "He does not consider himself extreme", "note": "There is always someone more extreme; he had been looking at another athlete going for a record just before the interview", "kw": ["Nicolas", "Pre WR", "Explaining", "Phone"], "file": "A002C001_260527DC", "i": "01:45:38:09", "src": "16:10:05:08", "t": "Non, je ne me considère pas comme / Non, je ne me considère pas comme quelqu'un d'extrême. On n'arrive plus à retrouver des gens plus extrêmes que soi. Quand on regarde, avant de venir, je regardais sur Instagram, il y a Benjamin Mugelle qui est en train de battre le record, d'essayer de faire 100 000 m de dénivels plus rapidement possible, en regard des traversés de mater au jaque-moule, en sens l'intégralité des alpes. On trouvera toujours plus extrême après le tout, je pense que c'est le trou et sa propre voix et vraiment ce qu'on a envie de faire de soi-même. / Est-ce que tu serais une personne différente sans l'alpinisme et le trail ? / Est-ce que je serais différente"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "Recognition is pleasant, not the point", "note": "Being known for what you love is enjoyable, but he does not think he lives for it", "kw": ["Nicolas", "Pre WR", "Explaining", "happy"], "file": "A002C001_260527DC", "i": "01:46:16:16", "src": "16:23:23:20", "t": "Est-ce que je serais différente / Je pense que tout à chacun, dans sa passion, dans ce qu'il aime faire, ça ne peut qu'être plaisant d'avoir cette notoriété. Ensuite, est-ce que je vis pour ça ? Non, je ne pense pas que je vis pour ça. Je pourrais très bien aller en montagne courir et je prends énormément de plaisir à aller faire une promenade en montagne, même si elle peut durer longtemps. Mais ce n'est pas quelque chose qui est nécessaire, mais quelque chose qui est plaisant. / Comment tu définirais ton style ? C'est de l'alpinisme, du trail ou quelque chose entre les deux ? / Comment je définirais"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "Neither to inspire nor to warn", "note": "If there is a message it is that everyone finds their own way - not that others should follow his", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration"], "file": "A002C001_260527DC", "i": "01:46:53:11", "src": "16:57:50:08", "t": "Comment je définirais / je ne veux ni inspirer ni mettre en garde je pense que chacun si je vais passer un message c'est que chacun a trouvé sa propre voie c'est pas parce que je fais ça, qu'il y a des horaires images que forcément quelqu'un va se reconnaître dans un projet comme ça je fais ce projet parce que j'ai une histoire avec ce massif dans le début de ma pratique de mon alcunisme"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "He does not have the level to be a pro", "note": "Completely honest: he does not think he has the level of a professional runner, and there are far more talented people", "kw": ["Nicolas", "Pre WR", "Explaining", "Running", "struggling"], "file": "A002C002_260527XB", "i": "01:47:17:18", "src": "17:01:30:04", "t": "Si je vais être totalement honnête, je ne pense que je n'ai pas du tout le niveau d'être pro-runner. Il y a tellement de gens qui sont bien plus talentueux que moi. / Après, je suis un bourreau de travail par rapport à ça. C'est ce qui me permet de faire des projets de ce type-là. Je n'ai pas le niveau de plein d'autres gens qui ne pourraient pas. / Tu n'as pas le niveau de cours pro ? / Je ne me considère pas comme pro. / C'est bien, c'est bien."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "A workhorse rather than a talent", "note": "He is realistic about it - what lets him do projects like this is work, not level", "kw": ["Nicolas", "Pre WR", "Explaining", "Training", "Preparation"], "file": "A002C002_260527XB", "i": "01:47:57:05", "src": "17:02:06:16", "t": "C'est bien, c'est bien. / C'est bien, c'est bien. / Je ne me considère vraiment pas comme pro tout simplement parce que je ne pense pas que j'ai le niveau pour aspirer à ça. Je suis aussi un être réaliste, je suis un bourreau de travail. C'est ce qui me permet d'envisager des projets comme ça. Je m'entraîne énormément, je suis passionné. Par contre, quand je vois d'autres cours unres qui ont des niveaux pour moi stratosphérique, je pense que je n'ai pas ce talent. / Tu penses ça ou c'est de la modesty ? / Ce n'est absolument pas de la fausse modesty de penser ça. / Je n'arrive à être assez réaliste quand même là-dessus. Après, je pense que j'ai aussi une faculté à courir très longtemps."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "What he wanted people to take from it", "note": "At the start what he wanted was for people to see that anyone can get where they want - a view that shifted after the teaser discussion", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration"], "file": "A002C002_260527XB", "i": "01:48:40:05", "src": "17:11:13:02", "t": "Et au départ, pour moi, ce que je voulais qu'ils retiennent, c'est de dire que tout le monde peut arriver à faire ce qu'il veut. Et je pense que je gardais peut-être un esprit, mais je compléterais en me disant que tout le monde peut arriver à faire ce qu'il veut, si il s'en a de les moyens. Et à mon avis, le si il s'en a de les moyens, c'est quelque chose qui a muri dans ma réflexion et qui a toute son importance. / Est-ce que tu veux que les gens passent à l'action après avoir vu ce que tu as fait ou tu veux juste qu'ils se souviennent? / Je ne peux pas"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "impostor syndrome", "name": "Giving yourself the means", "note": "Someone told him he wanted to give himself the means to climb the summits he wanted, and it changed his mindset", "kw": ["Nicolas", "Inspiration", "Training", "Explaining"], "file": "A002C063_260418WT", "i": "01:49:11:19", "src": "04:31:02:02", "t": "Je ne peux pas / Et il m'a dit, oui, mais moi, j'ai envie de me donner les moyens moi-même de pouvoir grimper les sommets que j'ai envie de grimper. Et ça, ça va mal changer mon mindset"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "impostor syndrome", "name": "Step by step you move mountains", "note": "Progress comes in small steps; looking back at the trajectory he has moved mountains, and one day it becomes a revelation that he is capable", "kw": ["Nicolas", "Training", "Explaining", "happy", "Inspiration"], "file": "A002C063_260418WT", "i": "01:49:23:01", "src": "04:31:43:04", "t": "après en moins de 3 heures et au fur et à mesure, on avance petit pas par petit pas et si on regarde la trajectoire qu'on a eu on a accompli on a abattu des montagnes donc c'est vraiment ça, ça m'a beaucoup marqué le fait que quelque chose qui l'imaginaient que lui, un sigant apiniste que des choses qu'il n'imaginaient pas possible au fur et à mesure il s'est rendu compte qu'il pourrait peut-être le faire et ça, ça a aussi beaucoup changé mon mindset pour avoir la montagne / et on voit le progress chaque fois que vous allez là-bas et voir comment vous vous interviendrez et vous vous rendez plus bien / exactement, de voir le progrès et un jour, peut-être presque comme une révélation un jour de se dire ce que j'ai envisagé même pas de faire un jour de dire mais en fait oui, je suis capable de le faire et je vais y aller / donc c'est vraiment la fascination qui vous a pris le temps et vous aimait plus et plus / alors c'est même pas forcément / de se rendre compte c'est"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "impostor syndrome", "name": "On Nicolas saying he is an impostor", "note": "Nicolas says plenty of people could do it faster or more technically; Florian points at social media making everyone look stronger, and says his real strength is motivation and discipline rather than raw numbers", "kw": ["Florian", "Partner", "Explaining", "Training"], "file": "DSC_0169", "i": "01:50:23:06", "src": "00:18:53:12", "t": "de se rendre compte c'est / Il dit personnellement qu'il a le syndrome de l'imposteur, que plein de gens pourraient faire ça plus vite, ou de manière plus technique, qu'est-ce que tu en penses toi ? / Alors Nico, il dit qu'il a le syndrome de l'imposteur, que les gens pourraient faire ça plus vite. / Après, on est dans une société qui est très particulière, avec les réseaux sociaux, on a toujours l'impression que les gens, ils sont méga forts, méga plus, voilà. Je pense que Nico aussi, il a un profil, il a eu une vie avant où il était plutôt fait tard, plutôt à faire bien la brinque et tout, il vient pas d'un univers en main à montagne, c'est quelque chose qui est venu sur le tard. / Et après, je pense que c'est quelqu'un sa plus grande force, sa motivation et sa discipline. C'est pas quelqu'un, on va se dire, ah ouais, il est surdoué au niveau des valeurs de VMA ou quelque chose comme ça. Ce qui va faire vraiment la différence, Nico, là où il va être vraiment bon, c'est la tête et la motivation pour son projet. Et du coup, c'est peut-être ça qui influence que, oui, ces données, peut-être VODMAX ou VMA, il y en a plein, surtout maintenant avec les jeunes, qui sont surmutants, il y a toujours plus fort et plus rapide. Donc peut-être que là, des fois, c'est difficile de trouver sa place dans cet univers-là, mais ça ne m'étonne pas de lui. Après, il y a tellement une forme d'humilité aussi, une forme d'altruisme, avec des valeurs comme ça, forcément, c'est pas égotique, tu ne pe"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "impostor syndrome", "name": "Not another always", "note": "Against a backdrop of influencer projects always going higher and further, he explains why this one is sincere", "kw": ["Florian", "Partner", "Explaining", "Alpine"], "file": "DSC_0169", "i": "01:52:00:04", "src": "00:23:44:11", "t": "ce monde ? / Alors, je pense que ce projet-là, par rapport à tout ce qu'on peut voir au niveau sur les réseaux, est toujours plus loin, toujours plus haut, toujours plus... Moi, je pense qu'il a une forme de légitimité, une forme de cohérence par rapport au parcours de Nico. C'est-à-dire que ça lui ressemble bien. Ça lui ressemble bien, c'est pas quelque chose qui tombe comme ça, voilà, tiens, on va faire du buzz, / et puis, il faut que je trouve quelque chose qui parle, et qu'il faut savoir que Nico, je pense qu'il y a deux endroits vraiment où il est souvent très souvent fourré, c'est le Salève, et puis Montblanc. Donc, le fait d'avoir un projet comme ça sur Montblanc, qui est une montagne emblématique pour lui, mais vraiment réellement, parce que c'est une montagne où il va souvent, je pense que ça a du sens, personnellement, pour lui, et du coup, à partir du moment où ça a du sens de manière personnelle,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "impostor syndrome", "name": "No official record on this route", "note": "There is no official FKT for this line, so there is no time pressure - which suits the conditions", "kw": ["Nicolas", "Explaining", "Preparation", "Mont Blanc"], "file": "A003C112_260611HR", "i": "01:52:55:03", "src": "19:10:03:09", "t": "et puis, il faut que je trouve quelque chose qui parle, et qu'il faut savoir que Nico, je pense qu'il y a deux endroits vraiment où il est souvent très souvent fourré, c'est le Salève, et puis Montblanc. Donc, le fait d'avoir un projet comme ça sur Montblanc, qui est une montagne emblématique pour lui, mais vraiment réellement, parce que c'est une montagne où il va souvent, je pense que ça a du sens, personnellement, pour lui, et du coup, à partir du moment où ça a du sens de manière personnelle, / when you're alone ? / Alors disons que là il y a deux choses qui rentrent au monde c'est comme il n'y a pas de FKT, un supportage de temps officiel sur ce tracé, ce qui est assez cool quand même c'est que / j'ai pas de pression sur le temps surtout avec les conditions puisqu'on change un tout petit peu le parcours à la fin, ça la rallonge, ça évite de se poser la question, se dire ok est-ce que je prends le choix de perdre un peu de sécurité"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Some mornings you do not want to get up", "note": "Winter mornings when getting out to train is the last thing he wants, but mostly he goes for the pleasure of it", "kw": ["Nicolas", "Pre WR", "Training", "Running", "struggling"], "file": "A002C001_260527DC", "i": "01:54:49:04", "src": "15:54:38:20", "t": "On pourrait penser que c'est trop, c'est vraiment une passion. Bien sûr, il y a des matins, oui, pleu, en hiver, on n'a pas trop envie de se lever pour aller courir, pour aller s'entraîner, mais la majeure partie du temps, j'y vais quand même par plaisir. / Est-ce que tu peux répéter la question ? Travailler de neuf à cinq et s'entraîner deux fois par jour, comment tu fais ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Two or three sessions a day around a full", "note": "Works eight to five and trains two or three times a day; it sounds like too much but it is a genuine passion", "kw": ["Nicolas", "Pre WR", "Training", "Running", "Office"], "file": "A002C001_260527DC", "i": "01:55:12:24", "src": "15:54:59:16", "t": "Travailler de huit heures à dix-sept heures et s'entraîner deux ou trois fois par jour. On pourrait penser que c'est trop, par contre, c'est une vraie passion. J'aime aller courir, c'est ce qui me détend, et c'est un vrai plaisir. Alors je ne dis pas qu'il n'y a pas de temps en temps, des entraînements, ou c'est la rigueur qui doit prendre le dessus, mais la majeure partie du temps, j'y vais vraiment pas plaisir. / Le stress du boulot et le stress du sport, c'est cumuler ou ça s'annule ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "A typical working day", "note": "Up around six for a first session, a run at midday, a longer trail outing in the evening, sometimes core work", "kw": ["Nicolas", "Pre WR", "Training", "Running", "Office"], "file": "A002C001_260527DC", "i": "01:55:41:23", "src": "16:26:34:01", "t": "Ma journée type est assez différente quand je travaille et quand j'ai du temps libre. Ma journée type, quand je travaille, ça va être ne levé assez tôt. En général, vers 6 heures, aller faire un premier entraînement, que ce soit en hypoxie, / c'est un sens de musculation, par exemple, à la salle. / Le midi, souvent, c'est courir, et si je ne vais pas courir, le midi, ça va être plus une sortie en trail, un peu plus longue le soir. Des fois, il y a aussi une séance de gainage. Souvent, ces deux séances, parfois une troisième, / rarement, loin de ses séances par jour."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "A day off starts even earlier", "note": "On free days he gets up earlier still to be in the mountains early and make the most of the day", "kw": ["Nicolas", "Pre WR", "Training", "Mountain", "Alpine"], "file": "A002C001_260527DC", "i": "01:56:19:12", "src": "16:27:08:20", "t": "Ma journée type, quand je ne travaille pas, ça va être ne levé encore plus tôt. J'aime vraiment me lever tôt, pouvoir être très tôt en montagne, profiter de la journée. Et où ça va être plus une sortie toute la journée, où mon idéal, c'est pouvoir rentrer vers 14 heures, manger un bon truc, faire une sieste, / et après avoir la soirée pour partager des moments où on est en famille, ou avoir une activité plus détente."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Once to three times a week on the Saleve", "note": "How often he trains there depends on the phase of training; usually evenings after work rather than mornings", "kw": ["Nicolas", "Pre WR", "Training", "Salève", "Office"], "file": "A002C001_260527DC", "i": "01:56:51:07", "src": "16:28:29:07", "t": "une des fois à trois, ça va dépendre de la période de l'entraînement, si il peut faire beaucoup de volume ou pas, et c'est souvent le soir après le travail. Je vais rarement le matin, parce que le matin, ça permet pas de faire une sortie assez longue, je préfère à ce moment la découvrir le long du rône près de chez moi, / et le salèvres, ça me permet vraiment de faire une sortie de 2, 3, 4, 5 heures le soir après le travail. / À la fin du mois, si tu n'es pas à tes 30 000 mètres de déplus, tu peux faire le dernier jour pour rattraper, c'est vrai ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Hypoxia twice a week", "note": "Trains in hypoxia around twice a week and explains what it gives him, including a boost on mornings when motivation is low", "kw": ["Nicolas", "Pre WR", "Training", "Hypoxy", "Gym", "Explaining"], "file": "A002C001_260527DC", "i": "01:57:24:15", "src": "16:30:47:02", "t": "À la fin du mois, si tu n'es pas à tes 30 000 mètres de déplus, tu peux faire le dernier jour pour rattraper, c'est vrai ? / Tu parlais de questions hypoxiques, questions hypoxiques. Pourquoi, qu'est-ce que ça t'apporte ? / Alors, je m'entraîne en général deux fois par semaine en hypoxie. Ça m'apporte plusieurs choses. Déjà, il y a souvent des groupes qui sont assez sympas, des gens qu'on revoit d'une fois sur l'autre. Et cet aspect, même dans un sport individuel, cet aspect d'entraînement collectif, c'est assez, assez motivant. / Des fois, on se lève le matin, on a un peu moins envie, donc ça permet de se booster. On sait que les autres, ce qu'on a. On se challenge de manière positive. / Et après, ça permet de faire de l'entraînement cardio. Même si on fait la long-vistance, il est surtout quand on fait des choses un peu plus rapide. / On sait qu'on a quand même des horaires à tenir. / Et ça permet de garder cette vitesse. / Tu t'entraînes parfois la nuit, tout seul, pourquoi ? / Alors, je m'entraîne aussi"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Training at night on purpose", "note": "Trains at night because those are the conditions he will meet during the record", "kw": ["Nicolas", "Pre WR", "Training", "Preparation", "Explaining"], "file": "A002C001_260527DC", "i": "01:58:24:03", "src": "16:31:43:24", "t": "Alors, je m'entraîne aussi / Alors, je m'entraîne aussi la nuit parce que c'est des conditions qu'on va retrouver. Et que ce soit là pour le projet au monde. / C'est le point. C'est le point. / C'est le point. C'est le point. C'est le point. Il va être fort. / C'est le point. / Mais on est seulement dans une heure et demi. Donc je pense que c'est le point. Non ? / Comme la grande partie qui arrive maintenant. / C'est le point. / On peut demander à Jerem."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Rest days, and getting hurt through enthusiasm", "note": "One or two rest days a week, cycling instead; the danger is that enthusiasm itself is how you end up injured", "kw": ["Nicolas", "Pre WR", "Training", "Tired", "struggling", "Explaining"], "file": "A002C001_260527DC", "i": "01:58:59:19", "src": "16:34:32:08", "t": "On peut demander à Jerem. / Avec 1 jour par semaine ou 2. Je me repose et je fais du vélo à la place. Je change un peu. / Je vais te dire que le problème est que même si tu as l'enthousiasme, tu arrives à te blesser. / tu vas te blesser c'est ça mais après des fois je fais juste plus du je fais que de la zone 2 pour l'instant enfin j'essaie en maximum de la zone 2 et puis ça marche plutôt bien il y a en fait la givrine où je fais givrine givrine sincère gladole et je redescends sur givrine et ça c'est génial parce que tu as mille des plus et tu fais tu as quand même 25 kills / dis moi une fois qu'on t'y va un soir comme ça comme toi / ouais avec plaisir ça pourrait être cool c'est vraiment en chouette en droit t'as déjà écouté la dôle ? / le copain qui part là bas et en plus j'ai vu un pote qui a fait les vières en 2024 il a déménagé la victoire verriée mais maintenant il est à Nion donc il dit je suis un p'tain plus rare mais si on se fait rire ouais"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Every ultra runner gets injured", "note": "He has had injuries like every ultra runner, and often kept going through another discipline that asked less of the body", "kw": ["Nicolas", "Pre WR", "Training", "struggling", "Tired", "Running"], "file": "A002C001_260527DC", "i": "02:00:00:01", "src": "16:40:16:08", "t": "le copain qui part là bas et en plus j'ai vu un pote qui a fait les vières en 2024 il a déménagé la victoire verriée mais maintenant il est à Nion donc il dit je suis un p'tain plus rare mais si on se fait rire ouais / alors j'ai eu des blessures dans ma carrière de pourreur je pense comme tout pourreur on a dit en ultra je ne vois pas un seul pourreur qui n'a pas eu de blessures / et souvent j'ai quand même réussi à avoir une autre pratique je pense justement à l'alpinisme avec des choses plus classiques mais peut-être moins exigeant pour le corps ou à aller faire du vélo donc j'ai réussi toujours à compenser ça ça fait que ça n'a jamais été très frustrant pour moi les seules choses qui va être frustrant c'est qu'on a des blessures dans des compétitions parce que dans le cadre de compétition on est là pour ça, on est là pour finir on est là pour aller au bout pour gagner ça va dépendre je ne sais pas de son objectif et c'est vraiment l'aboutissement"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "SwissPeaks 700, injured twice", "note": "Two years running he was injured after more than 500km on the same race", "
