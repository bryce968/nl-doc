e à vraiment devenir."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Wind erased all the tracks", "note": "Fog plus wind had blown out every track; navigated by the planned route on his watch", "kw": ["Nicolas", "Wind", "Conditions", "Watch", "struggling"], "file": "A003C134_26061230", "i": "03:05:54:23", "src": "08:33:10:22", "t": "Et en plus dans le brouillard, comme il y avait beaucoup de vent, ça avait soufflé toutes les traces. Donc dans le brouillard c'était une de ces galères pour s'orienter. Parce que moi j'avais la trace, soit à ma montre de ce que je voulais faire au départ. / Je ne l'avais pas pensé à le mettre"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Had to go and get it", "note": "Needed the summit mentally; set a limit and would have turned back if he could not run the descent", "kw": ["Nicolas", "Dangerous", "Conditions", "Summit", "Explaining"], "file": "A003C138_260612WR", "i": "03:06:14:02", "src": "08:37:18:14", "t": "Je ne l'avais pas pensé à le mettre / entre guillemets ? / Non, justement je l'ai vraiment bien dans la tête sinon je n'aurais pas pu aller au sommet Parce que là il fallait vraiment aller chercher quand même Il fallait vraiment aller chercher, ouais, dire que maintenant j'y vais c'est bon Je me défile une limite si je ne me sentais plus capable de courir pour descendre Je faisais demi tour parce que la météo qu'il y avait, il faisait vraiment super super frère / Et je me suis dit, voici,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "The turnaround criterion", "note": "As long as he could still run the descent he kept climbing; degrading wind would have changed that", "kw": ["Nicolas", "Dangerous", "Wind", "Explaining"], "file": "A003C138_260612WR", "i": "03:06:43:09", "src": "08:37:45:04", "t": "Et je me suis dit, voici, / Et je me suis dit, voici, je monte et après je vais te traîner sur la descente Avec le vent suffit que ça se dégrade d'accord un peu, ça devient vraiment chaud Donc je me t'ai dit tant que je me dis ok je peux courir pour la descente, je peux continuer à monter"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Would have had to be truly dangerous", "note": "The project matters too much to abandon on day one; only real danger would have stopped him. ALSO STRONG FOR: motivation", "kw": ["Nicolas", "Dangerous", "Explaining"], "file": "A003C138_260612WR", "i": "03:07:00:02", "src": "08:38:10:13", "t": "C'est vraiment un projet qui me tient un coeur Donc le premier jour comme ça, tu te dis, ah non ça passe pas, c'était pas possible Il aurait vraiment fallu que ça soit vraiment trop dangereux pour dire ok, je suis au demi tour Et / puis en termes de température"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Minus 15 to minus 20", "note": "Cold but kept moving to stay warm; coldest stretch between 4000m and the summit", "kw": ["Nicolas", "Conditions", "Weather", "Summit"], "file": "A003C138_260612WR", "i": "03:07:27:24", "src": "08:38:39:13", "t": "C'était quoi ça ? C'était quoi ? Moins 15 ? / Je sais même pas à partir de combien les 6 ligènes et les... / Tu vas attendre ça à dire moins 20 ? / Ouais, non c'est... Ouais, j'ai eu froid mais oui, si j'ai eu froid Mais je t'ai tout le temps de mouvement, c'est pour ça que je parais c'est mon temps de sommet Pour éviter... / Et après c'était le plus froid, c'était entre 4000 et 4000, le reste ça allait Mais pas trop trop devant / Est-ce qu'on a vu déjà une partie du"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Stayed in a good state of mind", "note": "Frustrated by the conditions but never lost morale", "kw": ["Nicolas", "happy", "Conditions"], "file": "A003C138_260612WR", "i": "03:07:58:00", "src": "08:39:10:22", "t": "Est-ce qu'on a vu déjà une partie du / Non, je suis de bonne humeur Non non, franchement, je suis... En fait je suis tout le temps resté dans un bon état de l'esprit Ah ouais, ça me soulait, franchement, c'est clair, ça me soulait / Mais j'étais un peu positif"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Hoping not the same tomorrow", "note": "Clear skies now; the same wind that caused the trouble is what cleared it", "kw": ["Nicolas", "Weather", "Wind"], "file": "A003C138_260612WR", "i": "03:08:13:16", "src": "08:39:25:08", "t": "Mais j'espère quand même qu'il n'y aura pas la même métier au le prochain jour / Ah ça va être parce que là c'est beau Ouais, ouais mais je sais pas, c'est bizarre parce que ça s'est dégagé avant c'était... / On ne voyait rien Ah ouais ? Ouais, mais pas les sommets là / J'ai pas eu de bol après Ouais, je pense, c'est le vent qui a dégoucé, c'est pour ça ça"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Clear, but the wind on the ridge", "note": "Fine weather with no mist, but it blew hard on the ridge and at times he had to lie flat on the ground", "kw": ["Nicolas", "Wind", "Ridge", "Conditions", "struggling"], "file": "A004C002_260613C4", "i": "03:08:34:04", "src": "09:13:23:09", "t": "Oui, grand beau, le vent. Ah oui ? / C'est du mal à dire. / Je pense que par moments c'était pire qu'hier. / Mais il n'y avait pas la brume, donc ça allait, mais sur l'arrête ça soufflait. / J'ai toujours dû nous coucher par terre des fois. Ah c'est pour là ? / Ouais, c'était tendu. / Sur certains passages, je sais pas, on fait des espèces de petits folles comme ça. Ça fait un effet, du coup. Mais c'est marrant, parce que des fois 50 mètres après, il n'y a plus rien. Et après, ça revenait. / Mais ouais, toutes ont super conditions, donc c'est vraiment cool. / Ok, on va voir."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Fog on the glacier, unfamiliar sector", "note": "Retrospective: trailbreaking in heavy fog on the glacier, in a sector he did not know", "kw": ["Nicolas", "Glacier", "Conditions", "struggling"], "file": "A004C047_260613OO", "i": "03:09:14:06", "src": "12:56:42:20", "t": "Ok, on va voir. / Et ça brassait... Il y avait des sévences, des dames, il y avait tellement de brouillards sur le glacier, et en plus, un secteur... Je suis allé, mais je ne le connais pas bien. C'est pas un secteur où, déjà, on brouillard, de toute façon,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "After Grands Mulets it got complicated", "note": "Retrospective: deep snow, then fog arriving at the plateaus; followed earlier ski tracks", "kw": ["Nicolas", "Snow", "Conditions", "Glacier", "struggling"], "file": "A004C047_260613OO", "i": "03:09:34:16", "src": "12:58:15:21", "t": "Et après, les grands mules, ça a commencé à devenir compliqué parce que ça a brafé, plus ou moins dans les secteurs. / Et là, il y a le brouillard qui est venu au niveau des plateaux. / J'ai réussi au début à suivre les traces de ski, / les gens qui étaient passés, je pense, les gens qui étaient allés au début de la journée."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Above the Mur de la Cote", "note": "Retrospective: snow much harder above the Mur; searching for a line he knew from weeks earlier", "kw": ["Nicolas", "Snow", "Conditions", "Explaining"], "file": "A004C047_260613OO", "i": "03:09:56:23", "src": "12:58:46:16", "t": "les gens qui étaient passés, je pense, les gens qui étaient allés au début de la journée. / le mur de la côte, je me souviens quand j'y étais il y a quelques semaines, / après le mur de la côte, ça changeait totalement. C'était beaucoup plus, la neige beaucoup plus dure. Je me suis dit, ok, j'essaie quand même de trouver le mur de la côte. Et dans le brouillard, je me parle de trouver. / Je trouve que si il a en bonne condition, je le montre, je trouve que si il y a au-dessus. Et je sais qu'au-dessus, il reste, je ne sais pas, 400 mètres de neige, donc 400."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Wind", "note": "Retrospective: fresh wind-loaded snow higher up with no support underfoot", "kw": ["Nicolas", "Snow", "Wind", "Conditions"], "file": "A004C047_260613OO", "i": "03:10:23:17", "src": "12:59:17:20", "t": "Après, effectivement, la neige au-dessus, je pense qu'elle était beaucoup plus souffée, la neige fraîche, il y avait vraiment de la consistance."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Extreme cold, needed a fast exit", "note": "Retrospective: very cold with high wind; had to stay certain he could descend quickly", "kw": ["Nicolas", "Dangerous", "Weather", "Wind"], "file": "A004C047_260613OO", "i": "03:10:34:23", "src": "12:59:40:20", "t": "Je faisais extrêmement froid, il y avait beaucoup de vent, je me suis dit, il faut que je puisse descendre rapidement. Donc, je ne voulais pas aller cuiser dans mes réserves au point de me dire je ne suis pas capable de courir pour descendre. / Donc, c'est un peu le"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "loneliness", "name": "Autonomy is what creates the engagement", "note": "Going alone with no resupply and no mental support is exactly what makes the commitment real", "kw": ["Florian", "Partner", "Explaining", "Emptiness", "Preparation"], "file": "DSC_0169", "i": "03:12:08:14", "src": "00:25:24:00", "t": "et ça, ce côté autonomie, ça amène vraiment de l'engagement. Ça amène de l'engagement mental parce que tu sais que tu vas pas avoir de... ... de ravito, de... ... de support mental pour pousser et tout ça. Et c'est un peu comme mon trail, quand tu fais des trails off ou on, tu vois, souvent des fois tu peux avoir le même parcours et tu te dis, tiens, je vais le faire en off, et ça change vraiment la donne, hein, t'as pas les gens qui vont t'encourager, t'as pas les ravito, si t'as pas les ravito, tu dois avoir beaucoup plus d'autonomie aussi sur toi, et mine de rien, on a des projets comme ça, le poids, ça fait vraiment la diff, hein. Tu vois, pour peu que tu dois porter ta flotte ou un réchaud pour te faire un peu d'eau, ta bouffe et tout ça, la dynamique, elle est pas du tout pareil en termes d'effort énergétique et en termes d'engagement mental. T'es face à toi-même, beaucoup plus. / Super, on passe sur la partie plus générale sur le trail et l'alti. / Déjà, est-ce que Nicolas tente, est-ce que ça, ça a déjà fait ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "loneliness", "name": "Alone, so no rope", "note": "Pure glacier walking and going solo, so a rope would be of little use", "kw": ["Nicolas", "Gear", "Glacier", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "03:13:06:24", "src": "12:00:40:05", "t": "Pour demain, pas de cordes, pas besoin. On est vraiment que sur de la rando glacière, donc seul, la corde sera pas très utile. / Et on a ce qu'il faut. On a une partie technique."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "loneliness", "name": "Supported or unsupported", "note": "Discussing what counts as supported; he will finish day 3 unsupported and sleep at the Cosmiques hut", "kw": ["Nicolas", "Explaining", "Mountain Hut", "Sleep"], "file": "A004C047_260613OO", "i": "03:13:22:09", "src": "12:52:46:09", "t": "J'ai une autre question de refuge du cosmique, pour le tour, supporteur de supporteur, ça marche ou... oui ? / Oui, parce que ce que je vais faire pour la refuge des cosmiques, demain, en arrivant, je dirais jusqu'à l'égout de mes vies, pour finir ce parcours du jour 3 en une supported. Ensuite, je dirais au refuge des cosmiques, dormir, j'espère qu'ils ont leur place à l'air."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Stripped back to primary needs", "note": "No phone signal, everything forgotten, and he is left facing very primary needs - above all water", "kw": ["Nicolas", "Pre WR", "food", "struggling", "Emptiness"], "file": "A002C001_260527DC", "i": "03:15:15:20", "src": "16:13:57:20", "t": "On a un réseau avec le téléphone, donc tout ça, on oublie. Et on se retrouve face à des besoins très primaires au fond. On va avoir besoin d'eau, quand on n'a plus d'eau, je peux te dire que tout le reste, ça compte plus. On a juste envie de trouver à boire. On a besoin de manger. Une fois qu'on n'a pas dormi depuis un ou deux jours, on a juste envie de dormir. Et c'est des besoins primaires et on ne pense pas à autre chose. On se rend compte, en faisant des courses d'ultra distance en montagne, qu'au final, on arrive facilement à se concentrer sur ces besoins vitaux. / Et pour toi,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Mental availability to get through it", "note": "Needing the mental capacity to rise above the suffering; knowing it will pass, but having to get through the time", "kw": ["Nicolas", "Pre WR", "struggling", "Tired", "Nervous"], "file": "A002C001_260527DC", "i": "03:15:56:15", "src": "16:15:14:11", "t": "Et pour toi, / Il faut qu'on ait toute la disponibilité mentale pour réussir à passer au-dessus de ça. On sait que ça va passer, mais il faut réussir à passer le temps. / Et quand tu... / Tu peux prendre une petite pause ? / Tu as besoin de boire ? Oui, on me profite. / Ah, c'est plus tard, c'est vrai. / Quand je suis allé..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Several versions of himself", "note": "Pushing past his limits brings out different versions of him depending on his mental state; enthusiasm turns it into a motor rather than a negative", "kw": ["Nicolas", "Pre WR", "struggling", "Tired", "happy"], "file": "A002C001_260527DC", "i": "03:16:34:19", "src": "16:20:10:20", "t": "Quand je pousse au-delà des limites, il peut y avoir plusieurs versions de moi. Il peut y avoir la version justement, ça va dépendre de mon état mental. Je n'ai pas une grande disponibilité et ça va être tout au négatif. Parce que ça va nous décourager. / Et à l'inverse, si je suis disponible et que j'arrive, que je suis dans ce mode, / ou que je suis vraiment enthousiaste, même en poussant au-delà de mes limites, ça va exacerber, ça, je dirais, ça va plus être quelque chose de moteur que quelque chose de négatif. Mais je pense que quand je pousse au-delà de mes limites, c'est vraiment un état d'esprit qui va déterminer là où je vais aller. / Donc, ça répond à une partie en la question, est-ce que tu te connectes plus à ton corps quand tu pousses les limites ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Pain over several days", "note": "He does not feel more connected to his body at the limit, but pain inevitably arrives across several days, and how he handles it comes down to his mental state", "kw": ["Nicolas", "Pre WR", "struggling", "Tired", "Explaining"], "file": "A002C001_260527DC", "i": "03:17:33:14", "src": "16:21:06:20", "t": "Je ne pense pas que je me connecte plus à mon corps quand je pousse mes limites, mais une sensation d'houleur va forcément arriver en poussant loin, en pourrant plusieurs jours. / Et c'est la manière dont j'appréhende ça, qui va être directement liée à mon état mental. Je remarque sur plusieurs courses, dernièrement, je n'avais peut-être pas la disponibilité mentale. Et ça a été assez négatif, ça a peut-être même mené à des amendements, alors qu'à l'inverse, sur d'autres courses, où je n'ai déjà été bien plus dans le dur, / ça a été vraiment positif et ça va mener des super performances. / Est-ce que tu es compétitif ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the extreme", "name": "Nothing else remains", "note": "In those moments he is completely focused and thinks about nothing else - that is all there is", "kw": ["Nicolas", "Emptiness", "struggling", "Alpine"], "file": "A002C063_260418WT", "i": "03:18:16:09", "src": "04:23:21:04", "t": "Il ne faut pas confondre les deux. Mais dans ces moments-là, on est vraiment hyper concentrés et on ne pense à plus rien d'autre. Il n'y a que ça qui reste. / Et quand il y a des moments plus simples, c'est la liberté. / quand on a fini une course en haute montagne, la journée n'est pas finie, mais pour moi, elle est finie quand on a fini tous ces moments où il peut y avoir du danger, je dirais. Après, des fois, on a 2, 3, 4 heures de marche, mais pour quelqu'un de normal, entre guillemets, ou qui ne fait pas ça, ça paraît très énorme. Alors que nous, on a fini notre journée, il reste encore 4 heures de marche, il ne sait pas qu'un danger, c'est juste la marche. Nice, nice. / Ouais, c'est de"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the extreme", "name": "Cold is the sensation that stays", "note": "Of everything the mountain gives him, cold is what remains - and the swings in temperature", "kw": ["Nicolas", "Weather", "Conditions", "struggling"], "file": "A002C063_260418WT", "i": "03:18:56:14", "src": "04:25:46:22", "t": "Ouais, c'est de / Alors, je pense que s'il y a une sensation qui doit me rester dans la montagne, c'est le froid. C'est vraiment des moments où tu as des variations de températures. On va avoir très chaud, on va avoir très froid. Dans la même journée, on peut avoir toutes ces sensations. Et c'est vraiment ces sensations de température si je devrais ressortir un filet. / Et du à du à le vent ne t'a pas de problème."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the extreme", "name": "Where ultra and high mountain meet", "note": "He grasped quickly that ultra trail and fast-and-light share the same fundamentals - hard efforts, altitude, and going on regardless", "kw": ["Florian", "Alpine", "Running", "struggling", "Hypoxy"], "file": "DSC_0169", "i": "03:19:27:01", "src": "00:12:31:12", "t": "Je pense que ce qu'il a compris très rapidement c'est que sur les fondamentaux entre l'ultra trail et le fast on light, ou la haute montagne on est sur des efforts qui vont être durs, l'altitude, voilà il faut se donner, ça il l'a compris très vite, après je pense qu'il a compris très vite que si le transfert entre basse altitude et haute altitude, il ne se faisait pas de manière aussi simple, il avait besoin d'acclimatation pour pouvoir tenir un peu des rythmes comme il avait envie de tenir en altitude, il faut être entraîné en altitude, donc ça je pense qu'il a très vite compris que ce n'était pas tout à fait les mêmes données, chiffré, brut, je pense qu'il a très bien compris aussi que dès qu'on est sur des terrains techniques, tout de suite il les allure et tout ça diminue de manière drastique et par contre il a très bien compris aussi que ces allures là, ils pouvaient être aussi très rapides entre guillemets si techniquement on progressait donc il a eu tout de suite envie de comprendre un peu comment est-ce qu'on bouge un peu sur le caillou, avec les mains, les pieds, sans être juste en cours, mais vraiment on va mettre un peu des quatre appuis, voilà ça ils sont vite rendus compte et ils a vite mis ça en place et après peut-être ce qui est ce qui lui a pris un peu plus de temps à comprendre,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the extreme", "name": "A different apprehension every day", "note": "Each day carried its own kind of dread; the one he expected to enjoy most became something else", "kw": ["Nicolas", "Nervous", "Explaining"], "file": "A004C046_260613H5", "i": "03:20:44:24", "src": "12:48:20:03", "t": "bizarre parce que chaque jour en fait, j'avais une appréhension que c'est différent. Je me disais au début, toujours là, le jour qui est, enfin le demain, c'est le jour que je vais le plus apprécier parce que c'est vraiment la traversée qui apprécie plus. En soi, c'est tout à fait ça. Maintenant, il y a quelque chose qui est quand même qui peut compliquer la donne, le vent. Il y aura quand même pas mal de vent. Sur un parcours d'arrête comme ça, avec des portions d'escalade aussi en solo. C'est pas génial. Donc il y a ça qui met quand même, qui crée une petite tension. Et il y a aussi l'horaire. Je vois que ça fait quand même de grosse journée. On est à plus de 110 000 mètres de neige, de plus en plus. Il y a la fatigue qui s'est un peu sentie. Et l'arrête de bien asser, c'est une arrête de neige hyper effilée. / Et pour qu'elle"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the extreme", "name": "Never thought he would get that far", "note": "On day one the weather and the unmanageable risk meant he never expected to make it as far as he did", "kw": ["Nicolas", "Dangerous", "Conditions", "Explaining"], "file": "A004C047_260613OO", "i": "03:21:45:18", "src": "12:56:01:23", "t": "Et pour qu'elle / ce que tu ferais d'habitude ? / Ah, clairement, oui. Oui, clairement, le premier jour, c'est... Je serais jamais à nous aussi loin, c'est sûr que je vais faire. Le premier jour, vu les punis sur météo, vu les risques qui n'étaient pas maîtrisables par rapport au preuve à cette tue d'Iara, je serais... / Oui, c'est évident, pour être realiste."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the extreme", "name": "Does not know how he reached the summit", "note": "Looking back he cannot explain how he got to the top that day", "kw": ["Nicolas", "Summit", "struggling"], "file": "A004C047_260613OO", "i": "03:22:09:23", "src": "12:56:32:20", "t": "Oui, c'est évident, pour être realiste. / sincèrement, je ne sais pas comment j'ai fait pour aller au Sommeil Hère. Ah oui, c'était..."}], "pink": [{"topic": "origins", "n": 7, "srcs": "Nicolas Pre WR, Pre WR", "i": "01:00:00:00", "d": "05:13:07"}, {"topic": "the switch", "n": 9, "srcs": "Nicolas Pre WR, Pre WR", "i": "01:06:33:07", "d": "05:13:23"}, {"topic": "family", "n": 14, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "01:13:07:05", "d": "09:24:05"}, {"topic": "portrait", "n": 11, "srcs": "Pre WR", "i": "01:23:51:10", "d": "08:25:17"}, {"topic": "motivation", "n": 17, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "01:33:37:02", "d": "09:52:11"}, {"topic": "impostor syndrome", "n": 13, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "01:44:49:13", "d": "08:39:14"}, {"topic": "training", "n": 13, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "01:54:49:02", "d": "08:11:12"}, {"topic": "the sport", "n": 18, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "02:04:20:14", "d": "14:50:12"}, {"topic": "gear", "n": 8, "srcs": "WR", "i": "02:20:31:01", "d": "03:05:15"}, {"topic": "food/fuel", "n": 6, "srcs": "WR", "i": "02:24:56:16", "d": "02:41:16"}, {"topic": "places", "n": 12, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "02:28:58:07", "d": "07:31:10"}, {"topic": "work & discipline", "n": 7, "srcs": "Nicolas Pre WR, Pre WR", "i": "02:37:49:17", "d": "03:34:06"}, {"topic": "risk & safety", "n": 13, "srcs": "Nicolas Pre WR, Pre WR", "i": "02:42:43:23", "d": "10:20:15"}, {"topic": "route & conditions", "n": 14, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "02:54:24:13", "d": "08:50:02"}, {"topic": "storm", "n": 16, "srcs": "WR", "i": "03:04:34:15", "d": "06:13:22"}, {"topic": "loneliness", "n": 3, "srcs": "Pre WR, WR", "i": "03:12:08:12", "d": "01:47:06"}, {"topic": "the extreme", "n": 10, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "03:15:15:18", "d": "07:03:09"}]}</script>
<script>
const D=JSON.parse(document.getElementById('p').textContent);
const ALL=[...D.iv,...D.fkt];
const S={mode:'iv',q:'',topic:new Set(),speaker:new Set(),source:new Set(),day:new Set(),ty:new Set(),kw:new Set()};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const terms=()=>S.q.toLowerCase().split(/\s+/).filter(Boolean);
function hay(r){return r.kind==='iv'
 ?[r.name,r.note,r.t,r.kw.join(' '),r.speaker,r.topic,r.source,r.file].join(' ').toLowerCase()
 :[r.note,r.t,r.kw.join(' '),r.file,r.ty,r.tln].join(' ').toLowerCase()}
function pool(){return S.mode==='iv'?D.iv:S.mode==='fkt'?D.fkt:ALL}
function match(r){
 if(r.kind==='iv'){
  if(S.topic.size&&!S.topic.has(r.topic))return false;
  if(S.speaker.size&&!S.speaker.has(r.speaker))return false;
  if(S.source.size&&!S.source.has(r.source))return false;
 }else{
  if(S.day.size&&!S.day.has(r.tl))return false;
  if(S.ty.size&&!S.ty.has(r.ty))return false;
 }
 if(S.kw.size){for(const k of S.kw)if(!r.kw.includes(k))return false}
 const t=terms();if(!t.length)return true;const h=hay(r);return t.every(x=>h.includes(x));
}
function hl(s){let o=esc(s);const t=terms();if(!t.length)return o;
 for(const x of t){const rx=new RegExp('('+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');o=o.replace(rx,'<mark>$1</mark>')}return o}
function chips(id,label,vals,set,counts){
 const TOP=12;const s=vals.slice(0,TOP),h=vals.slice(TOP);
 return `<div class="frow"><span class="eyebrow">${label}</span>`
 +s.map(v=>`<button class="chip${set.has(v)?' on':''}" data-f="${id}" data-v="${esc(v)}">${esc(v)}<span class="c">${counts[v]||0}</span></button>`).join('')
 +(h.length?`<span class="hid" id="h_${id}">`+h.map(v=>`<button class="chip${set.has(v)?' on':''}" data-f="${id}" data-v="${esc(v)}">${esc(v)}<span class="c">${counts[v]||0}</span></button>`).join('')+`</span><button class="more" data-more="${id}">+${h.length} more</button>`:'')
 +`</div>`}
function render(){
 const P=pool();
 document.getElementById('modes').innerHTML=
  [['iv','Interviews',D.iv.length],['fkt','FKT footage',D.fkt.length],['all','Both',ALL.length]]
  .map(([k,l,n])=>`<button class="mode${S.mode===k?' on':''}" data-m="${k}">${l}<span class="c">${n}</span></button>`).join('');
 const cnt=(arr,f)=>{const o={};arr.forEach(r=>{const v=f(r);if(v)o[v]=(o[v]||0)+1});return o};
 const kwc={};P.forEach(r=>r.kw.forEach(k=>kwc[k]=(kwc[k]||0)+1));
 const kws=Object.keys(kwc).sort((a,b)=>kwc[b]-kwc[a]||a.localeCompare(b));
 let f='';
 if(S.mode!=='fkt'){
  const sp=cnt(D.iv,r=>r.speaker),so=cnt(D.iv,r=>r.source);
  f+=chips('speaker','Speaker',Object.keys(sp).sort((a,b)=>sp[b]-sp[a]),S.speaker,sp);
  f+=chips('source','Interview',Object.keys(so).sort((a,b)=>so[b]-so[a]),S.source,so);
 }
 if(S.mode!=='iv'){
  const dy=cnt(D.fkt,r=>r.tl),ty=cnt(D.fkt,r=>r.ty);
  const dord=['Pre_WR','WR_D1','WR_D2','WR_D3','WR_D4','WR_D5'].filter(x=>dy[x]);
  const names={};D.fkt.forEach(r=>names[r.tl]=r.tln);
  f+=`<div class="frow"><span class="eyebrow">Shoot day</span>`
   +dord.map(v=>`<button class="chip${S.day.has(v)?' on':''}" data-f="day" data-v="${v}">${names[v]}<span class="c">${dy[v]}</span></button>`).join('')+`</div>`;
  f+=chips('ty','Marker',Object.keys(ty),S.ty,ty);
 }
 f+=chips('kw','Keyword',kws,S.kw,kwc);
 document.getElementById('filters').innerHTML=f;
 if(S.mode!=='fkt'){
  const tc=cnt(D.iv,r=>r.topic);const mx=Math.max(...Object.values(tc),1);
  document.getElementById('topicbar').innerHTML=D.pink.map(p=>{
   const n=tc[p.topic]||0;const h=Math.max(10,Math.round(n/mx*100));
   return `<button class="tb${S.topic.has(p.topic)?' on':''}" data-f="topic" data-v="${esc(p.topic)}">
   <span class="bar"><span class="fill" style="height:${h}%"></span></span>
   <span class="lab"><span class="nm">${esc(p.topic)}</span><span class="ct">${n}</span></span></button>`}).join('');
 } else document.getElementById('topicbar').innerHTML='';
 const res=P.filter(match);
 const active=S.q||S.topic.size||S.speaker.size||S.source.size||S.day.size||S.ty.size||S.kw.size;
 document.getElementById('count').innerHTML=active?`<b>${res.length}</b> of ${P.length}`:`<b>${P.length}</b> markers`;
 document.getElementById('reset').classList.toggle('on',!!active);
 document.getElementById('clr').classList.toggle('on',!!S.q);
 document.getElementById('sl').style.display=S.q?'none':'';
 document.getElementById('footl').textContent=`${D.iv.length} interview + ${D.fkt.length} FKT markers · ${D.pink.length} topics`;
 if(!res.length){document.getElementById('out').innerHTML=`<div class="empty">
  <span class="eyebrow dim">No markers match</span><h2>Nothing here.</h2>
  <p>The index searches marker notes, dialogue, keywords and names — not what a shot looks like.</p>
  <p>Clear a filter or try a single word.</p></div>`;return}
 document.getElementById('out').innerHTML=res.map(r=>r.kind==='iv'?`<article class="row">
  <div class="gut"><span class="ty iv">${esc(r.topic).toUpperCase()}</span>
  <span class="sub">${esc(r.speaker)}</span><span class="sub">${esc(r.source)}</span></div>
  <div class="body"><div class="hd">
   <button class="tc" data-tc="${r.i}">${r.i}</button>
   ${r.file?`<span class="src">${esc(r.file)}</span>`:''}</div>
   <p class="nm2">${hl(r.name)}</p>
   <p class="note">${hl(r.note)}</p>
   ${r.kw.length?`<div class="kws">${r.kw.map(k=>`<button class="kw" data-f="kw" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}
   ${r.t?`<p class="dia">${hl(r.t)}</p>`:''}</div></article>`
 :`<article class="row">
  <div class="gut"><span class="ty ${r.ty.replace(' ','')}">${r.ty}</span>
  <span class="sub">${esc(r.tln)}</span><span class="sub">${esc(r.date)}</span></div>
  <div class="body"><div class="hd">
   <button class="tc" data-tc="${r.i}">${r.i}${r.d?` <span style="opacity:.34">→</span> ${r.o}`:''}</button>
   ${r.d?`<span class="dur">${r.d}</span>`:''}
   ${r.file?`<span class="src">${esc(r.file)}</span>`:''}</div>
   <p class="note${r.note?'':' none'}">${r.note?hl(r.note):'No note'}</p>
   ${r.kw.length?`<div class="kws">${r.kw.map(k=>`<button class="kw" data-f="kw" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}
   ${r.t?`<p class="dia">${hl(r.t)}</p>`:''}</div></article>`).join('');
}
const q=document.getElementById('q');
q.addEventListener('input',e=>{S.q=e.target.value;render()});
document.getElementById('clr').onclick=()=>{S.q='';q.value='';q.focus();render()};
document.getElementById('reset').onclick=()=>{S.q='';q.value='';
 [S.topic,S.speaker,S.source,S.day,S.ty,S.kw].forEach(s=>s.clear());render()};
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-m]');
 if(m){S.mode=m.dataset.m;render();return}
 const mo=e.target.closest('[data-more]');
 if(mo){const el=document.getElementById('h_'+mo.dataset.more);
  const o=el.classList.toggle('open');mo.textContent=o?'show fewer':mo.textContent;return}
 const f=e.target.closest('[data-f]');
 if(f){const set=S[f.dataset.f];const v=f.dataset.v;
  set.has(v)?set.delete(v):set.add(v);render();
  if(f.classList.contains('kw'))window.scrollTo({top:0,behavior:'smooth'});return}
 const tc=e.target.closest('[data-tc]');
 if(tc){navigator.clipboard?.writeText(tc.dataset.tc);
  const o=tc.textContent;tc.textContent='COPIED';setTimeout(()=>tc.textContent=o,900);return}
 const d=e.target.closest('.dia');if(d)d.classList.toggle('open');
});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
 if(e.key==='Escape'){if(S.q){S.q='';q.value='';render()}q.blur()}});
render();
</script></body></html>
