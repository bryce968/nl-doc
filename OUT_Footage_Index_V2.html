icité plutôt que même la facilité. Et cette simplicité, je pense que c'est ce qui amène la liberté. / Est-ce que tu peux... / calme. On fait une"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "The message has not changed", "note": "Not that people should climb or do sport - simply that everyone can find their own thing", "kw": ["Nicolas", "Post WR", "Inspiration", "Explaining", "happy"], "file": "A004C002_2606275W", "i": "02:01:24:16", "t": "non non je pense que le message en soi ça reste le même C'est pas forcément d'aller en montagne, d'aller faire du sport, de l'escalade, mais j'en sais rien. C'est juste que chacun peut se donner les moyens de faire ce qu'il veut faire. On parlait avant justement des critiques sur les réseaux et des gens qui disaient « Ah mais je comprends pas, ça sert à rien ». Ok, très bien. Moi, le message que je veux me le plus passer, c'est que chacun peut se donner les moyens de faire ce qu'il a envie de faire. Et ce qu'il lui parle. Et maintenant, / le seul truc, c'est de faire quelque chose. / C'est pas rester à temps que la vie est passée. Est-ce que c'est aussi / les choses que"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "The debate about everyone being able to do it", "note": "Showing the teaser started an argument about his claim that anyone could do this, and it shifted his view slightly", "kw": ["Nicolas", "Pre WR", "Explaining", "Training"], "file": "A002C001_260527DC", "i": "02:04:06:16", "t": "Alors quand je dis que tout le monde peut le faire c'est marrant parce que j'ai montré le teaser à quelques personnes et dans le teaser je dis que tout le monde peut le faire et on en a discuté ça a été un mini débat et ça a un tout petit peu changé ma vision on a réussi à me faire changer ma vision là-dessus parce que je pense que tout le monde peut le faire s'il s'en donne les moyens et le fait"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "He gets there by giving himself the means", "note": "He still thinks anyone can do it - what makes it possible for him is that he commits the means to it", "kw": ["Nicolas", "Pre WR", "Preparation", "Training"], "file": "A002C001_260527DC", "i": "02:04:34:10", "t": "Alors quand je dis que tout le monde peut le faire c'est marrant parce que j'ai montré le teaser à quelques personnes et dans le teaser je dis que tout le monde peut le faire et on en a discuté ça a été un mini débat et ça a un tout petit peu changé ma vision on a réussi à me faire changer ma vision là-dessus parce que je pense que tout le monde peut le faire s'il s'en donne les moyens et le fait / et le fait d'ignorer cette partie-là ça ne serait pas juste je pense que tout le monde peut le faire oui et j'arrive à faire des choses comme ça parce que je m'en donne les moyens et c'est assez important quand même dans mon approche / est-ce que tu te considères comme quelqu'un d'extrême ? / non je ne me considère pas comme"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "He does not consider himself extreme", "note": "There is always someone more extreme; he had been looking at another athlete going for a record just before the interview", "kw": ["Nicolas", "Pre WR", "Explaining", "Phone"], "file": "A002C001_260527DC", "i": "02:04:55:10", "t": "non je ne me considère pas comme / non je ne me considère pas comme quelqu'un d'extrême on arrive toujours à trouver des gens plus extrêmes que soi quand on regarde avant de venir je regardais sur Instagram il y a Benjamin Mougel qui est en train de battre le record d'essayer de faire 100 000 mètres de dénivelle le plus rapidement possible on regarde des traversées traversées de Mathéo Jacques Mou l'ensemble de l'intégralité des Alpes on trouvera toujours plus extrême après le tout je pense que c'est de trouver sa propre voie et vraiment ce qu'on a envie de faire soi-même / est-ce que tu serais une personne différente sans l'alpinisme et le trail ? / est-ce que je serais différent"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "Recognition is pleasant, not the point", "note": "Being known for what you love is enjoyable, but he does not think he lives for it", "kw": ["Nicolas", "Pre WR", "Explaining", "happy"], "file": "A002C001_260527DC", "i": "02:05:33:17", "t": "est-ce que je serais différent / milieu-là. Et je pense que tout à chacun, dans sa passion, dans ce qu'il aime faire, ça ne peut qu'être plaisant d'avoir cette notoriété. Ensuite, est-ce que je vis pour ça ? Non, je ne pense pas que je vis pour ça. Je pourrais très bien aller en montagne, courir, et je prends énormément de plaisir à aller faire une promenade en montagne, même si elle peut durer longtemps. / Mais ce n'est pas quelque chose qui est nécessaire, mais c'est quelque chose qui est plaisant. / Comment tu définirais ton style ? C'est de l'alpinisme, du trail ou quelque chose entre les deux ? / Comment je définirais"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "Neither to inspire nor to warn", "note": "If there is a message it is that everyone finds their own way - not that others should follow his", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration"], "file": "A002C001_260527DC", "i": "02:06:10:12", "t": "Comment je définirais / Je ne veux ni inspirer ni mettre en garde. Je pense que chacun, / si je devais passer un message, c'est que chacun va trouver sa propre voie. Ce n'est pas parce que je fais ça qu'il y a des volées images que forcément quelqu'un va se reconnaître dans un projet comme ça. Je fais ce projet parce que j'ai une histoire avec ce massif dans le début de ma pratique de l'alpinisme."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "He does not have the level to be a pro", "note": "Completely honest: he does not think he has the level of a professional runner, and there are far more talented people", "kw": ["Nicolas", "Pre WR", "Explaining", "Running", "struggling"], "file": "A002C002_260527XB", "i": "02:06:34:19", "t": "Alors, si je dois être totalement honnête, je pense que je n'ai pas du tout le niveau d'être un trail runner pro. Il y a tellement de gens qui sont bien plus talentueux que moi. / Après, je suis un bourreau de travail quand même par rapport à ça. C'est ce qui me permet de faire des projets de ce type-là. / Clairement, oui, je n'ai pas le niveau de plein d'autres gens qui pourraient... / Tu n'as pas le niveau de cours pro ? / Je ne me considère pas comme pro... / C'est bien, c'est bien."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "A workhorse rather than a talent", "note": "He is realistic about it - what lets him do projects like this is work, not level", "kw": ["Nicolas", "Pre WR", "Explaining", "Training", "Preparation"], "file": "A002C002_260527XB", "i": "02:07:14:06", "t": "C'est bien, c'est bien. / C'est bien, c'est bien. Ça marche. / Je ne me considère vraiment pas comme pro, tout simplement, parce que je ne pense pas que j'ai le niveau pour aspirer à ça. Il faut aussi être réaliste. Je suis un bourreau de travail, donc c'est ce qui me permet d'envisager des projets comme ça. Je m'entraîne énormément, je suis passionné. Par contre, quand je vois d'autres coureurs qui ont des niveaux pour moi stratosphériques, je pense que je n'ai pas ce talent. / Tu le penses ça ou c'est de la modestie ? / Ce n'est absolument pas de la fausse modestie de penser ça. / J'arrive à être assez réaliste quand même là-dessus. Après, je pense que j'ai aussi une faculté à courir très longtemps et ça,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "impostor syndrome", "name": "What he wanted people to take from it", "note": "At the start what he wanted was for people to see that anyone can get where they want - a view that shifted after the teaser discussion", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration"], "file": "A002C002_260527XB", "i": "02:07:57:06", "t": "J'arrive à être assez réaliste quand même là-dessus. Après, je pense que j'ai aussi une faculté à courir très longtemps et ça, / Et au départ, pour moi, ce que je voulais qu'ils retiennent, c'était de se dire que tout le monde peut arriver à faire ce qu'il veut. Et je pense que, je garde tes pètes à esprit, mais je compléterai en disant que tout le monde peut arriver à faire ce qu'il veut s'ils s'en donnent les moyens. Et à mon avis, le « s'ils s'en donnent les moyens », c'est quelque chose qui a mûri dans ma réflexion et qui a toute son importance. / Est-ce que tu veux que les gens passent à l'action après avoir vu ce que tu as fait, ou tu veux juste qu'ils se souviennent ? / Je ne veux pas forcément"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "impostor syndrome", "name": "Giving yourself the means", "note": "Someone told him he wanted to give himself the means to climb the summits he wanted, and it changed his mindset", "kw": ["Nicolas", "Inspiration", "Training", "Explaining"], "file": "A002C063_260418WT", "i": "02:08:28:20", "t": "Je ne veux pas forcément / Et il m'a dit, oui mais moi j'ai envie de me donner les moyens moi-même de pouvoir grimper les sommets que j'ai envie de grimper. Et ça, ça a pas mal changé mon mindset parce"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "impostor syndrome", "name": "Step by step you move mountains", "note": "Progress comes in small steps; looking back at the trajectory he has moved mountains, and one day it becomes a revelation that he is capable", "kw": ["Nicolas", "Training", "Explaining", "happy", "Inspiration"], "file": "A002C063_260418WT", "i": "02:08:40:02", "t": "Et il m'a dit, oui mais moi j'ai envie de me donner les moyens moi-même de pouvoir grimper les sommets que j'ai envie de grimper. Et ça, ça a pas mal changé mon mindset parce / de 4 heures et après en moins de 3 heures. Et au fur et à mesure, on avance petit pas par petit pas. Et si on regarde la trajectoire qu'on a eue, on a abattu des montagnes. Donc c'est vraiment ça, ça m'a beaucoup marqué. Le fait que quelque chose qu'il imaginait, que lui, un si grand alpiniste, que des choses qu'il n'imaginait pas possible, au fur et à mesure il s'est rendu compte qu'il pourrait peut-être le faire. Et ça, ça a aussi beaucoup changé mon mindset par rapport à la montagne. / C'est vraiment de voir le progrès chaque fois que tu es là et que tu es en train de se faire. / Exactement. De voir le progrès et un jour, presque comme une révélation, un jour de se dire ce que j'envisageais même pas de faire. Un jour de se dire, mais en fait oui, je suis capable de le faire et je vais y aller. / Donc est-ce que c'est vraiment la fascination qui t'a fait honte et te poussé à aller plus loin et plus loin ? / Alors, c'est même pas forcément de me pousser, c'est de se rendre compte. C'est"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "impostor syndrome", "name": "On Nicolas saying he is an impostor", "note": "Nicolas says plenty of people could do it faster or more technically; Florian points at social media making everyone look stronger, and says his real strength is motivation and discipline rather than raw numbers", "kw": ["Florian", "Partner", "Explaining", "Training"], "file": "DSC_0169", "i": "02:09:40:07", "t": "Alors, c'est même pas forcément de me pousser, c'est de se rendre compte. C'est / Il dit personnellement qu'il a le syndrome de l'imposteur, que plein de gens pourraient faire ça plus vite ou de manière plus technique. Qu'est-ce que tu en penses toi ? / Alors Nico, il dit qu'il a le syndrome de l'imposteur, que les gens pourraient faire ça plus vite. Après, on est dans une société qui est très particulière, voilà, avec les réseaux sociaux. On a toujours l'impression que les gens, ils sont méga forts, méga plus, voilà. Je pense que Nico aussi, il a un profil. Il a eu une vie avant où il était plutôt fait tard, plutôt à faire bien la bringue et tout. Il vient pas du univers de la montagne, c'est quelque chose, il est venu sur le tard. Et après, je pense que c'est quelqu'un de sa plus grande force, sa motivation et sa discipline. C'est pas quelqu'un, on va se dire, ah ouais, il est surdoué au niveau des valeurs de VMA ou quelque chose comme ça. Ce qui va faire vraiment la différence, Nico, là où il va être vraiment bon, c'est la tête et la motivation pour son projet. Et du coup, c'est peut-être ça qui influence que, oui, ces données, peut-être VO2max ou VMA, il y en a plein, surtout maintenant avec les jeunes qui sont surmutants. Il y a toujours plus fort et plus rapide. Donc, peut-être que là, des fois, c'est difficilement, c'est dur de trouver sa place dans cet univers-là. / Mais, ouais, ça m'étonne pas de lui. Après, il a tellement une forme d'humilité aussi, une forme d'altr"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "impostor syndrome", "name": "Not another always", "note": "Against a backdrop of influencer projects always going higher and further, he explains why this one is sincere", "kw": ["Florian", "Partner", "Explaining", "Alpine"], "file": "DSC_0169", "i": "02:11:17:05", "t": "Ça, c'est super. / dans ce monde ? / Alors, je pense que ce projet-là, par rapport à tout ce qu'on peut voir au niveau, sur les réseaux, et toujours plus loin, toujours plus haut, toujours plus, Moi, je pense qu'il a une forme de légitimité, une forme de cohérence par rapport au parcours de Nico. C'est-à-dire que ça lui ressemble bien. Ça lui ressemble bien, c'est pas quelque chose qui tombe comme ça, voilà, tiens, on va faire du buzz, et puis, il faut que je trouve quelque chose qui parle, et qui, voilà. Il faut savoir que Nico, je pense qu'il y a deux endroits, vraiment, où il est souvent, très souvent fourré, c'est le Salève, et puis le Mont Blanc, voilà. Donc, le fait d'avoir un projet comme ça, sur le Mont Blanc, qui est une montagne emblématique pour lui, mais vraiment réellement, parce que c'est une montagne où il va souvent, je pense que ça a du sens, personnellement, pour lui. Et du coup, à partir du moment où ça a du sens de manière personnelle, je"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "impostor syndrome", "name": "No official record on this route", "note": "There is no official FKT for this line, so there is no time pressure - which suits the conditions", "kw": ["Nicolas", "Explaining", "Preparation", "Mont Blanc"], "file": "A003C112_260611HR", "i": "02:12:12:04", "t": "Alors, je pense que ce projet-là, par rapport à tout ce qu'on peut voir au niveau, sur les réseaux, et toujours plus loin, toujours plus haut, toujours plus, Moi, je pense qu'il a une forme de légitimité, une forme de cohérence par rapport au parcours de Nico. C'est-à-dire que ça lui ressemble bien. Ça lui ressemble bien, c'est pas quelque chose qui tombe comme ça, voilà, tiens, on va faire du buzz, et puis, il faut que je trouve quelque chose qui parle, et qui, voilà. Il faut savoir que Nico, je pense qu'il y a deux endroits, vraiment, où il est souvent, très souvent fourré, c'est le Salève, et puis le Mont Blanc, voilà. Donc, le fait d'avoir un projet comme ça, sur le Mont Blanc, qui est une montagne emblématique pour lui, mais vraiment réellement, parce que c'est une montagne où il va souvent, je pense que ça a du sens, personnellement, pour lui. Et du coup, à partir du moment où ça a du sens de manière personnelle, je / tu es seul ? / disons que là, il y a deux choses qui rentrent en compte. Comme il n'y a pas de FKT, unsupported, de temps officiel sur ce tracé, / ce qui est assez cool quand même, c'est que je n'ai pas de pression sur le temps. Surtout avec les conditions, puisqu'on change un tout petit peu le parcours à la fin, ça le rallonge. / Ça évite de se poser la question, de se dire, ok, est-ce que je prends le choix de perdre un peu de sécurité"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "The speed records are stratospheric", "note": "He would not be capable of the times the specialists post, and chasing them is not what he is looking for", "kw": ["Nicolas", "Post WR", "Running", "Explaining", "struggling"], "file": "A003C438_26062775", "i": "02:12:47:05", "t": "Ça évite de se poser la question, de se dire, ok, est-ce que je prends le choix de perdre un peu de sécurité / déjà, je pense que je n'en serais pas capable. Clairement, quand je vois les temps qui sont faits, c'est juste stratosphérique. Donc c'est impossible pour moi de faire ça. Et ce n'est pas quelque chose qui m'intéresse en soi. Il y a d'autres parcours sur lesquels dans le massif du Mont Blanc, j'aimerais aller essayer de faire des chronos. Mais sur quelque chose comme ça, peut-être un peu moins."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "So much positive that the criticism vanished", "note": "There were criticisms, but so much positive response that they barely registered", "kw": ["Nicolas", "Post WR", "Explaining", "Phone", "happy"], "file": "A003C438_26062775", "i": "02:13:08:23", "t": "réponds de ce chant ? / alors il y a eu pas mal de critiques on ne peut pas dire qu'il y a eu pas mal de critiques en fait parce qu'il y a eu tellement de positifs que les critiques sur le réseau on a pensé à me sentir l'anecdote importante de quantité par rapport aux gens qui ont été enthousiés par le projet et souvent quand je vois ça c'est des commentaires souvent ah ça n'a aucun sens, à quoi ça sert mais au final je ne demande pas aux gens que ça leur servait à quelque chose ça n'a aucun intérêt pour moi que ça leur servait à quelque chose je cherche juste quelque chose qui me parle à moi ce que je souhaite à tout le monde que chacun puisse trouver un projet qui lui parle je peux tout à fait comprendre que des projets en montagne des gens qui ne soient pas sensibles à ça ils n'ont aucun intérêt mais là où je suis peut-être plus critique moi je ne vois pas à quoi ça leur sert de critiquer ce genre de projet si eux ils sont fans de jardinage je ne vais pas aller dire que le jardinage c'est nul moi je pense que chacun doit trouver sa propre voie et je suis le premier à dire qu'il n'y a rien de génial dans ce genre de projet ou pas mais c'est juste quelque chose qui me parle il / y avait par contre un commentaire qui on"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "The article saying leave Mont Blanc alone", "note": "A piece arguing there had been too many records on Mont Blanc that year, and what he makes of it", "kw": ["Nicolas", "Post WR", "Mont Blanc", "Explaining", "Phone"], "file": "A003C438_26062775", "i": "02:14:28:08", "t": "y avait par contre un commentaire qui on / c'est vrai qu'il y a un article qui disait laisser le mont blanc tranquille parce qu'il y a eu énormément de records sur le mont blanc cette année et pour ceux qui ont vu l'article disons que ça m'a fait entre guillemets plaisir dans le sens où il disait peut-être que le unsupported c'est c'est ce qui garde pour le plus de sens là-dedans même si je pense que même les autres ça a du sens c'est juste des pratiques différentes et pourquoi le mont blanc pour moi ? parce que c'est un massif qui me parle c'est un massif qui m'a amené à la montagne avec lequel j'ai une histoire si j'étais né à proximité des écrins peut-être que j'aurais fait un projet dans les écrins j'ai pas fait le mont blanc parce que c'est le mont blanc j'ai fait le mont blanc parce que j'ai beaucoup d'histoires personnelles avec ce massif"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "Open", "note": "What he would say to people who do not understand the project: the greatest proof of intelligence is being open", "kw": ["Nicolas", "Post WR", "Explaining", "Inspiration"], "file": "A003C438_26062775", "i": "02:15:24:18", "t": "pense que la plus grande preuve d'intelligence dans la vie c'est l'ouverture d'esprit c'est être ouvert aux autres plein de choses et leur souhaitent de voir à l'ouverture"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "The word for it is impostor syndrome", "note": "With everyone congratulating him afterwards, and seeing what others do, the term that fits is impostor syndrome", "kw": ["Nicolas", "Post WR", "Explaining", "struggling", "Phone"], "file": "A003C439_260627CT", "i": "02:15:43:10", "t": "un bon sujet / perception des autres là la suite du projet j'ai plein de gens qui vont féliciter qui est terme qu'on emploie pour ça c'est souvent le sentiment d'imposteur mais quand je vois tout ce que plein de gens font en montagne j'ai pas le sentiment que ce soit si exceptionnel que ça ce qui fait que le projet il a peut-être un peu plus se parler de lui c'est que c'est peut-être plus tangible pour tout un chacun quatre mont blanc tout le monde comprend bien quatre mont blanc par quatre voies différentes c'est déjà un peu moins compris mais ça va encore et après quand je vois des réalisations en montagne des voies des ouvertures je suis comme un gamin quand je vois ça je me sens pas du tout dans cette catégorie donc j'ai vraiment aucune légitimité pour moi je peux rapporter la même chose au trail c'est génial tu as réussi tu as fait ça mais quand je vois ce que d'autres font tellement stratosphérique et donc je me retrouve un peu entre les deux entre ces deux pratiques c'est nulle part génial je me retrouve bien en tout cas je prends du plaisir"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "You can always compare upwards", "note": "There is always someone above you to measure yourself against", "kw": ["Nicolas", "Post WR", "Explaining", "struggling"], "file": "A004C001_260627PB", "i": "02:16:47:13", "t": "perception des autres là la suite du projet j'ai plein de gens qui vont féliciter qui est terme qu'on emploie pour ça c'est souvent le sentiment d'imposteur mais quand je vois tout ce que plein de gens font en montagne j'ai pas le sentiment que ce soit si exceptionnel que ça ce qui fait que le projet il a peut-être un peu plus se parler de lui c'est que c'est peut-être plus tangible pour tout un chacun quatre mont blanc tout le monde comprend bien quatre mont blanc par quatre voies différentes c'est déjà un peu moins compris mais ça va encore et après quand je vois des réalisations en montagne des voies des ouvertures je suis comme un gamin quand je vois ça je me sens pas du tout dans cette catégorie donc j'ai vraiment aucune légitimité pour moi je peux rapporter la même chose au trail c'est génial tu as réussi tu as fait ça mais quand je vois ce que d'autres font tellement stratosphérique et donc je me retrouve un peu entre les deux entre ces deux pratiques c'est nulle part génial je me retrouve bien en tout cas je prends du plaisir / dans tous dans leur domaine respectif mais est ce que tu arrives à comprendre sur le fait que les gens peuvent potentiellement s'inquiéter pour ta pratique les gens qui sont proches de toi notamment est ce que c'est quelque chose que tu conçois que il ya une tu mentionnais que voilà tu regardes toujours vers le plus haut plus haut que toi il ya toujours des choses plus extraordinaires mais est ce que tu arrives à comprendre que la plupart des g"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "The distortion between perception and living it", "note": "Hard to understand the gap between how people see it and how he experiences it - he goes running, essentially", "kw": ["Nicolas", "Post WR", "Explaining", "Running", "struggling"], "file": "A004C002_2606275W", "i": "02:17:37:21", "t": "sais pas pour cette prise de / je suis pas c'est en ça où j'ai des fois du mal à comprendre cette distorsion entre la perception et les choses comme je les vis moi parce qu'au final ce que je fais c'est je vais courir je vais passer la distorsion entre la perception des gens je fais rien d'exceptionnel en fait c'est comme ça que je perçois sincèrement les choses tout le monde peut faire ça tout le monde est capable après tout le monde pas tout le monde est capable le week-end au lieu de rester à la maison ou dans une sa conversion tout le monde est capable de aller marcher à l'île de / l'escalade enfin ça s'apprend mais enfin pourquoi pas quoi je vais passer oui mais / c'est aussi le tu m'as dit"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "impostor syndrome", "name": "Why he will not turn pro", "note": "He does not think he has the level, and going professional would take away what the balance gives him", "kw": ["Nicolas", "Post WR", "Explaining", "Office", "struggling"], "file": "A004C002_2606275W", "i": "02:18:35:22", "t": "c'est aussi le tu m'as dit / de cette pratique ? / Je pense que d'un côté ça enlèverait quand même le fait de devenir pro. Alors… la première chose, le fait de devenir pro, je pense que j'ai carrément pas les compétences. Euh… On en a parlé avant et il y a des gens qui font des choses tellement bien, qui… largement plus… qui sont largement plus compétents, meilleurs que moi pour faire ça. Donc ça c'est déjà la première chose. Et si euh… par un… un malheureux malentendu, je devais devenir pro, euh… ça m'enlèverait quand même une part de liberté. Euh… disons que… là je fais ce que je veux, euh… je fais les projets que je veux, euh… et même si j'ai la chance d'avoir des partenaires qui me laissent déjà faire entièrement ce que je veux comme projet, euh… et c'est hyper facile, euh… j'aurais cette peur en tout cas, j'aurais la peur de… de… de ne plus être totalement libre de… de… de pouvoir pratiquer comme je souhaite. / Donc finalement t'as besoin"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Some mornings you do not want to get up", "note": "Winter mornings when getting out to train is the last thing he wants, but mostly he goes for the pleasure of it", "kw": ["Nicolas", "Pre WR", "Training", "Running", "struggling"], "file": "A002C001_260527DC", "i": "02:21:31:24", "t": "Alors on pourrait penser que c'est trop maintenant. C'est vraiment une passion. Donc bien sûr il y a des matins où il pleut, en hiver, où ça fait pas trop... On a pas trop envie de se lever pour aller courir, pour aller s'entraîner. Mais la majeure partie du temps j'y vais quand même par plaisir. / Est-ce que tu peux répéter la question ? Donc travailler de 9 à 5 et s'entraîner 2 fois par jour, comment tu fais ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Two or three sessions a day around a full", "note": "Works eight to five and trains two or three times a day; it sounds like too much but it is a genuine passion", "kw": ["Nicolas", "Pre WR", "Training", "Running", "Office"], "file": "A002C001_260527DC", "i": "02:21:55:19", "t": "Alors travailler de 8h à 17h et s'entraîner 2 ou 3 fois par jour, on pourrait penser que c'est trop. Par contre c'est une vraie passion. J'aime aller courir, c'est ce qui me détend et c'est un vrai plaisir. Alors je dis pas qu'il y a pas de temps en temps des entraînements où c'est la rigueur qui doit prendre le dessus. Mais la majeure partie du temps j'y vais vraiment avoir plaisir. / Le stress du boulot et le stress du sport, c'est cumulé ou ça s'annule ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "A typical working day", "note": "Up around six for a first session, a run at midday, a longer trail outing in the evening, sometimes core work", "kw": ["Nicolas", "Pre WR", "Training", "Running", "Office"], "file": "A002C001_260527DC", "i": "02:22:24:18", "t": "Alors, ma journée type, elle est assez différente quand je travaille et quand j'ai du temps libre. Ma journée type, quand je travaille, ça va être me lever assez tôt, en général vers 6 heures, aller faire un premier entraînement, que ce soit en hypoxie, / une séance de musculation aussi, par exemple, à la salle. Le midi, souvent, c'est courir. Et si je ne vais pas courir, le midi, ça va être plus une sortie en trail, un peu plus longue le soir. / Des fois, il y a aussi une séance de gainage. Donc, souvent, ces deux séances, parfois une troisième, / rarement moins de deux séances par jour. / Et ma journée type,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "A day off starts even earlier", "note": "On free days he gets up earlier still to be in the mountains early and make the most of the day", "kw": ["Nicolas", "Pre WR", "Training", "Mountain", "Alpine"], "file": "A002C001_260527DC", "i": "02:23:02:07", "t": "Et ma journée type, / Et ma journée type, quand je ne travaille pas, ça va être me lever encore plus tôt. / J'aime vraiment me lever tôt, pouvoir être très tôt en montagne, profiter de la journée. Et où ça va être une sortie toute la journée où mon idéal, c'est de pouvoir rentrer vers 14 heures, manger un bon truc, faire une sieste. Et après, encore avoir la soirée pour partager des moments en famille ou avoir une activité plus détente."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Once to three times a week on the Saleve", "note": "How often he trains there depends on the phase of training; usually evenings after work rather than mornings", "kw": ["Nicolas", "Pre WR", "Training", "Salève", "Office"], "file": "A002C001_260527DC", "i": "02:23:34:02", "t": "Des fois une, des fois trois. Ça va dépendre souvent de la période de l'entraînement, s'il va faire beaucoup de volume ou pas. / Et c'est souvent le soir après le travail. J'y vais rarement le matin parce que le matin, / ça ne permet pas de faire une sortie assez longue. Je préfère qu'à ce moment-là aller courir le long du Rhône, près de chez moi. / Et le Salève, ça me permet vraiment de faire des sorties de 2, 3, 4, 5 heures que le soir après le travail. / À la fin du mois, si tu n'es pas à tes 30 000 mètres de D+, tu fais des escaliers le dernier jour pour rattraper, c'est vrai ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Hypoxia twice a week", "note": "Trains in hypoxia around twice a week and explains what it gives him, including a boost on mornings when motivation is low", "kw": ["Nicolas", "Pre WR", "Training", "Hypoxy", "Gym", "Explaining"], "file": "A002C001_260527DC", "i": "02:24:07:10", "t": "À la fin du mois, si tu n'es pas à tes 30 000 mètres de D+, tu fais des escaliers le dernier jour pour rattraper, c'est vrai ? / Tu parlais de questions hypoxiques. Question hypoxique, pourquoi, qu'est-ce que ça t'apporte ? / Alors, je m'entraîne en général deux fois par semaine en hypoxie. / Ça m'apporte plusieurs choses. Déjà, il y a souvent des groupes qui sont assez sympas, des gens qu'on revoit d'une fois sur l'autre. Et cet aspect, même dans un sport individuel, cet aspect d'entraînement collectif, c'est assez motivant. / Des fois, on se lève le matin, on a un peu moins envie. Donc, ça permet de se booster. On sait que les autres sont là. Et on se challenge de manière positive. / Et après, ça permet de faire des entraînements cardio. Même si on fait de la longue distance, surtout quand on veut faire des choses un peu plus rapides, on sait qu'on a quand même des horaires à tenir. / Et ça permet de garder cette vitesse. / Tu t'entraînes parfois la nuit tout seul. Pourquoi ? / Alors, je m'entraîne aussi"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Training at night on purpose", "note": "Trains at night because those are the conditions he will meet during the record", "kw": ["Nicolas", "Pre WR", "Training", "Preparation", "Explaining"], "file": "A002C001_260527DC", "i": "02:25:06:23", "t": "Alors, je m'entraîne aussi / Alors, je m'entraîne aussi la nuit parce que c'est des conditions qu'on va retrouver, que ce soit là pour le projet au monde. / Salut ! Merci. / Il faut être très fort. / Mais nous sommes en plus en demi-heure. Donc je pense que c'est OK. Non ? / La grande partie arrive maintenant. / Oui, ça va à l'arrière. / Après on peut le réagir."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Rest days, and getting hurt through enthusiasm", "note": "One or two rest days a week, cycling instead; the danger is that enthusiasm itself is how you end up injured", "kw": ["Nicolas", "Pre WR", "Training", "Tired", "struggling", "Explaining"], "file": "A002C001_260527DC", "i": "02:25:42:14", "t": "Après on peut le réagir. / Ah oui c'est clair Avec un jour par semaine ou deux où je me repose et puis je fais du vélo à la place J'en ai dit, / ouais, fait un quart de mois toujours Sinon le problème c'est que même si tu as l'enthousiasme tu vas te blesser / Ouais tu vas te blesser c'est ça Mais après des fois je fais juste plus du... je fais que de la zone 2 pour l'instant Enfin j'essaie un maximum de la zone 2 Et puis ça marche plutôt bien Il y a en fait la Givrin où je fais Givrin / Givrin sans cergue la dôle Et je redescends sur Givrin et ça c'est génial parce que tu as 1000 D plus Et tu fais... tu as quand même 25 kills / Mais dis moi une fois quand tu y vas un soir comme ça comme toi / Ouais avec plaisir, ça pourrait être cool Ouais, c'est vraiment un chouette endroit T'as déjà couru à la dôle ? / Ouais, ouais, ouais, ouais Il a 4, il a déménagé, là il était à Verrier Mais maintenant il est à Nyon donc il dit toujours Ouais, viens, je fais oh putain Givrin mais c'est un peu plus beau, qu'il se ferme ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "Every ultra runner gets injured", "note": "He has had injuries like every ultra runner, and often kept going through another discipline that asked less of the body", "kw": ["Nicolas", "Pre WR", "Training", "struggling", "Tired", "Running"], "file": "A002C001_260527DC", "i": "02:26:42:21", "t": "Ouais, ouais, ouais, ouais Il a 4, il a déménagé, là il était à Verrier Mais maintenant il est à Nyon donc il dit toujours Ouais, viens, je fais oh putain Givrin mais c'est un peu plus beau, qu'il se ferme ? / Alors j'ai eu des blessures dans ma carrière de coureur, je pense comme tout coureur, à mon avis en ultra je vois pas un seul coureur qui a pas eu de blessure euh... Et euh... / Souvent j'ai quand même réussi à avoir une autre pratique euh... Je pense justement à l'alpinisme avec des choses plus classiques... Où c'est peut-être moins exigeant pour le corps ou aller faire du vélo donc j'ai réussi toujours à compenser ça... Ça fait que ça a jamais été très frustrant pour moi euh... Les seules choses qui peuvent être frustrantes c'est qu'on a des choses plus classiques... On a des blessures euh... / Dans des compétitions euh... Parce que dans le cadre de compétitions euh... Bah on est là pour ça, on est là pour finir... On est là pour aller au bout, pour gagner... Ça va dépendre à chaque fois de son objectif euh... Et euh... C'est vraiment l'aboutissement euh... Alors que quand on"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "training", "name": "SwissPeaks 700, injured twice", "note": "Two years running he was injured after more than 500km on the same race", "kw": ["Nicolas", "Pre WR", "Running", "Training", "struggling", "Tired"], "file": "A002C001_260527DC", "i": "02:27:31:03", "t": "Dans des compétitions euh... Parce que dans le cadre de compétitions euh... Bah on est là pour ça, on est là pour finir... On est là pour aller au bout, pour gagner... Ça va dépendre à chaque fois de son objectif euh... Et euh... C'est vraiment l'aboutissement euh... Alors que quand on / euh... Il y a euh... La SwissPix qui est décidément... La SwissPix 700 euh... Qui est décidément une course qui ne me réussit pas euh... Euh... Deux années de suite euh... Après plus de 500 km euh... J'ai été blessé euh... / Donc forcément euh... C'est frustrant euh... On a fait plus de 500 km sur les 700... De pas aller au bout euh... C'est déjà frustrant euh... Peut-être encore plus l'année dernière parce euh... Euh... On... On était en train de de de de... euh... Batailler je dirais pour la victoire euh... Avec Sanglier euh... / Euh... Donc oui ça reste des... Des choses qui sont... Qui sont un peu frustrantes. Maintenant dans ces moments là je dirais que... J'arrive souvent quand même à voir le chemin que j'ai accompli pour y aller et qui est souvent un beau chemin euh... Euh... Qui me permet de passer assez rapidement au-dessus euh... Peut-être plus rapidement au-dessus que les gens qui m'entraient."}, {"kind": "iv", "speaker": "Kristine", "source": "Pre", "topic": "training", "name": "Kristine and the hypoxic gym", "note": "Alpinist who opened a hypoxic training gym called Keep Pushing, running sessions at altitude", "kw": ["Kristine", "Gym", "Hypoxy", "Training"], "file": "DSC_0094", "i": "02:28:25:10", "t": "Je m'appelle Christine Vaugondi, je suis Genevoise et je suis alpiniste. J'ai ouvert une salle de sport, plus particulièrement une salle hypoxie qui s'appelle Kipushing où on fait des entraînements à 3500 mètres d'altitude. Et Nico, je l'ai connu dans une ancienne salle hypoxie qui s'appelait Sport Altitude et ça a été un de mes premiers clients à Kipushing à l'ouverture en septembre."}, {"kind": "iv", "speaker": "Kristine", "source": "Pre", "topic": "training", "name": "Training smarter, not just harder", "note": "Hypoxic work lets athletes like Nicolas train differently and more intelligently, with less load on the joints", "kw": ["Kristine", "Gym", "Hypoxy", "Training", "Explaining"], "file": "DSC_0094", "i": "02:28:52:05", "t": "Alors, des athlètes comme Nicolas, ça lui permet de s'entraîner d'une façon un petit peu différente, certainement un petit peu plus intelligente, de mettre moins de charge sur ses articulations, de s'entraîner avec des intensités différentes. Et puis, on force l'adaptation du corps. Du coup, ça faudra lui demander si ça l'aide. Mais en général, les gens, ils sentent des effets à partir de un mois et demi, deux mois de séance régulière."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "training", "name": "Heavier than trail, lighter than ski touring", "note": "Six or seven kilos is heavy for trail but he does alpinism year round; still lighter than a ski kit", "kw": ["Nicolas", "Gear", "Training", "Running", "Alpine"], "file": "A003C004_2606111P", "i": "02:29:19:13", "t": "Et ce n'est pas lourd ? Pourtant c'est lourd ? / Oui c'est assez lourd. En trail on n'a pas souvent un poids comme ça. Après je fais de l'alpinisme toute l'année. Je pense que c'est moins lourd qu'avec le ski. / On a beaucoup plus de matériel, on a encore le DVA, on a encore les pelles, son, enfin plein de choses. / Plus d'habits aussi, des choses comme ça."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Ueli Steck changed what seemed possible", "note": "A precursor of extreme alpine style who shifted the perception of what was achievable, and who was humble and fragile in how he spoke about it", "kw": ["Nicolas", "Pre WR", "Alpine", "Scrambling", "Explaining"], "file": "A002C001_260527DC", "i": "02:31:43:11", "t": "une personne Ulich Tech c'est une personne qui m'a beaucoup inspiré parce que je trouve il a vraiment été précurseur dans ce style alpin poussé à l'extrême quand on voit la face nord de Laïger par exemple qu'il arrivait à gravir en un peu plus de 2h30 même aujourd'hui on voit ça ça paraît tellement démesuré et il y a des personnes comme ça qui ont je pense changé la perception qu'on pouvait avoir de ce qui était faisable ou non et pour moi il en fait vraiment partie et je le trouvais aussi à la fois très humble et très fragile dans sa manière d'exprimer les choses et c'est quelque chose que je trouvais aussi touchant"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Defining his style", "note": "His style depends on the discipline - alpinism in a fast alpine style, or pure trail; he does not think he is inventing anything", "kw": ["Nicolas", "Pre WR", "Alpine", "Running", "Explaining"], "file": "A002C001_260527DC", "i": "02:32:30:06", "t": "je définirais mon style ? Mon style, il va vraiment dépendre de l'activité que je pratique. Ça peut être de l'alpinisme, ça peut être du trail purement. Je pense que de qualifier ça d'alpinisme dans le style alpin, en allant assez vite, ça me paraît correspondre à ça pour la partie alpinisme, mais sinon c'est du trail. Je ne pense pas inventer un style. À mon avis, il y a eu d'autres précurseurs bien avant moi qui ont mis en avant ça. On peut parler du Lich Tech, de Kylian Jornet, on peut parler de"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Alpinism combined with ultra endurance", "note": "What is less visible is the combination of alpinism with ultra endurance, in the vein of projects like Kilian Jornet's", "kw": ["Nicolas", "Pre WR", "Alpine", "Running", "Mont Blanc"], "file": "A002C001_260527DC", "i": "02:33:11:01", "t": "je définirais mon style ? Mon style, il va vraiment dépendre de l'activité que je pratique. Ça peut être de l'alpinisme, ça peut être du trail purement. Je pense que de qualifier ça d'alpinisme dans le style alpin, en allant assez vite, ça me paraît correspondre à ça pour la partie alpinisme, mais sinon c'est du trail. Je ne pense pas inventer un style. À mon avis, il y a eu d'autres précurseurs bien avant moi qui ont mis en avant ça. On peut parler du Lich Tech, de Kylian Jornet, on peut parler de / où ça se voit moins, parce que ça combine vraiment cet aspect alpinisme avec l'aspect ultra-endurance. Maintenant, quand on regarde des projets comme Kylian Jornet a eu il y a deux ans, en faisant les 82, 4000 des Alpes, ou l'année dernière aux Etats-Unis, / c'est des choses qui se font déjà. C'est quelque chose qu'on voit moins, effectivement, de par la longueur et l'aspect alpin. / D'accord. Maintenant, parlons"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Florian taught him to think outside the frame", "note": "Much in the mountains is codified, and what Florian showed him is that there is room for your own way of doing it", "kw": ["Nicolas", "Pre WR", "Partner", "Alpine", "Inspiration", "Explaining"], "file": "A002C001_260527DC", "i": "02:33:40:21", "t": "D'accord. Maintenant, parlons / Qu'est-ce qu'il t'a appris concrètement ? Sur la montagne et sur toi-même potentiellement ? / Ce que Florian m'a appris c'est peut-être de penser en dehors du cadre Euh... C'est que euh... En montagne, il y a beaucoup de choses qui sont très cadrées, codifiées Euh... Et c'est que il y avait aussi de la place pour sa propre pratique, pour la manière dont il y avait envie de faire les choses Euh... Alors oui, forcément on va pouvoir discuter de sécurité, on va pouvoir discuter de plein de choses Euh... Mais ça veut pas dire pas se poser ces questions Ça veut juste dire, assumer qu'on peut avoir une vision différente euh... De sa pratique en montagne Euh... / Est-ce que tu peux penser à une ou deux personnes qui ont compté autant dans ton parcours ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Matteo Giacomo shaped his practice too", "note": "Another figure who changed how he approaches the mountain", "kw": ["Nicolas", "Pre WR", "Inspiration", "Alpine", "Partner", "Explaining"], "file": "A002C001_260527DC", "i": "02:34:30:03", "t": "Euh... Je pense que dans mon parcours il y a aussi Mathéo Jacquemou qui euh... Qui a sans doute eu un... Un impact euh... Aussi de par sa pratique de la montagne euh... Euh... / Au départ quand j'ai rencontré Mathéo, je l'ai pris comme guide euh... Et euh... / On allait faire de la cascade de glace Et il m'a aussi apporté un regard différent parce que j'allais souvent chercher des sommets avant, pour faire des alpinismes euh... Et là euh... Il m'a sans doute montré le fait qu'on pouvait aller chercher autre chose en montagne Euh... Le fait qu'on pouvait aller euh... Prendre du plaisir euh... On est allé grimper euh... En cascade dans des endroits où euh... Je n'aurais jamais pensé qu'on pouvait grimper en cascade et qui ont absolument rien de prestigieux On est juste allé prendre du plaisir euh... Et ça me laisse des supers souvenirs Et plusieurs fois avec Mathéo on fait des choses comme ça qui sont peut-être plus improbables euh... Qui euh... Ne feront jamais euh... Les grands titres des journaux mais euh... Tu vas juste en montagne parce que t'es à mettre en montagne Euh..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "Four itineraries, each with its own DNA", "note": "He prefers to call them four itineraries rather than four faces - each is emblematic and has its own character", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Alpine", "Explaining"], "file": "A002C001_260527DC", "i": "02:35:44:10", "t": "On allait faire de la cascade de glace Et il m'a aussi apporté un regard différent parce que j'allais souvent chercher des sommets avant, pour faire des alpinismes euh... Et là euh... Il m'a sans doute montré le fait qu'on pouvait aller chercher autre chose en montagne Euh... Le fait qu'on pouvait aller euh... Prendre du plaisir euh... On est allé grimper euh... En cascade dans des endroits où euh... Je n'aurais jamais pensé qu'on pouvait grimper en cascade et qui ont absolument rien de prestigieux On est juste allé prendre du plaisir euh... Et ça me laisse des supers souvenirs Et plusieurs fois avec Mathéo on fait des choses comme ça qui sont peut-être plus improbables euh... Qui euh... Ne feront jamais euh... Les grands titres des journaux mais euh... Tu vas juste en montagne parce que t'es à mettre en montagne Euh... / Alors euh... Euh... Je préfère parler de quatre itinéraires que de quatre faces euh... C'est quatre itinéraires qui sont pour moi euh... emblématiques. Ils ont chacun leur propre euh... ADN je dirais. On a forcément l'itinéraire des Grands Mulets euh... Qui est l'itinéraire où se font tous les records euh... Euh... Un aller-retour depuis Saint-Gervais c'est euh... Un dénivelé, le dénivelé le plus important je pense qu'on peut faire euh... Euh..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the sport", "name": "The royal traverse is his favourite", "note": "From Les Contamines over Bionnassay, his favourite summit on the massif", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Ridge", "Alpine", "Enjoying"], "file": "A002C001_260527DC", "i": "02:36:14:07", "t": "Alors euh... Euh... Je préfère parler de quatre itinéraires que de quatre faces euh... C'est quatre itinéraires qui sont pour moi euh... emblématiques. Ils ont chacun leur propre euh... ADN je dirais. On a forcément l'itinéraire des Grands Mulets euh... Qui est l'itinéraire où se font tous les records euh... Euh... Un aller-retour depuis Saint-Gervais c'est euh... Un dénivelé, le dénivelé le plus important je pense qu'on peut faire euh... Euh... / Euh... La voie que je préfère c'est la traversée royale en partant des comptes à mine pour aller jusqu'à l'église du Midi euh... Via l'église de Bionasset qui je pense est l'un des sommets préférés euh... Sur le Massif euh... / Et le versant italien euh... Ouais... Je pense que j'adore tellement la focaccia à Courmayeur euh... Euh... Fais bien sûr que je trouve quelque chose, un moyen d'aller en hire. / Pourquoi Unsupported qu'est-ce que ça change pour toi? / Je pense qu'on peut euh... / Ouais exact background, he could show Nicolas that sixty kilometres with three thousand metres on climbing ground is nothing like the same on trail", "kw": ["Florian", "Partner", "Alpine", "Running", "Training"], "file": "DSC_0169", "i": "02:37:56:11", "t": "parce que j'ai commencé à pouvoir vraiment progresser pour y arriver par moi-même. Il y a ça et il y a une autre phrase de Uli Stek qui disait qu'il voyait quelque chose, quand il parlait surtout de la face nord des Grandes Jorasses, qui a été vraiment la face qui est associée à Uli, où il disait que quand il la regardait avant, il disait, ah j'arriverai peut-être jamais à faire ça. Et au fur et à mesure il progressait, il disait, ah un jour sera peut-être possible. Et après un jour, il sera peut-être possible de la faire en moins de 4 heures et après en / Alors, je pense que ce qui a changé dans son approche à l'alpinisme, Nico, par rapport à notre rencontre, c'est que moi, j'ai un parcours qui est un petit peu atypique, dans le sens où, quand j'étais jeune, j'ai peu d'expérience en montagne, mais j'ai fait une première expédition tout de suite à 25 ans, qui était une expédition qui était très engagée au Pakistan, sur une voie très connue qui était... Voilà, qui était vraiment... Il y avait de l'altitude, il y avait de la technicité. Et en fait, ça, ça m'a tout de suite mis un petit peu dans le bain de ce qu'est la haute montagne. Et du coup, moi, j'ai toujours eu un peu cette culture où la montagne reste un élément, enfin, un univers assez dangereux, assez technique. Je n'avais pas cette approche montagne un peu douce, on va dire, ou calme, tout de suite un peu très engagée. Et du coup, en fait, Nico, en venant du trail, il avait plutôt cette approche... / Pas trop de conna"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "What fast and light actually means", "note": "One push from one point to another, often far apart, moving constantly, and cutting away the barriers as you go", "kw": ["Florian", "Alpine", "Running", "Explaining"], "file": "DSC_0169", "i": "02:39:55:20", "t": "Pas trop de connaissances des dangers objectifs. Ouais, ça va aller. En fait, la dynamique, elle est quand on est trailer, de faire, surtout dans de l'ultra, de faire 60 bornes avec 3000 2D+, c'est rien du tout. Sauf que le transfert à la haute montagne, eh bien, il ne se fait pas de manière aussi simple. Il faut avoir une culture montagne. Et cette culture montagne, moi, je pense que, du coup, j'ai essayé de lui apporter par rapport aux dangers objectifs, par rapport aussi à la technicité de l'itinéraire. Même si, en trail, il y a des courses qui sont quand même assez engagées, ça reste quand même des terrains... Voilà, des terrains roulants. Et moi, c'est vrai que j'aime beaucoup, depuis que je suis très petit, je tourne dans des endroits avec du scrambling, des choses un peu, voilà, plus grimpe, course à pied. Et voilà, moi, j'ai essayé d'amener cette approche-là de technicité, de mobilité rapide dans des terrains un peu scabreux, on va dire. Et voilà, je pense que c'est ce que j'ai pu lui apporter. Là où il a évolué un petit peu, c'est danger objectif et technicité dans des terrains à chabrois, on appelle ça. / bon, alors le principe, c'est vraiment si tu pars d'un point et t'arrives à un autre point, qui souvent est très loin, dans le sens en one push, comme on dit. Le but, c'est de réduire ce temps en fait que tu vas passer du cours montagne. Enfin, le réduire. Alors, attends, on va le refaire. / Alors, le principe du Fast & Light, c'est vraiment le côté one push, c'est"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "The Miage traverse, a shared memory", "note": "A route you would normally build up to over years, done in a single push - breaking mental and physical barriers", "kw": ["Florian", "Partner", "Alpine", "Ridge", "happy"], "file": "DSC_0169", "i": "02:41:10:19", "t": "Alors, le principe du Fast & Light, c'est vraiment le côté one push, c'est le côté mouvement en permanence. Et ce qui est vraiment intéressant, c'est qu'en fait, on fait sauter un petit peu les barrières. Ce qui peut normalement nous prendre 3-4 jours, en fait, on va essayer de le faire vraiment en une journée. Et moi, ce que j'aime beaucoup là-dedans, c'est ce côté voyage. C'est que tu as un côté vraiment où tu es en mouvement en permanence, et sur un mouvement qui va être ni ultra rapide, comme tu peux avoir sur des courses un peu courtes, mais ni non plus où tu prends ton temps, tu te poses, tu fais nuit en refuge. Voilà, c'est vraiment un truc où tu vas te laisser aller à courir. En fait, c'est ce qu'on peut retrouver en moyenne montagne, mais ça, tu le transposes en haute montagne, et du coup, tu arrives vraiment sur des choses qui sont hyper intenses en termes d'efforts, en termes de ressentis, en termes de vécu. Par exemple, avec Nico, / Par exemple, avec Nico, on avait un très très beau souvenir, c'est vraiment la traversée Millage Venacé Mont Blanc. Ça, c'est des courses, quand tu commences l'alpinisme, tu te dis, bah là, il me faut 4 jours quoi. Et puis après, au fur et à mesure de ton expérience, tout ça, si en plus tu aimes bien un peu courir, l'endurance, tu te dis, tiens, est-ce qu'on n'essaierait pas de le faire en one push ? Voilà, et du coup, tu pars sur une traversée, je sais pas, c'est comme si tu surprennes. Tu pars sur le volet tout ça, et voilà, tu fais "}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Linkages exist, but not quite this", "note": "There have been chains and records before, but the particular combination here has not been done", "kw": ["Florian", "Partner", "Alpine", "Mont Blanc", "Explaining"], "file": "DSC_0169", "i": "02:42:04:17", "t": "ça, ça s'est déjà fait ? / Alors, le projet que Nico et tente, est-ce qu'il s'est déjà fait ? / Alors, il y a eu pas mal de choses comme ça, des enchaînements, des records et tout. Après, je crois que le fait d'enchaîner comme ça les 4 FKT, je crois que non, c'est un peu une première. Et voilà. Après, il y a dû déjà avoir des choses un petit peu dans le même état d'esprit, tout ça. Mais comme ça, les 4 itinéraires sur la même montagne, je pense que c'est une première."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Two communities that used to be separate", "note": "Alpinists and trail runners were distinct worlds; now the transfer between them is clearly happening", "kw": ["Florian", "Partner", "Alpine", "Running", "Explaining"], "file": "DSC_0169", "i": "02:42:35:16", "t": "d'exceptionnel et tout ça. Maintenant, je pense qu'à l'heure actuelle, on voit vraiment ce transfert. Avant, il y avait vraiment la communauté alpiniste et la communauté trailer, tu vois. Et c'était très distinct. Et de plus en plus, on voit vraiment que ces deux communautés, elles se rejoignent. Et du coup, en fait, on a des projets en alpi, notamment sur du Fast & Light ou des FKT qui se rejoignent. Et du coup, on a vraiment des choses qui poussent de plus en plus. Donc, je pense qu'à l'heure actuelle, c'est dans la continuité. Ce projet, il est dans la continuité de ce qui se fait déjà un petit peu. Et voilà, il est dans l'air du temps un petit peu. C'est de combiner en fait des choses qui avant, tu allais mettre un mois pour faire. Maintenant, tu le fais en 3-4 jours. / Est-ce que ce genre de projet va changer la manière dont les gens voient le nom blanc ?"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the sport", "name": "Alpine skill and ultra endurance in one pot", "note": "Not something new - you take everything from alpinism and everything from ultra endurance and put the two together", "kw": ["Florian", "Partner", "Alpine", "Running", "Explaining"], "file": "DSC_0169", "i": "02:43:26:15", "t": "Est-ce que ce genre de projet va changer la manière dont les gens voient le nom blanc ? / Alors, est-ce que ce projet des quatre faces, c'est du trail, de l'alpinisme ou quelque chose de nouveau ? Alors, ce n'est pas quelque chose de nouveau parce que c'est quelque chose qui se fait depuis pas mal d'années. Après, c'est quelque chose qui est mis en avant ces derniers temps. Est-ce que c'est du trail ou de l'alpinisme ? Bah, c'est du trail alpinisme. / C'est vraiment cette nouvelle... Voilà, c'est ça. On met les aptitudes et nos connaissances du trail, on les transpose dans l'alpinisme et puis on fait un peu cette marmite-là et en avant quoi. C'est vraiment les aptitudes de l'alpinisme, toute l'expérience de l'alpinisme, toute l'expérience du trail et on met ces deux choses-là. Les capacités physiques, les capacités techniques et on met. Et après, ce qui est vraiment intéressant aussi, moi je trouve, de ce que j'ai pu observer avec des gens comme Nico qui sont des trailers très très forts et puis j'ai eu la chance aussi de tourner avec des alpinistes très très forts, les capacités physiques, en fait, souvent elles sont impressionnantes dans les deux domaines. C'est-à-dire que, avec de la vitesse et très peu de poids, un trailer hyper impressionnant. On va avoir beaucoup de rythme, beaucoup de vitesse et du coup une capacité à enchaîner les itinéraires, à faire de la distance. Par contre, s'il y a du poids, de la lourdeur, / là les capacités physiques elles s'écroulent parce qu"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the sport", "name": "No transport during the chain", "note": "Refuses any transport across the whole linkage - sleeping at the Cosmiques hut and climbing back up in the morning", "kw": ["Nicolas", "Explaining", "Mountain Hut", "Preparation"], "file": "A004C046_260613H5", "i": "02:45:18:18", "t": "là les capacités physiques elles s'écroulent parce qu'ils n'ont pas l'habitude de porter des gros sacs, de porter du matos, de porter, ça peut être des caméras et tout, comme les vidéastes et tout ça. Alors que les alpinistes, tu leur mets de la vitesse, tu les mets light, ils ne vont pas avancer vite, c'est des escargots. Par contre, tu leur mets du poids ou un petit rythme lent régulier, ils sont increvables. Et du coup, en fait, c'est super chouette de voir ces deux mondes qui cohabitent, ces deux potentiels physiques, tu vois, qui sont complètement différents. Tu les mets comme ça et une fois que tu as compris ce que Nico a fait, il a compris que, ah ouais, c'est pas tout à fait les mêmes rythmes, c'est pas tout à fait le même poids, boum, on combine tout ça, on va super loin et du coup on amène sur des pratiques un peu nouvelles, du trail alpinisme. / cosmique potentiellement ? / Alors, exactement. Je ne souhaite vraiment pas utiliser de moyens de transport durant cet enchaînement. Donc, l'idée, ça va être de dormir au cosmique et de repartir le matin, juste de remonter les cosmiques à l'aiguille pour attaquer le FKT et l'aiguille du midi, Mont Blanc et l'aiguille du midi. / Et après, c'est"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the sport", "name": "On the trail sections he is set free", "note": "Two disciplines in one project; coming off the alpine sections onto trail releases the pressure", "kw": ["Nicolas", "Running", "Alpine", "Explaining", "Enjoying"], "file": "A004C047_260613OO", "i": "02:45:42:07", "t": "Et après, c'est / Enfin, il y a vraiment 2 choses, il y a toutes les parties alpinistes, mais les parties trail. / Et c'est vrai que... Quand je passe sur des parties... Quand j'ai fini les sections alpines et que je passe sur des parties trail, là, spécialement, je suis... Libéré. Parce qu'il y a toute la pression qui retombe, il y a... J'ai plus aucun danger, en soi. / Alors que sur les parties alpines, je suis obligé de rester quand même beaucoup plus longtemps, en fait. / C'est vrai que tu viens de la base,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the sport", "name": "From trail into alpinism", "note": "Rooted in trail running, moving further into alpinism and the combination of the two", "kw": ["Nicolas", "Running", "Alpine", "Training", "Explaining"], "file": "A004C047_260613OO", "i": "02:46:09:18", "t": "C'est vrai que tu viens de la base, / même beaucoup plus longtemps, en fait. / C'est vrai que tu viens de la base, du monde du trail, finalement, et tu t'aventures de plus en plus dans ce côté alpinisme, et puis de combiner, ces deux pratiques. Donc finalement, ça me paraît assez logique, finalement, que le moment de relâchement, c'est quand tu reviens dans ta zone de confort, finalement. Est-ce que, d'une certaine manière, ça repousse tes limites plus que ce que tu ferais d'habitude ? / Ah, clairement, oui. Oui, clairement,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the sport", "name": "Why combine trail and alpinism", "note": "Likes the technical side of alpinism and the very long endurance side of trail running, and wanted both in one project", "kw": ["Nicolas", "Post WR", "Alpine", "Running", "Explaining"], "file": "A003C438_26062775", "i": "02:46:34:23", "t": "Ah, clairement, oui. Oui, clairement, / alors j'aime combiner les deux éléments le trail running et l'alpinisme parce que euh j'aime vraiment cette partie technique de l'alpinisme et cette partie euh endurance très longue du trail running euh j'aime pas trop les courses courtes ou les choses trop intenses et donc euh là le projet est combiné vraiment tout on était vraiment sur de l'ultra alpinisme / alors tu préfères euh moi le le le speed ou de endurance euh / euh je préfère vraiment l'endurance"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the sport", "name": "Three or four days, done in one", "note": "The royal traverse is normally a three or four day outing, and being able to consider it as a day gives a kind of freedom", "kw": ["Nicolas", "Post WR", "Mont Blanc", "Alpine", "Explaining", "Running"], "file": "A003C438_26062775", "i": "02:47:04:10", "t": "euh je préfère vraiment l'endurance / impressionnant, je pense. / C'est vrai que la voie royale, normalement, la traversée qui va décontaminer jusqu'à l'aiguille du midi, c'est une traversée qui se fait en 3 ou 4 jours. / Et je trouve ça vraiment génial de pouvoir faire ça à la journée, de pouvoir envisager des projets comme ça à la journée. Ça donne une liberté. Il faut se dire que quelqu'un qui veut faire traversée royale, normalement, il doit réserver les refuges, il doit avoir le créneau météo, il y a plein de logistique à mettre en place. Alors que là, c'est ce qui m'est arrivé l'année dernière, où la veille, je dis à un copain, allez, on va faire la traversée royale et au final, on est parti le soir à minuit, on fait la traversée royale et on rentre le soir à la maison. Donc cette possibilité d'aller rapidement sur des terrains, des terrains un peu alpins, de la technique, c'est pour moi une liberté, c'est quelque chose de phénomène. / Et le quatrième / Donc ce que j'aime bien faire, c'est d'abord pour voir tout ce qui est matériel plutôt technique. Donc les chaussures, les crampons, une"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Technical kit gets checked first", "note": "His routine: always lay out the technical gear before anything else", "kw": ["Nicolas", "Gear", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "02:50:02:06", "t": "Donc ce que j'aime bien faire, c'est d'abord pour voir tout ce qui est matériel plutôt technique. Donc les chaussures, les crampons, une"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Extra weight for big mittens", "note": "Expects a lot of wind and his hands get cold, so he allows the extra weight of heavy mittens", "kw": ["Nicolas", "Gear", "Wind", "Conditions", "Explaining"], "file": "A002C287_260611IW", "i": "02:50:13:18", "t": "Donc ce que j'aime bien faire, c'est d'abord pour voir tout ce qui est matériel plutôt technique. Donc les chaussures, les crampons, une / Ensuite au niveau des vêtements. / J'ai prévu pas mal de vent et j'ai souvent les mains qui ont bien froid, donc je m'accorde un petit peu de poids supplémentaire avec des grosses mouffles au cas où. Je vais faire un petit peu de poids pour que je cale bien au fond"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Trainers or mountaineering boots", "note": "Tested crampons on trainers; carries both so he can run the rolling sections and stay secure on technical ground", "kw": ["Nicolas", "Gear", "Shoes", "Running", "Explaining"], "file": "A002C287_260611IW", "i": "02:50:33:02", "t": "J'ai prévu pas mal de vent et j'ai souvent les mains qui ont bien froid, donc je m'accorde un petit peu de poids supplémentaire avec des grosses mouffles au cas où. Je vais faire un petit peu de poids pour que je cale bien au fond / J'aurais pu partir en basket et mettre les crampons sur les baskets, mais j'ai fait quelques tests, ça ne tient pas forcément bien. Au final, je ne gagne pas énormément de temps. Donc je préfère partir avec quelque chose qui tienne vraiment bien aux pieds. Pour les parties roulantes, les baskets vont permettre de bien courir. Pour les chaussures d'alphi, ensuite pour les portions vraiment techniques."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Crampons had torn the trousers", "note": "Lighter gloves by default with mittens in reserve; the crampons had already put holes in the trousers, repaired that week", "kw": ["Nicolas", "Gear", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "02:50:58:07", "t": "une paire de gants un peu plus légère, que je prendrais a priori tout le temps, et si il commence à faire vraiment trop froid les moufles. / Donc justement, vraiment bien léger. J'ai celui qui vous voit en plus. / Je lui ai fait quelques trous le week-end dernier, donc je l'ai fait rafistoler cette semaine. / Les crampons, on l'avait déjà bien abîmé."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Tracker bagged so he remembers it", "note": "The GPS tracker goes in its own bag so he does not forget to switch it on", "kw": ["Nicolas", "Gear", "Watch", "Preparation"], "file": "A002C287_260611IW", "i": "02:51:29:17", "t": "Ça va, ça va. Le tracker GPS, alors que je le mets dans le sachet, comme ça, je pense bien l'allumer avant de le mettre dans le sac demain. / Des lunettes de soleil."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Undecided about the helmet", "note": "Always hesitant on pure glacier routes; he will save the helmet for rocky ground and carry it on the Gouter ridge", "kw": ["Nicolas", "Gear", "Glacier", "Ridge", "Explaining"], "file": "A002C287_260611IW", "i": "02:51:45:12", "t": "ensuite le casque toujours un peu hésitant à le prendre sur des parcours vraiment glaciers comme ça on n'a pas forcément besoin je ne suis pas encore tout à fait décidé juste à savoir si je prends le casque je mets la frontale dessus je pense que je garderai plutôt le casque pour les sections uniquement rochers ça devrait aller pour demain et je le mettrai déjà pour l'arrêt du bouté à partir de samedi ça je le laisse là encore"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Pack on the back before it is finished", "note": "Wears the loaded pack to check nothing rubs; he has set off before and regretted it within a few hundred metres", "kw": ["Nicolas", "Gear", "Preparation", "Explaining"], "file": "A003C001_260611C3", "i": "02:52:20:24", "t": ""}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "gear", "name": "Room left in the bag is the test", "note": "As long as there is still space in the pack he knows he has not over-packed", "kw": ["Nicolas", "Gear", "Preparation", "Training", "Explaining"], "file": "A003C004_2606111P", "i": "02:52:43:08", "t": "j'accorde la place dans le sac. C'est toujours un bon critère. Je peux encore ouvrir ça et rajouter du volume en haut. Donc tant que j'accorde la place dans le sac, c'est que je n'ai pas exagéré. / Quand je suis parti le week-end dernier pour m'entraîner, j'avais encore un peu plus de choses, j'avais besoin d'un peu plus de matériel. Il était un peu plus plein. Mais là si je dois encore rajouter par exemple"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Two bottles, water and energy drink", "note": "Two soft flasks with water and energy drink, maybe a third, plus half a litre before he even starts", "kw": ["Nicolas", "food", "Gear", "Preparation"], "file": "A002C287_260611IW", "i": "02:55:07:21", "t": "donc là j'ai déjà préparé deux gourdes avec de l'eau et une boisson énergétique je pense que je vais peut-être en prendre une troisième je boirai déjà un demi litre avant le moment de poser les baskets ça me laissera pas un litre pour le sommeil et la remise ça sera parfait comme ça ça"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Which Haribo for tomorrow", "note": "The genuinely important question of the evening: which sour Haribo goes in the pack", "kw": ["Nicolas", "food", "Preparation", "laughing", "happy"], "file": "A002C287_260611IW", "i": "02:55:37:05", "t": "sera parfait comme ça ça sera parfait comme ça ensuite / question très stratégique c'est quelle gamme de Haribo je vais prendre donc les Orangina qui piquent les Pêches qui piquent et les Propos qui piquent donc on va miser sur les Orangina qui piquent pour demain ça sera parfait"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Three gels because the day is long", "note": "Adds three gels, coffee flavoured, on the assumption the day will run long", "kw": ["Nicolas", "food", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "02:56:05:05", "t": "question très stratégique c'est quelle gamme de Haribo je vais prendre donc les Orangina qui piquent les Pêches qui piquent et les Propos qui piquent donc on va miser sur les Orangina qui piquent pour demain ça sera parfait / une petite gaufre une petite gaufre une petite gaufre une gaufre une gaufre une gaufre on va quand même prendre quelques gels parce que la journée va être longue donc je pense trois gels comme ça et / caféine ça devrait suffire pour la journée un"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Water from a river is allowed", "note": "If he passes a stream he will drink from it - taking water is the one thing permitted while self-supported", "kw": ["Nicolas", "food", "Explaining", "Mountain"], "file": "A003C001_260611C3", "i": "02:56:34:04", "t": "caféine ça devrait suffire pour la journée un"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "Buying water would break self", "note": "Even buying water in a cafe would not be allowed under self-support; the rules are strict on it", "kw": ["Nicolas", "food", "Explaining", "Preparation"], "file": "A004C047_260613OO", "i": "02:57:00:22", "t": "Mais même, prendre de l'eau, acheter de l'eau dans un café, ce ne sera pas autorisé, ça passe en self-supported. Donc vraiment, ils sont assez exigeants là-dessus. Et c'est pour ça que même, puisqu'il y a tournage, on ne peut pas tourner, il ne peut pas y avoir d'équipe de tournage avec, c'est considéré comme un support. Donc, pendant les ascensions, j'ai tout filmé à la GoPro pour enregistrer quelques images."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "food/fuel", "name": "A litre and a half, hoping for a river", "note": "Carrying 1.5 litres and hoping to find a river on the way to top up to two", "kw": ["Nicolas", "food", "Mountain", "Explaining"], "file": "A004C070_260613YW", "i": "02:57:29:21", "t": "Et de l'eau là j'ai pris un litre et demi, j'ai pris une boutée de vie en plus. J'espère trouver une rivière sur la route mais pas en altitude déjà. Comme ça je peux remplir et avoir deux lits pour le reste de la journée. C'est pas mal."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "You see the Saleve from everywhere", "note": "Living in Geneva the Saleve is always in view; a place he has spent a great deal of time", "kw": ["Nicolas", "Pre WR", "Salève", "Town", "Mountain"], "file": "A002C001_260527DC", "i": "02:59:49:12", "t": "Alors à quel moment j'ai vu pour la première fois une vraie montagne ? En habitant à Genève, on voit le Salève de partout donc forcément c'est un lieu qui est très particulier pour moi, c'est un lieu où je viens m'entraîner, c'est un lieu... / Le dernier était faible, c'est la fin de journée aussi. / Je sais qu'il n'est pas... Je crois pas hein ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "The massif is part of his life", "note": "Not just a mountain but a massif, and a permanent part of his life - he trains there several times a week", "kw": ["Nicolas", "Pre WR", "Mountain", "Training", "Alpine"], "file": "A002C001_260527DC", "i": "03:00:24:22", "t": "Je sais qu'il n'est pas... Je crois pas hein ? / que c'est le Salève depuis Genève on voit partout cette montagne et c'est vraiment un massif qui fait partie de ma vie en permanence, c'est là que je viens souvent m'entraîner plusieurs fois par semaine c'est là qu'on se rencontre avec nos amis on fait plein d'activités différentes donc oui si je dois penser une vraie montagne c'est celle-ci et à côté"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "The landscapes of the record", "note": "What he will cross during the record: trail paths first, then long glacier sections and high alpine ground", "kw": ["Nicolas", "Pre WR", "Glacier", "Mont Blanc", "Alpine", "Mountain"], "file": "A002C001_260527DC", "i": "03:00:45:17", "t": "que c'est le Salève depuis Genève on voit partout cette montagne et c'est vraiment un massif qui fait partie de ma vie en permanence, c'est là que je viens souvent m'entraîner plusieurs fois par semaine c'est là qu'on se rencontre avec nos amis on fait plein d'activités différentes donc oui si je dois penser une vraie montagne c'est celle-ci et à côté / alors ce que je vais rencontrer comme paysage durant le record en Mont-Blanc ça va être assez varié ça sera d'abord des sentiers de trail ensuite il y aura beaucoup de portions glaciaires où ça reste des grandes détendues de neige qui cachent pas mal de dangers quand même avec des crevasses qui ne sont pas visibles ça peut être les parties que j'affectionne le moins parce que ça laisse beaucoup de place à l'incertitude et on ne peut pas trop prévoir sur ces sections-là et une des parties qui me réjouit le plus ça va être l'aiguille et l'arrête de Bionasset où il va y avoir des sections d'escalade et d'arrête mixte avec du rocher où je trouve que c'est les portions les plus esthétiques / tu te sens vivant quand tu cours ? plus vivant qu'autrement ? / je ne pourrais pas dire"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "Why the Saleve is his mountain", "note": "A mountain with a lot of history and many faces - gentle family paths alongside far harder trails", "kw": ["Nicolas", "Pre WR", "Salève", "Mountain", "Training"], "file": "A002C001_260527DC", "i": "03:01:38:12", "t": "je ne pourrais pas dire / Tu mentionnes souvent le Salève et on y est d'ailleurs en ce moment. Pourquoi c'est ta montagne ou qu'est-ce qu'elle représente pour toi ? / Alors, le Salève, déjà, c'est une montagne qui a beaucoup d'histoires. Il y a beaucoup de grands alpinistes qui sont passés ici. Et c'est vraiment une montagne de multiples facettes. Il y a aussi bien des sentiers très familiaux où on peut aller se promener, où on peut aller faire un autre moment très cool, on dira. Et il y a aussi des sentiers hyper techniques où le moindre pas de côté est interdit parce que ça pourrait être une chute qui pourrait être fatale. Et on arrive vraiment à mixer tout ça pour, en fonction de son humeur, en fonction du jour, en fonction de ce qu'on a envie de faire, trouver la pratique qui nous correspond. / Combien de fois par semaine tu y montes et à quelle heure ? / Alors, je vais au Salève en général deux fois par semaine. Des fois"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "places", "name": "Chamonix, the cradle of alpinism", "note": "Loves walking the streets of Chamonix after a day out in the massif; the Grand Nesle rock and the massif itself inspire him", "kw": ["Nicolas", "Pre WR", "Chamonix", "Town", "Alpine", "Mont Blanc", "Enjoying"], "file": "A002C001_260527DC", "i": "03:02:32:07", "t": "Alors, je vais au Salève en général deux fois par semaine. Des fois / euh... C'est le berceau de l'alpinisme pour moi. J'adore me trimballer dans les rues de Chamonix euh... Après avoir fait euh... Une sortie en Alpi euh... Euh... Ou à Mont-Blanc à la journée. Et euh... Retrouver à la fois ces touristes ou à l'aiguille du midi qui sont en train de manger des glaces, des gens avec des cordes sur le dos euh... D'autres avec des baskets de trail euh... Des gens qui arrivent, des gens qui partent. C'est une ambiance, une aura particulière. Donc euh... Oui... Chamonix est le Massif du Mont-Blanc. Euh... / Euh... Inspire des émotions que je trouve euh... Il est pareil. / Pourquoi les quatre faces et pourquoi pas une seule ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "places", "name": "Sunrises are what he would keep", "note": "If one thing had to stay it would be the sunrises, in ultra trail after a night out and in the high mountains", "kw": ["Nicolas", "Sunrise", "Mountain", "Enjoying", "happy"], "file": "A002C063_260418WT", "i": "03:03:12:14", "t": "Je pense que s'il y a une chose que je dois garder, c'est vraiment les levées de soleil. Que ce soit en ultra-trail où on a un lever de soleil après une nuit en général, on a pour eux toute la nuit. C'est comme une nouvelle vie presque on pourrait dire. Et en alpinisme aussi où on a quand même cet aspect très austère de la montagne avec des bruits de serra, de rochers qui tombent la nuit. Ça peut être assez impressionnant quand le jour se laisse, c'est une libération. / Peut-être que tu peux décrire ça en une sentence, que le rêve du soleil c'est comme une nouvelle vie. Je trouve ça que c'est très bien. / Le lever de soleil en montagne c'est comme une nouvelle vie, c'est vraiment comme une libération. / Et peut-être aussi quand tu es en montagne, en limite peut-être ? Et qu'est-ce qu'il y a dans ton head ? Il y a des choses où il est nul dans la tête ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "places", "name": "Up the Saleve every other day", "note": "He climbs it every two days and was still surprised to find the vegetation suddenly green; the mountain changes all year", "kw": ["Nicolas", "Salève", "Training", "Mountain", "Weather"], "file": "A002C063_260418WT", "i": "03:04:21:02", "t": "Et peut-être aussi quand tu es en montagne, en limite peut-être ? Et qu'est-ce qu'il y a dans ton head ? Il y a des choses où il est nul dans la tête ? / C'est complètement différent. Là, je monte tous les deux jours au Salève. Et hier, je me suis surpris parce que je voyais la végétation qui était verte. Et c'est tout nouveau. Et je voyais des fleurs. Et chaque fois, il y a des choses différentes. Et la montagne, elle change toute l'année. D'un coup, on va avoir de la neige, de la glace. Après, il y a grand soleil, il y a chaud. Et ça, ça change vraiment tout le temps. / Et en haute montagne, c'est la même chose. On peut avoir un passage où on ne peut pas passer. Et quelques jours après, il aura neigé, il y aura des conditions et on va pouvoir y aller. C'est fascinant ce changement-là."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "Place du Triangle de l'Amitie", "note": "The symbolic square in Chamonix for trail running an
