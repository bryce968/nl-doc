e to make up", "kw": ["Running", "Monologue", "GoPro"], "file": "GX010014", "i": "01:31:02:01", "o": "01:31:02:02", "d": "", "t": "Bon ça grimpe bien, les sensations sont super bonnes pour l'instant on sentait rien en forêt je partis assez vite, ça va vraiment bien, je fais pour l'instant ralentir un tout petit peu pour éviter de le payer un peu plus tard ou les autres jours, il aura bien le temps de rattraper ça si ça continue, allez aussi bien et autrement je serais content de ne mettre pas de misé"}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Changing into mountaineering - passed the old cable car station, changing into mountaineering gear and use it as 5 min break", "kw": ["Monologue", "Gear", "GoPro"], "file": "GX010015", "i": "01:31:30:02", "o": "01:31:30:03", "d": "", "t": "Bon ça grimpe bien, les sensations sont super bonnes pour l'instant on sentait rien en forêt je partis assez vite, ça va vraiment bien, je fais pour l'instant ralentir un tout petit peu pour éviter de le payer un peu plus tard ou les autres jours, il aura bien le temps de rattraper ça si ça continue, allez aussi bien et autrement je serais content de ne mettre pas de misé / Ok, je viens de passer il y a 10 minutes, un quart d'heure, ancien garde téléphérique et là maintenant ça va être passage en chaussures d'alpi, je vais arriver, je fais deux heures que je suis parti exactement et je vais arriver à la jonction. Donc on va s'équiper, ça fera un petit break de 5 minutes en même temps."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "SEQUENCE", "note": "Camera on the ground, changing shoes", "kw": ["Gear"], "file": "", "i": "01:31:39:16", "o": "01:32:48:19", "d": "1:09", "t": "Ok, je viens de passer il y a 10 minutes, un quart d'heure, ancien garde téléphérique et là maintenant ça va être passage en chaussures d'alpi, je vais arriver, je fais deux heures que je suis parti exactement et je vais arriver à la jonction. Donc on va s'équiper, ça fera un petit break de 5 minutes en même temps."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Timer for 5 minute break", "kw": ["GoPro", "Monologue"], "file": "GX010015", "i": "01:32:52:14", "o": "01:32:52:15", "d": "", "t": "On va repart dans 5 minutes. / Ok, prêt. J'ai mis les 10 minutes et c'est reparti. On va traverser la jonction. À tout à l'heure. / Ok, je suis au niveau du refuge des grands mulets, je continue. La progression n'est pas géniale là."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Traverse La Jonction - just took a 10 minute break", "kw": ["GoPro", "Monologue", "Watch"], "file": "GX010016", "i": "01:33:00:00", "o": "01:33:00:01", "d": "", "t": "Ok, prêt. J'ai mis les 10 minutes et c'est reparti. On va traverser la jonction. À tout à l'heure. / Ok, je suis au niveau du refuge des grands mulets, je continue. La progression n'est pas géniale là. / La neige, il n'y a pas un super rejet. Pas forcément de traces partout."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Grand Mulets hut - Progress isn't good", "kw": ["Monologue", "struggling", "GoPro"], "file": "GX010017", "i": "01:33:08:22", "o": "01:33:08:23", "d": "", "t": "Ok, prêt. J'ai mis les 10 minutes et c'est reparti. On va traverser la jonction. À tout à l'heure. / Ok, je suis au niveau du refuge des grands mulets, je continue. La progression n'est pas géniale là. / La neige, il n'y a pas un super rejet. Pas forcément de traces partout. / Et voilà. Donc ça avance simplement vite là. Je prends mon mal en patience. J'espère que ça sera mieux au-dessus."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Snow conditions - Snow not good, not seeing any tracks", "kw": ["Monologue", "struggling", "Conditions", "GoPro"], "file": "GX010017", "i": "01:33:17:18", "o": "01:33:37:19", "d": "0:20", "t": "La neige, il n'y a pas un super rejet. Pas forcément de traces partout. / Et voilà. Donc ça avance simplement vite là. Je prends mon mal en patience. J'espère que ça sera mieux au-dessus. / On va voir."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Struggling conditions - hard since hut, no tracks, bad snow conditions, steep and feet slipping, not ideal", "kw": ["Monologue", "struggling", "Conditions", "GoPro"], "file": "GX010018", "i": "01:33:43:08", "o": "01:33:43:09", "d": "", "t": "Et voilà. Donc ça avance simplement vite là. Je prends mon mal en patience. J'espère que ça sera mieux au-dessus. / On va voir. / Bon depuis le refuge, là ça devient vraiment dur, il y a presque plus de traces, là ça va encore, il y a un major partie du temps, la neige n'importe pas, neige qui n'est pas existante, donc jusqu'en c'est un peu raide, la pied recule et là il commence à avoir beaucoup de vent, les conditions sont de loin, pas idéales."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Conditions - Not going great, terrible conditions, a lot of wind visibility down to 10 metres", "kw": ["Monologue", "struggling", "Conditions", "GoPro"], "file": "GX010019", "i": "01:34:27:17", "o": "01:34:47:18", "d": "0:20", "t": "Bon, ça va pas génial, les conditions sont horribles. / Il y a une petite accalmie mais il y a de plus en plus de vent. / On y voit plus à 10 mètres. / Il y a 10 mètres ici mais pas beaucoup plus loin."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "really rough", "kw": ["Monologue", "struggling", "GoPro"], "file": "GX010019", "i": "01:34:54:14", "o": "01:34:54:15", "d": "", "t": "Il y a 10 mètres ici mais pas beaucoup plus loin. / Il y a des sections qui s'abrasent dans la neige jusqu'au genou. / C'est compliqué. / Je m'épuise, on ne voit pas de traces, je ne sais pas. / C'est vraiment galère. / J'essaye d'avancer de troule. On va voir ce que ça donne. / Il y a personne qui est passé ce matin encore donc je ne l'aide pas."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "No one has passed - makes it even more difficult", "kw": ["Monologue", "struggling", "GoPro"], "file": "GX010019", "i": "01:35:12:00", "o": "01:35:12:01", "d": "", "t": "C'est vraiment galère. / J'essaye d'avancer de troule. On va voir ce que ça donne. / Il y a personne qui est passé ce matin encore donc je ne l'aide pas. / Ok, je suis allé monter par là, ça se dégage un tout petit peu et de passer là sur le glacier. J'ai aussi trouvé un peu mon chemin, des traces de ski, c'était pas super mais ça porte un peu mieux. Au dessus j'ai l'impression que c'est bien bouché, on va voir."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Clearing conditions - found some tracks, better snow, a lot of energy used, trying to preserve energy", "kw": ["Monologue", "Conditions", "GoPro"], "file": "GX010020", "i": "01:35:22:07", "o": "01:36:11:03", "d": "0:48", "t": "Ok, je suis allé monter par là, ça se dégage un tout petit peu et de passer là sur le glacier. J'ai aussi trouvé un peu mon chemin, des traces de ski, c'était pas super mais ça porte un peu mieux. Au dessus j'ai l'impression que c'est bien bouché, on va voir. / Ça m'a demandé énormément d'énergie, beaucoup plus que ce que j'aurais mis comme énergie si les conditions avaient été bonnes, pas bien de faire la trace. / Donc voilà, je pense que je n'ai pas accéléré pour essayer de retraper le temps perdu. Il y a encore beaucoup en perspective, le but c'est de se préserver aussi. / Je pense que la tempête ici, le vent, le froid, la visibilité, tu vas essayer de monter un drapeau petit peu mais ça devient vraiment dangereux. Je vais devoir prendre une décision, je pense bientôt que du froid là."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Storm - the wind, the cold, the visibility, it's getting really dangerous. Have to make a decision", "kw": ["Monologue", "Wind", "struggling", "GoPro", "Conditions"], "file": "GX010021", "i": "01:36:18:18", "o": "01:36:35:07", "d": "0:16", "t": "Je pense que la tempête ici, le vent, le froid, la visibilité, tu vas essayer de monter un drapeau petit peu mais ça devient vraiment dangereux. Je vais devoir prendre une décision, je pense bientôt que du froid là."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Summit - Not many people went up", "kw": ["Monologue", "Mont Blanc", "Summit", "struggling", "Conditions", "GoPro"], "file": "GX010022", "i": "01:36:41:06", "o": "01:36:41:07", "d": "", "t": "Voilà, saumé, avant que ton dire n'est pas grand monde, j'ai pas trop traité les noms de pluie, c'est horrible, j'ai peur que je vais pas arriver là haut. / Bon, zone de glaciers avec un gros crevasse."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Clear distress and tiredness - looks really defeated and tired", "kw": ["Tired", "Monologue", "Summit", "Mont Blanc", "struggling", "GoPro"], "file": "GX010022", "i": "01:36:58:12", "o": "01:36:58:13", "d": "", "t": "Voilà, saumé, avant que ton dire n'est pas grand monde, j'ai pas trop traité les noms de pluie, c'est horrible, j'ai peur que je vais pas arriver là haut. / Bon, zone de glaciers avec un gros crevasse. / Passer sur le pivon de neige là, c'était pas spécialement rassurant."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Glacier with crevasse - dangerous zone", "kw": ["Monologue", "Dangerous", "Glacier", "GoPro"], "file": "GX010023", "i": "01:37:07:07", "o": "01:37:07:08", "d": "", "t": "Bon, zone de glaciers avec un gros crevasse. / Passer sur le pivon de neige là, c'était pas spécialement rassurant. / Et j'aimerais bien déjeler un jour parce que c'est pas très agréable. / Tu vas arriver au plateau, on va aller sur la gendarme Chamonix. Voilà Barde, on va voir qui vous quand même. Je trouve que je suis vraiment cuit. Je suis passé les trois cas de la journée à brasser dans la neige. Je pensais que c'était la journée la plus cool aujourd'hui. Mais en tout cas physiquement je suis rincé."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Plateau arrival - really tired, because of route through snow, expected it to be easier, physically wiped out", "kw": ["Monologue", "struggling", "GoPro"], "file": "GX010024", "i": "01:37:29:14", "o": "01:37:29:15", "d": "", "t": "Et j'aimerais bien déjeler un jour parce que c'est pas très agréable. / Tu vas arriver au plateau, on va aller sur la gendarme Chamonix. Voilà Barde, on va voir qui vous quand même. Je trouve que je suis vraiment cuit. Je suis passé les trois cas de la journée à brasser dans la neige. Je pensais que c'était la journée la plus cool aujourd'hui. Mais en tout cas physiquement je suis rincé. / C'est ici, qu'on traîne pas."}, {"kind": "fkt", "tl": "WR_D2", "tln": "WR Day 2", "date": "12 Jun", "ty": "MOMENT", "note": "Crossing glacier - No place to be alone", "kw": ["Monologue", "Glacier", "GoPro"], "file": "GX010025", "i": "01:37:56:13", "o": "01:37:56:14", "d": "", "t": "C'est ici, qu'on traîne pas. / Si on veut pas se prendre, c'est rack."}, {"kind": "fkt", "tl": "WR_D3", "tln": "WR Day 3", "date": "13 Jun", "ty": "SEQUENCE", "note": "Arrival Ascent 2 - arriving in town after ascent 2", "kw": ["Town", "Arrival"], "file": "", "i": "01:00:00:00", "o": "01:00:28:16", "d": "0:28", "t": "Пошли. / Повторяем! Спасибо! Двадцатая. Я не знаю, что будет тяжело, а то вон, на свете! СМЕХ / ПЕСНЯ / suis en train de mourir la musique, ou... / Je"}, {"kind": "fkt", "tl": "WR_D3", "tln": "WR Day 3", "date": "13 Jun", "ty": "MOMENT", "note": "talking about route - talking right after arrival, not sure what was harder", "kw": ["happy", "Dialogu  "t": ""}, {"kind": "fkt", "tl": "WR_D5", "tln": "WR Day 5", "date": "15 Jun", "ty": "MOMENT", "note": "Aguille du Midi", "kw": ["Aguille du Midi"], "file": "A001_06150829_C041", "i": "01:15:26:08", "o": "01:15:26:09", "d": "", "t": ""}], "iv": [{"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "origins", "name": "A mining region with no mountains", "note": "Grew up in north-east France, a working region of mines that became an industrial desert when they closed", "kw": ["Nicolas", "Pre WR", "Family", "City"], "file": "A002C001_260527DC", "i": "01:00:00:02", "t": "Alors j'ai grandi dans le nord-est de la France. C'est une région ouvrière où il y avait beaucoup de mines et une région pour laquelle il y a eu un vrai... / Je ne sais plus comment on dit... Un vrai désert industriel quand les mines ont fermé. Et dans la région d'où je viens, ça me fait pas mal rire maintenant quand j'y retourne pour aller voir la famille, c'est qu'il y a des terrils. Il est terril pour ceux qui ne connaissent pas, c'est en gros une bosse de 100 mètres de dénivelé d'eau. Et je vais m'entraîner là-bas, je vais la faire vingt, trente, quarante fois quand je vais voir la famille. Puisque là-bas on n'a pas de grande montagne."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "origins", "name": "Nobody in the family was sporty", "note": "No sporting family; the one athletic figure was a father he barely knew and stopped seeing around thirteen", "kw": ["Nicolas", "Pre WR", "Family"], "file": "A002C001_260527DC", "i": "01:00:40:24", "t": "Alors je n'ai pas une famille qui est très sportive en général. Donc si je dois retrouver quelqu'un dans mon entourage qui a été sportif, c'est mon père que j'ai peu connu. Je ne l'ai plus vu depuis l'âge de 13-14 ans environ, peut-être même un peu avant, je ne sais plus exactement. Lui m'emmenait faire beaucoup de sport, du vélo. Et je voyais ça quand j'étais enfant, plus comme une contrainte parce que tous les week-ends je devais aller faire des kilomètres et des kilomètres à vélo. J'y repense maintenant avec un peu de nostalgie où je me dis peut-être que je n'arrivais pas encore à me rendre compte que ça me servirait aussi aujourd'hui. Les capacités qu'on développe quand on est enfant, c'est quelque chose qui reste toute la vie je pense. / Donc du coup, est-ce que c'est une forme de signe que tu finirais à courir sur le Mont Blanc ? Le fait que tu fasses autant de sport quand tu étais jeune ? / Je ne pense"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "origins", "name": "Chance encounters, not predestination", "note": "He does not think his childhood pointed here; more the accidents of life, encounters and small triggers that make big changes", "kw": ["Nicolas", "Pre WR", "Family", "Explaining"], "file": "A002C001_260527DC", "i": "01:01:31:19", "t": "Je ne pense / Je ne pense pas que ce soit un signe que je fasse autant de sport quand j'étais jeune, qui m'a prédestiné aujourd'hui. Mais c'est peut-être plus des hasards de la vie, des rencontres, des petits déclics qui font des grands changements. On parle souvent du battement d'aile d'un papillon qui déclenche un tsunami à l'autre bout du monde et je pense que c'est vraiment ça pour moi. / A quel moment exactement tu as vu une vraie montagne, donc pas ta colline de 100 mètres pour la première fois ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "Flat country, hills of fifty metres", "note": "He is a Lorrain who grew up in real countryside where the biggest hills are fifty metres high", "kw": ["Christelle", "Family", "City"], "file": "A002C118_2604191Z", "i": "01:02:02:14", "t": "Alors Nicolas, c'est un Lorrain. Il a grandi vraiment à la campagne. Chez nous, c'est très très plat. Les plus grandes montagnes, ils doivent faire 50 mètres. Et puis là, du coup, ça change vraiment du tout au tout. / Et c'était... Ah ouais ! C'était la next question !"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "He already climbed", "note": "It still makes her laugh: as a small boy he was already climbing, but on the furniture, because there was nothing else", "kw": ["Christelle", "Family", "laughing", "Scrambling"], "file": "A002C118_2604191Z", "i": "01:02:26:15", "t": "Non, pas réellement. Nicolas, quand il était petit... Et d'ailleurs, ça me fait souvent rire quand j'y pense, parce qu'il grimpait déjà. Mais il grimpait donc à l'intérieur, puisque chez nous, de toute façon, il n'y avait rien. Donc, il grimpait sur les meubles de cuisine. Il grimpait, il sautait, il remontait. Il était très très très agile. Et au point qu'on se disait, il faut absolument le canaliser. Et on lui a fait faire de la gymnastique. Et donc, quand il était petit, c'était un gymnast de très bon niveau. / Quand il n'y a pas de montagne... / Voilà ! Sur les meubles de la cuisine, c'est... / Sa grand-mère avait très peur, toujours. / Et peut-être aussi... Est-ce que quelqu'un dans la famille faisait de la montagne, déjà ? Ou c'est vraiment lui qui a amené ça ? / Eh bien, personne dans"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "Nobody in the family went to the mountains", "note": "Absolutely no one - the land is flat and people moved around far less then", "kw": ["Christelle", "Family", "City"], "file": "A002C118_2604191Z", "i": "01:03:25:03", "t": "Eh bien, personne dans / Eh bien, personne dans la famille ne faisait de la montagne. Absolument personne, parce que chez nous, c'est plat. Et puis, en ce temps-là, on bougeait quand même beaucoup moins que de nos jours. Donc, il a surtout connu des plaines et des petits vallons. Mais je dois dire que quand j'étais jeune, j'étais passionnée de lecture de Frison Roche. Et je suppose que ça l'a peut-être influencé quelque part. / Et maintenant, des questions peut-être... Avant Nicolas découvert les montagnes... / Et quand vous avez repensé à Nicolas avant 30 ans, avant les montagnes et beaucoup de sport, c'était qui ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "origins", "name": "Born very premature", "note": "He was a very premature baby, tiny and light, with great difficulty at birth", "kw": ["Christelle", "Family", "Nervous"], "file": "A002C118_2604191Z", "i": "01:04:11:13", "t": "ça vient peut-être de Nicolas, quand il est né, c'était un grand prématuré. C'était un tout petit bébé, très, très léger. Il a eu beaucoup de difficultés à la naissance. Enfin, à l'époque, là, un grand prématuré, c'était encore difficile. Et j'ai l'impression que c'est cette lutte qui lui a fallu mener dès le début de sa vie, qui lui donne peut-être ce caractère aussi déterminé. C'est / très joli, très joli. Tu as souvent contrôlé la lumière. / pense que c'est bien. C'est bien, hein ? Oui. / Parce que là, il y a beaucoup de soleil maintenant. / Oui, ça a changé. En vrai, c'est bien. / Est-ce que je peux juste prendre une gorge d'eau ? / Ah, bien sûr, oui, bien sûr. Bon, là, vous voulez vous dire, vous prenez... Si vous avez tenté de faire des causes à n'importe quel moment, vous ne les dites pas. / Mais on peut se tutoyer, hein ? Comme tout à l'heure. Ah, ah, ah, ah. Oui, ben, avec l'âge, tout ça, c'est sûr. / Non, non, non, c'est même pas ça. C'est juste"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "First time in the high mountains", "note": "The Dome de Miage in the Mont Blanc massif was another world entirely", "kw": ["Nicolas", "Pre WR", "Alpine", "Mont Blanc", "Glacier"], "file": "A002C001_260527DC", "i": "01:07:13:09", "t": "et à côté de ça je dois quand même parler de la haute montagne c'est la première fois où j'étais en haute montagne au Dôme de Millage dans le massif du Mont Blanc ça a été un autre déclic c'est quelque chose d'apporté beaucoup"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "Better at the third half than the game", "note": "Before thirty he was no endurance athlete; he played rugby, and was strongest in the drinking that followed", "kw": ["Nicolas", "Pre WR", "laughing", "Family"], "file": "A002C001_260527DC", "i": "01:07:27:15", "t": "alors avant 30 ans j'étais pas tout à fait un athlète d'endurance j'ai fait pas mal de sport j'ai notamment joué au rugby et le rugby c'est connu pour une chose surtout pour la troisième mi-temps et j'étais plutôt très fort dans la troisième mi-temps que dans d'autres activités avant mes 30 ans"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "Sedentary, smoker, fifteen kilos heavier", "note": "A completely different life before thirty: sedentary, smoking, more time at the bar than doing sport", "kw": ["Nicolas", "Pre WR", "struggling", "Family"], "file": "A002C001_260527DC", "i": "01:07:47:11", "t": "avant mes 30 ans je me donnais une vie totalement différente j'avais une vie vraiment sédentaire j'étais fumeur et je passais plus de temps à l'apéro qu'à faire du sport / maintenant on va parler un petit peu du switch tu nous as raconté que ta première fois en haute montagne au Dôme de Miage c'est ce qui t'avait entre guillemets créé comme une sorte de déclic est-ce que tu veux me décrire ce moment ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "From running to lose weight to passion", "note": "Started running only to shed some weight; the switch to sport as pleasure came with the high mountains, altitude sickness and all", "kw": ["Nicolas", "Pre WR", "Training", "Alpine", "Hypoxy"], "file": "A002C001_260527DC", "i": "01:08:14:15", "t": "alors le switch vraiment où je suis passé de courir parce que je me disais qu'il fallait quand même faire quelque chose pour essayer de perdre un peu de poids pour me maintenir un peu en forme le switch vers le sport plaisir la passion pour la montagne ça s'est fait au Dôme de Miage c'est la première fois que j'ai vraiment découvert cet univers de la haute montagne ça a été difficile je ne vais pas dire le contraire le mal de l'altitude pas forcément la condition physique adaptée pour ça par contre ça a été des paysages grandioses pour moi qui ne vient pas du tout de ce milieu c'est une révélation je peux dire / maintenant raconte-moi un petit peu la première course de trail à laquelle tu as participé comment ça s'est passé"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the switch", "name": "An early solo Tour du Mont Blanc", "note": "One of his first ultras, done solo, leaving on a Friday evening after work", "kw": ["Nicolas", "Pre WR", "Running", "Mont Blanc", "Training", "happy"], "file": "A002C001_260527DC", "i": "01:08:56:10", "t": "maintenant raconte-moi un petit peu la première course de trail à laquelle tu as participé comment ça s'est passé / Je me souviens, je pense que c'est peut-être mon premier ultra, non peut-être mon deuxième ultra que j'ai fait en solo, en faisant un tour du Mont-Blanc, en partant le vendredi soir après le travail, un truc totalement improbable avec une certaine naïfté. Ça a été dur pour arriver au bout, je suis arrivé. / Mais j'ai pas mal d'histoires et d'anecdotes sur ce massif et un attachement particulier. C'est pour ça que ce projet me parle. / Ce n'est pas la question."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the switch", "name": "The Dome de Miage, and wanting Mont Blanc", "note": "His first time in the high mountains and his first race; ridges and summits he never imagined climbing", "kw": ["Nicolas", "Alpine", "Mont Blanc", "Glacier", "Ridge"], "file": "A002C063_260418WT", "i": "01:09:26:17", "t": "quand ou pourquoi? / Alors, la première fois que je suis allé en haute montagne, c'était au Dôme de Millage, dans le massif du Mont-Blanc. Et c'était ma première course. J'avais envie de faire le Mont-Blanc et quelqu'un m'avait emmené faire un sommet juste à côté pour essayer déjà. / Si on t'avait montré ta vie aujourd'hui, quand tu avais 25 ans, tu aurais dit quoi? / C'est pas possible. J'aurais dit que c'était pas possible. J'avais pas du tout une vie comme ça. J'avais une vie beaucoup plus sédentaire. / Et même quand je repense à cette première sortie en haute montagne, des arrêtes"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the switch", "name": "The real switch was a trail race", "note": "The high mountains impressed him, but the actual turning point was his first trail running race and the view over Lac d'Annecy", "kw": ["Nicolas", "Running", "Training", "happy"], "file": "A002C063_260418WT", "i": "01:10:06:00", "t": "Et même quand je repense à cette première sortie en haute montagne, des arrêtes / un peu de temps par temps? / Peut-être, sans doute pas sur ce moment-là. La fois où j'ai eu un switch, je pense, c'était sur ma première course de trail running. Disons que la première fois que j'étais en haute montagne, j'étais très impressionné. Et ma première fois sur une course de trail running, j'ai eu une vue sur le lac d'Annecy. Et ça, ça a été plus émerveillé. Et c'est assez différent comme sensation et les deux ont contribué à faire qu'aujourd'hui j'ai envie de passer tout mon temps en montagne. / Et qu'est-ce qui a changé concrètement dans la vie et quand ta vie tu as commencé? / Quand j'ai commencé la montagne? / Ça a été une passion"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the switch", "name": "A devouring passion", "note": "It started small and grew, and he kept adding disciplines - climbing, alpinism, one after another", "kw": ["Nicolas", "Training", "Running", "Alpine", "Scrambling"], "file": "A002C063_260418WT", "i": "01:10:54:05", "t": "Ça a été une passion / Ça a été une passion dévorante. Au début j'ai commencé à aller un petit peu et j'ai rajouté plein d'autres sports au fur et à mesure un petit peu d'escalade, de l'alpinisme, de la cascade de glace, du ski, de randonnée. Et au final avec toutes ces activités maintenant je passe tout mon temps libre en montagne. C'est bon. Nice. / J'ai rapidement été émerveillé. / Il y a une personne, un moment qui a fait basculer les choses?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "the switch", "name": "A completely different young man", "note": "The opposite of who he became - he liked parties and drinks and spending the time he had", "kw": ["Christelle", "Family", "laughing"], "file": "A002C118_2604191Z", "i": "01:11:29:19", "t": "C'était un jeune homme totalement différent. Un jeune homme, mais à l'opposé de ce qu'il est devenu. Il aimait faire la fête, il aimait boire des verres, passer... Bon, passer du temps avec les copains, ça, il le fait toujours. Mais il faisait du bateau... Enfin, c'était une vie très, très différente. Et puis, il s'est mis tout doucement à la course. Au début, je trouvais ça très bien. Et puis, quand j'ai vu l'intensité que ça prenait, l'engagement que ça représentait, c'est là que mon inquiétude, elle a commencé à croître. Au fur et à mesure qu'il montait, j'étais de plus en plus inquiète. / Et est-ce qu'il y avait des signes que tout ça allait arriver ? Ou c'est vraiment sorti de nulle part ? Oui, oui. / Ah, c'est vraiment arrivé brutalement, sans qu'on comprenne. / Je ne sais pas comment ça s'est fait."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the switch", "name": "The massif brought him to the mountains", "note": "The Mont Blanc massif is what brought him to alpinism, starting like many people wanting only to reach a summit", "kw": ["Nicolas", "Post WR", "Mont Blanc", "Alpine", "Family", "Explaining"], "file": "A003C438_26062775", "i": "01:12:28:07", "t": "Je ne sais pas comment ça s'est fait. / que j'ai avec / le mont blanc c'est le massif du mont blanc qui m'a amené à la montagne j'ai peut-être commencé la montagne la montagne et l'alpinisme comme beaucoup de gens qui veulent juste faire un sommet parce que c'est le sommet emblématique en Europe de l'Ouest j'ai commencé comme ça mais par contre j'en suis pas resté là / et ça m'a amené à la montagne parce que j'étais pas vraiment sportif avant ou en tout cas pas sur des sports d'endurance et ça a été un changement radical de vie pour moi ça a amené tellement de bouleversements que je ne pourrais même pas tout énumérer et c'est en ça que j'avais envie de faire vivre pour ce passé et / tu t'es senti plus connecté qu'avant pendant le record et après le record maintenant ? / on essaie de chercher du contraste merde"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the switch", "name": "Fundamentally not that different", "note": "He has always been engaged and enthusiastic; the values have not changed, they have simply moved elsewhere", "kw": ["Nicolas", "Post WR", "Explaining", "Training", "Inspiration"], "file": "A004C002_2606275W", "i": "01:13:29:03", "t": "Je pense fondamentalement, il n'y a pas une folle différence. Dans la mesure où j'ai toujours été très engagé et enthousiaste dans les projets que je faisais. Il y a d'autres projets qui sont peut-être un peu moins… / spectaculaires, je sais pas, on peut dire ça. Mais j'ai pas fondamentalement changé mes valeurs, mes aspirations… sont juste déportées ailleurs."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the switch", "name": "Still in evolution", "note": "Constantly evolving, and it will keep evolving for the rest of his life", "kw": ["Nicolas", "Post WR", "Explaining", "Inspiration", "Training"], "file": "A004C002_2606275W", "i": "01:14:03:18", "t": "nouveau Nicolas ? / Je pense que c'est… C'est… C'est en évolution constante, ça sera en évolution… tout le monde ma vie. Il y a des choses que je fais aujourd'hui, que j'aime aujourd'hui… euh… que… j'ai apprécié moins avant… euh… disons que pendant pas mal d'années, ça a été vraiment beaucoup de trail running et maintenant j'apprécie vraiment beaucoup plus cet aspect technique euh… de venir sur du… de l'alpinisme facile qui mélange un peu les deux pratiques. Peut-être que dans quelques années euh… je ferai que des trucs super difficiles techniquement, j'en sais rien. Euh… ça c'est peut-être pour la… la partie technique pratique, mais même dans… dans l'état d'esprit. Euh… Il y a quelque chose… j'en discute à… il y a… il y a… il y a pas longtemps avec euh… avec Paul Benham, on était courir ensemble un soir et euh… on disait « il y a bien un truc, on ne peut qu'avoir à être laissasi, euh… c'est le recul. » Et euh… après euh… on s'est dit euh… en fait non c'est la sagesse. Et je pense que euh… tout au long de sa vie on est de plus en plus sage. / Alors ce processus,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "His personal situation", "note": "PERSONAL - the interviewer had cut the couple questions; he speaks about his situation and a separation. Handle with care before using", "kw": ["Nicolas", "Pre WR", "Family", "Partner", "struggling"], "file": "A002C001_260527DC", "i": "01:17:14:01", "t": "Je les ai enlevées d'une façon générale Vis-à-vis de Jean Ouais, Jean, ouais Ça va ? / Ouais Mais ouais, c'est un peu compliqué ma situation Ah ouais en ce moment ? Ouais Ouais, ça va, ça va continuer On va sans doute se séparer avec Jets donc là Ok C'est vraiment un peu iniquité / tu vois Je les avais pas inclus de toute manière Ok, ah mince / Donc euh... Mais bon, c'est pas un... / Ok Les allées ? Ouais, ça, les allées de... Les allées ? / Je clope, je baisse hein / C'est reparti ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "How he met Florian", "note": "Cannot say exactly when, but recalls how the friendship with Florian began", "kw": ["Nicolas", "Pre WR", "Family", "Partner", "Explaining"], "file": "A002C001_260527DC", "i": "01:17:58:08", "t": "Comment est-ce que tu as rencontré Florian ? Raconte-moi un petit peu cette rencontre / Alors Florian, comment je l'ai rencontré ? C'est une très bonne question, je pourrais pas dire exactement comment je l'ai rencontré mais je me souviens de notre première sortie en montagne ensemble C'est une sortie qu'on a faite euh... On était au Grand Combain Et Florian c'est quelqu'un qui est vraiment hyper inspirant en montagne, qui est très fort, forcément il a un niveau assez impressionnant Une aisance, ça a été vraiment inspirant pour moi parce que c'était une pratique un peu différente de la montagne Euh... Beaucoup plus libre, euh... à mon sens, dans la vision que j'ai de sa pratique en montagne"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "How his mother sees it", "note": "Ambiguous - she sees it does him good, but the exchanges are difficult because she is not sporty and struggles to picture it", "kw": ["Nicolas", "Pre WR", "Family", "Christelle", "Explaining", "Phone"], "file": "A002C002_260527XB", "i": "01:18:41:05", "t": "comment c'est perçu par ma maman, par ma famille ? Je ne sais pas. C'est assez ambigu. Je pense que... Vraiment, on voit que je m'épanouis là-dedans. Donc forcément, ça lui fait plaisir de voir que je m'épanouis. / Au début, il y avait quand même beaucoup d'inquiétudes. Je ne sais pas si maintenant elle me le montre moins ou si elle s'est peut-être un peu habituée. / Et c'est toujours des échanges qui sont un peu difficiles parce qu'elle n'est pas vraiment sportive et je crois qu'elle a peut-être un peu du mal à comprendre des fois ce que je peux trouver là-dedans, ce que je peux aimer là-dedans."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "family", "name": "His son Jean wants MMA", "note": "Jean is fifteen and does combat sports; nothing to do with the alpine world, so he plants a seed without pushing", "kw": ["Nicolas", "Pre WR", "Family", "Partner", "Explaining"], "file": "A002C002_260527XB", "i": "01:19:24:22", "t": "Je pense que mon fils Je h, de distance, de dénivelé, tout ça. Et moi, c'est quelque chose qui m'a attiré. Mais j'avais pas trop de compagnons de cordée comme ça. Et on s'est rapproché, en fait, avec chacun nos spécificités, nos aptitudes. Et du coup, on a fait des premières sorties comme ça, avec à chaque fois des trucs qui font un petit peu... qui techniquement / Je les mettrai aussi dans le sac, je les mettrai dans une petite poche facilement facile de main. Une casquette. Le choix de la couleur de la casquette, c'est mon fils qui a eu droit aujourd'hui. J'ai dit ton色 blanc, noir. Et il a dit, ah non, noir c'est plus sympa. Il a dit, ah non,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "Messages from friends and his son Jean", "note": "Messages of encouragement land well; his son Jean sent one too", "kw": ["Nicolas", "Family", "Partner", "happy"], "file": "A004C046_260613H5", "i": "01:25:12:03", "t": "Je les mettrai aussi dans le sac, je les mettrai dans une petite poche facilement facile de main. Une casquette. Le choix de la couleur de la casquette, c'est mon fils qui a eu droit aujourd'hui. J'ai dit ton色 blanc, noir. Et il a dit, ah non, noir c'est plus sympa. Il a dit, ah non, / énergies et de mochilat ça ? / Oui, ça fait plaisir de recevoir des messages d'amis. Donc, il y a sur le groupe, je recevois aussi des messages en privé. / Il y a des gens qui m'envoient des messages pour m'encourager. Donc, oui, ça fait super plaisir. Il y a mon fils, Jean, qui m'a envoyé un message aussi. Il n'a pas l'habitude de m'envoyer. Donc, c'est pour ça que j'étais encore plus surfer. Pour m'encourager. Donc, c'est vraiment cool. / Et aussi, pour le"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "Different friendships have different rhythms", "note": "He and Florian do not message much; that says nothing about the quality of the friendship", "kw": ["Nicolas", "Partner", "Family", "Explaining"], "file": "A004C046_260613H5", "i": "01:25:34:12", "t": "Et aussi, pour le / Il m'envoyait un petit message où il a réagi à quelques messages. Mais avec Florian, on n'a pas l'habitude. On ouvre beaucoup de messages comme ça. Donc, il y a certaines relations où on échange beaucoup, d'autres où on échange moins. Et ça ne dénote en rien la qualité d'une relation. Mais ce n'est pas juste des personnes."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "family", "name": "First attempted the royal traverse with Florian", "note": "The first time he tried this traverse it was with Florian; they turned back at the foot of the Bosses ridge", "kw": ["Nicolas", "Partner", "Ridge", "Mountain", "Explaining"], "file": "A004C047_260613OO", "i": "01:26:02:06", "t": "en particulier ? / La première fois que j'ai voulu faire cette traversée royale avec quelqu'un, c'était avec Flo, justement. / Et on est parti des Contamine, / pas exactement là où on voulait partir demain, mais un peu de choses près. Et on a fait cette traversée bionnassée, on est arrivé juste au pied de l'arrière des bosses, on a fait demi-tour, on est redescendu par une autre voie. On n'avait pas fait le sommet le jour-là, parce qu'on voulait redescendre par les Trois-Monts, mais il y avait des risques d'avalanche, donc on a laissé d'un peu. Mais oui, la première fois que j'ai fait cette grande traversée, j'ai tenté de rester avec lui. / Lui, il l'avait vécu comment ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "Not a sacrifice, because he loves it", "note": "It is not a sacrifice - though he has never really asked whether people miss him while he is gone", "kw": ["Nicolas", "Post WR", "Family", "Partner", "Explaining"], "file": "A004C002_2606275W", "i": "01:26:39:06", "t": "Lui, il l'avait vécu comment ? / moi c'est pas un sacrifice parce que c'est ce que j'aime jamais posé la question de savoir si je manquais à des personnes aussi disons que quand je suis avec des personnes quand je suis à ce que je fais je suis à 100% donc je vois pas l'intérêt de me forcer à faire quelque chose à me forcer quelque part où j'aurais pas envie d'être je suis un peu fort de dire où je vois pas envie d'être mais où j'aurais envie d'être ailleurs plutôt parce que je ne serais juste pas / donc pour toi cette notion"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "His circle is in the mountains", "note": "Almost his entire circle of friends comes from the mountains, family aside", "kw": ["Nicolas", "Post WR", "Family", "Partner", "Mountain"], "file": "A004C002_2606275W", "i": "01:27:38:13", "t": "trouver un juste équilibre / je parle pas de la partie famille parce que la partie famille c'est un peu différent parce qu'il pratique à la montagne mais sinon c'est vrai que tout mon cercle d'amis il se fait en montagne / je propose pas très souvent d'aller"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "With Jean, precious moments rather than presence", "note": "He looks for moments with Jean that actually matter, rather than simply being in the room", "kw": ["Nicolas", "Post WR", "Family", "Partner", "Explaining"], "file": "A004C002_2606275W", "i": "01:27:55:13", "t": "je propose pas très souvent d'aller / encore plus de temps avec lui / avec Jean je cherche surtout dans le temps des moments qui soient précieux parce que si c'est juste pour dire que je suis là et au final juste pour être là ça n'a pas grand intérêt par contre quand je suis avec là quand on fait des activités je m'intéresse vraiment à ce qu'il fait je suis passionné de savoir ce qu'il fait comme je suis passionné dans le reste de ce qu'il fait je pense que je suis dans la vie je pense que en terme de valeur je pense que je lui transmets de lui transmettre j'ai plus envie de lui transmettre voilà soit 100% à ce que tu fais et les moments qu'on passe ensemble c'est des moments où on se souviendra plus que d'être tout le temps là au final pas grand chose Ok je"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "Jean, sixteen, unusually interested", "note": "He has rarely seen his son so interested in one of his projects, and it surprised him", "kw": ["Nicolas", "Post WR", "Family", "happy", "Phone"], "file": "A004C002_2606275W", "i": "01:28:45:05", "t": "ça en allemand. / Jean, c'est mon fils qui a 16 ans, et c'est vrai que je l'ai rarement vu aussi intéressé par un de mes projets. Et ça m'a un peu surpris, presque étonné. Je me suis demandé s'il avait quelque chose à me demander. Mais a priori non, c'était juste par simple intérêt. Et on a bien rigolé dans les jours qui ont suivi, comme il y a quand même eu une certaine couverture médiatique, où ses copains ont vu ça et lui demandaient si c'était son père, etc. Donc j'ai remarqué qu'il y avait une certaine forme de à la fois pudeur dans ce qu'il me disait, parce que c'est un ado qui a 16 ans. Et j'ai vu qu'il y avait quand même de la fierté pour son père qui transparaissait. Et ça m'a fait plaisir en tant que papa."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "A relationship built on listening", "note": "Very close, with a lot of mutual respect - they talk about everything", "kw": ["Nicolas", "Post WR", "Family", "happy", "Partner"], "file": "A004C002_2606275W", "i": "01:29:34:14", "t": "On a une relation vraiment très complice. Complice dans le sens où il y a beaucoup de respect entre nous, beaucoup d'écoute et on parle de tout. / La relation que j'ai avec Jean, c'est quelque chose de très précieux pour moi. On parlait aussi avant du fait de ne pas toujours être présent parce que je suis beaucoup en montagne. / Et en fait,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "What he wants Jean to keep of him", "note": "Not the mountains - Jean does not much like them - but the enthusiasm and the going beyond oneself", "kw": ["Nicolas", "Post WR", "Family", "Inspiration", "happy", "Explaining"], "file": "A004C002_2606275W", "i": "01:30:02:18", "t": "Et en fait, / Et en fait, ce que je voudrais qu'il garde de moi, c'est plus un exemple, le fait d'être inspirant pour lui. Je ne sais pas si j'y arriverais. / Il n'aime pas plus que ça la montagne. Mais ce n'est pas forcément dans l'activité. C'est dans l'enthousiasme, dans le dépassement de soi, dans toutes ces choses-là, dans toutes ces valeurs. / Là, on ne parle que des valeurs qui sont liées à l'activité, mais il y a plein d'autres choses que j'ai envie de transmettre. Mais en fait, j'ai envie que ça ait une belle personne, tout simplement. / À un moment ? J'ai vu ça. / Yeah, I saw that as well. Yeah, yeah. Bien sûr, là. / Prends des pauses, Nico, si tu as besoin. / Ouais, je crois juste une gopée de… Ouais. / De ton técho."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "family", "name": "His family struggles to picture it", "note": "They have some difficulty understanding what he does, though he enjoys the time he spends with them", "kw": ["Nicolas", "Post WR", "Family", "Christelle", "Explaining"], "file": "A004C002_2606275W", "i": "01:31:04:01", "t": "inspired par ? / Oui, sans doute. Sans doute, ces changements-là. Je vois quelque chose… On parlait aussi avant de famille, etc. Et… des fois, je pense que ma famille, elle a un peu du mal à comprendre que… si je passe une soirée à table, on va rigoler, on va discuter… je me sens super bien, j'adore ça. Mais au bout de 3 jours, on passe tous les repas, c'est 4 heures à table. / Mais c'est pas un rapport à eux parce que je prends beaucoup de plaisir à passer du temps avec eux."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "Christelle, his mother", "note": "Introduces herself as Nicolas's mother", "kw": ["Christelle", "Family"], "file": "A002C118_2604191Z", "i": "01:33:40:03", "t": "bien. Alors, je m'appelle Christelle et je suis donc la maman de Nicolas. Donc, je parle à... Je regarde Yone. Vous pouvez parler. D'accord. Je parle en direct. OK. Très bien. Donc, je suis Christelle, la maman de Nicolas. / Et quoi votre premier réflexe quand vous dit votre fille Nicolas ? / Oui. Votre premier réflexe. / Votre premier réflexe. Quand on vous parle de Nicolas, c'est votre première pensée qui vous vient à l'esprit quand on parle de Nicolas. / Quand on me parle de Nicolas, je me dis que c'est un sportif... / Enfin, je me dis qu'il réussit sur beaucoup de plans."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "He carries everything at once", "note": "He succeeds on many fronts - professional life, personal life, and above all the sport and the mountains, his first passion", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:34:21:00", "t": "Enfin, je me dis qu'il réussit sur beaucoup de plans. / je me dis qu'il réussit sur beaucoup de plans. Il mène un peu tout de front. Aussi bien sa vie professionnelle, personnelle, mais surtout tout ce qui concerne le sport. La montagne, sa première passion. / Et quoi son caractère de base depuis tout petit ? C'est quoi le trait qui ne jamais change chez lui ? / Il est très... comment dire... / Nicolas est très très... / Ah, je ne trouve pas le mot maintenant. Désolé. Il est très... comment dire... / Il est juste le mot qui m'échappe. C'est pour dire que... / Il est jusqu'au boutiste. Et puis surtout,"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "Perseverance to the very end", "note": "His defining trait is perseverance - he is a jusqu'au-boutiste, and when he starts something he goes all in", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:35:09:20", "t": "Il est jusqu'au boutiste. Et puis surtout, / Donc, l'une des principales caractéristiques du caractère de Nicolas, c'est la persévérance. Il est assez jusqu'au boutiste et il adore la montagne. Donc, quand on met tout ça bout à bout, ben, on arrive à ce résultat. / Et Nicolas, il a grandi où exactement c'était quoi comme environnement ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "She has no sense that he doubts", "note": "His personal commitment is such that once he begins something or launches into a new adventure, he goes", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:35:36:14", "t": "Et Nicolas, il a grandi où exactement c'était quoi comme environnement ? / Je n'ai pas l'impression que Nicolas soit quelqu'un qui doute. Il a tellement d'emmègement personnel que quand il commence quelque chose, ou quand il se lance dans une nouvelle aventure ou un nouveau défi. Les doutes sont derrière lui. D'ailleurs, je ne sais même pas s'il est sujet ou doutes. J'en doute."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "portrait", "name": "No weakening in his character", "note": "There is no faltering in his nature - he always goes", "kw": ["Christelle", "Family", "Explaining"], "file": "A002C118_2604191Z", "i": "01:36:03:02", "t": "il n'y a pas de fléchissement dans sa nature et dans son caractère. Et là, il y va toujours. D'accord. D'ailleurs,"}, {"kind": "iv", "speaker": "Kristine", "source": "Pre", "topic": "portrait", "name": "What she sees in him", "note": "Asked what she notices in Nicolas that other people might not", "kw": ["Kristine", "Gym", "Explaining"], "file": "DSC_0094", "i": "01:36:14:24", "t": "D'accord. D'accord. Et une question peut-être plus personnelle aussi pour Nicolas, mais... / Peut-être tu peux dire-moi qu'est-ce que vous voyez chez lui que les autres peut-être ne voyaient pas, ou des choses très spéciales, ou des choses que tu penses... C'est vraiment des choses... Le Nicolas. Oui. Typiquement Nicolas. / Bon, alors, beaucoup de persévérance. Toujours des idées un peu farfelues. / C'est bon, qu'est-ce que tu peux"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "Florian, climbing instructor", "note": "Introduces himself: climbing instructor, route setter, and years working in a specialist mountain shop", "kw": ["Florian", "Partner", "Scrambling"], "file": "DSC_0169", "i": "01:36:54:12", "t": "C'est bon, qu'est-ce que tu peux / Alors moi je m'appelle Florian Lecoq du coup. Et j'ai plusieurs casquettes. J'ai été moniteur d'escalade, / ouvreur de voies et de blocs. Et j'ai travaillé longtemps dans un magasin spécialisé dans la montagne sur Genève, Carouche, à Cactusport. Et puis après, j'ai pas mal brassé un petit peu dans le monde de l'outdoor en tant que professionnel. / Comment est-ce que tu connais Nicolas et comment est-ce que vous vous êtes rencontrés ?"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "Organised and permanently motivated", "note": "The first time out he was on normal ground, but Nicolas organises well and arrives hugely motivated", "kw": ["Florian", "Partner", "Preparation", "Training"], "file": "DSC_0169", "i": "01:37:27:12", "t": "Alors, Nico, l'avantage, c'est que c'est un mec, il arrive vachement bien à se réorganiser, il est toujours hyper motivé, et du coup, la première fois, c'était voie normale du peigne, mais par contre, en partant de Cham, Nico, il prend pas trop les bennes, d'accord ? Moi, ça me va bien parce que, à l'époque, j'avais pas trop d'argent et tout ça, donc voilà, départ de Cham, parti pour la voie normale du peigne, et après, moi, ce qu'il faut savoir, c'est que je regarde pas trop les cartes et que j'ai pas beaucoup de mémoire, du coup, en fait, j'ai eu beaucoup au feeling. Bref, on a loupé la voie normale du peigne, d'accord ? On s'est retrouvé dans une variante, je fais souvent des variantes, sans faire exprès, et du coup, on s'est retrouvé vraiment dans les passages assez scabreux et tout, avec très très peu de matos, parce que, bien sûr, on part à deux friends et tout. Voilà, donc on était un petit peu limite, mais c'était, voilà, Nico derrière, il a super bien suivi, super bien organisé, donc vraiment, il a cette aptitude à se recentrer et à reprendre un peu les bons gestes, à être calmé un petit peu quand il faut calmer. Et voilà, c'était une des premières expériences qui m'a montré qu'il tenait bien la route, parce que, des fois, tu peux avoir des gens qui sont très très forts au niveau sportif, mais qui, mentalement, par contre, s'effondrent. Lui, de par l'ultra-endurance, je pense qu'il a aussi un très très bon mental par rapport à l'engagement et tout. / Qu'est-ce qu'il "}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "A very big mental engine", "note": "His strength is mental - always full on, and even deep in difficulty he keeps going", "kw": ["Florian", "Partner", "struggling", "Explaining"], "file": "DSC_0169", "i": "01:38:55:08", "t": "Les forces de Nico, c'est mental, motivation. C'est vraiment, il a un gros, gros mental. Il est tout le temps à fond et vraiment même dans le dur, il va continuer, il va y aller. Et puis il aime ça, je pense qu'il aime ça. Il y a un côté un peu maso, vraiment, j'aime me faire mal et j'y vais. Et aussi ce côté motivation. Quand on le rencontre, c'est quelqu'un où tout de suite on se rend compte qu'il a de la joie de vivre, il a une belle énergie, il est toujours hyper partagé, hyper altruiste, il pense vraiment à l'autre et tout ça. Et ça se retrouve vachement dans ses projets. Il y a toujours de la vie dans ses projets, de la motivation. Il a toujours envie d'aller se balader. C'est pas genre, non, aujourd'hui il faut que je fasse ma petite sortie. Genre typique, il est en phase d'entraînement, tu lui proposes d'aller faire un hors-jeb ou un truc comme ça, il va craquer. Il va y aller. Même moi, on a fait des trucs des fois où il était en phase d'entraînement, il était complètement cuit, rincé. Mais par contre il me disait, allez viens, on y va. Et puis il est toujours, ouais, on va aller faire ça. Je me dis, c'est pas grave. Et voilà, c'est dans le dur, mais par contre il y va, il y va. Donc c'est vraiment ce côté motivation mentale qui fait sa grande force. / Et à l'inverse, est-ce qu'il a des faiblesses, des choses qui t'inquiètent personnellement, dans le cadre de ce record particulièrement ? / Alors, des faiblesses on en a forcément, mais des choses qui vont m'inquiéter "}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "Is he ready? Absolutely", "note": "Ready for some time - mental, physical and technical parameters all in place", "kw": ["Florian", "Partner", "Preparation", "Training"], "file": "DSC_0169", "i": "01:40:31:23", "t": "est prêt ? / Est-ce qu'il est prêt pour ce genre de projet ? Bah oui, ouais, ouais, carrément, ouais. Moi, je pense que ça fait, ça fait quelques temps qu'il est prêt. / Après, c'est, est-ce qu'il est prêt, voilà, c'est plusieurs paramètres. Il y a un paramètre mental, il y a un paramètre physique, il y a un paramètre technique et puis après, il y a un paramètre, on va dire, spatio-temporel, tu vois, des conditions externes. Donc, lui, il est prêt. Prêt."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "portrait", "name": "He has real values", "note": "A project like this puts a sporting approach to the mountain in the spotlight, and Nico brings genuine values to it", "kw": ["Florian", "Partner", "Explaining", "Alpine"], "file": "DSC_0169", "i": "01:40:59:22", "t": "Alors, ce genre de projet forcément, il va mettre un petit peu en lumière une approche sportive de la montagne. Et après, Nico, c'est quelqu'un qui a des vraies valeurs, des vraies valeurs sportives, mais des vraies valeurs aussi environnementales. Et voilà, donc je pense que dans ce qui va dégager, dans le message qu'il va apporter, il va y avoir une prise de conscience un petit peu de tout ça. C'est vrai qu'à l'heure actuelle, en fait, on a vraiment une forme d'urbanisation du milieu outdoor, dans le sens où avant, les pratiquants de ce genre de sport étaient souvent des gens qui étaient déjà... qui habitent en montagne, en moyenne montagne, qui avaient déjà une conscience de l'environnement dans lequel ils évoluent. Maintenant, de plus en plus, on a un public très urbain qui vient dans les montagnes. Et je pense que culturellement, il y a vraiment une éducation à faire sur comment est-ce qu'on aborde ce milieu montagne, ce milieu naturel. / Moi, j'habite au pied du Salève et j'ai pu"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "portrait", "name": "The old man at the refuge", "note": "At the refuge door an older man said it was wonderful what they were doing, and told him to keep going and live as long as he had", "kw": ["Nicolas", "Post WR", "Mountain Hut", "Partner", "happy", "Alpine"], "file": "A003C438_26062775", "i": "01:42:06:20", "t": "Moi, j'habite au pied du Salève et j'ai pu / Il y a peut-être juste une chose en arrivant au refuge qui a été, je sais pas, assez émouvant. Ou euh... C'est un détail, un truc. Et on est arrivé au refuge. Donc euh... À la porte, on enlève le matériel. Quand j'enlève le matériel, je rentre dans le refuge et euh... Je discutais avec la gardienne et il y a un guide qui avait 70 ans passé, 71 ans. Euh... Qui tendait une oreille et on s'est mis à discuter. Et en fait, c'était... Ouais, je sais pas pourquoi, c'était un moment qui était un peu émouvant pour moi. Parce qu'il a commencé à me raconter quand il était jeune, les solos qu'il faisait, etc. Et euh... Avec beaucoup de... Je sais pas, de... / Presque d'affection, on pourrait dire. Il disait, ah mais c'est génial ce que vous faites les jeunes. C'est bien de continuer comme ça. / Et euh... Et euh... Essaye de vivre aussi"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "portrait", "name": "Florian, a friend who shaped his practice", "note": "Someone who has given him a great deal both personally and in the mountains, and who inspired the way he climbs today", "kw": ["Nicolas", "Post WR", "Florian", "Partner", "Alpine", "Inspiration"], "file": "A004C002_2606275W", "i": "01:42:55:05", "t": "Et euh... Et euh... Essaye de vivre aussi / Florian c'est un ami à moi qui m'a beaucoup apporté, à la fois d'un point de vue personnel et en montagne, c'est quelqu'un qui m'a inspiré je pense dans la pratique que j'ai aujourd'hui. / C'est plus l'effet ce qu'il a. / Ouais j'allais dire ça... / We're almost done. / C'est presque fini."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Who he would be without it", "note": "Without alpinism and trail he would be a different person; it gives perspective, and every alpinist has faced situations where life was at stake", "kw": ["Nicolas", "Pre WR", "Dangerous", "Alpine", "Explaining"], "file": "A002C001_260527DC", "i": "01:45:25:18", "t": "sans l'alpinisme et le trail je pense que je serais différent parce que ça me permet de prendre beaucoup de recul sur pas mal de situations dans la vie c'est vrai que je pense que tout alpiniste a déjà été confronté à des situations où sa vie a pu être mise en danger et par rapport à des petites choses du quotidien ça permet quand même de prendre du recul et de relativiser"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Not alive, but good", "note": "He would not say running makes him feel alive - it makes him feel good, and he asks himself fewer questions", "kw": ["Nicolas", "Pre WR", "Running", "Enjoying", "happy"], "file": "A002C001_260527DC", "i": "01:45:50:09", "t": "je ne pourrais pas dire que je me sens vivant quand je cours je pourrais dire que je me sens bien c'est facile on a déjà eu l'occasion d'en parler on se pose moins de questions on est vraiment à ce qu'on fait et on n'a pas tout ce bruit du quotidien qui vient me perturber je dirais / du coup quand tu cours est-ce que c'est vers quelque chose ou loin de quelque chose ? / vers ou loin ? / je ne pourrais"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Contemplative, and simply being outside", "note": "What draws him is partly the landscapes and partly just being outdoors", "kw": ["Nicolas", "Pre WR", "Running", "Enjoying", "Mountain"], "file": "A002C001_260527DC", "i": "01:46:27:04", "t": "je ne pourrais / ce qui me motive et qui me plaît quand je vais courir forcément il y a un aspect contemplatif avec des paysages, des choses de ce type là et aussi le fait juste d'être bien, d'être dehors ça n'apporte pas grand chose de rester scotché sur le canapé toute la journée et de profiter par contre des paysages, des choses simples en fait c'est la simplicité peut-être qui m'attient / tu dis souvent effectivement ça que la vie en montagne elle est plus simple en quoi est-ce que c'est le cas ? / la vie en montagne pour moi elle est plus simple parce qu'on a moins de questions à se poser souvent on n'a pas de réseau avec le téléphone"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Competitive, but against himself", "note": "He is competitive and remembers racing head to head, but the measure is himself rather than the other runner", "kw": ["Nicolas", "Pre WR", "Running", "Explaining"], "file": "A002C001_260527DC", "i": "01:47:04:07", "t": "la vie en montagne pour moi elle est plus simple parce qu'on a moins de questions à se poser souvent on n'a pas de réseau avec le téléphone / Je pense que je suis compétitif. Maintenant, une saine compétition. J'ai des souvenirs de course où on était deux en tête de course et j'ouvrais à mon concurrent, on pourrait dire, ça compote parce qu'il n'arrivait plus à l'ouvrir, il avait trop froid aux mains. Donc, c'est une saine compétition. C'est une compétition dans le meilleur de soi-même. / Cet aspect compétitif, il peut des fois être pris de manière un peu négative parce qu'on peut le percevoir comme essayer d'être meilleur, mieux que l'autre. Pour moi, être compétitif, c'est de donner le meilleur de soi-même. / Ok, c'est intéressant. Donc finalement, quand quelqu'un te dépasse, tu n'en ressens pas grand-chose ? / Disons que quand quelqu'un me dépasse, je ne vais pas"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "No jealousy, and winning is validating", "note": "No resentment towards a rival - he tries to do better, but relative to himself; winning is validating and it would be dishonest to pretend otherwise", "kw": ["Nicolas", "Pre WR", "Running", "happy", "Explaining"], "file": "A002C001_260527DC", "i": "01:47:54:00", "t": "Disons que quand quelqu'un me dépasse, je ne vais pas / pas avoir de jalousie, d'envie ou de ressentiment par rapport à lui. Je vais essayer de faire mieux, oui, mais ça reste par rapport à moi. Je vais essayer de donner le meilleur de moi-même pour avoir une performance qui me permettrait de le redépasser. / Est-ce qu'il y a quand même une partie de toi qui a besoin de gagner ? / Mon rapport vis-à-vis de la compétition, de la victoire, c'est sûr que c'est valorisant. Ce ne serait pas juste de dire que ça me passe totalement au-dessus. Oui, forcément, c'est valorisant, c'est ce qui permet aussi de rencontrer du monde, d'avoir une certaine notoriété dans ce milieu-là. Et je pense que tout"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "The mountain asks for no result", "note": "In the mountains there is no result to chase, which is what makes injury in competition so frustrating", "kw": ["Nicolas", "Pre WR", "Running", "Alpine", "Enjoying", "Explaining"], "file": "A002C001_260527DC", "i": "01:48:46:20", "t": "Mon rapport vis-à-vis de la compétition, de la victoire, c'est sûr que c'est valorisant. Ce ne serait pas juste de dire que ça me passe totalement au-dessus. Oui, forcément, c'est valorisant, c'est ce qui permet aussi de rencontrer du monde, d'avoir une certaine notoriété dans ce milieu-là. Et je pense que tout / Alors que quand on va en montagne euh... Il y a pas cette... Cette recherche euh... Intrasec d'un résultat euh... C'est ça qui est le plus frustrant c'est les blessures dans le cadre de compétitions. / Euh... Parlons maintenant un petit peu du record euh... / Euh... Est-ce que tu as un exemple quand tu étais blessé dans une compétition ? / Alors j'ai été blessé plusieurs fois euh... Dans des courses euh... Il y a euh..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "The project in one sentence", "note": "How he would put it to someone who knows nothing about mountains: four times to the summit in four days, four routes, unsupported", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Explaining", "Preparation"], "file": "A002C001_260527DC", "i": "01:49:17:02", "t": "Alors j'ai été blessé plusieurs fois euh... Dans des courses euh... Il y a euh... / Si je devais expliquer le projet à quelqu'un qui connait rien à la montagne euh... Je l'expliquerais tellement simplement euh... Je lui dirais qu'en quatre jours je vais aller quatre fois en haut du Mont-Blanc. / Pourquoi le Mont-Blanc euh... Spécifiquement ? / Le Massif du Mont-Blanc c'est un Massif qui m'inspire euh... Bah déjà euh... Le rocher dans le Massif du Mont-Blanc, le Granit, c'est un rocher qui est absolument génial, qui est beau je trouve et à grimper sur la section du rocher. C'est... C'est vraiment hyper agréable euh... Euh... Euh... Et euh... C'est"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Fate is not fixed", "note": "He is not asking anyone to act, only that people know life is not a destiny handed to them", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration"], "file": "A002C002_260527XB", "i": "01:49:49:09", "t": "Le Massif du Mont-Blanc c'est un Massif qui m'inspire euh... Bah déjà euh... Le rocher dans le Massif du Mont-Blanc, le Granit, c'est un rocher qui est absolument génial, qui est beau je trouve et à grimper sur la section du rocher. C'est... C'est vraiment hyper agréable euh... Euh... Euh... Et euh... C'est / Je ne veux pas forcément que les gens passent à l'action. Je veux juste que tout le monde puisse avoir la conscience qu'au final, / dans la vie, il ne faut pas croire au destin. Que chacun prend les choses en main et faire ce qu'on a envie. Il faut juste croire en ses rêves."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "motivation", "name": "Believe in yourself, maybe more than you are", "note": "It may sound like a platitude, but believing in what you want to do and in yourself, perhaps more than you actually are", "kw": ["Nicolas", "Pre WR", "Explaining", "Inspiration", "happy"], "file": "A002C002_260527XB", "i": "01:50:08:01", "t": "Ça me paraît peut-être une phrase un peu bateau comme ça, mais au final, croire en ce qu'on a envie, de faire croire en soi peut être même plus qu'on ses rêves. / Si tu réussis les quatre phases, qu'est-ce qui vient après ? / C'est rare que je dise ça, mais je ne pense pas si je réussis ce projet, qu'est-ce qui vient après. Je suis convaincu que je vais le réussir. / J'ai peut-être trop été les derniers temps dans un schéma,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "Life up there is simpler", "note": "Mountain life is far simpler than daily life because it forces him back onto very basic things", "kw": ["Nicolas", "Emptiness", "Mountain", "Enjoying"], "file": "A002C063_260418WT", "i": "01:50:42:05", "t": "J'ai peut-être trop été les derniers temps dans un schéma, / alors la vie en montagne est beaucoup plus simple pour moi que la vie au quotidien parce que au final on est obligé de se recentrer sur des choses très simples très basiques On veut manger, on veut boire et quand on est dans une course de montagne, on va essayer de progresser et d'arriver au bout. On est vraiment focus sur ces choses-là. Tout ce qui est téléphone, réseaux sociaux, télé, on n'y pense plus du tout. On se ressent sur les choses qui nous permettent tout simplement de vivre."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "Single sentences that changed the trajectory", "note": "Several moments redirected him, sometimes nothing more than one sentence someone said", "kw": ["Nicolas", "Explaining", "Inspiration", "Partner"], "file": "A002C063_260418WT", "i": "01:51:14:21", "t": "Je pense que je pourrais avoir plusieurs moments qui à chaque fois ont changé la trajectoire. Notamment dans des petites phrases. C'est des choses, des fois une seule phrase, tu vas y repenser, y repenser et ça va changer beaucoup de choses sur la trajectoire. C'est comme un petit angle. Même si c'est un tout petit angle au départ, quand tu regardes à la fin ça fait un très gros écart. / Est-ce que tu as un exemple particulier d'une de ces phrases qui t'a percuté? / Oui, je pense que j'ai, on en parlait et j'ai un ami un jour qui m'a dit, j'allais en montagne assez régulièrement pour faire certains sommets avec des guides. Et il"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "Every outing now points at the project", "note": "Going into the mountains at the moment, he thinks constantly about the attempt ahead", "kw": ["Nicolas", "Mountain", "Preparation", "Nervous"], "file": "DSC_0095", "i": "01:51:54:01", "t": "Oui, je pense que j'ai, on en parlait et j'ai un ami un jour qui m'a dit, j'allais en montagne assez régulièrement pour faire certains sommets avec des guides. Et il / ce moment, quand je vais en montagne, c'est sûr que je pense vraiment beaucoup aux projets qui approchent. Et je dirais que chaque sortie, surtout en haute montagne, c'est l'occasion de préparer, de faire des tests de matériel. Aujourd'hui, j'ai commencé à faire un test avec des crampons sur les baskets. Ça n'a pas été du tout. Heureusement, j'étais un peu méfiant et j'ai prévu une autre paire de chaussures qui a permis quand même de faire la sortie. Mais donc, ça oblige encore à revoir pas mal de choses et à adapter pas mal de choses. / Et peut-être aussi, est-ce que tu sens... / Tu m'as dit que tu sens très libre, les montagnes sont la liberté, mais aussi peut-être les choses que... / Pas des choses"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "motivation", "name": "The mountains without a project", "note": "Going up with no objective is a space he loves precisely because it asks nothing of him", "kw": ["Nicolas", "Mountain", "Enjoying", "Emptiness"], "file": "DSC_0095", "i": "01:52:37:21", "t": "Pas des choses / sans projet ? / Alors, quand je vais à la montagne sans projet, c'est vrai que pour moi, c'est un espace que j'adore, parce que c'est un espace qui est extrêmement facile. Il y a beaucoup de personnes qui ne pourraient pas comprendre ça. Mais en fait, en montagne, on pense à l'instant présent, on pense à ce qu'on est en train de faire, quand on grimpe, on est concentré. Et on envisage vraiment à court terme les actions qu'on va devoir faire. Alors que dans la vie quotidienne, on a le téléphone, on a la télé, les réseaux sociaux, on est sollicité de toutes parts. Alors pour moi, la montagne, c'est vraiment quelque chose de libre et facile."}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "motivation", "name": "Four routes suits him", "note": "The four itineraries fit Nicolas exactly - not one line but a whole emblematic mountain seen by different faces and different moods", "kw": ["Florian", "Mont Blanc", "Alpine", "Explaining"], "file": "DSC_0169", "i": "01:53:15:14", "t": "Alors, moi, par rapport à ce projet des 4 phases, des 4 itinéraires, là, je trouve ça vraiment chouette. Parce que, / déjà, ça correspond bien à Nico. Voilà. Pas viser un seul itinéraire, mais toujours essayer d'ajouter un peu plus. Il aime bien vraiment, plus c'est long, plus il kiffe. Et du coup, le fait d'avoir ce côté 4 itinéraires comme ça, par 4 branches, moi, je trouve ça assez beau parce que tu as un côté... / Tu vas découvrir un peu une montagne emblématique par différents itinéraires, différents versants et du coup, différentes ambiances. C'est pas du tout la même chose que tu passes par la voie normale, ou tu passes par le versant italien, ou tu passes par... / Bon, après, il y a quand même des itinéraires où ça se rassemble un peu, mais je trouve ce côté un peu, côté français, côté italien, ça fait vraiment un beau tour de la montagne, quoi. / Par tes réponses avant, je pense qu'on peut le déduire, mais est-ce que tu penses qu'il peut le faire ? / Est-ce qu'il en a des capacités, bien sûr, ouais. Ouais, c'est sûr. Après, voilà, dans des projets"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "motivation", "name": "Bigger than the four FKTs", "note": "On paper it was four FKTs; in reality it became a far larger adventure than he pictured", "kw": ["Nicolas", "Explaining", "Mont Blanc", "Preparation"], "file": "A004C047_260613OO", "i": "01:54:21:12", "t": "Est-ce qu'il en a des capacités, bien sûr, ouais. Ouais, c'est sûr. Après, voilà, dans des projets / Il y a déjà plein d'autres choses qui viennent que les FKT, enfin, c'est une telle aventure, au final, quand je posais ça sur papier, je suis toujours seulement en soutien, je me rendais peut-être pas compte de l'ampleur de ces trucs, et c'est vrai que c'est assez énorme, donc, oui, alors les FKT, là, il y en a déjà 2, on a une supportée qui devrait être validée, mais c'est"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "motivation", "name": "What he is looking for: adventure", "note": "Asked what he is after - simply adventure, something out of the ordinary", "kw": ["Nicolas", "Explaining"], "file": "A004C047_260613OO", "i": "01:54:46:19", "t": "Finalement, c'est quoi que tu recherches ? Est-ce que tu as déjà, tu as déjà à mettre des mots, finalement, sur ce que tu recherches à travers cette aventure, ou pas ? / Je ne sais pas, est-ce qu'on ne recherche pas tout simplement l'aventure ? / C'est peut-être juste l'aventure, quelque chose qui change de l'ordinaire,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "motivation", "name": "Creating the project is part of himself", "note": "Building and imagining a project like this is almost a part of who he is", "kw": ["Nicolas", "Explaining", "Preparation"], "file": "A004C047_260613OO", "i": "01:55:04:21", "t": "Ouais, de faire un projet comme ça, de le créer, de l'imaginer, / c'est... Ouais, c'est presque, on pourrait presque dire, c'est une partie de soi. / Il y a quelque chose que le trail te"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "The project was born in a corner of his head", "note": "It had never been done, but that was never what he was after - the idea took shape two years earlier", "kw": ["Nicolas", "Post WR", "Mont Blanc", "Preparation", "Explaining"], "file": "A003C438_26062775", "i": "01:55:19:04", "t": "Il y a quelque chose que le trail te / alors c'est quelque chose qui n'avait jamais été fait et en même temps c'est pas du tout ce que je recherchais dans le projet euh euh le projet il est né dans un coin de ma tête il y a deux ans où je cherchais un peu comment enchaîner c'est toutes ces voies euh classiques au Mont Blanc euh et euh c'est plus ça qui me tentait c'était de pouvoir justement mêler cet aspect euh ultra endurance à l'aspect alpinisme / cette vidéo n'est plus tu qui finalement savent lieu que tu te dis des décices donc c'est je"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "A child's naivety about the difficulties", "note": "Not seeing all the difficulties coming - and being able to set them aside - is a strength rather than a weakness", "kw": ["Nicolas", "Post WR", "Explaining", "Inspiration", "happy"], "file": "A003C438_26062775", "i": "01:56:10:11", "t": "Une naïveté d'enfant où on ne voit pas toutes les difficultés qui vont arriver. Réussir à faire abstraction de ça, c'est une force. / Mais aussi tu vois"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "He never pictured failing", "note": "Not once did he imagine a scenario where he did not finish; he left with a great deal of optimism and appetite", "kw": ["Nicolas", "Post WR", "Explaining", "happy", "Preparation"], "file": "A003C438_26062775", "i": "01:56:24:10", "t": "Mais aussi tu vois / Non, je n'ai pas une fois imaginé un scénario où je n'arrivais pas au bout, où ça se passait mal. Je suis vraiment parti avec beaucoup d'optimisme. / Et ouais. Et c'était bien ? Ça m'apportait tout le projet, de l'optimisme, de l'envie, beaucoup d'envie. Ça fait longtemps que je n'étais pas sur un projet, une course ou quelque chose où j'avais autant envie d'y être. J'étais vraiment aligné avec moi-même. C'était vraiment du plaisir. / Beaucoup de manifestations aussi."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "Nothing to prove with four", "note": "He is not trying to prove anything; a single route is something he does regularly, so four was the interesting shape", "kw": ["Nicolas", "Post WR", "Mont Blanc", "Explaining", "Alpine"], "file": "A003C438_26062775", "i": "01:56:59:11", "t": "Alors, qu'est-ce que les quatre prouvent et qu'une ne prouve pas ? Déjà, en fait, je crois que je ne cherche rien à prouver avec ça. Et faire une route, c'est quelque chose que je fais régulièrement. Je vais plusieurs fois dans l'année, tous les ans, je vais faire des One Push comme ça au Mont Blanc sur un itinéraire. L'année dernière, c'était la première fois que je faisais la traversée royale en One Push. Donc ça, c'était quand même une belle aventure déjà l'année dernière. Et je pense que c'est cette aventure-là qui m'a vraiment donné confiance dans le projet. Et je me suis dit, en fait, il y a vraiment possibilité de rechaîner les quatre à la suite. / Et si c'était une question de chrono, tu le feras, / le projet ? / Si c'était juste une question de chrono ou d'essayer de battre un temps sur un des itinéraires, / déjà, je pense que je n'en serais pas capable. Clairement,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "He needs to be aligned with what he does", "note": "Something he learned about himself: he has to be aligned with a project to be able to give himself to it", "kw": ["Nicolas", "Post WR", "Explaining", "Preparation", "Inspiration"], "file": "A003C438_26062775", "i": "01:57:56:20", "t": "déjà, je pense que je n'en serais pas capable. Clairement, / There's one thing I discovered about myself I think I think I think I don't know how to pronounce it I really need to be aligned with what I do To be able to give it to me I have some projects that I do Or some projects that I do Or some projects that I do Without too conviction And clearly That's not a success That I understand I haven'twhat Of course It's yourest An important point Quite"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "Life up there does not multiply", "note": "Mountain life is simple because you are not thinking of a thousand things, and being forced off the phone is something he values", "kw": ["Nicolas", "Post WR", "Emptiness", "Mountain", "Phone", "Enjoying"], "file": "A003C438_26062775", "i": "01:58:46:11", "t": "compliquées en bas ? / ouais alors c'est vrai que je trouve la vie en montagne ou passer du temps à faire de l'alpinisme ou du trail assez simple parce qu'on pense pas à mille choses on est vraiment concentré sur ce qu'on fait contrairement à la vie quotidienne ou plein de choses et je suis le premier à devoir vivre avec mes amis / contradictions parce que, bah, on est sur les réseaux, sur les messages, sur... Je le fais aussi. Et, par contre, le fait d'être obligé de m'en libérer, c'est vraiment quelque chose que j'apprécie en montagne. / Alors, seulement regarder pour toi-même et pas être obligé des autres personnes. / Exactement, obligé des autres personnes. Et il y a aussi cet aspect où, quand on est vraiment concentré sur ce qu'on fait, / bah, ça permet de"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "It lets you escape", "note": "You stop thinking about the bill to pay and everything else in a life run at a thousand miles an hour", "kw": ["Nicolas", "Post WR", "Emptiness", "Enjoying", "Explaining"], "file": "A003C438_26062775", "i": "01:59:43:06", "t": "bah, ça permet de / bah, ça permet de s'évader. On pense plus à la facture qu'on devrait payer, à tout ce qu'on a à faire au quotidien, qu'on a tous des vies où on en a à mille à l'heure tout le temps. Je pense que c'est une personne qui ne voit pas de quoi je parle. Et là, on revient vraiment à l'essentiel. Trois choses à penser. Manger, boire, dormir, ça va être là. / Les trois choses plus importantes. Et est-ce qu'aller en montagne, c'est comme une forme de... / pas de thérapie, mais... / Ouais. Et toi ? / Je pense que ça serait un peu fort de dire ça, que c'est une forme de thérapie... / Thérapie, c'est pas vraiment... Des excutoires, ou un déchinois... Mais ouais, peut-être de... De... / Disons que... Régulation, ou des... / Turning off the head, you know."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "motivation", "name": "Freer rather than more alive", "note": "He would not say he feels more alive - freer of constraints, and that simplicity is the point", "kw": ["Nicolas", "Post WR", "Running", "Enjoying", "Emptiness", "Explaining"], "file": "A003C438_26062775", "i": "02:00:53:13", "t": "Non, je pense pas que je me sens plus vivant. Je me sens sans doute plus libre de toutes les contraintes. On en revient à la facilité, à la simpl
