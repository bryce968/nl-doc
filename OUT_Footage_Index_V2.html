d for Mont Blanc records", "kw": ["Nicolas", "Chamonix", "Town", "Running", "Explaining"], "file": "A003C106_260611ZQ", "i": "03:05:02:07", "t": "Maintenant, nous allons à l'église et la place. C'est quel meaning pour toi cet endroit ? / Alors, la place du Triangle de l'amitié, c'est un peu pour tout ce qui est trail, c'est la place, et même pour les records au Mont Blanc, c'est vraiment la place symbolique."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "Every start happens in front of the church", "note": "The square carries a particular symbolism for him, tied to his UTMB finishes in 2017 and 2023", "kw": ["Nicolas", "Chamonix", "Town", "Start", "Running"], "file": "A003C106_260611ZQ", "i": "03:05:24:12", "t": "Chaque départ, pour chaque itinéraire, justement, ça sera devant les églises. Et là, cette place là, pour moi, elle a toute une symbolique particulière avec l'arrivée de la PTL en 2017 et en 2023. / Surtout en 2023,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "Arriving at the UTMB in 2023", "note": "Finishing in broad daylight with crowds through the streets; the mythical arrival place in Chamonix", "kw": ["Nicolas", "Chamonix", "Town", "Arrival", "happy", "Running"], "file": "A003C106_260611ZQ", "i": "03:05:42:17", "t": "Surtout en 2023, / Surtout en 2023, arrivé en pleine journée avec du monde partout dans les rues, avec cette ambiance juste de folie quand on est arrivé à la PTL. Donc c'est vrai que c'est un endroit que j'aime particulièrement. Et j'y reviendrai cet été pour la PTL, j'espère, avec la même ambiance et le même résultat qu'il y a trois ans. / C'est beaucoup de motivation pour maintenant. / Exactement. C'est vraiment le lieu mythique à"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "He decided that morning he wanted music", "note": "He had not planned on music for the departure, then that morning found he wanted it", "kw": ["Nicolas", "Chamonix", "Music", "Start", "happy"], "file": "A003C117_2606114O", "i": "03:06:12:09", "t": "Exactement. C'est vraiment le lieu mythique à / maintenant pour toi ? / C'est marrant que tu poses cette question. C'est peut-être pour ça que, au départ, je n'avais pas prévu de mettre de la musique. Et là, ce matin, je me suis dit, ah, tiens, j'aurais bien envie de la musique. C'est peut-être ce qui va me donner un peu plus de mouvement pour le départ. Parce que, ouais, c'est vrai que c'est bizarre de partir dans un tel calme comme ça, la nuit, seul. En général, quand on va faire des sommets en one push comme ça, on est toujours un ou deux copains. Il y a quand même une émulsion comme ça, mais là, c'est vrai que c'est un peu spécial."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "places", "name": "A chamois came right up to him", "note": "It approached without fear and simply watched him; on the descent another ran on the snow beside him", "kw": ["Nicolas", "Animal", "Mountain", "happy", "Enjoying"], "file": "A004C047_260613OO", "i": "03:06:46:17", "t": "une chamois, voilà ? / Oui, exactement. Il était tout accusé, il n'avait pas l'air très craintif donc il s'approchait comme ça, il regardait. / Est-ce que tu peux redire les sentences avec « j'ai vu une chamois » aussi une chamois pour la vidéo ? / Oui, à la descente j'ai aussi vu un chamois qui courait sur la neige et il était tout à côté de moi et c'était assez rigolo parce qu'il n'était pas du tout craintif, il s'approchait et je pense qu'il y a l'habitude de voir pas mal de monde. Merci."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "places", "name": "Sunrise at the Domes de Miage", "note": "Day three, the sun coming up at the Domes de Miage - a magical moment he had experienced there before", "kw": ["Nicolas", "Post WR", "Sunrise", "Mountain", "Alpine", "Enjoying", "happy"], "file": "A003C438_26062775", "i": "03:07:21:22", "t": "le troisième jour, quand le soleil s'est levé et que j'étais au niveau des dômes de mi-âge, ça, c'est un instant qui est juste magique. Je m'étais déjà retrouvé là, / par le passé, sur ce même type d'horaire. Je m'attendais déjà à ce moment-là. / Je m'attendais, je m'impatientais à ce moment-là. Parce que je savais que c'était vraiment la partie alpine de cette troisième journée qui allait commencer. En plus, j'avais la fatigue des jours précédents. Et je voulais quand même être assez tôt au niveau de l'aiguille et de l'arrête de Bionasset. Et ça s'était déroulé mieux que tout ce que je pouvais imaginer. Une progression extrêmement rapide, / vraiment facile. Donc, c'était un moment juste dans le flow, comme on dirait. / pour avoir un vrai highlight de tout le projet. / Disons que j'avais encore un"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "places", "name": "If he could keep one day, the third", "note": "The most beautiful of the four - the preparation, and having dreamed of it for months", "kw": ["Nicolas", "Post WR", "Mountain", "Alpine", "Enjoying", "happy", "Ridge"], "file": "A003C438_26062775", "i": "03:08:16:00", "t": "Disons que j'avais encore un / also other things? / If I could only stay there for a single day It would be the third day after The most beautiful day It's all It's the preparation It's the fact of having Have dreamed of doing it for months Have waited the good day Have had a good day Have had a success in the project It's really all the way to do it / What did you discover about yourself That you didn't know before going? / There's one thing I"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Who he is", "note": "Introduces himself: IT manager in Geneva with a passion for endurance running, ultra trail and alpinism", "kw": ["Nicolas", "Pre WR", "Office", "Running", "Alpine"], "file": "A002C001_260527DC", "i": "03:11:07:05", "t": "Présente-toi ton prénom, ton nom et ce que tu fais dans la vie. / Alors je m'appelle Nicolas Lehmann. Je suis manager dans l'informatique à Genève. Et j'ai une vraie passion pour tout ce qui est course de longue distance, ultra trail et alpinisme."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Work stress and sport stress", "note": "The two either compound or cancel each other out depending on his state of mind; availability is a key performance factor in ultra", "kw": ["Nicolas", "Pre WR", "Office", "Training", "Nervous"], "file": "A002C001_260527DC", "i": "03:11:25:19", "t": "Alors le stress du boulot, le stress du sport, c'est deux choses qui peuvent ou se cumuler ou se compenser. Ça va dépendre de l'état d'esprit dans lequel on est. En ultra trail, je pense que c'est un des facteurs clés de la performance avec la disponibilité mentale. C'est vraiment quelque chose que plus le temps passe, plus j'appréhende et je dois faire avec. / Comment te décrirais-tu aujourd'hui en quelques mots ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Enthusiastic and rigorous", "note": "Two words for himself: enthusiastic, a real kid about projects like this - and rigorous", "kw": ["Nicolas", "Pre WR", "Office", "Preparation", "happy"], "file": "A002C001_260527DC", "i": "03:11:53:24", "t": "Je pense que si je devais donner deux ou trois mots pour me décrire, je dirais la première chose, c'est enthousiaste. Je suis un vrai gamin par rapport à des projets comme ça et rigoureux. Je pense que tout le monde peut faire ce qu'il veut dans la vie, peut arriver à ce qu'il veut. Par contre, ça demande de se donner les moyens. / Est-ce que d'une certaine"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Banking rigour and the mountain", "note": "Twenty years in a highly organised industry he was predisposed to, and the discipline feeds back into how he approaches the mountain", "kw": ["Nicolas", "Pre WR", "Office", "Preparation", "Alpine"], "file": "A002C001_260527DC", "i": "03:12:17:05", "t": "Est-ce que d'une certaine / Alors la culture du milieu bancaire et cette rigueur qui caractérise ce milieu, / ce côté très organisé, je pense que c'est peut-être quelque chose qui m'a amené à travailler là-dedans depuis vingt ans. C'est peut-être quelque chose pour lequel je suis prédisposé et à la fois ça m'a permis d'accomplir ma carrière professionnelle et en même temps d'accomplir ma carrière sportive. / Tu as grandi où exactement ? Décris-moi un petit peu le paysage de ton enfance. / Alors j'ai grandi dans le nord-est de la France. C'est une région..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "work & discipline", "name": "Fitting it all into a day, a week, a year", "note": "The rigour it takes to fit every session into a day, those days into a week and the weeks into a year", "kw": ["Nicolas", "Pre WR", "Training", "Office", "Preparation", "Explaining"], "file": "A002C001_260527DC", "i": "03:12:55:00", "t": "tout ça, on parlait de rigueur avant. Et pour pouvoir mettre tout ça dans une journée et toutes ces journées dans une semaine et toutes ces semaines dans une année, il faut être hyper organisé. parfois, il y a beaucoup de monde qui croit que j'adore cette organisation, c'est quelque chose qui me fait fondamentalement plaisir et en fait, ça ne me dérange pas, mais ce n'est pas une nécessité. / Pardon, ça ne me dérange pas, c'est plus une nécessité si je veux pouvoir faire tout ça. / Alors, ce n'est pas une obsession avec des chiffres, mais c'est seulement une nécessité que tout le monde c'est possible dans un jour, par exemple. / Exactement, ce n'est pas du tout que je suis obsédé par les chiffres ou"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "work & discipline", "name": "Organised months in advance", "note": "Very organised and needing control over a great deal; everything planned months ahead, rational and thought through", "kw": ["Christelle", "Family", "Preparation", "Office"], "file": "A002C118_2604191Z", "i": "03:13:44:20", "t": "Exactement, ce n'est pas du tout que je suis obsédé par les chiffres ou / quelqu'un de très, très organisé. Et effectivement, il a besoin de garder le contrôle sur beaucoup de choses. Il a une organisation des mois à l'avance. Tout est rationnel. Tout est réfléchi. / C'est quelqu'un de très, très structuré dans sa tête. Et donc, ça se ressent aussi bien au niveau de son engagement, de ses entraînements, de ses courses, de tout ce qu'il fait. Oui. / Et qu'est-ce que tu penses avec son obsession d'Excel ? / Avec des programmes d'Excel ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "work & discipline", "name": "His love of Excel has bailed her out", "note": "When she has trouble with a spreadsheet she asks the specialist; she is not as rational as he is", "kw": ["Christelle", "Family", "Office", "laughing"], "file": "A002C118_2604191Z", "i": "03:14:21:24", "t": "programmes d'Excel ? / Je dois dire que son attrait pour Excel, ça m'a déjà aidé plus d'une fois. Parce que quand j'ai moi-même des soucis avec Excel, je demande au spécialiste, c'est Nicolas. Sinon, j'ai un peu de mal à comprendre. Je ne suis pas aussi rationnel que lui."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "work & discipline", "name": "Training for it was almost easy", "note": "Honestly it was not hard to train for - it fits the rhythm of his life and needed no special upheaval", "kw": ["Nicolas", "Post WR", "Training", "Office", "Preparation", "Explaining"], "file": "A003C438_26062775", "i": "03:14:42:11", "t": "chose aussi ? / Alors pour s'entraîner pour quelque chose comme ça euh euh je dirais que très sincèrement ça a été assez facile pour moi parce que ça s'inscrit vraiment dans mon rythme de vie euh euh j'ai pas eu besoin de de de de fixer le créneau très précis où j'allais être prêt physiquement et ça serait là ou jamais euh donc ça me donnait pas mal de marge de manœuvre sur sur cette partie physique en tout cas euh euh je vais tous les jours pourrir ou faire du vélo je vais à la musculation je vais plein de choses tous les jours donc euh ouais ça a vraiment été facile sur cet aspect"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "work & discipline", "name": "The balance is what gives him freedom", "note": "Having work alongside it is what produces the freedom, rather than the two being separate worlds", "kw": ["Nicolas", "Post WR", "Office", "Training", "Enjoying", "Explaining"], "file": "A004C002_2606275W", "i": "03:15:17:10", "t": "qui t'apporte la liberté ? / Que ce soit différencié, je sais même pas si… si euh… c'est euh… un critère, mais ce qui m'apporte la liberté, ouais, c'est… c'est… c'est… c'est… c'est d'avoir un… d'avoir un… un équilibre entre tout ça. Euh… je trouve juste exceptionnel, c'est Ludo Pomeray, euh… en trail, euh… bah il a travaillé… je crois que c'est la première année là où… euh… il est passé entièrement… à quel âge, il est passé en tout cas, euh… et euh… il a travaillé toute sa vie, alors peut-être réduit un peu son temps de travail, euh… les dernières années, mais euh… « est-ce que je l'aurais, je l'aurais pas ? » je trouve pas la réponse, mais euh… je trouve que c'est important de… de garder le maximum d'ouverture d'esprit. / Donc ce n'est pas…"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "work & discipline", "name": "No sacrifice, because of the balance", "note": "He sees no sacrifice precisely because he keeps that balance, though dropping to 80% would be another matter", "kw": ["Nicolas", "Post WR", "Office", "Training", "Preparation", "Explaining"], "file": "A004C002_2606275W", "i": "03:16:25:14", "t": "Donc ce n'est pas… / c'est de garder cet équilibre. / Tout à fait, je vois pas de sacrifice parce que je garde cet équilibre. Maintenant je dis pas que des fois, je me dirais « non pas, travailler à 80% pour être sympa », ça je pense que oui, parce que le planil est souvent assez chargé. Euh… mais ce qui a peut-être changé les dernières années, euh… peut-être les derniers mois encore plus, c'est que je sélectionne beaucoup plus les choses qui me tiennent à cœur, les choses que j'ai envie de faire, et les personnes à qui j'ai envie d'être. Euh… j'avais tendance à beaucoup faire des choses qui pour faire plaisir, etc. Euh… et euh… là c'est à la fois une manière de me recentrer sur mes envies, euh… et euh… j'apprends aussi de l'importance aux gens qui m'entourent et aux gens qui j'ai envie de passer le temps. / Euh… une autre question, vraiment off-topique… / euh… claquettes ou chaussettes ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "risk & safety", "name": "Competence as a way of feeling safe", "note": "High mountains carry enormous uncertainty; he can plan for a great deal but much is at the mountain's mercy, so technical competence is how he feels secure", "kw": ["Nicolas", "Pre WR", "Dangerous", "Alpine", "Preparation"], "file": "A002C001_260527DC", "i": "03:19:30:03", "t": "c'est peut-être d'un côté pour se sentir en sécurité je pense qu'en haute montagne on a énormément d'incertitudes il y a plein de choses pour lesquelles on peut prévoir mais aussi plein de choses pour lesquelles on est tributaire de la montagne je pense aux chutes de Serrac aux chutes de pierre il y a suffisamment de choses imprévisibles pour que tout ce qu'on peut mettre comme compétence et avoir comme compétence et comme moyen on va les mettre en oeuvre donc si je pense au projet du Mont-Blanc par exemple il y a des sections d'escalade qui sont certes pas difficiles mais c'est des sections sur lesquelles j'ai vraiment envie de me sentir à l'aise confortable et pas me sentir déjà limite sur des portions comme ça / tu nous as mentionné à plusieurs reprises ton admiration pour Ulich Tech pourquoi son approche t'inspire ? / Ulich Tech c'est un personnage une personne Ulich"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "risk & safety", "name": "On some sections a fall would be fatal", "note": "Completely honest about it - on certain sections a fall would probably kill him, and it does not worry him more than that", "kw": ["Nicolas", "Pre WR", "Dangerous", "Alpine", "Explaining"], "file": "A002C001_260527DC", "i": "03:20:28:14", "t": "Ulich Tech c'est un personnage une personne Ulich / Et en étant tout à fait honnête, sur certaines sections, l'erreur, elle peut être fatale. / Maintenant, c'est pas quelque chose qui m'inquiète plus que ça. Je pense que j'ai quand même l'habitude de ce genre d'effort et j'ai assez confiance à la lucidité que je vais avoir tout au long de tout comme ça. / Tu as déjà eu peur en montagne ? Vraiment peur pour ta vie ? / J'ai déjà eu à plusieurs reprises vraiment peur pour ma vie, oui, clairement. Ça s'est produit à plusieurs reprises où je pense que j'ai frôlé des accidents assez graves."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "risk & safety", "name": "Does the project take away the fear people should have", "note": "Asked whether people seeing this will think it is easy and attempt it themselves", "kw": ["Nicolas", "Pre WR", "Dangerous", "Explaining", "Mountain"], "file": "A002C001_260527DC", "i": "03:21:06:21", "t": "Est-ce que tu as peur que ton projet enlève la peur que les gens devraient avoir devant la montagne finalement ? Que les gens te voient, pensent que c'est facile et prennent eux-mêmes des risques inconsidérés ou qu'ils poussent leurs limites sans vraiment avoir fait tout le travail que tu as fait en amont ? / C'est une question que je me suis posée de savoir si le fait d'exposer un projet comme ça, ça ne pourrait pas inspirer d'autres personnes qui n'auraient peut-être pas forcément la conscience des risques qui sont pris à certains moments ou qui ne mesureraient pas le niveau de compétence qu'il faut avoir pour le faire. Je pense que avec les années de pratique, si j'ai bien compris quelque chose, c'est que en débutant la montagne, j'étais beaucoup plus naïf et cette naïveté, on n'arrive pas à avoir une réelle conscience des risques qu'on va prendre ou des réels dangers de certaines sections. Si on marche sur un glacier, par exemple, on voit juste une étendue de neige, on ne se rend pas compte qu'il y a plein de crevasses en dessous. Une fois qu'on a l'habitude, qu'on connaît ces risques, on les appréhende et on arrive à les minimiser, je dirais. / Le fait d'exposer un projet comme ça, je ne voudrais pas non plus que ça puisse faire penser à d'autres personnes qui n'ont aucun risque dans ce genre de projet. / Comment tu te positionnes là-dessus ? Tu veux plutôt inspirer ou mettre en garde ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "risk & safety", "name": "The day ends when the danger does", "note": "After a high mountain outing the day is not over until every dangerous section is behind him", "kw": ["Nicolas", "Dangerous", "Alpine", "Glacier"], "file": "A002C063_260418WT", "i": "03:22:29:03", "t": "quand on a fini une course en haute montagne, la journée n'est pas finie, mais pour moi elle est finie. On a fini tous ces moments où il peut y avoir du danger je dirais. Après des fois on a 2, 3, 4 heures de marche encore. Pour quelqu'un « normal » ou qui ne fait pas ça, ça paraîtrait énorme. Alors que nous on a fini notre journée, il reste encore 4 heures de marche et on sait qu'on n'a plus aucun danger, c'est juste de la marche. Nice, nice."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "risk & safety", "name": "Temperature swings over wind", "note": "Sometimes wind forces a retreat, but it is the shifts in temperature between faces that impress him most", "kw": ["Nicolas", "Weather", "Wind", "Conditions", "Dangerous"], "file": "A002C063_260418WT", "i": "03:22:55:08", "t": "alors des fois ça empêche de faire une sortie en montagne. Ou renoncer à cause du vent. D'accord. C'est plus les changements de température qui m'impressionnent toujours. Entre une face nord aussi, ou qu'on bascule sur une autre face, c'est une autre montagne d'un seul coup. / Et quand vous... Kind of... Come up here... / Several times on la saleh. Est-ce que c'est toujours les mêmes sensations ? Ou tu vois différentes, nouvelles fascinations ou spots ?"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "His first Sierre", "note": "Coming from flat country, mountains are imposing; his first mountain race struck her as extreme and she was very worried", "kw": ["Christelle", "Family", "Nervous", "Running"], "file": "A002C118_2604191Z", "i": "03:23:31:13", "t": "Je ne sais pas comment ça s'est fait. Je me souviens de son premier Sierre Zinal. Je trouvais que c'était le bout du monde. Sierre Zinal, pour moi, c'était la course extrême. Et je me revois l'attendre à l'arrivée. C'était très, très joyeux. Je pensais qu'il n'irait jamais plus loin que ça. Et entre-temps, j'ai appris qu'il y en avait des courses bien, bien plus longues que ça. / Et quand il vous a annoncé qu'il allait faire son premier Ultra, ou son premier Mont Blanc, vous avez pensé quoi ? / J'ai trouvé que c'était absolument fou. J'étais très inquiète. Et comme je vous le disais tout à l'heure, nous, on est d'un paysage plutôt plat. Et donc, les montagnes, c'est quelque chose d'impressionnant. Et pas de dangereux réellement, mais qu'il faut connaître. Donc, / sachant d'où on était originaire, le peu de connaissance de la montagne, j'étais même un peu traumatisée. Et dans la famille, on l'était un peu tous. Très inquiets. / Peut-être, est-ce que tu peux formuler la réponse ? Parce que quand on utilise seulement la réponse, on connaît le début. / Alors, quand il a lancé, il allait faire un Ultra. / Donc, tu veux dire que je répète un petit peu... Exactement. / Ah, exactement. D'accord."}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "The whole family tried to stop him", "note": "When he took up ultra trail everyone was alarmed; his grandmother did everything she could to make him stop", "kw": ["Christelle", "Family", "Nervous"], "file": "A002C118_2604191Z", "i": "03:25:02:06", "t": "Ah, exactement. D'accord. / Donc, quand Nicolas a commencé l'Ultra Trail, tout le monde était très inquiet dans la famille. Moi, extrêmement. Sa grand-mère, très, très inquiète. Elle, elle a tout fait pour essayer de le faire arrêter. Des discussions, etc. Parce que pour nous, qui sommes vraiment des gens de la terre, et pas des gens des hautes montagnes, c'était très impressionnant. Très inquiets. Beaucoup d'inquiétude. / Et est-ce que tu as aussi un petit peu peur, peut-être, de lui ? J'ai / très, très souvent"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "She is often frightened for him", "note": "She knows it is dangerous and hopes he measures the risk and takes as little of it as he can", "kw": ["Christelle", "Family", "Nervous", "Dangerous"], "file": "A002C118_2604191Z", "i": "03:25:45:01", "t": "Et est-ce que tu as aussi un petit peu peur, peut-être, de lui ? J'ai / très, très souvent / très, très souvent peur pour Nicolas. Oui, très souvent. Je sais que c'est dangereux. Je pense qu'il mesure le danger, qu'il le calcule, qu'il essaye, j'espère, de prendre le moins de risques possibles. Mais je sais que tout peut s'arrêter à tout moment. On le voit souvent. / Et peut-être maintenant, les choses, behind the curtain de Nicolas. Oui, oui. Alors, Nicolas, pour moi, il donne l'impression que tout est toujours sous contrôle. Un"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "Hoping he knows his limits", "note": "She hopes above all that he is aware of his limits - because otherwise he will simply try again until he succeeds", "kw": ["Christelle", "Family", "Nervous", "Dangerous"], "file": "A002C118_2604191Z", "i": "03:26:24:17", "t": "Et peut-être maintenant, les choses, behind the curtain de Nicolas. Oui, oui. Alors, Nicolas, pour moi, il donne l'impression que tout est toujours sous contrôle. Un / et j'espère qu'il est conscient de ses limites. J'espère surtout que tout va aller très bien et qu'il arrivera au bout de ce qu'il souhaite, parce que sinon, il va réessayer jusqu'à y arriver et il y aura ce risque ou cette crainte pour moi, en tout cas, qui va se répéter plusieurs fois. Donc, tout bon. / Mais est-ce que"}, {"kind": "iv", "speaker": "Christelle", "source": "Pre", "topic": "risk & safety", "name": "Frightened by the photographs", "note": "She is afraid of not knowing what he is doing while he does it, and the photos he sends frighten her; life up there is fragile", "kw": ["Christelle", "Family", "Nervous", "Dangerous", "Phone"], "file": "A002C118_2604191Z", "i": "03:26:50:10", "t": "Mais est-ce que / J'ai toujours peur pour Nicolas. J'ai peur de ne pas savoir ce qu'il fait, au moment où il le fait, par exemple. J'ai surtout très peur aussi quand je vois les photos qu'il envoie parfois. Parce que là, je me rends compte que ça ne tient qu'à un fil. le moindre, même pas faux pas, mais la moindre hésitation peut-être pourrait être très très grave. Et je suis consciente que la vie, dans ces moments-là, elle est très très fragile. Et j'espère qu'il tient suffisamment à sa vie pour garder toujours le pied sûr. Parfait. / Et quand tout le record du monde est fini, et des choses comme ça, et il a fait le record quatre fois, qu'est-ce que tu"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "risk & safety", "name": "Putting the cursors in the right place", "note": "Reining in an abnormal level of motivation and setting the limits where they belong - a project that works on paper still has to work in the mountains", "kw": ["Florian", "Dangerous", "Preparation", "Explaining"], "file": "DSC_0169", "i": "03:27:44:06", "t": "Et quand tout le record du monde est fini, et des choses comme ça, et il a fait le record quatre fois, qu'est-ce que tu / n'ai pas d'exemple concret comme ça. Je pense, si, peut-être mettre les limites et les curseurs au bon endroit. Il faut freiner un peu sa motivation hors norme et se dire, ok, ce projet, sur le papier, c'est possible. Mais dans la réalité, il y a peut-être encore un chemin avant d'arriver à ça. Notamment sur des itinérats un peu plus engagés. Par exemple, versant italien du Mont Blanc, sur certaines choses. / En quoi cette approche légère qu'il a en général change tout pour un projet comme les quatre faces du Mont Blanc ?"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "risk & safety", "name": "What gets forgotten is the investment", "note": "Projects like this demand an enormous physical and mental investment that is easy to overlook from outside", "kw": ["Florian", "Partner", "Preparation", "Dangerous", "Explaining"], "file": "DSC_0169", "i": "03:28:30:07", "t": "Je pense que des fois, ce qu'on a tendance à oublier, c'est que dès qu'il y a des projets comme ça, ça demande un investissement qui est très très important, tant physique, mental, temporel. Il y a vraiment un gros investissement pour arriver à une filialité comme ça. Et maintenant, un peu dans la société du zapping et du consommérisme tout de suite, les gens, des fois, ils ne se rendent pas compte à quel point ça peut être... / Pour Nico, par exemple, je pense que ce projet-là, c'est l'aboutissement de plein d'années de trail avant tout, et après d'alpi. Ce n'est pas quelque chose qui vient comme ça du jour au lendemain. Et en six mois, je... Hop ! Maintenant, je suis alpiniste et puis je vais faire un enchaînement. Donc voilà, je pense que potentiellement, ça peut rendre les choses plus accessibles pour les gens, mais il faut qu'ils essayent de se rendre compte que ce n'est pas"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "risk & safety", "name": "Mont Blanc is mythical, and still high mountain", "note": "Everyone wants to go because of the name, but it remains serious high mountain terrain", "kw": ["Florian", "Partner", "Mont Blanc", "Dangerous", "Alpine"], "file": "DSC_0169", "i": "03:29:22:10", "t": "Pour Nico, par exemple, je pense que ce projet-là, c'est l'aboutissement de plein d'années de trail avant tout, et après d'alpi. Ce n'est pas quelque chose qui vient comme ça du jour au lendemain. Et en six mois, je... Hop ! Maintenant, je suis alpiniste et puis je vais faire un enchaînement. Donc voilà, je pense que potentiellement, ça peut rendre les choses plus accessibles pour les gens, mais il faut qu'ils essayent de se rendre compte que ce n'est pas / essayent de se rendre compte que ce n'est pas si accessible que ça. Et ces problèmes sont des itinéraires mythiques comme le Mont Blanc où tout le monde a envie d'y aller, mais ça reste quand même très haut, ça reste de la haute montagne, il ne faut pas l'oublier. / Est-ce que ce projet... Alors, tu l'as déjà répondu partiellement ou même complètement à vrai dire, mais peut-être si on peut essayer de résumer. Est-ce que ce projet, les quatre faces en autonomie, c'est du trail ou de l'alpinisme ou c'est un truc nouveau ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "risk & safety", "name": "Crevasses were the worry", "note": "What preoccupied him most before leaving was the crevasses - the part he could do least about", "kw": ["Nicolas", "Post WR", "Dangerous", "Glacier", "Nervous", "Conditions"], "file": "A003C438_26062775", "i": "03:29:51:18", "t": "mal peut-être ? / Ce qui m'inquiétait le plus avant de partir, ou en tout cas ce qui était… je dirais même pas inquiété, ce qui me préoccupait le plus avant de partir, c'était les crevasses. Parce que c'est vraiment quelque chose que l'on ne maîtrise pas. Si il y a un pont de neige qui est vraiment fragile, on ne va pas le voir. Donc c'est peut-être la partie, qu'on ne soit pas difficile, mais aussi le plus aléatoire. C'est cette partie là où j'étais le moins à l'aise. Et essentiellement la première journée, parce qu'au niveau des grands mulets, c'est peut-être la section où il y avait plus de risques à ce niveau-là."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "risk & safety", "name": "Ninety kilometres an hour the night before", "note": "Seeing the forecast the evening before day one he admits he pulled a face, and they talked it through", "kw": ["Nicolas", "Post WR", "Wind", "Weather", "Nervous", "Conditions"], "file": "A003C438_26062775", "i": "03:30:25:03", "t": "Alors pour le premier jour, la veille au soir, qu'on a juste vu à ce moment-là qu'il y avait 90 km heure de vent annoncé, j'avoue que j'ai un petit peu tiré la gueule quand même. Et en en discutant, on a eu cette lucidité d'esprit de se dire, ah ouais, mais plutôt que de passer par l'arrêt des bosses, passer par le corridor, ça semble beaucoup plus approprié. Donc ça m'a assez vite rassuré sur le parcours, parce que je me suis dit au pire, au corridor je fais demi-tour. Ce que je n'avais pas prévu, c'est qu'il y a le brouillard qui serait aussi là, et que ça serait vraiment compliqué de naviguer au milieu des énormes crevasses du corridor. / Aussi avec la vue, ouais, c'est tout blanc. / Exactement, ouais, c'était vraiment un"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "risk & safety", "name": "Hunting snow bridges in the corridor", "note": "Deep among the crevasses looking for bridges that looked like they would hold - the moment he questioned the whole project", "kw": ["Nicolas", "Post WR", "Dangerous", "Glacier", "Snow", "Nervous"], "file": "A003C438_26062775", "i": "03:31:13:10", "t": "Exactement, ouais, c'était vraiment un / tout le projet ? / Le premier jour, il y a un moment donné justement, quand j'étais vraiment dans le corridor, au plein milieu des crevasses, où j'ai essayé de chercher des passages sur des ponts de neige qui me semblaient quand même suffisamment sûrs, parce qu'il y en a quelques-uns où ça aurait pu passer aussi, mais je ne me suis pas risqué. J'ai vraiment eu un gros doute. Et j'ai enregistré justement une vidéo que j'ai envoyée à toute l'équipe pour dire, écoutez, là je vais encore essayer de progresser jusqu'au mur de la côte. Mais c'est sans aucune garantie. Je ne sais pas si je pourrais atteindre le sommet avec les conditions comme ça. / Vous pouvez y aller, pardon. / Désolé, il fallait pas aller nous. / Je ne l'ai pas vu. / À moins que ça vous intéresse, sinon... / À moins que"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "risk & safety", "name": "How friends read the risk", "note": "He often thinks about exchanges with friends, because they approach an alpine route very differently", "kw": ["Nicolas", "Post WR", "Partner", "Dangerous", "Alpine", "Explaining"], "file": "A004C001_260627PB", "i": "03:32:30:12", "t": "À moins que / sais pas pour cette prise de risque pour le les risques en montagne je prends souvent des échanges que j'ai avec des amis parce que quand eux ils apportent une course en alpinisme beaucoup sont à cet endroit là il ya ça qui pourrait mal se passer ça qui pourrait mal se passer ça qui pourrait plus un regard vous me dis ok on va commencer on sait qu'il ya quelques endroits où il va falloir faire gaffe par contre on verra sur le moment on va pas commencer à envisager tous les scénarios du pire alors que ça se trouve très bien aller durant toute la course c'est à la fois je pense il ya mon état d'esprit est aussi ce dont on parlait avant c'est une sorte de naïveté je pense qui est nécessaire mais / je reviens encore une chose là tu parles de gens qui sont je vais pousser jusqu'à ce qu'on a cette réponse parce que c'est assez important / ce qui est vraiment / je pense justement que le gap il est moins important avec des personnes qui ne connaissent rien que les personnes qui ont déjà des notions parce que les personnes qui ne connaissent rien elles ont vraiment ce et se rendent pas compte une seule seconde de ce que c'est alors que les personnes qui connaissent vont déjà avoir même si elles ne connaissent pas pas tout si c'est une pratique qui est moins fréquente plus légère je sais pas comment dire mais elles ont quand même cette perception"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "risk & safety", "name": "The gap is smaller with people who know nothing", "note": "People with no notions at all are easier to talk to about this than people with partial knowledge", "kw": ["Nicolas", "Post WR", "Explaining", "Dangerous", "Partner"], "file": "A004C002_2606275W", "i": "03:33:29:23", "t": "ce qui est vraiment / je pense justement que le gap il est moins important avec des personnes qui ne connaissent rien que les personnes qui ont déjà des notions parce que les personnes qui ne connaissent rien elles ont vraiment ce et se rendent pas compte une seule seconde de ce que c'est alors que les personnes qui connaissent vont déjà avoir même si elles ne connaissent pas pas tout si c'est une pratique qui est moins fréquente plus légère je sais pas comment dire mais elles ont quand même cette perception"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "risk & safety", "name": "Balancing enthusiasm against competence", "note": "Trying to hold a balance between the enthusiasm he has, the risks, and his actual competence", "kw": ["Nicolas", "Post WR", "Dangerous", "Preparation", "Explaining", "Alpine"], "file": "A004C002_2606275W", "i": "03:34:05:10", "t": "chèvre de montagne ? / Je… je… je… je… je… je… je… j'essaye de garder un équilibre entre l'enthousiasme que je peux avoir, euh… les risques, euh… les compétences, euh… c'est peut-être là où je fais le plus de travail sur moi en ce moment. Euh… j'ai peut-être trop d'enthousiasme des fois, donc euh… j'essaye de… de mélanger un peu tout ça pour avoir euh… pour avoir quelque chose qui ressorte et qui soit… qui soit… qui soit courir. / Et ça c'est une grande…"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "route & conditions", "name": "Grands Mulets is the one he wants least", "note": "No great difficulty but too random for his liking", "kw": ["Nicolas", "Pre WR", "Glacier", "Conditions", "Dangerous", "Explaining"], "file": "A002C001_260527DC", "i": "03:36:42:14", "t": "Alors pour parler des quatre itinéraires, si on commence par l'étire des grands mulets, c'est je pense l'itinéraire que j'ai le moins envie de faire, on pourrait dire. Pourquoi ? Parce que c'est celui qui est le plus aléatoire. Au niveau de la jonction, c'est un endroit qui est extrêmement crevassé. J'ai été à Grand Ski cet hiver et je suis passé dans une crevasse. Heureusement, les skis m'ont bien retenu, on était encordé. Et là, je vais devoir le passer en solo. / Et cet aspect d'aléatoire, ce n'est pas quelque chose que j'affectionne. / Après, techniquement, c'est extrêmement facile."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "route & conditions", "name": "Saint", "note": "A route he has done before, with the Grand Couloir to cross; the stone fall there does not trouble him unduly", "kw": ["Nicolas", "Pre WR", "Mont Blanc", "Dangerous", "Conditions", "Explaining"], "file": "A002C001_260527DC", "i": "03:37:21:21", "t": "en soi, il n'y a pas de grosses difficultés, mais ce côté aléatoire, je ne l'aime pas. / Ensuite, il y a l'itinéraire depuis Saint-Gervais. Il y a une sinéraire que j'ai déjà fait depuis les Oufs ou depuis Saint-Gervais, mais qui est relativement similaire. C'est la voie normale en été du Mont-Blanc. Cette sinéraire-là, je le connais vraiment par cœur. Je suis extrêmement à l'aise, donc ça va vraiment bien dérouler. / Oui, il peut y avoir des endroits avec des crevasses. Oui, il peut y avoir des endroits avec des crevasses, mais ça reste vraiment limité. C'est vraiment très fréquenté, donc ça réduit bien le risque. / Il y a le grand couloir à traverser. Maintenant, dans les OEA, dans lesquelles je vais traverser, je dirais que ce n'est pas quelque chose qui m'embête plus que ça. / Ensuite, il y a l'itinéraire"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "route & conditions", "name": "The Jonction is the part he likes least", "note": "An obligatory passage rather than an enjoyable one", "kw": ["Nicolas", "Glacier", "Conditions", "struggling"], "file": "DSC_0095", "i": "03:38:10:03", "t": "Ensuite, il y a l'itinéraire / quand tu arrives ? / Alors pour moi, la jonction, c'est peut-être le passage que j'ai apprécié le moins du projet. Maintenant, c'est un passage obligé parce que c'est le passage qui va être le plus crevassé avec des ponts de neige. / Et je dirais que c'est le passage qui m'inquiète le plus. Il y a d'autres endroits qui vont être plus compliqués techniquement, où il y a de l'escalade, je pense, enfin l'aiguille de Bionasset, qui sont plus impressionnants. Mais là, c'est moi qui maîtrise la situation. J'ai beaucoup moins d'aléas que je ne maîtrise pas. / D'accord. Et peut-être"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "route & conditions", "name": "Snow bridges between the seracs", "note": "Back from a recce and a ski descent of Mont Blanc, he has already noticed changes; the flat section at the Jonction hides snow bridges between the seracs", "kw": ["Nicolas", "Glacier", "Snow", "Dangerous", "Conditions"], "file": "DSC_0095", "i": "03:38:48:09", "t": "D'accord. Et peut-être / Alors aujourd'hui, on est venu à la jonction. J'étais aussi la semaine dernière en repérage et faire le Mont Blanc à ski. Et j'ai déjà remarqué énormément de changements en une semaine alors qu'il n'a pas fait spécialement chaud. Donc pour le projet, au mois de juin, je serai obligé de venir faire un repérage 2-3 jours avant avec un ami pour être sûr de l'endroit où je vais passer le jour J et éviter justement les endroits qui pourraient être problématiques par rapport au pont de neige. / D'accord. Et peut-être tu peux seulement expliquer la problématique de la crevasses ou l'endroit en plein de sentence. / Alors la problématique à la jonction, c'est qu'il y a un endroit assez plat où il y a des ponts de neige qui se font facilement entre les séraques et on ne peut pas vraiment le voir. Donc on marche dessus et si le pont de neige n'est plus assez solide, on peut tomber vraiment dans la crevasse. D'accord. Cool."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Wind forecast: 70 passable, 90 is dicey", "note": "Morning forecast of 90 km/h at 4000m dropping to 70 in the afternoon; 70 can be worked with, 90 cannot", "kw": ["Nicolas", "Wind", "Weather", "Conditions", "Preparation"], "file": "A003C007_260611XF", "i": "03:39:49:12", "t": "Alors la problématique à la jonction, c'est qu'il y a un endroit assez plat où il y a des ponts de neige qui se font facilement entre les séraques et on ne peut pas vraiment le voir. Donc on marche dessus et si le pont de neige n'est plus assez solide, on peut tomber vraiment dans la crevasse. D'accord. Cool. / possible avec Nami ? Il prévoit jusqu'à 2.015 km heure et après 90 km heure à 4.000. À quelle heure ? / Et après il prévoit dans l'après-midi 70. / Donc c'est pas fou 70 mais 70 ça peut passer. 90 c'est chaud, vraiment très très chaud."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Talking about delaying the start", "note": "No wind data yet for Saturday; discussing pushing the departure back two hours to see if it calms", "kw": ["Nicolas", "Wind", "Weather", "Start", "Preparation"], "file": "A003C007_260611XF", "i": "03:40:15:12", "t": "A partir de samedi, il n'y a pas encore d'info sur le vent mais c'est tendu. / Et de le décaler ? / Enfin de le décaler dans la journée je dis, tu vois, de commencer plus tard. / ça se calme quand même. / Comme toujours, le plus compliqué, c'est avant d'arriver sur la trace principale, dans quelle rue passer, ça ne me vitera pas pendant 5 minutes parce que je me suis perdu en ville. Et il n'y a pas trop obsessif, dans quel Rouge doğret des énerges."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The hardest part is before the main track", "note": "As always at the start, the complicated part is reaching the main line - crossing the Jonction and what lies in it", "kw": ["Nicolas", "Glacier", "Conditions", "Start", "Explaining"], "file": "A003C106_260611ZQ", "i": "03:40:42:18", "t": "Comme toujours, le plus compliqué, c'est avant d'arriver sur la trace principale, dans quelle rue passer, ça ne me vitera pas pendant 5 minutes parce que je me suis perdu en ville. Et il n'y a pas trop obsessif, dans quel Rouge doğret des énerges. / Combien de beers faissent dwarvues, aujourd'hui, les deux en leur / parce que tu vas crosser la jonction et tu as déjà tombé là un petit peu ? / Oui, j'ai fait une petite tute en crevasse à la jonction cet"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Skis on his back at the Jonction", "note": "Remembers crossing roped up with skis on his back and not being keen on it", "kw": ["Nicolas", "Glacier", "Dangerous", "Gear", "Conditions"], "file": "A003C106_260611ZQ", "i": "03:41:18:23", "t": "Oui, j'ai fait une petite tute en crevasse à la jonction cet / cet hiver, j'avais des skis sur le dos, ça m'a bloqué, on était encordé, donc c'est un endroit que forcément je n'aime pas trop. Là, de ce que j'ai pu discuter avec quelqu'un qui est passé hier, les conditions ont l'air bonnes, il ne fait pas trop chaud, je serai assez tôt, j'étais passé en fin de journée en descendant du Mont Blanc cet hiver, donc ça va. / Ce qui est marrant, c'est que ce qui rend le plus nerveux, c'est le pire. Donc / J'aurais dit hier après-midi, j'aurais dit là c'est la Junction qui me plaît pas trop mais maintenant c'est plus le vent qui me... Donc"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The Torino transition and its problems", "note": "Explains the crossing to Courmayeur, the glacier section to the Torino hut, and where it gets difficult", "kw": ["Nicolas", "Glacier", "Mountain Hut", "Explaining", "Conditions"], "file": "A004C046_260613H5", "i": "03:41:58:03", "t": "J'aurais dit hier après-midi, j'aurais dit là c'est la Junction qui me plaît pas trop mais maintenant c'est plus le vent qui me... Donc / problème avec le door ? La porte, la porte, pour le lendemain ? / Alors une fois qu'on est là, il y a la transition à faire qui consiste à aller à Courmayer qui se trouve ici. / Et il y a plusieurs problèmes. Donc déjà, / il y a une section à traverser ici, glaciers, jusqu'au Refuge Torino. / Donc ça, bon, rien de spécial. Et après, il y a une descente qui est vraiment très escarpée sur le haut. Et il y a une porte de l'ancien refuge qui permet d'y accéder. Donc là, j'ai appelé le refuge Torino. Ils ne savent même pas si la porte est déjà ouverte vu la saison. / Et j'ai regardé"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Webcams and word of mouth, no clear answer", "note": "Checked webcams the week before and asked people who had been through; nobody could tell him", "kw": ["Nicolas", "Conditions", "Preparation", "Explaining"], "file": "A004C046_260613H5", "i": "03:42:44:16", "t": "Et j'ai regardé / Et j'ai regardé les webcams la semaine dernière. Il reste encore de la neige. Donc je leur ai demandé des infos sur les conditions pour savoir s'il y a déjà des gens qui étaient passés. / Ils ne pouvaient pas me dire. / Et on vient d'avoir d'autres infos à l'instant. Donc, à priori, la descente n'est pas du tout praticable. On était déjà limite au niveau du timing. Parce que vu la traversée qu'on a à faire pour arriver... / Ça va faire demain pour arriver ici. Ça va être assez tard. La descente, elle était assez longue."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The descent is not passable", "note": "New information arrives: the Torino descent is impassable and the timing was already tight, so plan B is forced", "kw": ["Nicolas", "Dangerous", "Conditions", "Explaining"], "file": "A004C046_260613H5", "i": "03:43:17:19", "t": "Ça va faire demain pour arriver ici. Ça va être assez tard. La descente, elle était assez longue. / descente, elle était assez longue. Donc là, avec toutes les incertitudes qu'il y a ici, on ne sait même pas si c'est possible de passer ou pas. / Il va falloir qu'on parte sur le plan B. Donc le plan B, ça consiste... / Puisqu'on... Je ne souhaite vraiment pas utiliser le moyen de transport pendant les ascensions. Ça consiste à repartir de..."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Rebuilding the route from the Aiguille du Midi", "note": "Plan B starts from the Aiguille du Midi where he will already be, shortening what was planned for the last day", "kw": ["Nicolas", "Aguille du Midi", "Mont Blanc", "Explaining", "Preparation"], "file": "A004C046_260613H5", "i": "03:43:43:09", "t": "Repartir de l'aiguille du midi où je serai arrivé en fin de journée. Pour faire le plus rapidement possible avec F4N supported. Aiguille du midi, Mont Blanc, Aiguille du midi. Donc, ça raccourcit un petit peu ce qui était prévu sur les derniers jours. / Mais au vu de tous les éléments qu'on a eu. Redescendre sur le versant italien par ce chemin-là. Ça ne va pas être possible. Donc, on a bien été obligé de trouver quelque chose d'alternatif. En soi, c'est une autre des voies classiques du Mont Blanc. Donc, je trouve que ça a tout à fait du sens de le faire comme ça. / C'est dommage pour toi quand"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "Plan B has to make sense on its own", "note": "A fallback purely for the sake of a fallback would not do; the Aiguille du Midi route is a classic in its own right", "kw": ["Nicolas", "Explaining", "Aguille du Midi", "Mont Blanc"], "file": "A004C046_260613H5", "i": "03:44:24:05", "t": "C'est dommage pour toi quand / Alors, si c'était un plan B, juste pour trouver un plan B, ça ne me conviendrait pas. Là, je trouve que le plan B, il a aussi du sens. / C'est aussi une des routes classiques du massif du Mont Blanc. C'est aller-retour, aiguille du midi, sommet du Mont Blanc, retour aiguille du midi. Et c'est souvent une course qui se fait même justement à la journée. Les gens, ils viennent, ils prennent la première benne le matin. / Ils font le sommet, ils redescendent. Et l'objectif,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "route & conditions", "name": "The same mountain, a day apart", "note": "Two successive days on the same mountain and it is completely different - wind, cloud and fog change everything", "kw": ["Nicolas", "Weather", "Conditions", "Mountain", "Explaining"], "file": "A004C048_260613PO", "i": "03:44:54:08", "t": "Ils font le sommet, ils redescendent. Et l'objectif, / je réalise toujours que c'est quelque chose... j'en pense que tu as une porte ouverte mais une même montagne, la météo ça change tout, le vent, des nuages, du grouillard, j'ai bien vu là, deux jours successifs, enfin c'était... le premier jour c'était un cauchemar et le deuxième, alors oui il y avait du vent mais il y avait un grand ciel bleu donc on a de la visibilité, on sait où on va, / c'est beaucoup plus facile. Avec le vent, quand on ne sait pas où on va en plus, combien de temps on a encore à faire, c'est des passages escarpés, c'est du grouillard, on ne voit"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "Still some apprehension at Bionnassay", "note": "Not hard climbing but real climbing, and he stayed concentrated - while knowing it was the part he would enjoy most", "kw": ["Nicolas", "Post WR", "Ridge", "Alpine", "Nervous", "Scrambling"], "file": "A003C438_26062775", "i": "03:45:33:16", "t": "c'est beaucoup plus facile. Avec le vent, quand on ne sait pas où on va en plus, combien de temps on a encore à faire, c'est des passages escarpés, c'est du grouillard, on ne voit / Disons que j'avais encore un peu d'appréhension. Parce que je savais que j'arrivais à l'aiguille de Bionasset. Ça ne grimpe pas très difficile, mais il y a quand même un peu d'escalade. Après, j'avais vu l'arrête la veille, depuis le jour 2. Donc, tout ce que j'avais vu de loin, elle me semblait bien effilée. Ça s'est confirmé où elle était vraiment très effilée cette année. En fonction des années, des saisons, ça change. / Donc, j'ai resté encore vraiment concentré par rapport à ça. Et c'était le moment que je savais que j'allais vraiment le plus apprécier dans le projet."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "How day three broke down", "note": "A lot of vertical first, cardio work to gain time, then the alpine sections", "kw": ["Nicolas", "Post WR", "Alpine", "Ridge", "Explaining", "Training"], "file": "A003C438_26062775", "i": "03:46:08:00", "t": "Donc, le troisième jour, il se décomposait vraiment en plusieurs parties. Et la première partie, c'était vraiment beaucoup de dénivelé, assez cardio, où le but, c'était d'aller vite pour gagner du temps pour le reste de la journée. Et j'avais encore une hésitation sur l'itinéraire avant d'arriver au Dome de Millage pour aller sur l'Aiguille de la Bérangère. Donc, je ne savais pas si je voulais passer devant le refuge des conscrits ou on peut bifurquer un petit peu avant pour aller en plus direct sur l'Aiguille de la Bérangère. Mais je ne savais pas si elle serait praticable, si la neige porterait assez, notamment. Et j'avais traversé quelques nevées. Donc, je me suis dit, allez, je tente le coup. Ça me fait gagner un petit peu de temps et c'est l'itinéraire que je prends d'habitude. Donc, j'ai pris cette itinéraire un peu plus directe. Et au final, ça a été, je pense, ma meilleure décision de la journée du projet parce que je me suis retrouvé dans des pentes de neige où ça portait super bien. Alors que des fois, c'est du caillou qui est un peu délité, donc pas très stable. Et ça m'a permis d'avancer vraiment très rapidement à ce niveau-là. Ensuite, il y avait la partie, on arrive à l'Aiguille de la Bérangère. On traverse les Dômes de Millage. Et là aussi, il y a encore pas mal de neige. On est assez tôt dans la saison. Donc, ça a déroulé vraiment super bien."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "No tracks at the Refuge du Rier", "note": "Nobody had been through - just as well, he would not have been allowed to stop anyway", "kw": ["Nicolas", "Post WR", "Mountain Hut", "Conditions", "Alpine", "Explaining"], "file": "A003C438_26062775", "i": "03:47:31:19", "t": "J'arrive au Refuge du Rier. Il n'y a pas de traces de personne. Pourtant mieux, de toute façon, je n'aurais pas eu le droit de m'arrêter. Ça aurait été frustrant. Et je continue sur l'aiguille de Bionasset. Il y a d'abord une grande pente de neige à monter avant d'arriver sur le Bastion Rocheux. Et je le connais assez bien. Je l'ai déjà fait plusieurs fois. Mais c'est vrai qu'après, le fait d'être en solo, même si c'est pas difficile, il y a quand même quelques pas où on est un peu plus vigilant. On a quand même les mains un peu plus moites que d'habitude. Mais ça s'est super bien passé en fait. J'ai vraiment apprécié. Je ne sais pas, c'est comme en ski. Des fois, les premiers virages, quand il y a quelque chose d'un peu raide, ils sont un peu compliqués. Mais en fait, là, c'était juste les premiers mouvements qui étaient peut-être un peu plus difficiles psychologiquement. Et après, ça a vraiment tellement bien déroulé. C'était génial. / Arrivé en haut de"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "The Bionnassay ridge was razor thin", "note": "He usually runs this ridge to gain time; this time it was impossible, so he took it slowly instead", "kw": ["Nicolas", "Post WR", "Ridge", "Dangerous", "Conditions", "Snow"], "file": "A003C438_26062775", "i": "03:48:28:15", "t": "Arrivé en haut de / Arrivé en haut de l'aiguille, il y a la fameuse Arête de Bionasset. J'arrive devant l'Arête et oui, effectivement, j'ai vu qu'elle était vraiment super effilée. Il y avait la trace qui était quasiment sur le fil de l'Arête. Ça descendait un petit peu à gauche, un petit peu à droite des fois, selon l'on cheminait entre les deux versants. / D'habitude, je cours souvent sur cette Arête. Ça permet de gagner pas mal de temps et là, franchement, impossible. Donc, je me suis dit, bah voilà, c'est pas grave. Je prends mon temps. J'apprécie. C'était magnifique. Et donc, j'ai continué comme ça. / Là, je savais que j'avais passé les passages les plus techniques de la journée. / Aussi avec des ponts de neige, ouais ? / Non, alors là, justement, rien du tout jusque là. / Je savais que j'avais passé les"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "Ice on the Mont Maudit", "note": "Some climbing with ice about, and he was glad of the second small axe he had brought", "kw": ["Nicolas", "Post WR", "Gear", "Dangerous", "Alpine", "Scrambling"], "file": "A003C438_26062775", "i": "03:49:22:05", "t": "j'arrive d'abord au Mont Maudit où il y a un peu des escalades à fer. Il y avait un peu de glace. Donc, j'avais pris un deuxième petit piolet. J'étais bien content de l'avoir. Ça a très bien été. Et après, les ponts de neige, effectivement, au niveau du Mont Blanc, du Zaku, / ça va. Je m'attendais à pire. Donc, disons que je pense que ce soit bien que dans ce sens-là, on m'avait dit, ah, il y a d'énormes ponts de neige. Et je me dis, ça va, c'est raisonnable par rapport à ce que j'avais fait le premier jour. Donc, que le sens inverse, ça a vraiment bien été. / À ce niveau-là,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "A navigation error on glazed track", "note": "The track had iced over and was no longer visible; he did not want that at this point but had no choice", "kw": ["Nicolas", "Post WR", "Conditions", "Dangerous", "Snow", "struggling"], "file": "A003C438_26062775", "i": "03:49:56:17", "t": "À ce niveau-là, / À ce niveau-là, peut-être la dernière chose au niveau du Mont Blanc, du Zaku, j'ai fait une erreur de parcours où la trace s'est un peu glacée. Donc, la trace, on ne la voyait plus vraiment. Et je ne suis pas parti du tout dans la bonne direction. Donc, j'ai dû revenir sur mes pas. Ça, moi, je pense bien coûter, peut-être une bonne demi-heure. / Je n'avais vraiment pas envie de ça à ce moment-là. Mais bon, il n'y avait pas le choix. Je n'allais pas m'arrêter pour ça. Et c'est ce qui m'a... C'est ce qui a fait qu'au final, je n'ai pas battu le temps que j'avais fait l'année d'avant en seige du sportif. Donc, sinon, j'aurais réussi à le battre. Ce n'est pas grave, ce sera pour nous, toi. / Et après, à la fin du jour, tu as dormi à un refuge avec les autres personnes. / Comment ça, c'était pour la régénération ? C'était un petit peu... Ouais, c'était... C'était comment pour toi ? / Alors, dormir en refuge"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "The harness he did not have", "note": "Getting up at the refuge he realised he had no harness; the rescue services expect one, and a lent ice screw solved it", "kw": ["Nicolas", "Post WR", "Gear", "Mountain Hut", "Dangerous", "Preparation"], "file": "A003C438_26062775", "i": "03:50:56:24", "t": "Alors, dormir en refuge / Alors, la petite anecdote du refuge, c'est que le matin, quand je me suis levé, je suis d'abord allé prendre mon petit déjeuner. Et après, je me dis, bah, voilà. Peut-être l'heure d'y aller, même si on aime bien traîner, reprendre un café. Donc, je suis allé pour m'équiper. Et je trouve pas mon baudrier. D'abord, je me dis aussi que je l'ai laissé. Il y avait tous mes affaires. Et au final, j'ai cherché dans toute la salle où il y a l'équipement, plus de baudrier, avec le matériel qu'il y avait dessus. Donc, bah, c'était pas très pratique. En soi, je peux m'en passer, vu que j'étais seul de toute façon. Mais je considère toujours que s'il devait y avoir un secours, / bah, pour les équipes de secours, le minimum, c'est quand même de mettre un baudrier, de manière à ce qu'ils puissent facilement faire leur secours. Donc, j'ai de la chance parce que, en demandant à gauche à droite, on m'a prêté un baudrier. La gardienne m'a prêté une broche à glace aussi. Et ça m'a permis d'avoir le matériel pour repartir. / En anglais, have you been afraid that the project will fail this morning? Non, bah, du tout. / J'ai pas du tout été inquiet que le projet soit annulé parce que je savais que de toute façon, je repartais. La question serait, est-ce que je repartais avec un baudrier ou ça?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "Why the fourth day changed", "note": "The Torino to Courmayeur descent was the deciding factor; he preferred to secure day four with another line", "kw": ["Nicolas", "Post WR", "Conditions", "Dangerous", "Mountain Hut", "Explaining"], "file": "A003C438_26062775", "i": "03:52:19:09", "t": "Alors, pour le changement d'itinéraire sur le quatrième jour, ce qui a été vraiment déterminant, c'est de la descente entre Torino et Courmayeur. Il y a la première section qui est vraiment très escarpée. En temps normal, c'est du trail running, on pourrait dire, mais assez escarpé, avec pas mal de pierres. Et là, de ce qu'on a pu voir sur les webcams, et c'est ce qui a été confirmé pendant le projet par des personnes, c'est qu'il y avait encore pas mal de neige, il y avait des chutes de pierres aussi. Donc, j'ai pas voulu prendre le risque sur une partie. / comme ça, sachant que si ça... c'était pas possible de passer ou pas... ça remettrait même le 4ème jour en péril. Donc j'ai préféré sécuriser le 4ème jour par un autre itinéraire que de prendre le risque de passer par là. / Et le plan alternatif, c'est d'aller seulement... Bon, seulement... D'aller dans le refuge en Montblanc. / Et c'est un bien alternatif pour toi. C'est pas ? Oh pardon. Ouais, maintenant... Je vais... / Maintenant, il se met un peu. / C'est pas pour toi ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "route & conditions", "name": "A line that did not exist as an FKT", "note": "The day-four alternative had no record on it at all, and he found it more emblematic of Mont Blanc than he expected", "kw": ["Nicolas", "Post WR", "Mont Blanc", "Aguille du Midi", "Explaining", "Alpine"], "file": "A003C438_26062775", "i": "03:53:49:03", "t": "C'est pas pour toi ? / FKT ? Oui. / Alors, l'alternatif du 4ème jour, en fait, c'est un itinéraire qui existait même pas en FKT. Et j'ai été surpris parce qu'au final, ça nous tient assez emblématique, je trouve, pour le Montblanc. Parce que c'est un peu l'itinéraire qu'on va faire. On veut faire quelque chose à la journée, rapidement. Enfin, qu'on veut faire le Montblanc rapidement à la journée, sans partir de la vallée. On prend la première benne le matin à l'aiguille du midi. On monte au sommet, on redescend. Et l'objectif, c'est d'avoir la dernière benne, de ne pas avoir à dormir dans les WC. Donc, j'ai été surpris qu'il n'y ait pas d'FKT. Je trouvais que c'était vraiment une bonne alternative. D'autant que j'avais déjà fait cet itinéraire en descente, d'ailleurs le 3ème jour, mais je n'avais jamais fait cet itinéraire en montée. Donc, ça a été une première de le faire. Donc, c'était assez sympa de rajouter ça dans le projet. / Parfait. Et quand tu es arrivé au"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Only watched the wind", "note": "Kept moving at the summit because of the wind, did not linger before descending", "kw": ["Nicolas", "Wind", "Conditions", "Summit"], "file": "A003C134_26061230", "i": "03:56:38:02", "t": "toujours dû te regarder le vent des autres tu as combien tu / je n'aime pas mais c'est soufflé mais c'est pour ça que je n'ai pas traîné en haut pour redescendre parce que c'est vrai que dès que tu descendais aux alentours des 4000 ça c'est assez bien / on a vu tu as vraiment fait l'aller-retour tu as touché le sommet tu / as parti je peux"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Energy spent, day 3 must be rest", "note": "Used far more energy than expected; needs the next day easier to arrive rested at Bionnassay", "kw": ["Nicolas", "Tired", "Conditions", "Preparation"], "file": "A003C134_26061230", "i": "03:56:59:15", "t": "as parti je peux / quel est ton level d'énergie beaucoup plus / beaucoup plus que je pensais beaucoup plus que ce que je pensais aujourd'hui je m'étais dit justement ça va être la journée un peu cool pour se mettre dans le bain et en fait ça m'a séché donc je pense que le niveau de la gestion demain il faut que je fasse un peu plus cool pour la troisième journée à bionnasset parce que c'est une très très longue journée bionnasset et technique en plus donc il faut que j'arrive au plus reposé possible à bionnasset / donc demain c'est journée"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Snow did not hold above 3500", "note": "Expected good support from scouting the previous weekend; above the hut and 3500m it broke down", "kw": ["Nicolas", "Snow", "Conditions", "Explaining"], "file": "A003C134_26061230", "i": "03:57:35:05", "t": "donc demain c'est journée / Et je pensais vraiment, comme j'étais allé en montagne le week-end dernier, que ça allait bien porter. Mais là il est encore un peu neigé cette semaine, et en fait c'est au-dessus du refuge. Donc moi j'étais allé jusqu'à 3005 à peu près, ça portait bien. Et là c'est au-dessus de 3005 que ça commence vraiment à devenir la cata. Et"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Wind erased all the tracks", "note": "Fog plus wind had blown out every track; navigated by the planned route on his watch", "kw": ["Nicolas", "Wind", "Conditions", "Watch", "struggling"], "file": "A003C134_26061230", "i": "03:57:58:08", "t": "Et je pensais vraiment, comme j'étais allé en montagne le week-end dernier, que ça allait bien porter. Mais là il est encore un peu neigé cette semaine, et en fait c'est au-dessus du refuge. Donc moi j'étais allé jusqu'à 3005 à peu près, ça portait bien. Et là c'est au-dessus de 3005 que ça commence vraiment à devenir la cata. Et / la cata. Et en plus dans le brouillard, comme il y avait beaucoup de vent, ça avait soufflé toutes les traces. Donc dans le brouillard c'était une de ces galères pour s'orienter. Parce que moi j'avais la trace sur la montre de ce que je voulais faire au départ. / Je n'ai pas pensé à le mettre"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Had to go and get it", "note": "Needed the summit mentally; set a limit and would have turned back if he could not run the descent", "kw": ["Nicolas", "Dangerous", "Conditions", "Summit", "Explaining"], "file": "A003C138_260612WR", "i": "03:58:17:12", "t": "Je n'ai pas pensé à le mettre / Non, justement j'étais vraiment bien dans la tête sinon je n'aurais pas pu aller au sommet. / Parce que là il fallait vraiment aller chercher quand même. / Il fallait vraiment aller chercher et dire ok maintenant j'y vais c'est bon. / Je me disais fixer une limite, si je me sentais plus capable de courir pour descendre, je faisais demi-tour. Parce que la météo qu'il y avait, il faisait vraiment super super froid. Et je me suis dit, si"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "The turnaround criterion", "note": "As long as he could still run the descent he kept climbing; degrading wind would have changed that", "kw": ["Nicolas", "Dangerous", "Wind", "Explaining"], "file": "A003C138_260612WR", "i": "03:58:46:19", "t": "Je me disais fixer une limite, si je me sentais plus capable de courir pour descendre, je faisais demi-tour. Parce que la météo qu'il y avait, il faisait vraiment super super froid. Et je me suis dit, si / Et je me suis dit, si je dois, je monte et qu'après je dois traîner sur la descente avec le vent. Il suffit que ça se dégrade encore un peu, ça devient vraiment chaud. Donc je me suis dit tant que je me dis ok je peux courir pour la descente, je peux continuer à monter."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Would have had to be truly dangerous", "note": "The project matters too much to abandon on day one; only real danger would have stopped him. ALSO STRONG FOR: motivation", "kw": ["Nicolas", "Dangerous", "Explaining"], "file": "A003C138_260612WR", "i": "03:59:03:12", "t": "C'est vraiment un projet qui me tient à cœur. Donc le premier jour comme ça, se dire non ça passe pas, non c'était pas possible. / Il aurait vraiment fallu que ça soit vraiment trop dangereux pour dire ok je suis demi-tour. / Et puis en termes de température,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Minus 15 to minus 20", "note": "Cold but kept moving to stay warm; coldest stretch between 4000m and the summit", "kw": ["Nicolas", "Conditions", "Weather", "Summit"], "file": "A003C138_260612WR", "i": "03:59:31:09", "t": "Et puis en termes de température, / quoi ça ? C'était quoi, à moins 15 ? Quelque chose comme ça ? / Je sais même pas, à partir de combien les 6, l'IGL ? / Tu aurais tendance à dire moins 20 ? / Ouais, non c'est... Ouais genre je vois. J'ai eu froid mais... Oui si j'ai eu froid. Mais j'étais tout le temps en mouvement, c'est pour ça que je ne suis pas resté longtemps au sommet. Pour éviter... Et après c'était le plus froid, c'était entre 4000 et 488. Le reste ça allait. Ok. On n'est pas trop trop devant. / Est-ce qu'on a vu déjà une partie du"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Stayed in a good state of mind", "note": "Frustrated by the conditions but never lost morale", "kw": ["Nicolas", "happy", "Conditions"], "file": "A003C138_260612WR", "i": "04:00:01:10", "t": "Est-ce qu'on a vu déjà une partie du / Non, je suis de bonne humeur. Non, non franchement, en fait je suis tout le temps resté dans un bon état d'esprit. Ah ouais ça me saoulait, franchement c'est clair, ça me saoulait. Mais j'étais encore positif."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Hoping not the same tomorrow", "note": "Clear skies now; the same wind that caused the trouble is what cleared it", "kw": ["Nicolas", "Weather", "Wind"], "file": "A003C138_260612WR", "i": "04:00:17:01", "t": "Mais j'espère quand même qu'il n'y aura pas la même métier le prochain jour. / C'est bête parce que là on pense que c'est beau. Ouais mais... Je sais pas, c'est bizarre parce que ça s'est dégagé. Avant c'était... / On ne voyait rien. / Ah ouais ? / Ouais, on ne voyait même pas / les sommets là. J'ai pas eu de balle en fait. Ouais, je pense. Bah je pense que c'est le vent qui a poussé tout ça."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Clear, but the wind on the ridge", "note": "Fine weather with no mist, but it blew hard on the ridge and at times he had to lie flat on the ground", "kw": ["Nicolas", "Wind", "Ridge", "Conditions", "struggling"], "file": "A004C002_260613C4", "i": "04:00:37:14", "t": "vrai. Oui, grand baux, mais un vent. Ah ouais ? Oui. / Je pense que par moment c'était pire que hier. / mais avec il n'y avait pas le la brume donc ça allait mais sur l'arrêt ça soufflait j'ai toujours dit me coucher par terre des fois ouais ouais c'était tendu / sur certains passages c'est bon tu as atteint des espèces de petits col comme ça ça fait un effet du coup mais c'est marrant parce qu'après des fois 50 mètres après il n'y avait plus rien et après ça revenait mais ouais tout est en super condition donc c'est vraiment cool"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Fog on the glacier, unfamiliar sector", "note": "Retrospective: trailbreaking in heavy fog on the glacier, in a sector he did not know", "kw": ["Nicolas", "Glacier", "Conditions", "struggling"], "file": "A004C047_260613OO", "i": "04:01:17:16", "t": "ça brassait et il y avait de ces vents, c'était un truc de dingue. / Il y avait tellement de brouillard sur le glacier, et en plus, c'est un secteur, j'y suis allé, mais je ne le connais pas bien. Ce n'est pas un secteur où, déjà dans le brouillard, de toute façon,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "After Grands Mulets it got complicated", "note": "Retrospective: deep snow, then fog arriving at the plateaus; followed earlier ski tracks", "kw": ["Nicolas", "Snow", "Conditions", "Glacier", "struggling"], "file": "A004C047_260613OO", "i": "04:01:38:01", "t": "et après, les Grands Mulets, ça a commencé à devenir compliqué, parce que ça brassait, plus ou moins selon les secteurs, et là, il y a le bourrière qui est venu, au niveau des plateaux, / j'ai réussi au début à suivre les traces de ski de gens qui étaient passés, je pense, la veille, ou les deux jours,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Above the Mur de la Cote", "note": "Retrospective: snow much harder above the Mur; searching for a line he knew from weeks earlier", "kw": ["Nicolas", "Snow", "Conditions", "Explaining"], "file": "A004C047_260613OO", "i": "04:02:00:08", "t": "le mur de la côte, je me souviens quand j'y étais il y a quelques semaines, après le mur de la côte, ça changeait totalement, c'était beaucoup plus, la neige beaucoup plus dure, et je me suis dit, ok, j'essaie quand même de trouver le mur de la côte, et dans le bourriard, je n'arrête pas à le trouver, et une fois que je l'ai trouvé, je crois qu'il est en bonne condition, je le montre et je crois qu'il y a au-dessus, et je sais qu'au-dessus, il reste, je ne sais pas, 400-500 mètres de dénivelé, donc peut-être 400, donc,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Wind", "note": "Retrospective: fresh wind-loaded snow higher up with no support underfoot", "kw": ["Nicolas", "Snow", "Wind", "Conditions"], "file": "A004C047_260613OO", "i": "04:02:27:02", "t": "le mur de la côte, je me souviens quand j'y étais il y a quelques semaines, après le mur de la côte, ça changeait totalement, c'était beaucoup plus, la neige beaucoup plus dure, et je me suis dit, ok, j'essaie quand même de trouver le mur de la côte, et dans le bourriard, je n'arrête pas à le trouver, et une fois que je l'ai trouvé, je crois qu'il est en bonne condition, je le montre et je crois qu'il y a au-dessus, et je sais qu'au-dessus, il reste, je ne sais pas, 400-500 mètres de dénivelé, donc peut-être 400, donc, / et après, effectivement, la neige au-dessus, je pense qu'elle était beaucoup plus soufflée, la neige fraîche, il y avait vraiment de la consistance, j'ai beaucoup, enfin,"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "storm", "name": "Extreme cold, needed a fast exit", "note": "Retrospective: very cold with high wind; had to stay certain he could descend quickly", "kw": ["Nicolas", "Dangerous", "Weather", "Wind"], "file": "A004C047_260613OO", "i": "04:02:38:08", "t": "et après, effectivement, la neige au-dessus, je pense qu'elle était beaucoup plus soufflée, la neige fraîche, il y avait vraiment de la consistance, j'ai beaucoup, enfin, / il faisait extrêmement froid, il y avait beaucoup de vent, je me suis dit, il faut que je puisse descendre rapidement, donc je ne voulais pas aller puiser dans mes réserves, au point de me dire, je ne suis plus capable de courir pour descendre, / donc c'est un peu le"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "storm", "name": "A totally white day", "note": "What stayed with him is that on some steps he could not tell whether he was going up or down", "kw": ["Nicolas", "Post WR", "Conditions", "Snow", "struggling", "Wind"], "file": "A003C438_26062775", "i": "04:02:52:24", "t": "donc c'est un peu le / Exactement, ouais, c'était vraiment un jour totalement blanc. Ce qui m'a le plus marqué comme sensation à ce moment-là, c'est que quand je faisais certains pas, je ne savais pas si je montais ou je descendais. Donc ça donnait vraiment une sorte de vertige, parce qu'il n'y avait aucun repère visuel, vraiment plus rien. / Et Fabiano m'a"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "storm", "name": "Segmenting the day to keep moving", "note": "He broke day one into sections to keep progressing, and credits the recce for getting him through", "kw": ["Nicolas", "Post WR", "Conditions", "Preparation", "struggling", "Explaining"], "file": "A003C438_26062775", "i": "04:03:12:24", "t": "Et Fabiano m'a / un trou noir. / Alors sur le premier jour, justement, j'ai vraiment segmenté ensuite les sections pour pouvoir continuer à progresser. Et je pense que ce qui m'a permis d'arriver au bout, c'est le repérage que j'avais fait trois semaines avant. J'étais à ski, ça me permettait d'avoir une meilleure idée des conditions. Et je savais qu'à partir du mur de la côte, la neige portait beaucoup mieux, parce que c'était assez verglacé quand j'étais à ski. Donc je m'étais dit, je vais au mur de la côte et je regarde comment ça a évolué d'ici là. Parce qu'en dessous, je brassais des fois jusqu'à mi-cuisse pour progresser dans la neige. Donc c'était extrêmement pénible et lent. Et je me suis dit, ok, si au mur de la côte, ça s'améliore, que la neige porte mieux et que les conditions le permettent, je continue. Et ça a été le cas. / Est-ce que tu as"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "loneliness", "name": "Autonomy is what creates the engagement", "note": "Going alone with no resupply and no mental support is exactly what makes the commitment real", "kw": ["Florian", "Partner", "Explaining", "Emptiness", "Preparation"], "file": "DSC_0169", "i": "04:05:58:07", "t": "Et ça, ce côté autonomie, ça amène vraiment de l'engagement. Ça amène de l'engagement mental parce que tu sais que tu vas pas avoir de ravito, de support mental pour te pousser et tout ça. Et c'est un peu comme en trail quand tu fais des trails off ou on, tu vois. Souvent, des fois, tu peux avoir le même parcours et tu te dis, tiens, je vais le faire en off. Et ça change vraiment la donne. T'as pas les gens qui vont t'encourager, t'as pas les ravito. Si t'as pas les ravito, tu dois avoir beaucoup plus d'autonomie aussi sur toi. Et mine de rien, dans des projets comme ça, le poids, ça fait vraiment la diff. Tu vois, pour peu que tu dois porter ta flotte ou un réchaud pour te faire un peu d'eau, ta bouffe et tout ça. La dynamique, elle est pas du tout pareille en termes d'efforts énergétiques et en termes d'engagement mental. T'es face à toi-même, beaucoup plus. / Super. On passe sur la partie plus générale sur le trail et l'alpi. / Déjà, est-ce que Nico la tente ? Est-ce que ça, ça s'est déjà fait ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "loneliness", "name": "Alone, so no rope", "note": "Pure glacier walking and going solo, so a rope would be of little use", "kw": ["Nicolas", "Gear", "Glacier", "Preparation", "Explaining"], "file": "A002C287_260611IW", "i": "04:06:56:17", "t": "Pour demain, pas de cordes, pas besoin, on est vraiment que sur la rando glaciaire, donc seule la corde sera pas très utile. Et on a ce qu'il faut, la partie technique."}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "loneliness", "name": "Supported or unsupported", "note": "Discussing what counts as supported; he will finish day 3 unsupported and sleep at the Cosmiques hut", "kw": ["Nicolas", "Explaining", "Mountain Hut", "Sleep"], "file": "A004C047_260613OO", "i": "04:07:12:02", "t": "J'ai une autre question du refuge du Cosmic. pour le tour, supported and supported, ça marche ou... oui ? / Oui, parce que, en fait, ce que je vais faire pour le refuge du Cosmic, demain, en arrivant, je dirais, jusqu'à l'aiguille de midi, pour finir, donc, ce parcours du jour 3, en une supported. Ensuite, j'irai au refuge du Cosmic, dormir, j'espère qu'ils ont eu leur place, d'ailleurs."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "Autonomy matters more as time goes on", "note": "The more time passes the more he values self-sufficiency in the mountains, and it resonates with how he wants to move", "kw": ["Nicolas", "Post WR", "Emptiness", "Alpine", "Preparation", "Explaining"], "file": "A003C438_26062775", "i": "04:07:46:13", "t": "deux quatre faces en blanc / Alors vouloir faire ça sans assistance c'est parce que euh plus le temps passe et plus euh euh je trouve ce ce côté euh euh d'autonomie en montagne euh euh important j'apprécie ça et ça ça résonne avec mes valeurs euh euh euh pour être un peu extrême toutes les courses de trail running moi je pense qu'on devrait les faire euh euh sans assistance juste avec quelques points d'eau et après tout chacun emporte ce qu'il a besoin on ira juste tous un peu moins vite mais ça enlèvera rien du tout à la beauté du sport donc je pense que je me radicalise peut-être un peu sur cet aspect là je pense / que je pense que c'est un peu plus simple et je pense que c'est un peu plus simple et"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "Walking at night is like a trance", "note": "You enter a rhythm and simply walk; at night it becomes almost trance-l
