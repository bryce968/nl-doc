ike", "kw": ["Nicolas", "Post WR", "Emptiness", "Running", "Enjoying", "Stars"], "file": "A003C438_26062775", "i": "04:08:23:07", "t": "que je pense que c'est un peu plus simple et je pense que c'est un peu plus simple et / או Of course When you come to nature la nuit c'était tu rentres dans un rythme où tu marches juste parce que pour moi c'était vraiment quand je marche en nuit c'est comme une transe et on seulement marche et ça marche meilleur quand il y a du soleil et on voit les choses c'est comme une transe c'était c'était la même chose c'était comme comment / alors le rythme de progression"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "The night sections were the trail sections", "note": "Progression at night was different - always the more runnable, less technical ground", "kw": ["Nicolas", "Post WR", "Running", "Training", "Explaining", "Stars"], "file": "A003C438_26062775", "i": "04:09:00:02", "t": "alors le rythme de progression / c'était comme comment / alors le rythme de progression la nuit c'était un peu différent parce qu'au final la nuit c'est une section qui était toujours plus trail qui n'était pas vraiment technique sur lesquels j'ai essayé d'avoir un rythme quand même assez soutenu parce que je savais qu'après j'ai vraiment un rythme donc j'essayais vraiment d'être plus dans l'effort physique je mettais de la musique tous les jours au départ j'avais de la musique et ça me permettait de me mettre dans un bon rythme pour cette première partie de journée / comment tu restes motivé quand tu souffres vraiment avec la musique ou / j'ai même pas besoin de rester"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "At night it is the sounds", "note": "Total calm, and then very distinct sounds - seracs collapsing, rockfall, a torrent round a bend in the path", "kw": ["Nicolas", "Post WR", "Emptiness", "Mountain", "Glacier", "Stars"], "file": "A003C438_26062775", "i": "04:09:46:24", "t": "j'ai même pas besoin de rester / pas quelque chose qui m'a marqué en tout cas d'accord la nuit la chose qui me marque peut-être le plus c'est les bruits / parce qu'il y a vraiment et surtout en montagne il y a toujours un calme assez / un calme total et il y a des bruits très marquants il y a des chutes de serraac, des chutes de pierres ou au détour d'un sentier on entend le bruit d'un torrent des choses comme ça et c'est peut-être ça qui plus que des... plus que ce qu'on ne peut pas voir c'est ce qu'on entend la nuit qui met l'essence en éveil je trouve / et... during the day c'est beaucoup de bruit de personnes ou des choses de civilisations qu'est-ce que ça change ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "Passing people in daylight", "note": "During the day he reached busier sections and crossed people, which gave a bit of distraction", "kw": ["Nicolas", "Post WR", "Mountain", "Partner", "Explaining"], "file": "A003C438_26062775", "i": "04:10:35:02", "t": "que ça change ? / durant la journée c'est vrai que j'arrivais sur des sections qui étaient peut-être plus fréquentées aussi et je croisais des personnes et après c'est vrai que ça donne un peu de divertissement aussi de voir d'autres personnes comme ça sur le parcours et durant la deuxième journée il y a même deux personnes qui m'ont dit ah Nicolas vas-y alors que c'est un genre que je ne connaissais pas du tout et qui avait pris connaissance du projet donc ça a été super motivant de croiser du monde comme ça et de voir de l'enthousiasme autour du projet alors que je ne pensais pas forcément qu'il y avait un autre intérêt que le mieux / Est-ce que d'organiser une"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "A meeting that was not arranged", "note": "Nothing was organised - the rules allow for people who happen to be on the route", "kw": ["Nicolas", "Post WR", "Explaining", "Mont Blanc", "Preparation"], "file": "A003C438_26062775", "i": "04:11:18:13", "t": "Est-ce que d'organiser une / du Unsupported ? / alors c'est pas une rencontre qui a été organisée justement dans le cadre du Unsupported ils expliquent bien ça c'est que s'il y a des personnes qui se retrouvent par hasard sur le parcours et qui disent bravo allez vas-y c'est pas considéré comme de l'assistance parce que ces personnes je ne les connaissais pas et je ne les connais toujours pas donc elles sont vraiment retrouvées là par hasard ça reste tout à fait avec cette histoire / Il y a peut-être un élément aussi pour le Unsupported on n'en a jamais parlé mais c'est vrai qu'on pourrait se dire aussi pourquoi au final je ne suis pas resté Unsupported tout le long et j'ai fait tous les itinerants d'Unsupported comme ça sans avoir aucune assistance durant tout le long et ce que je cherche en général dans les projets c'est que ça soit quand même quelque chose qu'il y ait du sens qui soit cohérent et pour moi retourner dans la vallée avec plein de commerce etc. et se dire qu'à ce moment là je me refuse de me ravitailler parce que j'ai décidé je trouve que ça n'a pas vraiment de sens et ça ne parle plus en fait et c'est pour ça que j'ai choisi vraiment d'être Unsupported sur les ascensions et pas dans les transitions dans la vallée / mais on allait dire il"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "Solitude is strongest unsupported", "note": "There is a powerful solitude in the unsupported sections, particularly leaving at those hours of the night", "kw": ["Nicolas", "Post WR", "Emptiness", "Stars", "struggling"], "file": "A003C438_26062775", "i": "04:12:30:11", "t": "mais on allait dire il / transitions dans la vallée / mais on allait dire il y a un aspect de solitude qui est très fort dans la partie Unsupported surtout quand tu pars à des heures pareilles de la nuit ou du matin plutôt finalement le fait d'être seul est-ce que c'est quelque chose que tu recherches absolument dans ton parcours d'Ultra Trailer finalement d'être dans la nuit seul sans personne autour de toi ou c'est quelque chose qui arrive par la pratique mais c'est pas quelque chose que tu cherches ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "loneliness", "name": "Alone is when he feels most accompanied", "note": "He does not go looking for solitude - honestly, being alone is when he feels the most accompanied", "kw": ["Nicolas", "Post WR", "Emptiness", "happy", "Explaining"], "file": "A003C438_26062775", "i": "04:13:01:04", "t": "quelque chose que tu cherches ? / je pense que je cherche pas la solitude d'être Unsupported et en étant honnête je pense que c'est quand je suis seul quand c'est là que je suis peut-être le plus accompagné parce que je vais sans cesse penser à des gens je vais me poser plein de questions je fais beaucoup d'introspection et je pense que Unsupported c'est là que je suis le plus accompagné du monde"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Stripped back to primary needs", "note": "No phone signal, everything forgotten, and he is left facing very primary needs - above all water", "kw": ["Nicolas", "Pre WR", "food", "struggling", "Emptiness"], "file": "A002C001_260527DC", "i": "04:15:30:20", "t": "souvent on n'a pas de réseau avec le téléphone donc tout ça on oublie et on se retrouve face à des besoins très primaires au fond on va avoir besoin d'eau, quand on n'a plus d'eau je peux te dire que tout le reste ça compte plus on a juste envie de trouver à boire, on a besoin de manger une fois qu'on n'a pas dormi depuis un ou deux jours on a juste envie de dormir et c'est des besoins primaires et on ne pense pas à autre chose quand on se rend compte en faisant des courses d'ultra distance en montagne qu'au final on arrive facilement à se recentrer sur ces bois vitaux / et pour toi"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Mental availability to get through it", "note": "Needing the mental capacity to rise above the suffering; knowing it will pass, but having to get through the time", "kw": ["Nicolas", "Pre WR", "struggling", "Tired", "Nervous"], "file": "A002C001_260527DC", "i": "04:16:11:15", "t": "et pour toi / il faut qu'on ait toute la disponibilité mentale pour réussir à passer au dessus de ça on sait que ça va passer mais il faut réussir à passer le temps / et quand tu... voilà... tu / peux prendre une petite pause ? je suis pas grave si t'as besoin de boire ? / il faut pour tirer déjà euh..."}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Several versions of himself", "note": "Pushing past his limits brings out different versions of him depending on his mental state; enthusiasm turns it into a motor rather than a negative", "kw": ["Nicolas", "Pre WR", "struggling", "Tired", "happy"], "file": "A002C001_260527DC", "i": "04:16:49:19", "t": "Quand je pousse au-delà de tes limites, il peut y avoir plusieurs versions de moi. Il peut y avoir la version, justement, ça va dépendre de mon état mental où je n'ai pas une grande disponibilité et ça va être plutôt négatif. Parce que ça va me décourager. / Et à l'inverse, si je suis disponible et que je suis dans ce mode où je suis vraiment enthousiaste, même en poussant au-delà de mes limites, ça va encore exacerber ça, je dirais, cet enthousiasme. Ça va plus être quelque chose de moteur que quelque chose de négatif. Mais je pense que quand je pousse au-delà de mes limites, c'est vraiment mon état d'esprit qui va déterminer là où je vais aller. / Donc, ça répond en une partie à la question, mais est-ce que tu te connectes plus à ton corps quand tu pousses les limites ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Nicolas Pre", "topic": "the extreme", "name": "Pain over several days", "note": "He does not feel more connected to his body at the limit, but pain inevitably arrives across several days, and how he handles it comes down to his mental state", "kw": ["Nicolas", "Pre WR", "struggling", "Tired", "Explaining"], "file": "A002C001_260527DC", "i": "04:17:48:14", "t": "Je ne pense pas que je me connecte plus à mon corps quand je pousse mes limites, mais une sensation de douleur va forcément arriver en poussant loin, en courant plusieurs jours. Et c'est la manière dont j'appréhende ça qui va être directement liée à mon état mental. Je remarque que sur plusieurs courses dernièrement, je n'avais peut-être pas la disponibilité mentale et ça a été assez négatif. Ça va peut-être même mener à des abandons. Alors qu'à l'inverse, sur d'autres courses où j'ai déjà été bien plus dans le dur, / ça a été vraiment positif et ça va mener à des super performances. / Est-ce que tu es compétitif ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the extreme", "name": "Nothing else remains", "note": "In those moments he is completely focused and thinks about nothing else - that is all there is", "kw": ["Nicolas", "Emptiness", "struggling", "Alpine"], "file": "A002C063_260418WT", "i": "04:18:31:09", "t": "il ne faut pas confondre les deux. Mais dans ces moments-là on est vraiment hyper concentré et on ne pense à plus rien d'autre, il n'y a que ça qui reste. / Et quand il y a des moments plus simples, c'est la liberté. / Exactement, souvent quand on a fini une course en haute montagne, la journée n'est pas finie, mais pour moi elle est finie. On a fini tous ces moments où il peut y avoir du danger je dirais. Après des fois on a 2, 3, 4 heures de marche encore. Pour quelqu'un « normal » ou qui ne fait pas ça, ça paraîtrait énorme. Alors que nous on a fini notre journée, il reste encore 4 heures de marche et on sait qu'on n'a plus aucun danger, c'est juste de la marche. Nice, nice."}, {"kind": "iv", "speaker": "Nicolas", "source": "Pre", "topic": "the extreme", "name": "Cold is the sensation that stays", "note": "Of everything the mountain gives him, cold is what remains - and the swings in temperature", "kw": ["Nicolas", "Weather", "Conditions", "struggling"], "file": "A002C063_260418WT", "i": "04:19:11:14", "t": "Alors je pense que s'il y a une sensation qui doit me rester dans la montagne, c'est le froid. C'est vraiment des moments où c'est une variation de température. On va avoir très chaud, on va avoir très froid. / Et dans la même journée, on peut avoir toutes ces sensations. C'est vraiment ces sensations de température si je devais ressortir un film. / Et... You are... You are... / The wind doesn't matter. Non,"}, {"kind": "iv", "speaker": "Florian", "source": "Pre", "topic": "the extreme", "name": "Where ultra and high mountain meet", "note": "He grasped quickly that ultra trail and fast-and-light share the same fundamentals - hard efforts, altitude, and going on regardless", "kw": ["Florian", "Alpine", "Running", "struggling", "Hypoxy"], "file": "DSC_0169", "i": "04:19:42:01", "t": "pense que ce qu'il a compris très rapidement, c'est que sur les fondamentaux entre l'ultra-trail et puis le fast and light ou la haute montagne, on est sur des efforts qui vont être durs. Donc, l'altitude, voilà, il faut se donner. Ça, il l'a compris très vite. Après, je pense qu'il a compris très vite qu'aussi le transfert entre basse altitude et haute altitude, il ne se faisait pas de manière aussi simple. Il y avait besoin d'acclimatation pour pouvoir tenir un peu des rythmes comme il avait envie de tenir en altitude. Il faut être entraîné en altitude. Donc ça, je pense qu'il a très vite compris que ce n'étaient pas tout à fait les mêmes données chiffrées brutes. / Voilà. Je pense qu'il a très bien compris aussi que dès qu'on est sur des terrains techniques, tout de suite les allures et tout ça, elles diminuent de manière drastique. Et par contre, il a très bien compris aussi que ces allures-là, elles pouvaient être aussi très rapides entre guillemets si techniquement on progressait. Donc, il a eu tout de suite envie de comprendre un peu comment est-ce qu'on bouge un peu sur le caillou, avec les mains, les pieds, sans être juste en cours. Mais vraiment, on va mettre un peu des quatre appuis. Voilà, ça, il s'en est vite rendu compte et il a vite mis ça en place. Et après, peut-être qu'est-ce qui lui a pris un peu plus de temps à comprendre ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the extreme", "name": "A different apprehension every day", "note": "Each day carried its own kind of dread; the one he expected to enjoy most became something else", "kw": ["Nicolas", "Nervous", "Explaining"], "file": "A004C046_260613H5", "i": "04:20:59:24", "t": "bizarre parce que chaque jour, en fait, / j'avais une appréhension qui fait différence. / Je me disais au début, ce jour-là, le jour qui est... Enfin, demain, c'est le jour que je vais le plus apprécier parce que c'est vraiment la traversée qui apprécie le plus. En soi, c'est tout à fait ça. Maintenant, il y a quelques choses qui viennent quand même... Qui viennent quand même un peu compliquer la donne. Le vent, il y aura quand même pas mal de vent. Sur un parcours d'arrête comme ça, avec les portions d'escalade aussi en solo. / Ce n'est pas génial. Donc, il y a ça qui crée une petite tension. Et il y a aussi l'horaire. Là, je vois que ça fait quand même de grosses journées déjà. On est à plus de 110 kg et 10 000 mètres de nivelais à peu près, un peu plus. / Donc, il y a la fatigue qui se sent un petit peu sans tir. Et l'arrête de bien assez, c'est une arrête de neige hyper effilée. / Et pour qu'elle"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the extreme", "name": "Never thought he would get that far", "note": "On day one the weather and the unmanageable risk meant he never expected to make it as far as he did", "kw": ["Nicolas", "Dangerous", "Conditions", "Explaining"], "file": "A004C047_260613OO", "i": "04:22:00:18", "t": "Et pour qu'elle / ce que tu ferais d'habitude ? / Ah, clairement, oui. Oui, clairement, le premier jour, je ne serais jamais allé aussi loin, c'est sûr, c'est clair. Le premier jour, vu les conditions météo, vu les risques, qui n'étaient pas maîtrisables par rapport aux crevasse, etc., / je serais, oui, c'est évident, il faut être"}, {"kind": "iv", "speaker": "Nicolas", "source": "WR", "topic": "the extreme", "name": "Does not know how he reached the summit", "note": "Looking back he cannot explain how he got to the top that day", "kw": ["Nicolas", "Summit", "struggling"], "file": "A004C047_260613OO", "i": "04:22:24:23", "t": "je serais, oui, c'est évident, il faut être / sincèrement, je ne sais pas comment j'ai fait pour aller au sommeil ailleurs. Ah oui, c'était,"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the extreme", "name": "It was always the head, never the legs", "note": "Striking how physically easy it was; what decided each day was mental, not muscular", "kw": ["Nicolas", "Post WR", "struggling", "Explaining", "Tired"], "file": "A003C438_26062775", "i": "04:22:35:04", "t": "Je pense que ce soit le premier jour ou même durant les jours suivants, ça a toujours été la tête. Je suis impressionné à quel point ça a été... peut-être exagéré un petit peu, mais facile physiquement. Le troisième jour, j'étais assez fatigué quand même. Donc, tu aurais peut-être quelques belles images là-dessus. Mais globalement, ça a été vraiment facile physiquement. Je vois le quatrième jour où j'étais peut-être un peu anxieux. Le troisième jour, elle dit de repartir le quatrième par rapport à la fatigue physique. Je me suis levé et j'avais l'impression que j'avais rien fait les jours précédents. Donc, ouais, ça a été vraiment facile. C'est vrai que par rapport à de l'ultra trail, la vitesse de progression, elle est quand même beaucoup plus lente. Même s'il y a des gros dénivelés, des grosses distances. Donc, ça aide à ne pas être trop marqué physiquement."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the extreme", "name": "The lack of sleep did not bother him", "note": "No drowsiness and no exhaustion across the four days; he felt good every day", "kw": ["Nicolas", "Post WR", "Sleep", "Tired", "Explaining"], "file": "A003C438_26062775", "i": "04:23:27:17", "t": "et au final le manque de sommeil ne m'a pas tant gêné non plus. J'étais vraiment tous les jours, j'étais bien. J'ai pas eu de somnolence, j'ai pas eu d'épuisement, ou on essaie de chercher des fois la solution qui paraît la plus facile et qui est peut-être pas la bonne. Donc sur ces aspects-là, ça a vraiment bien été le projet. / Et c'est aussi une question qui est vraiment qui fit ici. / C'est avec le muscle, parce que tu m'as dit que le muscle, tu n'as pas mal, mais tu étais un peu fort. C'était ça ?"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the extreme", "name": "Both knees hurt after day one", "note": "An unexpected stiffness in both knees - fine walking, painful sitting", "kw": ["Nicolas", "Post WR", "struggling", "Tired", "Explaining"], "file": "A003C438_26062775", "i": "04:24:14:24", "t": "c'est vrai qu'après le premier jour, mais je ne sais pas pourquoi, j'ai eu mal au genou, au deux genoux. Dès que je me levais et que je marchais, ça allait, mais je restais assis. Et après, ça a totalement disparu. Donc, tant mieux. Des fois, ça vient, ça part, on ne sait pas pourquoi. C'est les pâtisseries qui ont aidé ? Voilà, exactement."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "the extreme", "name": "Still concentrated at the fourth summit", "note": "Wind every day, sixty kilometres an hour at best, so at the top for the fourth time he was still entirely focused", "kw": ["Nicolas", "Post WR", "Summit", "Wind", "Conditions", "Nervous"], "file": "A003C438_26062775", "i": "04:24:40:05", "t": "alors très sincèrement, j'étais encore vraiment concentré. Parce qu'au final, tous les jours, on a eu vraiment pas mal de vent. Le moment qu'on ait eu, c'était 60 km heure. Donc, ça reste quand même pas mal. Et ça commençait à être très nuageux et dans le brouillard de nouveau. Donc, c'était moins problématique pour le jour-là, parce que l'itinéraire, par les 3 monts, il est peut-être plus lisible, même dans le brouillard, en tout cas pour la première partie. Enfin, pour la première partie de la descente. Mais ça reste pas agréable. Donc, j'étais assez concentré. Et je me suis dit que j'allais assez... Essayais d'aller assez vite pour justement éviter le brouillard. J'en ai eu un petit peu. Ça a été raisonnable. Après, c'est nouveau levé. Donc, j'ai vraiment essayé de pas traîner. / Là, tu étais aussi un petit peu heureux"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "aftermath", "name": "No strong emotion at the hut", "note": "Arriving at the hut at the end he felt almost nothing - after four days of thinking of little else, it simply stopped", "kw": ["Nicolas", "Post WR", "Emptiness", "Tired", "Mountain Hut", "Explaining"], "file": "A003C438_26062775", "i": "04:27:29:18", "t": "Quand je suis arrivé à la cabane, Je... Ouais. Je... J'ai pas eu d'émotion si forte que ça. En fait, je... Je... Je... Je sais pas comment dire, mais pendant les 4 jours, J'ai tellement pensé à ce moment déjà. Euh... Et avec de la nostalgie. Pendant les 4 jours, je me disais, ah, profites-en. Même quand c'était difficile parfois. Euh... Je me disais, profites-en. Ça va se finir. Ça va se finir. Euh... / Savour. Apprécie. Et euh... Ouais. Donc au final, je crois que je... / Je l'avais déjà anticipé, ce moment. Euh... C'est peut-être pour ça que ça a été un peu moins... Un peu moins d'émotion. / Et tu étais un petit peu... / Sainte ? Que le projet s'est fini à cet moment ? / Non. J'étais pas vraiment triste qu'il se finisse à ce moment-là. Euh... Je... Je pense que, bah... / Des fois, ça peut laisser un"}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "aftermath", "name": "The emptiness after finishing", "note": "Finishing something you have carried for months can leave a hollow; he thinks that is part of the deal", "kw": ["Nicolas", "Post WR", "Emptiness", "struggling", "Explaining"], "file": "A003C438_26062775", "i": "04:28:26:08", "t": "Des fois, ça peut laisser un / Des fois, ça peut laisser un sentiment de vide, Le fait de finir un projet qui nous tient vraiment à cœur. Euh... Je pense que ça fait partie... Ça fait partie du jeu. Bah, le projet, Une vie qui se termine aussi. Euh... Et euh... Ouais, je préfère me projeter vers d'autres projets. J'ai... Tellement de choses qui m'enthousiasment. Euh... Que... / J'ai assez de choses ensuite qui... Qui peuvent venir pour... Pour trouver d'autres... D'autres choses qui vont me faire rêver. Ouais... Ouais... Peut-être la... La... Je vais juste boire un coup. / Ouais, bien sûr. / Ha ha ha ha. Je pose le poisson. / Je sais pas si tu es froid ou tu es chaud. Ha ha ha. Je veux juste que tu es mauvais."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "aftermath", "name": "Looking for a pizzeria in Chamonix", "note": "The first thing after it was over: hunting for an open pizzeria, not finding one, and settling for a crepe", "kw": ["Nicolas", "Post WR", "Chamonix", "Town", "food", "laughing", "happy"], "file": "A003C438_26062775", "i": "04:29:12:12", "t": "La première chose à Chamonix, euh... C'était chercher une pizzeria ouverte qu'on a pas trouvé, donc on a fini à manger une crêpe. C'est vrai."}, {"kind": "iv", "speaker": "Nicolas", "source": "Post WR", "topic": "aftermath", "name": "Ten hours of sleep in three nights", "note": "Under ten hours across the first three nights; the refuge night was the best of them", "kw": ["Nicolas", "Post WR", "Sleep", "Tired", "Explaining"], "file": "A003C438_26062775", "i": "04:29:32:05", "t": "Alors les trois premières nuits, j'ai dormi un peu moins d'une dizaine d'heures au total. Celle où j'ai peut-être le moins dormi, c'est la première nuit avant le premier départ où il y a peut-être un peu plus de tension. / Et la nuit au refuge, c'est peut-être là que j'ai le plus dormi parce que je me suis couché à chez tôt, j'ai levé à 3h donc j'ai bien pu récupérer déjà. / Le sommeil, j'ai l'habitude de beaucoup moins dormir en ultra-trail, donc ça"}], "pink": [{"topic": "origins", "n": 7, "srcs": "Nicolas Pre WR, Pre WR", "i": "01:00:00:00"}, {"topic": "the switch", "n": 12, "srcs": "Nicolas Pre WR, Pre WR, Nicolas Post WR", "i": "01:07:13:07"}, {"topic": "family", "n": 21, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "01:17:13:24"}, {"topic": "portrait", "n": 13, "srcs": "Pre WR, Nicolas Post WR", "i": "01:33:40:01"}, {"topic": "motivation", "n": 26, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "01:45:25:16"}, {"topic": "impostor syndrome", "n": 21, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "02:04:06:14"}, {"topic": "training", "n": 13, "srcs": "Nicolas Pre WR, Pre WR, WR", "i": "02:21:31:22"}, {"topic": "the sport", "n": 20, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "02:31:43:09"}, {"topic": "gear", "n": 8, "srcs": "WR", "i": "02:50:02:04"}, {"topic": "food/fuel", "n": 6, "srcs": "WR", "i": "02:55:07:19"}, {"topic": "places", "n": 14, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "02:59:49:10"}, {"topic": "work & discipline", "n": 10, "srcs": "Nicolas Pre WR, Pre WR, Nicolas Post WR", "i": "03:11:07:03"}, {"topic": "risk & safety", "n": 19, "srcs": "Nicolas Pre WR, Pre WR, Nicolas Post WR", "i": "03:19:30:01"}, {"topic": "route & conditions", "n": 23, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "03:36:42:12"}, {"topic": "storm", "n": 18, "srcs": "WR, Nicolas Post WR", "i": "03:56:38:00"}, {"topic": "loneliness", "n": 11, "srcs": "Pre WR, WR, Nicolas Post WR", "i": "04:05:58:05"}, {"topic": "the extreme", "n": 14, "srcs": "Nicolas Pre WR, Pre WR, WR, Nicolas Post WR", "i": "04:15:30:18"}, {"topic": "aftermath", "n": 4, "srcs": "Nicolas Post WR", "i": "04:27:29:16"}]}</script>

 ?[r.name,r.note,r.t,r.kw.join(' '),r.speaker,r.topic,r.source,r.file].join(' ').toLowerCase()
 :[r.note,r.t,r.kw.join(' '),r.file,r.ty,r.tln].join(' ').toLowerCase()}

function match(r){
 if(r.kind==='iv'){
  if(S.topic.size&&!S.topic.has(r.topic))return false;
  if(S.speaker.size&&!S.speaker.has(r.speaker))return false;
  if(S.source.size&&!S.source.has(r.source))return false;
 }else{
  if(S.day.size&&!S.day.has(r.tl))return false;
  if(S.ty.size&&!S.ty.has(r.ty))return false;
 }
 if(S.kw.size){for(const k of S.kw)if(!r.kw.includes(k))return false}
 const t=terms();if(!t.length)return true;const h=hay(r);return t.every(x=>h.includes(x));
}
function hl(s){let o=esc(s);const t=terms();if(!t.length)return o;
 for(const x of t){const rx=new RegExp('('+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');o=o.replace(rx,'<mark>$1</mark>')}return o}
function chips(id,label,vals,set,counts){
 const TOP=12;const s=vals.slice(0,TOP),h=vals.slice(TOP);
 const btn=v=>`<button class="chip${set.has(v)?' on':''}" data-f="${id}" data-v="${esc(v)}">${esc(v)}<span class="c">${counts[v]||0}</span></button>`;
 return `<div class="frow"><span class="eyebrow">${label}</span>`+s.map(btn).join('')
 +(h.length?`<span class="hid" id="h_${id}">`+h.map(btn).join('')+`</span><button class="more" data-more="${id}">+${h.length} more</button>`:'')
 +`</div>`}
function render(){
 const P=pool();
 document.getElementById('modes').innerHTML=
  [['iv','Interviews',D.iv.length],['fkt','FKT footage',D.fkt.length],['all','Both',ALL.length]]
  .map(([k,l,n])=>`<button class="mode${S.mode===k?' on':''}" data-m="${k}">${l}<span class="c">${n}</span></button>`).join('');
 const cnt=(arr,f)=>{const o={};arr.forEach(r=>{const v=f(r);if(v)o[v]=(o[v]||0)+1});return o};
 const kwc={};P.forEach(r=>r.kw.forEach(k=>kwc[k]=(kwc[k]||0)+1));
 const kws=Object.keys(kwc).sort((a,b)=>kwc[b]-kwc[a]||a.localeCompare(b));
 let f='';
 if(S.mode!=='fkt'){
  const sp=cnt(D.iv,r=>r.speaker),so=cnt(D.iv,r=>r.source);
  f+=chips('speaker','Speaker',Object.keys(sp).sort((a,b)=>sp[b]-sp[a]),S.speaker,sp);
  f+=chips('source','Interview',Object.keys(so).sort((a,b)=>so[b]-so[a]),S.source,so);
 }
 if(S.mode!=='iv'){
  const dy=cnt(D.fkt,r=>r.tl),ty=cnt(D.fkt,r=>r.ty);
  const dord=['Pre_WR','WR_D1','WR_D2','WR_D3','WR_D4','WR_D5'].filter(x=>dy[x]);
  const names={};D.fkt.forEach(r=>names[r.tl]=r.tln);
  f+=`<div class="frow"><span class="eyebrow">Shoot day</span>`
   +dord.map(v=>`<button class="chip${S.day.has(v)?' on':''}" data-f="day" data-v="${v}">${names[v]}<span class="c">${dy[v]}</span></button>`).join('')+`</div>`;
  f+=chips('ty','Marker',Object.keys(ty),S.ty,ty);
 }
 f+=chips('kw','Keyword',kws,S.kw,kwc);
 document.getElementById('filters').innerHTML=f;
 if(S.mode!=='fkt'){
  const tc=cnt(D.iv,r=>r.topic);const mx=Math.max(...Object.values(tc),1);
  document.getElementById('topicbar').innerHTML=D.pink.map(p=>{
   const n=tc[p.topic]||0;const h=Math.max(10,Math.round(n/mx*100));
   return `<button class="tb${S.topic.has(p.topic)?' on':''}" data-f="topic" data-v="${esc(p.topic)}">
   <span class="bar"><span class="fill" style="height:${h}%"></span></span>
   <span class="lab"><span class="nm">${esc(p.topic)}</span><span class="ct">${n}</span></span></button>`}).join('');
 } else document.getElementById('topicbar').innerHTML='';
 const res=P.filter(match);
 const active=S.q||S.topic.size||S.speaker.size||S.source.size||S.day.size||S.ty.size||S.kw.size;
 document.getElementById('count').innerHTML=active?`<b>${res.length}</b> of ${P.length}`:`<b>${P.length}</b> markers`;
 document.getElementById('reset').classList.toggle('on',!!active);
 document.getElementById('clr').classList.toggle('on',!!S.q);
 document.getElementById('sl').style.display=S.q?'none':'';
 document.getElementById('footl').textContent=`${D.iv.length} interview + ${D.fkt.length} FKT markers · ${D.pink.length} topics`;
 if(!res.length){document.getElementById('out').innerHTML=`<div class="empty">
  <span class="eyebrow dim">No markers match</span><h2>Nothing here.</h2>
  <p>The index searches marker notes, dialogue, keywords and names — not what a shot looks like.</p>
  <p>Clear a filter or try a single word.</p></div>`;return}
 document.getElementById('out').innerHTML=res.map(r=>r.kind==='iv'?`<article class="row">
  <div class="gut"><span class="ty iv">${esc(r.topic).toUpperCase()}</span>
  <span class="sub">${esc(r.speaker)}</span><span class="sub">${esc(r.source)}</span></div>
  <div class="body"><div class="hd">
   <button class="tc" data-tc="${r.i}">${r.i}</button>
   ${r.file?`<span class="src">${esc(r.file)}</span>`:''}</div>
   <p class="nm2">${hl(r.name)}</p>
   <p class="note">${hl(r.note)}</p>
   ${r.kw.length?`<div class="kws">${r.kw.map(k=>`<button class="kw" data-f="kw" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}
   ${r.t?`<p class="dia">${hl(r.t)}</p>`:''}</div></article>`
 :`<article class="row">
  <div class="gut"><span class="ty ${r.ty.replace(' ','')}">${r.ty}</span>
  <span class="sub">${esc(r.tln)}</span><span class="sub">${esc(r.date)}</span></div>
  <div class="body"><div class="hd">
   <button class="tc" data-tc="${r.i}">${r.i}${r.d?` <span style="opacity:.34">→</span> ${r.o}`:''}</button>
   ${r.d?`<span class="dur">${r.d}</span>`:''}
   ${r.file?`<span class="src">${esc(r.file)}</span>`:''}</div>
   <p class="note${r.note?'':' none'}">${r.note?hl(r.note):'No note'}</p>
   ${r.kw.length?`<div class="kws">${r.kw.map(k=>`<button class="kw" data-f="kw" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}
   ${r.t?`<p class="dia">${hl(r.t)}</p>`:''}</div></article>`).join('');
}
const q=document.getElementById('q');
q.addEventListener('input',e=>{S.q=e.target.value;render()});
document.getElementById('clr').onclick=()=>{S.q='';q.value='';q.focus();render()};
document.getElementById('reset').onclick=()=>{S.q='';q.value='';
 [S.topic,S.speaker,S.source,S.day,S.ty,S.kw].forEach(s=>s.clear());render()};
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-m]');
 if(m){S.mode=m.dataset.m;render();return}
 const mo=e.target.closest('[data-more]');
 if(mo){const el=document.getElementById('h_'+mo.dataset.more);
  const o=el.classList.toggle('open');mo.textContent=o?'show fewer':mo.textContent;return}
 const f=e.target.closest('[data-f]');
 if(f){const set=S[f.dataset.f];const v=f.dataset.v;
  set.has(v)?set.delete(v):set.add(v);render();
  if(f.classList.contains('kw'))window.scrollTo({top:0,behavior:'smooth'});return}
 const tc=e.target.closest('[data-tc]');
 if(tc){navigator.clipboard?.writeText(tc.dataset.tc);
  const o=tc.textContent;tc.textContent='COPIED';setTimeout(()=>tc.textContent=o,900);return}
 const d=e.target.closest('.dia');if(d)d.classList.toggle('open');
});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
 if(e.key==='Escape'){if(S.q){S.q='';q.value='';render()}q.blur()}});
render();
</script></body></html>
