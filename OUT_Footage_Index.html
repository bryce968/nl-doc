<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUT — Footage Index — Le Goût de l'Altitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#171A1A; --cloud:#F7F5F5; --outside:#F2EA19;
  --glacier:#ACC6CC; --lake:#173C4A;
  --rule:rgba(23,26,26,.14); --rule-soft:rgba(23,26,26,.07);
  --mono:'Martian Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'Brockmann','Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cloud);color:var(--dark);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 96px}

/* ── header, after the guideline's own rule ───────────── */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:26px 0 9px;border-top:1.5px solid var(--dark);margin-top:22px}
.top .lhs{display:flex;gap:34px;align-items:baseline;flex-wrap:wrap}
.mark{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:-.04em}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0;text-transform:uppercase;
  font-weight:400;color:var(--dark)}
.eyebrow.dim{color:var(--lake);opacity:.62}
.top-rule{height:1px;background:var(--rule);margin-bottom:34px}

/* ── search ───────────────────────────────────────────── */
.search{position:relative;margin-bottom:26px}
.search input{width:100%;font-family:var(--sans);font-size:26px;font-weight:400;
  padding:14px 96px 15px 0;border:0;border-bottom:1.5px solid var(--dark);
  background:transparent;color:var(--dark);letter-spacing:-.02em}
.search input::placeholder{color:var(--lake);opacity:.34}
.search input:focus{outline:none;border-bottom-color:var(--lake)}
.search input:focus-visible{outline:none}
.slash{position:absolute;right:0;bottom:19px;font-family:var(--mono);font-size:10px;
  color:var(--lake);opacity:.5;pointer-events:none}
.clearbtn{position:absolute;right:0;bottom:14px;font-family:var(--mono);font-size:10px;
  background:none;border:0;color:var(--lake);cursor:pointer;padding:6px 2px;display:none}
.clearbtn.on{display:block}

/* ── signature: day density strip ─────────────────────── */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-bottom:30px}
.day{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:var(--mono);
  display:flex;flex-direction:column;gap:7px}
.day .bar{position:relative;height:52px;background:var(--rule-soft);display:flex;align-items:flex-end}
.day .fill{width:100%;background:var(--glacier);transition:background .16s ease}
.day .lab{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  padding-top:6px;border-top:1px solid var(--rule)}
.day .sh{font-size:11px;font-weight:600;letter-spacing:0}
.day .ct{font-size:9px;color:var(--lake);opacity:.62}
.day .dt{font-size:8.5px;color:var(--lake);opacity:.5;letter-spacing:0}
.day:hover .fill,.day:focus-visible .fill{background:var(--lake)}
.day:focus-visible{outline:2px solid var(--lake);outline-offset:3px}
.day.on .fill{background:var(--dark)}
.day.on .lab{border-top-color:var(--dark);border-top-width:1.5px}
.day.on .sh{font-weight:600}
.stripped .day:not(.on) .fill{background:var(--rule)}
.stripped .day:not(.on) .sh{opacity:.42}

/* ── filters ──────────────────────────────────────────── */
.filters{display:flex;flex-direction:column;gap:13px;margin-bottom:14px}
.frow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.frow>.eyebrow{flex:0 0 62px;padding-top:3px;opacity:.62}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:0;text-transform:uppercase;
  padding:5px 9px;border:1px solid var(--rule);background:transparent;color:var(--lake);
  cursor:pointer;border-radius:0;transition:none}
.chip:hover{border-color:var(--lake);color:var(--dark)}
.chip:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.chip.on{background:var(--dark);border-color:var(--dark);color:var(--cloud)}
.chip .c{opacity:.5;margin-left:5px}
.chip.on .c{opacity:.62}
.morebtn{font-family:var(--mono);font-size:9.5px;background:none;border:0;color:var(--lake);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:5px 2px}
.kwmore{display:none}
.kwmore.open{display:contents}

/* ── count bar ────────────────────────────────────────── */
.countbar{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:13px 0 11px;border-top:1px solid var(--rule);border-bottom:1.5px solid var(--dark);
  margin-bottom:2px;position:sticky;top:0;background:var(--cloud);z-index:5}
.count{font-family:var(--mono);font-size:10px}
.count b{font-weight:600}
.resetall{font-family:var(--mono);font-size:9.5px;background:none;border:0;color:var(--lake);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px;visibility:hidden}
.resetall.on{visibility:visible}

/* ── results ──────────────────────────────────────────── */
.row{display:grid;grid-template-columns:82px 1fr;gap:22px;padding:17px 0 18px;
  border-bottom:1px solid var(--rule-soft);align-items:start}
.row:hover{background:rgba(172,198,204,.10)}
.gut{display:flex;flex-direction:column;gap:3px;font-family:var(--mono)}
.ty{font-size:8.5px;letter-spacing:0;font-weight:600}
.ty.SEQUENCE{color:var(--lake)}
.ty.MOMENT{color:var(--dark)}
.ty[class*="SHOOT"]{color:var(--lake)}
.gday{font-size:9px;color:var(--lake);opacity:.6}
.body{min-width:0}
.hd{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.tc{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:-.02em;
  background:none;border:0;padding:0;color:var(--dark);cursor:pointer}
.tc:hover{background:var(--outside)}
.tc:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.tc .arrow{opacity:.34;font-weight:300;margin:0 3px}
.dur{font-family:var(--mono);font-size:9px;color:var(--lake);opacity:.62}
.src{font-family:var(--mono);font-size:9.5px;color:var(--lake);margin-left:auto}
.copied{font-family:var(--mono);font-size:9px;color:var(--dark);background:var(--outside);
  padding:1px 5px}
.note{font-size:15px;line-height:1.42;margin:0 0 7px;max-width:66ch;letter-spacing:-.01em}
.note.none{color:var(--lake);opacity:.42;font-style:italic}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.kw{font-family:var(--mono);font-size:8.5px;letter-spacing:0;text-transform:uppercase;
  color:var(--lake);border:1px solid var(--rule);padding:2px 6px;background:none;cursor:pointer}
.kw:hover{border-color:var(--lake);color:var(--dark)}
.kw:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.dia{font-size:13.5px;line-height:1.58;color:var(--lake);max-width:78ch;
  border-left:2px solid var(--glacier);padding-left:13px;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.dia.open{-webkit-line-clamp:unset;display:block}
.dia mark{background:var(--outside);color:var(--dark);padding:0 1px}
.dia:focus-visible{outline:2px solid var(--lake);outline-offset:3px}

/* ── empty ────────────────────────────────────────────── */
.empty{padding:64px 0 24px;max-width:52ch}
.empty h2{font-family:var(--sans);font-size:23px;font-weight:400;letter-spacing:-.02em;margin:0 0 9px}
.empty p{font-size:14px;color:var(--lake);margin:0 0 7px}
.empty .eyebrow{display:block;margin-bottom:15px;opacity:.6}

.foot{margin-top:44px;padding-top:13px;border-top:1px solid var(--rule);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot span{font-family:var(--mono);font-size:9px;color:var(--lake);opacity:.6}

@media (max-width:760px){
  .wrap{padding:0 17px 64px}
  .search input{font-size:20px;padding-right:64px}
  .strip{grid-template-columns:repeat(3,1fr);gap:9px 2px}
  .row{grid-template-columns:1fr;gap:7px}
  .gut{flex-direction:row;gap:10px;align-items:baseline}
  .src{margin-left:0;width:100%}
  .frow>.eyebrow{flex:0 0 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

py", "Hypoxy", "laughing", "Monologue", "Mont Blanc", "Mountain", "Mountain Hut", "Music", "Nervous", "Office", "Partner", "Pastries", "Phone", "Pre WR", "Preparation", "Ridge", "Running", "Salève", "Scrambling", "Shoes", "Sleep", "Snow", "Stairs", "Stars", "Start", "struggling", "Summit", "Sunrise", "Tired", "Town", "Training", "Watch", "Weather", "Wind"]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const S = {q:'', days:new Set(), types:new Set(), kws:new Set()};
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const terms = () => S.q.toLowerCase().split(/\s+/).filter(Boolean);

function hay(r){ return (r.n+' '+r.t+' '+r.k.join(' ')+' '+r.f+' '+r.ty+' '+D.tl[r.tl].full).toLowerCase(); }

function match(r){
  if(S.days.size && !S.days.has(r.tl)) return false;
  if(S.types.size && !S.types.has(r.ty)) return false;
  if(S.kws.size){ for(const k of S.kws) if(!r.k.includes(k)) return false; }
  const t = terms(); if(!t.length) return true;
  const h = hay(r); return t.every(x => h.includes(x));
}

function hl(text){
  let s = esc(text); const t = terms(); if(!t.length) return s;
  for(const x of t){
    const rx = new RegExp('('+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    s = s.replace(rx,'<mark>$1</mark>');
  }
  return s;
}

/* day strip */
const maxC = Math.max(...Object.values(D.counts));
document.getElementById('strip').innerHTML = D.order.map(t => {
  const c = D.counts[t], h = Math.max(8, Math.round(c/maxC*100));
  return `<button class="day" data-day="${t}" type="button" aria-pressed="false">
    <span class="bar"><span class="fill" style="height:${h}%"></span></span>
    <span class="lab"><span class="sh">${D.tl[t].short}</span><span class="ct">${c}</span></span>
    <span class="dt">${D.tl[t].date}</span></button>`;
}).join('');

/* type + keyword chips */
const TYPES = ['MOMENT','SEQUENCE','SHOOT DAY'];
document.getElementById('types').innerHTML = TYPES.map(t => {
  const c = D.rows.filter(r => r.ty===t).length;
  return `<button class="chip" data-type="${t}" type="button" aria-pressed="false">${t}<span class="c">${c}</span></button>`;
}).join('');

const kwCount = k => D.rows.filter(r => r.k.includes(k)).length;
const kwSorted = [...D.kw].sort((a,b) => kwCount(b)-kwCount(a) || a.localeCompare(b));
const TOPN = 14;
document.getElementById('kws').innerHTML =
  kwSorted.slice(0,TOPN).map(k => `<button class="chip" data-kw="${esc(k)}" type="button" aria-pressed="false">${esc(k)}<span class="c">${kwCount(k)}</span></button>`).join('')
  + `<span class="kwmore" id="kwmore">` + kwSorted.slice(TOPN).map(k => `<button class="chip" data-kw="${esc(k)}" type="button" aria-pressed="false">${esc(k)}<span class="c">${kwCount(k)}</span></button>`).join('') + `</span>`
  + `<button class="morebtn" id="moreb" type="button">+${kwSorted.length-TOPN} more</button>`;

function render(){
  const res = D.rows.filter(match);
  const active = S.q || S.days.size || S.types.size || S.kws.size;
  document.getElementById('count').innerHTML =
    active ? `<b>${res.length}</b> of ${D.rows.length} markers` : `<b>${D.rows.length}</b> markers`;
  document.getElementById('reset').classList.toggle('on', !!active);
  document.getElementById('clr').classList.toggle('on', !!S.q);
  document.getElementById('slash').style.display = S.q ? 'none' : '';
  document.getElementById('strip').classList.toggle('stripped', S.days.size>0);

  if(!res.length){
    document.getElementById('out').innerHTML = `<div class="empty">
      <span class="eyebrow">No markers match</span>
      <h2>Nothing here yet.</h2>
      <p>Try one word instead of a phrase — the index searches marker notes, dialogue, keywords and clip names, but not what a shot looks like.</p>
      <p>Unmarked B-roll won't surface at all. Clear a filter or widen the search.</p></div>`;
    return;
  }
  document.getElementById('out').innerHTML = res.map(r => {
    const tls = D.tl[r.tl];
    return `<article class="row">
      <div class="gut">
        <span class="ty ${r.ty.replace(' ','')}">${r.ty}</span>
        <span class="gday">${tls.short}</span>
      </div>
      <div class="body">
        <div class="hd">
          <button class="tc" data-tc="${r.i}" type="button" title="Copy timecode">${r.i}${r.d?`<span class="arrow">→</span>${r.o}`:''}</button>
          ${r.d?`<span class="dur">${r.d}</span>`:''}
          ${r.f?`<span class="src">${esc(r.f)}</span>`:''}
        </div>
        <p class="note${r.n?'':' none'}">${r.n?hl(r.n):'No note'}</p>
        ${r.k.length?`<div class="kws">${r.k.map(k=>`<button class="kw" data-kw="${esc(k)}" type="button">${esc(k)}</button>`).join('')}</div>`:''}
        ${r.t?`<p class="dia" tabindex="0" role="button" title="Expand">${hl(r.t)}</p>`:''}
      </div></article>`;
  }).join('');
}

/* events */
const q = document.getElementById('q');
q.addEventListener('input', e => { S.q = e.target.value; render(); });
document.getElementById('clr').onclick = () => { S.q=''; q.value=''; q.focus(); render(); };
document.getElementById('moreb').onclick = e => {
  const m = document.getElementById('kwmore'); const open = m.classList.toggle('open');
  e.target.textContent = open ? 'show fewer' : `+${kwSorted.length-TOPN} more`;
};
document.getElementById('reset').onclick = () => {
  S.q=''; q.value=''; S.days.clear(); S.types.clear(); S.kws.clear();
  document.querySelectorAll('[aria-pressed]').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});
  render();
};
function toggleSet(set, val, el){
  set.has(val) ? set.delete(val) : set.add(val);
  const on = set.has(val);
  el.classList.toggle('on', on); el.setAttribute('aria-pressed', on?'true':'false');
  render();
}
document.addEventListener('click', e => {
  const day = e.target.closest('[data-day]');
  if(day) return toggleSet(S.days, day.dataset.day, day);
  const ty = e.target.closest('[data-type]');
  if(ty) return toggleSet(S.types, ty.dataset.type, ty);
  const chip = e.target.closest('.chip[data-kw]');
  if(chip) return toggleSet(S.kws, chip.dataset.kw, chip);
  const kw = e.target.closest('.kw[data-kw]');
  if(kw){
    const v = kw.dataset.kw; if(!S.kws.has(v)) S.kws.add(v);
    document.querySelectorAll(`.chip[data-kw="${CSS.escape(v)}"]`).forEach(c=>{
      c.classList.add('on'); c.setAttribute('aria-pressed','true');
      if(!c.offsetParent) document.getElementById('moreb').click();
    });
    render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  const tc = e.target.closest('[data-tc]');
  if(tc){
    navigator.clipboard?.writeText(tc.dataset.tc);
    const old = tc.innerHTML; tc.innerHTML = `<span class="copied">COPIED</span>`;
    setTimeout(()=>{tc.innerHTML = old;}, 900); return;
  }
  const dia = e.target.closest('.dia');
  if(dia) dia.classList.toggle('open');
});
document.addEventListener('keydown', e => {
  if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if(e.key==='Escape'){ if(S.q){S.q='';q.value='';render();} q.blur(); }
  if(e.key==='Enter' && e.target.classList?.contains('dia')) e.target.classList.toggle('open');
});
render();
</script></body></html>
